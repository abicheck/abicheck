name: ABI check
on:
  pull_request:
permissions:
  contents: read
jobs:
  abi-check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo && cmake --build build
      - uses: abicheck/abicheck@v0.6.0
        with:
          abi-baseline: latest-release
          new-library: build/libzpack.so
          new-header: include/
          lang: c
          build-config: .abicheck.yml
