name: ABI check
on:
  pull_request:
permissions:
  contents: read
jobs:
  abi-check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          path: new
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: old
      - run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool
      - run: |
          for side in old new; do (cd $side && autoreconf -fi && ./configure && make); done
      - uses: abicheck/abicheck@v0.6.0
        with:
          old-library: old/.libs/libtoken.so
          new-library: new/.libs/libtoken.so
          old-header: old/include
          new-header: new/include
          lang: c
