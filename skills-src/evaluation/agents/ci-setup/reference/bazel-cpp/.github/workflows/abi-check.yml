name: ABI check
on:
  pull_request:
permissions:
  contents: read
jobs:
  abi-check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - uses: bazel-contrib/setup-bazel@0.15.0
      - run: |
          bazel build -c dbg //:libkv.so
          mkdir -p out && cp bazel-bin/libkv.so out/
      - run: gh release download --pattern 'libkv.abicheck.json' --dir baseline
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: abicheck/abicheck@v0.6.0
        with:
          old-library: baseline/libkv.abicheck.json
          new-library: out/libkv.so
          new-header: include/
