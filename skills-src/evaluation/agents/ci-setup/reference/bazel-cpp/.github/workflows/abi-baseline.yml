name: ABI baseline
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        required: true
permissions:
  contents: read
jobs:
  dump:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          ref: ${{ env.TAG }}
      - run: bazel build -c dbg //:libkv.so && mkdir -p out && cp bazel-bin/libkv.so out/
      - uses: abicheck/abicheck@a1f78b640ba29960251f7043c17ae98a647ee135  # v0.6.0
        with:
          mode: dump
          new-library: out/libkv.so
          header: include/
          output-file: libkv.abicheck.json
      - run: gh release upload "$TAG" libkv.abicheck.json --clobber
        env:
          GH_TOKEN: ${{ github.token }}
