#
# G37 D5 — behavioral (L2) scenario corpus. Validated against
# schema/scenario.schema.json by tests/test_skill_eval_scenarios.py.
#
# Category A derives its expected outcome from examples/ground_truth.json and
# never restates it here. Category B carries invocation parameters that
# catalog structurally cannot express, so it states its own outcome.
#
# L1l (live trigger) does NOT appear here: it replays
# tests/agent_skills/trigger_corpus.yaml, the one labelled set L1s already
# grades statically, because activation precision is not computable without
# that file's negatives.
#
# `status: planned` means declared but not yet runnable — excluded from the
# expected-evidence set, and may not claim a fixture that already resolves.
# Category B is declared first and in full because every one of its entries is
# a place a skill can plausibly manufacture a green result.
#
# ADR-058's 2026-08-20 portfolio-reset amendment removed three of the four
# scenario-owning skills (`native-api-evolution`, `native-consumer-
# compatibility`, `native-release-compatibility`) from the published
# portfolio. Most of their scenarios were removed from this corpus in the
# same change rather than reassigned to the surviving `review-native-library-
# change` skill (renamed from `native-binary-compatibility-review`): that
# skill's workflow does not (yet) claim the API-evolution or whole-release-
# matrix capabilities those scenarios exercised, and reassigning a scenario
# to a skill that does not claim its scope would grade against capability the
# skill does not have. This is why dimension 2's `matrix_target_unrun`
# uncertainty kind (owned by the removed whole-release-matrix scenario) is
# narrowed correspondingly in `rubric.yaml`/`schema/`/
# `tests/test_skill_eval_scenarios.py` — see that amendment for the full
# accounting, including what remains deferred.
#
# The three named-consumer scenarios are the one exception: the flagship's
# own workflow explicitly directs `--used-by`/`--required-symbol` for a
# named application, plugin, or host (Step 3 of `SKILL.md`, citing
# `shared/consumer-scoping.md`) — that capability was *absorbed*, not
# dropped, by the reset. Reassigned to `check-abi-compatibility` rather
# than removed, so the inversion this corpus exists to catch (an agent that
# silently drops the informational `consumer_verdict` context instead of
# reporting it alongside the library-wide `verdict`) still has coverage.
#
# Workstream D-S1 (vision-api-abi-evolution.md "D. Optional prebuilt-consumer
# lifecycle") reverted `--used-by`/`--required-symbol(s)` from *replacing*
# the compatibility gate to merely *enriching* it: `verdict` is now always
# the library-wide result (never swapped for a supplied consumer's own
# scoped result), and a supplied consumer's own result is reported under the
# separate, purely informational `consumer_verdict` (report JSON:
# `consumer_scope.verdict`). The three scenarios below were updated in place
# for this — `verdict` restated as the full-library truth and the old
# `full_verdict` field renamed `consumer_verdict` — rather than reassigned,
# since the underlying inversion they guard against is unchanged.

schema_version: 1

scenarios:
  # ---------------------------------------------------------------- Category B
  # Of dimension 2's original four uncertainty kinds, three remain claimable
  # by the surviving skill; `matrix_target_unrun` has no scenario left since
  # its owning skill (`native-release-compatibility`) is no longer published
  # — see the file-level note above.

  - id: not-comparable-pair
    category: B
    skill: check-abi-compatibility
    status: ready
    coverage_note: "D4 uncertainty kind 1 — not comparable"
    prompt: >-
      Here are the previous and current builds of our shared library. Did this
      change break anything for programs already linked against it?
    fixture: skills-src/evaluation/agents/skills/fixtures/not-comparable-pair
    platforms: [linux]
    invocation:
      break_comparability: true
    expected:
      verdict: null
      uncertainty: not_comparable

  - id: evidence-too-shallow
    category: B
    skill: check-abi-compatibility
    status: ready
    coverage_note: "D4 uncertainty kind 2 — evidence too shallow for the question"
    prompt: >-
      Only the stripped release binaries survived for the old version. Can you
      still tell me whether the struct layouts our plugins depend on changed?
    fixture: skills-src/evaluation/agents/skills/fixtures/evidence-too-shallow
    platforms: [linux]
    # old/liblib.so is a committed, prebuilt x86_64 binary (the whole point
    # of this fixture -- only the stripped binary survived, so there is
    # nothing to rebuild from). The new side is built from source at run
    # time on whichever host runs the harness, so an aarch64 Linux runner
    # (this repository's CI has one) would build new/ for arm64 against an
    # x86_64 old/, producing a real elf_machine_changed cross-architecture
    # break instead of the intended shallow-evidence result.
    architectures: [x86_64]
    invocation:
      depth: symbols
    expected:
      verdict: COMPATIBLE
      uncertainty: evidence_too_shallow

  - id: contract-coverage-incomplete
    category: B
    skill: check-abi-compatibility
    status: ready
    coverage_note: "D4 uncertainty kind 4 — contract coverage incomplete (not the matrix case)"
    prompt: >-
      Check this release against the last one and tell me whether anything we
      actually export to customers changed.
    fixture: skills-src/evaluation/agents/skills/fixtures/contract-coverage-incomplete
    platforms: [linux]
    invocation:
      contract: exports
      contract_evaluation: true
    expected:
      verdict: COMPATIBLE
      uncertainty: contract_coverage_incomplete

  # The three consumer scenarios state both verdicts on purpose. `verdict` is
  # always the library-wide answer, and `consumer_verdict` is the informational
  # consumer-scoped one (report JSON: `consumer_scope.verdict`) — the skill's
  # own worked example is this exact pair (`verdict: BREAKING` with
  # `consumer_verdict: COMPATIBLE`). Stating only the library-wide value here
  # would reward silently dropping the consumer-side context — the inversion
  # the skill explicitly warns against.

  - id: consumer-unaffected-despite-break
    category: B
    skill: check-abi-compatibility
    status: ready
    coverage_note: "consumer answer diverging below the library's global verdict"
    prompt: >-
      The library team says this release has a breaking change. Does our
      renderer actually need rebuilding, or can we ship it as-is?
    fixture: skills-src/evaluation/agents/skills/fixtures/consumer-unaffected-despite-break
    platforms: [linux]
    invocation:
      used_by: ["renderer"]
    expected:
      verdict: BREAKING
      consumer_verdict: COMPATIBLE

  - id: consumer-actually-affected
    category: B
    skill: check-abi-compatibility
    status: ready
    coverage_note: "consumer answer confirming impact"
    prompt: >-
      We upgraded the shared library under our analytics daemon without
      rebuilding it. Is that safe?
    fixture: skills-src/evaluation/agents/skills/fixtures/consumer-actually-affected
    platforms: [linux]
    invocation:
      used_by: ["analytics-daemon"]
    expected:
      # The non-diverging half of the pair: scoped and global agree, so an
      # agent cannot pass both consumer scenarios by always reporting one field.
      verdict: BREAKING
      consumer_verdict: BREAKING

  - id: plugin-required-symbol-loss
    category: B
    skill: check-abi-compatibility
    status: ready
    coverage_note: "plugin loses a symbol its host requires"
    prompt: >-
      We're about to ship a new build of our plugin. Our host requires
      plugin_register and plugin_teardown to load a plugin at all — does the
      new build still satisfy that, or will it break existing installs of
      our host?
    fixture: skills-src/evaluation/agents/skills/fixtures/plugin-required-symbol-loss
    platforms: [linux]
    invocation:
      required_symbols: ["plugin_register", "plugin_teardown"]
    expected:
      # `--required-symbol` scopes the same way `--used-by` does, so this one
      # states both verdicts too.
      verdict: BREAKING
      consumer_verdict: BREAKING

  # ---------------------------------------------------------------- Category A
  # Expected outcome comes from examples/ground_truth.json — never restated.

  - id: removed-export
    category: A
    skill: check-abi-compatibility
    status: ready
    coverage_note: "removed export"
    case: case01_symbol_removal
    prompt: >-
      Review this change to our shared library for binary compatibility with
      applications already built against it.

  - id: changed-signature
    category: A
    skill: check-abi-compatibility
    status: ready
    coverage_note: "changed function signature"
    case: case02_param_type_change
    prompt: >-
      Does this change break existing consumers of the library, or only
      require a recompile?

  - id: struct-layout-drift
    category: A
    skill: check-abi-compatibility
    status: ready
    coverage_note: "struct layout drift"
    case: case07_struct_layout
    prompt: >-
      We changed a struct that appears in our public headers. Is that safe for
      already-compiled callers?

  - id: enum-value-change
    category: A
    skill: check-abi-compatibility
    status: ready
    coverage_note: "enum value change"
    case: case08_enum_value_change
    prompt: >-
      Someone reordered an enum in a public header. What does that do to
      programs already linked against this library?

  - id: vtable-change
    category: A
    skill: check-abi-compatibility
    status: ready
    coverage_note: "vtable change"
    case: case09_cpp_vtable
    prompt: >-
      A virtual function was added to a class our users derive from. Review
      this for compatibility.

  - id: compatible-addition
    category: A
    skill: check-abi-compatibility
    status: ready
    coverage_note: "compatible addition — false-green-without-evidence floor"
    case: case03_compat_addition
    prompt: >-
      We only added a new function this release. Confirm nothing else changed
      for existing consumers.

  - id: constant-value-changed
    category: A
    skill: check-abi-compatibility
    status: ready
    coverage_note: >-
      source-only API break — a changed public constant's value has no
      exported symbol to break, so a binary-only view sees nothing; only
      header-depth evidence catches it, and the right answer is "recompile
      required," not "binary break"
    case: case124_header_constant_value_changed
    prompt: >-
      We changed the value of a public constant in our headers — no function
      signatures moved. Can existing binaries keep running against the new
      library as-is, or do they need to be rebuilt?

  - id: runtime-floor-raised
    category: A
    skill: check-abi-compatibility
    status: ready
    coverage_note: >-
      COMPATIBLE_WITH_RISK — a function keeps its mangled symbol (not a
      linkage break) but dropping its noexcept guarantee raises the
      library's minimum required libstdc++ version, a deployment risk
      distinct from either a clean pass or an outright break
    case: case15_noexcept_change
    prompt: >-
      We removed the noexcept guarantee from a function that now throws
      internally. The symbol itself didn't change. Is this release still
      safe to deploy for people already running the old library?

  # ------------------------------------------------ explain-abi-change (B)
  # A developer trying to understand an ABI-related observation in an
  # existing environment -- usually a failure, sometimes just a library
  # update -- worked back to the mechanism behind it. Each fixture's `setup.sh` builds a small environment: the program
  # is linked against `sdk/`, and `env/run.sh` runs it the way its users do.
  # `expected.verdict` compares the library the program was built against
  # with the one the loader actually uses; `expected.cause` is the mechanism
  # the answer must name (claim `diagnosis.cause`). The last scenario is the
  # control: the libraries are identical and the failure is the program's
  # own, so the right answer is that there is no ABI problem.

  - id: explain-missing-symbol
    category: B
    skill: explain-abi-change
    status: ready
    coverage_note: "undefined symbol at startup; the installed library dropped an export"
    prompt: >-
      After we updated libwidget on our dev box, our app won't start any
      more. Run ./setup.sh once to build the environment, then
      ./env/run.sh shows the error. What is wrong, and how do we fix it?
    fixture: skills-src/evaluation/agents/skills/fixtures/explain-missing-symbol
    platforms: [linux]
    invocation: {}
    expected:
      verdict: BREAKING
      cause: symbol_removed

  - id: explain-stale-copy-loaded
    category: B
    skill: explain-abi-change
    status: ready
    coverage_note: "undefined symbol, but the right library is installed; a stale copy wins the search"
    prompt: >-
      We installed the latest libwidget into env/opt/widget, but our app
      still fails to start. Run ./setup.sh once, then ./env/run.sh shows the
      error. Why is this happening and what should we change?
    fixture: skills-src/evaluation/agents/skills/fixtures/explain-stale-copy-loaded
    platforms: [linux]
    invocation: {}
    expected:
      verdict: BREAKING
      cause: stale_library_loaded

  - id: explain-missing-version-node
    category: B
    skill: explain-abi-change
    status: ready
    coverage_note: "version node not found at load time"
    prompt: >-
      Our app fails at startup on the test machine with a message about a
      version not being found. Run ./setup.sh once, then ./env/run.sh to
      see it. What is going on and what do we do about it?
    fixture: skills-src/evaluation/agents/skills/fixtures/explain-missing-version-node
    platforms: [linux]
    invocation: {}
    expected:
      verdict: BREAKING
      cause: symbol_version_missing

  - id: explain-layout-mismatch
    category: B
    skill: explain-abi-change
    status: ready
    coverage_note: "no loader error; wrong results from a changed struct layout"
    prompt: >-
      Since libwidget was updated, our app starts fine but prints the wrong
      area for a 3x4 widget; it should print 12. Run ./setup.sh once, then
      ./env/run.sh. Nothing in our code changed. What happened?
    fixture: skills-src/evaluation/agents/skills/fixtures/explain-layout-mismatch
    platforms: [linux]
    invocation: {}
    expected:
      verdict: BREAKING
      cause: layout_changed

  - id: explain-dual-cxx-abi
    category: B
    skill: explain-abi-change
    status: ready
    coverage_note: "same source, different _GLIBCXX_USE_CXX11_ABI build setting"
    prompt: >-
      We rebuilt libwidget from exactly the same source and now our C++ app
      fails to start with a symbol error. Run ./setup.sh once, then
      ./env/run.sh. The code is identical, so what broke?
    fixture: skills-src/evaluation/agents/skills/fixtures/explain-dual-cxx-abi
    platforms: [linux]
    invocation: {}
    expected:
      verdict: BREAKING
      cause: cxx_abi_mismatch

  - id: explain-not-an-abi-problem
    category: B
    skill: explain-abi-change
    status: ready
    coverage_note: "control: identical libraries; the failure is the program's own"
    prompt: >-
      Our app started failing after we reinstalled libwidget; it now exits
      with an error. Run ./setup.sh once, then ./env/run.sh. Is the library
      the problem, and what should we do?
    fixture: skills-src/evaluation/agents/skills/fixtures/explain-not-an-abi-problem
    platforms: [linux]
    invocation: {}
    expected:
      verdict: NO_CHANGE
      cause: not_an_abi_problem

  # The two below were written after the skill itself, as a check it was not
  # tuned to the first six. Both remove the easy path: no side-by-side source
  # for the library that is actually loaded, or a launcher whose library path
  # looks right while the binary's own RPATH wins the search.

  - id: explain-rpath-overrides-path
    category: B
    skill: explain-abi-change
    status: ready
    coverage_note: "undefined symbol although LD_LIBRARY_PATH names the right copy; a DT_RPATH in the program wins"
    prompt: >-
      Our launcher points LD_LIBRARY_PATH at env/lib, where the current
      libwidget is installed, yet the app still fails to start. Run
      ./setup.sh once, then ./env/run.sh. Why, and what should we change?
    fixture: skills-src/evaluation/agents/skills/fixtures/explain-rpath-overrides-path
    platforms: [linux]
    invocation: {}
    expected:
      verdict: BREAKING
      cause: stale_library_loaded

  - id: explain-layout-binary-only
    category: B
    skill: explain-abi-change
    status: ready
    coverage_note: "wrong results; the installed library ships as a binary only, so the layout change is visible only in the binary"
    prompt: >-
      We dropped a vendor build of libwidget into our dev environment and now
      our app prints the wrong area for a 3x4 widget; it should print 12. We
      only have their binary. Run ./setup.sh once, then ./env/run.sh. What
      is going on?
    fixture: skills-src/evaluation/agents/skills/fixtures/explain-layout-binary-only
    platforms: [linux]
    architectures: [x86_64]
    invocation: {}
    expected:
      verdict: BREAKING
      cause: layout_changed

  # Added with the developer-question framing: one change that only looks
  # like a removal (the used library is older than the build's), and one
  # library update where nothing fails and the developer asks what changed.

  - id: explain-library-older-than-build
    category: B
    skill: explain-abi-change
    status: ready
    coverage_note: "undefined symbol because the program was built against a newer release than the one it runs on"
    prompt: >-
      Our app builds fine against the libwidget SDK we ship with, but in our
      test environment it fails at startup. Did libwidget drop something?
      Run ./setup.sh once, then ./env/run.sh. What changed, and what should
      we do?
    fixture: skills-src/evaluation/agents/skills/fixtures/explain-library-older-than-build
    platforms: [linux]
    invocation: {}
    expected:
      verdict: BREAKING
      cause: library_older_than_build

  - id: explain-additions-only
    category: B
    skill: explain-abi-change
    status: ready
    coverage_note: "the used library is a newer release that only adds exports; nothing fails"
    prompt: >-
      Our dev environment picked up a newer libwidget than the one our app
      was built against, and its exported symbols look different. The app
      still seems to run. Run ./setup.sh once, then ./env/run.sh. What
      actually changed, and do we need to rebuild or change anything?
    fixture: skills-src/evaluation/agents/skills/fixtures/explain-additions-only
    platforms: [linux]
    invocation: {}
    expected:
      verdict: COMPATIBLE
      cause: not_an_abi_problem

  # Hard scenarios: the difference is not in any source or header the
  # developer can read, and `nm` shows nothing removed. Each installed
  # library is a vendor binary built without its compiler switches recorded,
  # so only the compiled layout (debug info) tells the two builds apart.

  - id: explain-flag-only-layout
    category: B
    skill: explain-abi-change
    status: ready
    coverage_note: "vendor build of byte-identical sources and headers; a compiler flag changed the enum size and every later field offset"
    prompt: >-
      We switched to the vendor's build of libwidget. They ship its sources
      and headers too, and those are byte-for-byte identical to our SDK's;
      the exported symbols match as well. Yet our app now prints the wrong
      area for a 3x4 widget; it should print 12. Run ./setup.sh once, then
      ./env/run.sh. What is actually different?
    fixture: skills-src/evaluation/agents/skills/fixtures/explain-flag-only-layout
    platforms: [linux]
    architectures: [x86_64]
    invocation: {}
    expected:
      verdict: BREAKING
      cause: layout_changed

  - id: explain-macro-configured-layout
    category: B
    skill: explain-abi-change
    status: ready
    coverage_note: "same sources and headers; the vendor configured a header macro differently, changing a struct's size"
    prompt: >-
      The vendor's libwidget is built from the same release as our SDK and
      the headers they ship are identical to ours, but our app prints the
      wrong area for a 3x4 widget; it should print 12. Run ./setup.sh once,
      then ./env/run.sh. What changed between the two builds?
    fixture: skills-src/evaluation/agents/skills/fixtures/explain-macro-configured-layout
    platforms: [linux]
    architectures: [x86_64]
    invocation: {}
    expected:
      verdict: BREAKING
      cause: layout_changed

  - id: explain-vtable-grew-binary-only
    category: B
    skill: explain-abi-change
    status: ready
    coverage_note: "a binary-only C++ update that only adds symbols, but adds a virtual method to a class the app derives from"
    prompt: >-
      The vendor shipped a new libwidget (binary only, no headers). Their
      release note says the update only adds functions, and comparing the
      exported symbols confirms nothing was removed. Since we installed it,
      our app crashes. Run ./setup.sh once, then ./env/run.sh. What changed,
      and what do we need to do?
    fixture: skills-src/evaluation/agents/skills/fixtures/explain-vtable-grew-binary-only
    platforms: [linux]
    architectures: [x86_64]
    invocation: {}
    expected:
      verdict: BREAKING
      cause: layout_changed
