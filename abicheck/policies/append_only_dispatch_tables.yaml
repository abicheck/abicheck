# abicheck built-in "append_only_dispatch_tables" policy — opt-in profile for
# function-pointer / dispatch tables whose contract is append-only tail growth
# (issue #1709).
#
# Level Zero (`ze_*_dditable_t`, `zes_dditable_driver_t`, `zet_*`, `zes_*`, `zer_*`, `zel_*`, plus the
# top-level aggregates `ze_dditable_t`/`zes_dditable_t`; DWARF names each by its
# struct tag, so `_ze_device_dditable_t` matches too), the Vulkan
# loader/layer dispatch tables (`VkLayerDispatchTable`,
# `VkLayerInstanceDispatchTable`) and the OpenCL ICD dispatch table
# (`cl_icd_dispatch`) are versioned by appending function pointers at the end.
# A consumer built against the old header only reads the prefix it knows, and
# the provider fills (or the caller sizes) the table for its own version, so a
# trailing append plus the size growth it causes is compatible by contract.
#
# Turnkey usage:
#
#   abicheck compare old/libze_loader.so.1 new/libze_loader.so.1 --policy append_only_dispatch_tables
#
# What this profile does, for matching type names ONLY:
#   - type_field_added / type_field_added_compatible  -> ignore
#   - type_size_changed                               -> ignore
#   - type_field_offset_changed, ONLY when compare recorded that the shift is
#     exactly the size growth of earlier members embedded by value whose types
#     also match (the top-level aggregates `_ze_dditable_t`/`_zes_dditable_t`
#     hold every sub-table by value; issue #1759)        -> ignore
#
# What stays BREAKING (not listed, so strict_abi still decides):
#   - removing a member ........... type_field_removed
#   - reordering / inserting ...... type_field_offset_changed (every shifted member)
#   - retyping a member ........... type_field_type_changed
#   - alignment change ............ type_alignment_changed
#   - any type whose name does not match the patterns below.
#   - an aggregate offset shift with any other cause (a reorder, insertion,
#     removal or retype before it, a padding change, or growth of an embedded
#     member whose type does not match): still type_field_offset_changed.
#     The grown sub-table's own reorder/removal/retype is reported on it.
#
# A size shrink always comes with type_field_removed (or an offset/type change
# of an existing member), so ignoring type_size_changed for these names never
# hides a real layout break on its own.
#
# Findings are reclassified, never suppressed: each one stays in the report
# with `reclassified_by` naming the rule label and reason (ADR-067).
#
# Own type names: copy the `reclassify:` block below into your policy file and
# replace `type_pattern` (a full-match regular expression over the type name).
base_policy: strict_abi

reclassify:
  - id: append-only-dispatch-table-member-added
    kind: type_field_added_compatible
    type_pattern: &dispatch_tables "_?(ze|zet|zes|zer|zel)(_[A-Za-z0-9_]*)?_dditable(_[A-Za-z0-9]+)?_t|VkLayer(Instance)?DispatchTable|_?cl_icd_dispatch"
    to: ignore
    label: append-only dispatch table
    reason: "member appended at the tail of an append-only dispatch table; existing members keep their offsets"
  - id: append-only-dispatch-table-member-added-unproven-layout
    kind: type_field_added
    type_pattern: *dispatch_tables
    to: ignore
    label: append-only dispatch table
    reason: "member added to an append-only dispatch table; any shift of an existing member is still reported as type_field_offset_changed"
  - id: append-only-dispatch-table-size-grew
    kind: type_size_changed
    type_pattern: *dispatch_tables
    to: ignore
    label: append-only dispatch table
    reason: "size growth of an append-only dispatch table from trailing members; removals, reorders and retypes are still reported separately"
  - id: append-only-dispatch-table-aggregate-shift
    kind: type_field_offset_changed
    type_pattern: *dispatch_tables
    shifted_by_type_pattern: *dispatch_tables
    to: ignore
    label: append-only dispatch table
    reason: "member shifted only because earlier embedded append-only dispatch tables grew; reorders, removals and retypes are still reported"
