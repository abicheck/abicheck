# Exclusions must hold for explicitly-passed paths too, not just directory
# walks. `pre-commit` invokes its hooks with the changed files as arguments,
# and ruff normally ignores `exclude` for a path named on the command line
# (see ruff's own `force-exclude` docs, which name pre-commit as the case).
# Without this, the `[format] exclude` below is honored by `verify.py`'s
# directory-walking `fmt-check` but silently bypassed by the `ruff-format`
# hook: committing a regenerated `kinds.pyi` would have the hook reformat it
# and `gen_changekind_stub.py --check` then reject it, with no way through the
# normal hook workflow. Local and CI must enforce the same contract.
force-exclude = true

[lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]  # line length

[lint.isort]
# Keep redundant-alias re-exports (`from .leaf import (a as a, b as b)`) in a
# single parenthesized statement instead of exploding each into its own import.
# The `as` form marks explicit re-exports for mypy (no_implicit_reexport); without
# this, isort splits them and balloons the size-split leaf re-export blocks.
combine-as-imports = true

[lint.per-file-ignores]
"tests/*" = ["S101"]  # allow assert in tests
"tests/test_platform_coverage_gaps.py" = ["E402"]  # sectioned imports by module

[format]
# `kinds.pyi` is generated by `scripts/gen_changekind_stub.py`, which is its
# formatting authority: the script emits one `NAME = 'value'` line per member
# with no line-wrapping, and `gen_changekind_stub.py --check` (a required CI
# gate) fails on any byte that differs from what it would write. Formatting it
# here would rewrite the quotes and wrap the members whose slug pushes the line
# past 88 columns, so `--check` and `fmt-check` could never both pass — and
# teaching the generator to reproduce the formatter's wrapping would mean a
# second, hand-maintained copy of `ruff format`'s line-breaking rules.
# Lint is deliberately still applied; only formatting is excluded.
exclude = ["abicheck/model/change_catalog/kinds.pyi"]
