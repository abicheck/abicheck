# catalog/catalog_classification.yaml
#
# Declarative per-case semantic classification consumed by
# scripts/gen_catalog_taxonomy.py -- see "Making the generator's semantic
# classification declarative" in
# docs/contribute/plans/examples-catalog-split.md's "What is left" section.
#
# Every case in catalog/ground_truth.json["verdicts"] must have exactly one
# entry below, under either `scenarios` or `rules`. Unlike the previous
# hard-coded case-number-set implementation, a case with no entry here fails
# `gen_catalog_taxonomy.py` outright -- classification never silently defaults
# to "entity: rule, ecosystem: generic" for a case nobody has classified yet.

scenarios:
  case107_task_scheduler_init_removed: {scenario_kind: case-study, ecosystem: onetbb}
  case108_task_class_removed: {scenario_kind: case-study, ecosystem: onetbb}
