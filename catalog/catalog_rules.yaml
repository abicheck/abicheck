# Canonical registry of the compatibility rules the calibration catalog names.
#
# Phase 2/6 of the examples/catalog split
# (docs/contribute/plans/examples-catalog-split.md). Every rule slug used
# anywhere in ground_truth.json's `taxonomy` block -- a rule-entity case's
# own `rule_slug`, or a scenario-entity case's `related_rules` -- must have
# an entry here, and every entry here must be used by at least one case.
# `scripts/gen_catalog_taxonomy.py` enforces both directions (see
# `validate_rule_registry`), which is what stops a typo, a synonym, or an
# accidental rename in `related_rules` from silently becoming one more
# "distinct compatibility rule" in the catalog-coverage headline.
#
# Hand-authored, not generated: `title` and `definition` state what the rule
# *means*, which no amount of ChangeKind/case-name derivation can supply.
# Deliberately NOT stated here, because they are derived from the taxonomy
# and would go stale the moment a case is added or reclassified:
#
#   status         "demonstrated" (at least one rule-entity case carries this
#                  slug as its rule_slug) or "referenced-only" (named solely
#                  by a scenario's related_rules -- a mechanism no
#                  single-library case demonstrates on its own yet)
#   canonical_case the non-variant rule-entity case demonstrating the rule
#   cases          every case carrying the slug, canonical/variant/duplicate
#   scenarios      every scenario composing the rule via related_rules
#
# `scripts/catalog_rule_registry.py` loads this file and joins it against the
# taxonomy to produce those derived fields for the coverage report and the
# generated by-rule/ doc pages.

rules:
  abi-tag-changed:
    title: ABI tag changed
    definition: A declaration gains, loses, or changes a compiler ABI tag, remangling its symbol so existing binaries no longer resolve it.
  access-level:
    title: Member access level changed
    definition: A class member moves between public, protected, and private, changing what compiles against the header and, for some compilers, member ordering.
  accidental-export-removed-still-breaking:
    title: Accidental export removed
    definition: A symbol that was never meant to be public is withdrawn, which is still a break for the consumers that had already come to depend on it.
  allocator-nested-typedef-removed:
    title: Allocator nested typedef removed
    definition: An allocator-like template drops a nested typedef the standard library contract requires, breaking generic code that names it.
  anon-struct:
    title: Anonymous aggregate member changed
    definition: An anonymous struct or union member changes shape, altering the enclosing type's size or field offsets.
  api-depends-on-consumer-env:
    title: Exported surface depends on consumer environment
    definition: Which symbols the library exports depends on the consumer's own build environment, so the same release presents different ABI to different users.
  api-pointee-const-abi-neutral:
    title: Pointee constness added, ABI neutral
    definition: A C parameter gains pointee constness, which changes the source contract without changing the binary calling convention.
  atomic-qualifier-changed:
    title: Atomic qualifier changed
    definition: A type gains or loses _Atomic, changing its size, alignment, and access protocol for existing binaries.
  audit-accidental-export:
    title: Exported symbol is not public API
    definition: A single-release audit finds a symbol in the export table that no public header declares, so it is reachable but unsupported.
  audit-private-header-leak:
    title: Private header leaks into the public surface
    definition: A single-release audit finds a public header including a private one, pulling internal declarations into the supported surface.
  audit-rtti-for-internal:
    title: RTTI emitted for an internal type
    definition: A single-release audit finds RTTI records for a type the public headers never declare, exposing an internal polymorphic type through the binary.
  audit-unversioned-export:
    title: Exported symbol carries no version
    definition: A single-release audit finds an exported symbol with no version node in a library that otherwise versions its exports.
  base-became-virtual:
    title: Base class became virtual
    definition: A base class becomes virtually inherited, introducing a vbase pointer and relocating every member of the derived object.
  base-class:
    title: Base class list changed
    definition: A class gains, loses, or replaces a base class, changing its layout, its conversions, and its vtable.
  base-class-member-added:
    title: Base class gained a member
    definition: A field added to a base class grows it and shifts every derived-class member that follows, invalidating existing offsets.
  base-class-position-changed:
    title: Base class position changed
    definition: The order of base classes changes, relocating base subobjects within the derived object and invalidating existing upcasts.
  bit-int-width-changed:
    title: _BitInt width changed
    definition: A _BitInt declaration changes width, changing the parameter size and register class existing callers pass it in.
  bitfield-changed:
    title: Bitfield width or position changed
    definition: A bitfield member changes width or packing position, so existing binaries read and write the wrong bits.
  calling-convention-changed:
    title: Calling convention changed
    definition: A function changes calling convention, so existing callers pass arguments and clean up the stack in a way the new code does not expect.
  cet-protection-weakened:
    title: CET protection weakened
    definition: The library drops Intel CET indirect-branch-tracking or shadow-stack markings, weakening the hardening a consumer process relies on.
  char-signedness-flip:
    title: Plain char signedness flipped
    definition: The build flips plain char between signed and unsigned, changing value semantics and mangled names that spell plain char.
  char8t-migration:
    title: char8_t migration
    definition: UTF-8 interfaces move from char to char8_t, remangling every affected symbol and changing the types callers must pass.
  class-became-final:
    title: Class became final
    definition: A class is marked final, so existing derived classes in consumer code no longer compile.
  compat-addition:
    title: Compatible addition
    definition: The new release adds a declaration without touching anything that already existed, which existing binaries and sources are unaffected by.
  concept-tightening:
    title: Concept tightened
    definition: A constraint becomes stricter, so consumer types that previously satisfied it are now rejected at compile time.
  covariant-return-changed:
    title: Covariant return type changed
    definition: An override's covariant return type changes, altering the thunk the vtable slot points at and the type callers receive.
  cpo-kind-changed:
    title: Customization point object kind changed
    definition: A customization point changes between a function, a function object, and a niebloid, changing how consumer code may name and invoke it.
  cpp-vtable:
    title: Virtual table layout changed
    definition: A polymorphic class's vtable changes shape, so existing binaries dispatch through the wrong slot.
  cpu-dispatch-isa-dropped:
    title: Dispatched ISA variant dropped
    definition: A runtime-dispatched implementation drops an instruction-set variant, silently downgrading or failing on hardware that used it.
  ctor-became-explicit:
    title: Constructor became explicit
    definition: A converting constructor is marked explicit, so consumer code relying on implicit conversion no longer compiles.
  cxx-standard-floor-raised:
    title: C++ standard floor raised
    definition: The library is built against a newer language standard whose ABI-relevant defaults differ, changing layouts and mangling for consumers below that floor.
  cyclic-type-member-added:
    title: Self-referential type gained a member
    definition: A type that refers to itself through a pointer or reference gains a member, growing every instance including the embedded ones.
  data-object-size-changed:
    title: Exported data object size changed
    definition: An exported variable changes size, so existing binaries that copy or index it read past or short of its real extent.
  default-argument-removed:
    title: Default argument removed
    definition: A parameter loses its default, so consumer calls that omitted the argument no longer compile.
  default-template-arg-changed:
    title: Default template argument changed
    definition: A template's default argument changes, so the same written specialization now names a different, differently-mangled instantiation.
  dependency-leak:
    title: Dependency type leaks into layout
    definition: A public type embeds a type from a transitive dependency, so that dependency's own layout change propagates into this library's ABI.
  detail-base-class-changed:
    title: Internal base class leaks through a public type
    definition: A public class inherits from an internal one, so a change to the internal base relocates the public object's members.
  detail-embedded-by-value:
    title: Internal type embedded by value
    definition: A public type holds an internal type by value, so the internal type's size becomes part of the public ABI.
  detail-pimpl-vtable-changed:
    title: Internal pimpl vtable leaks
    definition: A pimpl-hidden implementation is polymorphic and its vtable is reachable through the public type, so internal virtual changes break consumers.
  detail-templated-base-changed:
    title: Internal templated base leaks
    definition: A public class derives from an internal template, so changing that template's members shifts the public class's own layout.
  embedded-type-size-increased:
    title: Embedded type size increased
    definition: A type embedded by value in a public aggregate grows, changing the enclosing type's size and every subsequent field offset.
  empty-base-optimization-lost:
    title: Empty base optimization lost
    definition: A previously empty base gains state, so the empty-base optimization no longer applies and the derived object grows and shifts.
  enum-member-added:
    title: Enumerator added
    definition: An enumeration gains a member, which existing binaries never produce or handle and which may widen the enumeration's range.
  enum-member-removed:
    title: Enumerator removed
    definition: An enumeration loses a member, so consumer code naming it no longer compiles and stored values become unrepresentable.
  enum-member-value-changed:
    title: Enumerator value changed
    definition: An enumerator keeps its name but changes its numeric value, so existing binaries and persisted data carry the wrong meaning.
  enum-rename:
    title: Enumerator renamed
    definition: An enumerator is renamed, so consumer code naming the old spelling no longer compiles.
  enum-size-flag-flip:
    title: Short-enums build flag flipped
    definition: The build flips the short-enums setting, changing every enumeration's underlying size and therefore every layout containing one.
  enum-underlying-size-changed:
    title: Enumeration underlying type changed
    definition: An enumeration's underlying type changes width, changing its size wherever it is stored and how it is passed.
  env-runtime-floor-raised:
    title: Runtime floor raised
    definition: The library starts requiring a newer runtime or symbol version, so it no longer loads in environments that previously ran it.
  exceptions-mode-flip:
    title: Exceptions mode flipped
    definition: The library is rebuilt with exceptions disabled or enabled, changing unwind tables and the guarantees callers may rely on.
  executable-stack-flag-changed:
    title: Executable-stack marking changed
    definition: The library's executable-stack marking changes, which changes the memory protections imposed on every process that loads it.
  experimental-graduated:
    title: Experimental API graduated
    definition: An experimental declaration moves to its stable spelling, so consumers of the experimental name must migrate.
  experimental-removed-without-replacement:
    title: Experimental API removed without replacement
    definition: An experimental declaration is withdrawn with no stable successor, leaving consumers with no migration path.
  exported-function-removed:
    title: Exported function removed
    definition: A function is no longer exported, so existing binaries that import it fail to resolve at load or call time.
  field-layout:
    title: Field layout changed
    definition: A public aggregate's fields are reordered or resized, so existing binaries read the wrong offsets.
  field-qualifiers:
    title: Field type qualifiers changed
    definition: A field's type qualifiers change, altering the source contract and, where the qualifier is ABI-relevant, its representation.
  field-rename:
    title: Field renamed
    definition: A public aggregate's field is renamed, so consumer source naming it no longer compiles even though the layout is unchanged.
  flexible-array-member-changed:
    title: Flexible array member changed
    definition: A trailing flexible array member is added, removed, or resized, changing how consumers must allocate and index the object.
  frozen-runtime-signature-changed:
    title: Frozen runtime entry point signature changed
    definition: A runtime entry point whose signature is contractually frozen changes anyway, so existing binaries call it with the wrong argument shape.
  func-became-inline:
    title: Function became inline
    definition: A function stops being emitted as an exported symbol and becomes header-inline, so existing binaries can no longer resolve it.
  glibcxx-dual-abi-flip:
    title: libstdc++ dual ABI flipped
    definition: The build flips the libstdc++ dual-ABI setting, remangling every symbol that spells a std::string or std::list in its signature.
  global-var-type:
    title: Exported variable type changed
    definition: An exported variable's type changes, so existing binaries interpret its storage incorrectly.
  header-constant-value-changed:
    title: Public constant value changed
    definition: A constant defined in a public header changes value, so already-compiled consumers carry the old value while new code carries the new one.
  hidden-friend-removed:
    title: Hidden friend removed
    definition: A hidden friend function is withdrawn, so consumer code that found it by argument-dependent lookup no longer compiles.
  ifunc-transition:
    title: Symbol became an IFUNC
    definition: A plain symbol becomes an indirect function resolved at load time, changing its relocation model and its behaviour under early initialization.
  inherited-override-reuses-slot:
    title: Override reuses an inherited vtable slot
    definition: A derived class overrides an inherited virtual, adding an exported symbol while reusing the existing slot rather than growing the vtable.
  inline-accessor-renamed-pimpl-member:
    title: Inline accessor references a renamed internal member
    definition: A header-inline accessor names an internal member that was renamed, so already-inlined consumer code refers to a member that no longer exists.
  inline-function-outlined:
    title: Inline function outlined
    definition: A previously header-inline function becomes an exported out-of-line symbol, so old and new consumers can disagree on which body runs.
  inline-function-removed:
    title: Inline function removed
    definition: A header-inline function is deleted, so consumer source that calls it no longer compiles.
  inline-namespace-moved:
    title: Inline namespace membership changed
    definition: A declaration moves into or out of an inline namespace, changing its mangled name while its source spelling stays the same.
  inline-namespace-version-bumped:
    title: Inline namespace version bumped
    definition: The library bumps its versioned inline namespace, remangling every symbol inside it so old imports no longer resolve.
  internal-enum-churn-scoped:
    title: Internal enumeration churn, out of contract
    definition: An enumeration reachable only from internal headers changes, which public-surface scoping correctly declines to report.
  internal-struct-field-added-scoped:
    title: Internal struct gained a field, out of contract
    definition: A struct reachable only from internal headers gains a field, which public-surface scoping correctly declines to report.
  internal-struct-field-removed-scoped:
    title: Internal struct lost a field, out of contract
    definition: A struct reachable only from internal headers loses a field, which public-surface scoping correctly declines to report.
  internal-struct-reordered-scoped:
    title: Internal struct reordered, out of contract
    definition: A struct reachable only from internal headers is reordered, which public-surface scoping correctly declines to report.
  internal-template-signature-changed:
    title: Internal template signature leaks through the public API
    definition: A public signature names an internal template whose parameters changed, so the public symbol is remangled and existing imports break.
  internal-version-node-churn:
    title: Internal version node churn
    definition: A symbol version node the library documents as private is retired, which is churn rather than a supported-surface break.
  language-linkage-changed:
    title: Language linkage changed
    definition: A declaration moves between C and C++ linkage, changing whether its symbol is mangled and therefore what existing binaries import.
  leaf-struct-through-pointer:
    title: Pointed-to struct changed size
    definition: A struct only ever handled through a pointer changes size, which still breaks consumers that allocate or index it.
  long-double-abi-changed:
    title: long double ABI changed
    definition: The long double representation changes, so existing binaries pass and store floating-point values the new code misreads.
  lto-mode-flip:
    title: LTO mode flipped
    definition: The library is rebuilt with link-time optimization enabled or disabled, changing what is emitted and what remains externally visible.
  method-became-static:
    title: Member function became static
    definition: A member function loses its implicit this parameter, remangling it and changing the call sequence existing binaries use.
  method-const-changed:
    title: Member function cv-qualification changed
    definition: A member function gains or loses const, remangling it so existing imports no longer resolve.
  missing-template-instantiation:
    title: Explicit template instantiation missing
    definition: An explicit instantiation the previous release exported is absent from the new binary, so consumers that relied on it fail to link.
  multi-dim-array-change:
    title: Multidimensional array member changed
    definition: A multidimensional array member changes extents, changing its element indexing and the enclosing type's size.
  namespace-pollution:
    title: Declarations moved between namespaces
    definition: Declarations move between namespaces, so the old mangled names disappear and consumer source must be requalified.
  needed-added:
    title: New shared-library dependency added
    definition: The library gains a DT_NEEDED entry, so consumers must now be able to resolve a dependency they did not previously need.
  no-change:
    title: No change
    definition: The two releases are ABI- and API-identical -- a control case asserting the tool reports nothing.
  no-unique-address:
    title: no_unique_address applied or removed
    definition: A member gains or loses [[no_unique_address]], changing whether it occupies storage and therefore the enclosing type's layout.
  noexcept-change:
    title: noexcept specification changed
    definition: A function's exception specification changes, altering the guarantee callers compiled against and, for function pointers, the type itself.
  overload-added:
    title: Overload added
    definition: An overload is added to an existing name, which can make previously unambiguous consumer calls ambiguous.
  param-defaults:
    title: Parameter default value changed
    definition: A parameter's default changes, so already-compiled consumers keep passing the old default while newly-compiled ones pass the new one.
  param-type-change:
    title: Parameter type changed
    definition: A function parameter's type changes, so existing binaries pass a value the new implementation misinterprets.
  pimpl-shared-to-unique:
    title: Pimpl handle type changed
    definition: A pimpl handle changes smart-pointer type, changing the owning object's size and its copy semantics.
  pointer-chain-type-change:
    title: Pointer chain target type changed
    definition: A type reached through a chain of pointers changes, so existing binaries dereference it against the wrong layout.
  pointer-level:
    title: Pointer indirection level changed
    definition: A parameter gains or loses a level of indirection, so existing callers pass a value the callee dereferences incorrectly.
  polymorphic-nonvirtual-dtor:
    title: Polymorphic type has a non-virtual destructor
    definition: A type with virtual functions is destroyed through a base pointer without a virtual destructor, so derived state is never destroyed.
  preproc-conditional-field:
    title: Preprocessor-conditional field
    definition: A field's presence depends on a preprocessor condition, so library and consumer can disagree on the type's layout.
  protected-visibility:
    title: ELF symbol visibility changed
    definition: A symbol's ELF visibility changes, changing whether consumers can interpose or bind directly to it.
  public-api-gains-internal-dependency:
    title: Public API gained an internal dependency
    definition: A public declaration starts depending on an internal one, so the supported surface is no longer self-contained.
  public-class-private-base-class:
    title: Public class derives from a private class
    definition: A public class inherits from a class the public headers do not declare, putting an unpublished layout inside the supported surface.
  public-function-private-parameter-type:
    title: Public function takes a private parameter type
    definition: A public function's signature names a type the public headers do not declare, so consumers cannot legally form the call.
  public-macro-removed:
    title: Public macro removed
    definition: A macro defined by a public header is deleted, so consumer source that uses it no longer compiles.
  public-struct-private-field-type:
    title: Public struct has a private field type
    definition: A public struct holds a field whose type the public headers do not declare, hiding part of a supported type's layout.
  public-typedef-removed:
    title: Public typedef removed
    definition: A typedef declared by a public header is deleted, so consumer source naming it no longer compiles.
  pure-virtual-added:
    title: Virtual function became pure
    definition: A virtual function becomes pure, so existing derived classes in consumer code become abstract and can no longer be instantiated.
  python-kwarg-renamed:
    title: Python keyword argument renamed
    definition: An extension module renames a keyword parameter, so Python callers passing it by name fail at runtime.
  ref-qualifier-added:
    title: Reference qualifier added
    definition: A member function gains an lvalue or rvalue reference qualifier, remangling it and restricting which objects may call it.
  relro-weakened:
    title: RELRO hardening weakened
    definition: The library drops full or partial RELRO, leaving relocation data writable in processes that load it.
  return-type:
    title: Return type changed
    definition: A function's return type changes, so existing callers read the result from the wrong place or with the wrong width.
  rpath-leak:
    title: Build-machine search path leaked
    definition: The binary carries an RPATH or RUNPATH pointing at a build-machine directory, changing where consumers resolve dependencies from.
  rtti-mode-flip:
    title: RTTI mode flipped
    definition: The library is rebuilt with RTTI disabled or enabled, changing whether dynamic_cast and typeid work across the boundary.
  runpath-changed:
    title: RUNPATH changed
    definition: The library's RUNPATH changes, so dependency resolution can pick different libraries in a consumer's process.
  secondary-vtable-group-changed:
    title: Secondary vtable group changed
    definition: A secondary vtable under multiple inheritance changes shape, so dispatch through a non-primary base lands on the wrong slot.
  serialization-tag-reassigned:
    title: Serialization tag reassigned
    definition: A persisted type or message tag is reassigned to a different meaning, so old and new data are silently misinterpreted.
  soname:
    title: SONAME missing
    definition: The library ships without a SONAME, so consumers record the build-time filename and lose the versioned-dependency contract.
  soname-inconsistent:
    title: SONAME inconsistent with the release
    definition: The SONAME does not match the release it ships in, so the runtime linker resolves a different library than intended.
  stack-canary-removed:
    title: Stack protector removed
    definition: The library is rebuilt without stack-protector instrumentation, weakening the hardening a consumer process relies on.
  static-tls-introduced:
    title: Static TLS model introduced
    definition: The library starts requiring static TLS, so it can no longer be loaded with dlopen once the initial TLS block is exhausted.
  struct-packing-changed:
    title: Struct packing changed
    definition: A struct's explicit packing changes, changing every member offset and the type's overall size.
  struct-packing-flip:
    title: Default struct packing flipped
    definition: The build flips the default structure packing, changing layouts across every aggregate the library exposes.
  struct-return-convention:
    title: Struct return convention changed
    definition: A struct return moves between registers and a hidden return pointer, so existing callers read the result from the wrong place.
  symbol-binding-lost-unique:
    title: Unique binding lost
    definition: A symbol loses its unique binding, so a value that was guaranteed to have one instance per process can now be duplicated.
  symbol-binding-strengthened:
    title: Symbol binding strengthened
    definition: A weak symbol becomes strong, so consumer definitions that previously overrode it now collide with it.
  symbol-binding-weakened:
    title: Symbol binding weakened
    definition: A strong symbol becomes weak, so it can be silently interposed or left undefined at link time.
  symbol-source-owner-changed:
    title: Exported symbol changed owning library
    definition: A symbol moves to a different library in the same distribution, so consumers link against a provider that no longer defines it.
  symbol-version-node-removed:
    title: Symbol version node removed
    definition: A symbol version node is withdrawn, so existing binaries requesting that version fail to resolve even if the name still exists.
  symbol-versioning:
    title: Symbol versioning introduced
    definition: The library starts defining symbol versions, changing which versioned name new consumers bind to.
  tag-struct-renamed:
    title: Tag type renamed
    definition: A struct, class, or union tag is renamed, so consumer source naming it no longer compiles and C++ symbols spelling it are remangled.
  target-dependency-added:
    title: Build target dependency added
    definition: A build target gains a dependency, changing what consumers must have present to link and load the result.
  template-abi:
    title: Template instantiation layout changed
    definition: A template's definition changes so an existing instantiation's layout differs, breaking consumers that already instantiated it.
  template-signature-uninstantiated:
    title: Uninstantiated template body changed
    definition: A template body changes with no instantiation in the binary to observe it, so the break is only visible to source-level evidence.
  threadsafe-statics-flip:
    title: Thread-safe statics mode flipped
    definition: The build flips thread-safe static initialization, changing the guard variables and calls emitted into consumer code.
  tls-model-flip:
    title: TLS model changed
    definition: A thread-local variable's access model changes, so existing binaries use a TLS access sequence the new library does not support.
  tls-var-size-changed:
    title: Thread-local variable size changed
    definition: A thread-local variable changes size, so existing binaries index the thread-local block incorrectly.
  toolchain-flag-drift:
    title: Toolchain flag drift
    definition: The release is built with different ABI-relevant toolchain flags than its predecessor, changing generated code without any source change.
  trivial-to-nontrivial:
    title: Value ABI traits changed
    definition: A type stops being trivially copyable or destructible, so it must now be passed indirectly rather than in registers.
  type-alignment-changed:
    title: Type alignment changed
    definition: A type's alignment requirement changes, changing its placement in aggregates and how consumers must allocate it.
  type-changes:
    title: Compound type surface change
    definition: A release changes several aspects of its type surface at once -- a removal, an addition, and a value change -- as one compound stress case.
  type-field-added-compatible:
    title: Field added behind an accessor
    definition: An opaque type gains a field and an accessor, which consumers cannot observe because they never see the layout.
  type-kind-changed:
    title: Type kind changed
    definition: A declaration changes between struct, class, and union, changing both its layout rules and how consumer source may use it.
  typedef-opaque:
    title: Type became opaque
    definition: A previously complete type becomes opaque, so consumer code that allocated or dereferenced it no longer compiles.
  typedef-underlying-changed:
    title: Typedef underlying type changed
    definition: A typedef starts naming a different underlying type, so consumers using the alias pass and store a different representation.
  union-field-added:
    title: Union gained a member that grows it
    definition: A union gains a member larger than every existing one, growing the union and every aggregate containing it.
  union-field-added-compatible:
    title: Union gained a member within its size
    definition: A union gains a member no larger than its existing widest, so the union's size and every containing layout are unchanged.
  union-field-removed:
    title: Union member removed
    definition: A union loses a member, so consumer source naming that member no longer compiles.
  unnamed-type-in-public-abi:
    title: Unnamed type in the public ABI
    definition: A public signature names a type with no external name, so consumers cannot spell the type they are required to pass.
  used-reserved-field:
    title: Reserved field put to use
    definition: A field documented as reserved is given a meaning, so consumers that wrote arbitrary values into it now corrupt real state.
  var-added:
    title: Exported variable added
    definition: The library exports a new variable, which existing binaries never reference.
  var-const:
    title: Exported variable became const
    definition: An exported variable becomes const, moving it to read-only storage so existing binaries that write it fault.
  var-removed:
    title: Exported variable removed
    definition: An exported variable is withdrawn, so existing binaries that reference it fail to resolve.
  versioned-symbol-scheme:
    title: Symbol versioning scheme changed
    definition: The library changes how it versions symbols, so the versioned names existing binaries import are no longer the ones defined.
  virtual-method-added:
    title: Virtual function added
    definition: A virtual function is added, growing or reordering the vtable so existing binaries dispatch through the wrong slot.
  virtual-method-devirtualized:
    title: Virtual function devirtualized
    definition: A virtual function becomes non-virtual, removing its vtable slot and shifting every slot after it.
  virtual-methods:
    title: Virtual function set changed
    definition: A polymorphic class's set of virtual functions changes, changing vtable slot assignment for existing binaries.
  visibility:
    title: Symbol visibility changed
    definition: A function's visibility attribute changes, changing whether consumers can bind to it at all.
  vtable-slot-count-binary-only:
    title: Vtable slot count changed, binary evidence only
    definition: The vtable symbol's size shows a slot-count change with no debug information present to explain it.
  vtable-thunk-offset-changed:
    title: Vtable thunk offset changed
    definition: A this-adjusting thunk's offset changes, so dispatch through a secondary base adjusts the object pointer incorrectly.
  vtt-slot-count-changed:
    title: VTT slot count changed
    definition: The virtual-table table changes size, so construction of a virtually-inherited object initializes the wrong vtable pointers.
  xcheck-public-to-internal-dependency:
    title: Public declaration depends on an internal one
    definition: A cross-source audit finds a public declaration whose definition requires an internal one, so the published surface is incomplete.

  # -- Rules named only by a scenario's `related_rules` --------------------
  # No single-library rule case demonstrates these on their own yet; they
  # exist here so every `related_rules` value resolves to a definition
  # rather than to an unvalidated free-text string. `status:
  # referenced-only` is derived, not stated -- adding a rule case whose
  # `rule_slug` is one of these promotes it automatically.
  audit-public-not-exported:
    title: Public declaration is not exported
    definition: A declaration the public headers publish has no matching export, so consumers can compile against it but cannot link to it.
  compatible-type-added:
    title: Type added
    definition: The release adds a type without changing any existing one, which existing binaries are unaffected by.
  constructor-overload-ambiguity:
    title: Constructor overload became ambiguous
    definition: A new constructor overload makes an existing consumer initialization ambiguous, so previously valid source no longer compiles.
  empty-tag-type-gains-state:
    title: Empty tag type gained state
    definition: A stateless tag type gains members, so it is no longer empty and every signature and aggregate that passes it changes shape.
  exported-type-removed:
    title: Exported type removed
    definition: A type the library published is withdrawn, taking its RTTI and vtable exports with it.
  header-build-context-mismatch:
    title: Header and build context disagree
    definition: The headers a release ships and the flags its binary was built with imply different ABI, so neither alone describes what consumers get.
  internal-declaration-identity-reconciled:
    title: Internal declaration identity reconciled
    definition: An internal declaration is matched across releases despite a changed spelling, so the reconciliation reports no public break.
  internal-declaration-moved-reconciled:
    title: Internal declaration moved
    definition: An internal declaration moves between headers or scopes and is reconciled to its old identity rather than reported as a removal plus an addition.
  internal-declaration-renamed-reconciled:
    title: Internal declaration renamed
    definition: An internal declaration is renamed and reconciled to its old identity rather than reported as a removal plus an addition.
  internal-symbol-required-by-public-api:
    title: Public API requires an internal symbol
    definition: Using a public declaration requires resolving a symbol the library does not publish, so the supported surface is not independently usable.
  odr-type-variant:
    title: One type, two definitions
    definition: One type name has two conflicting definitions in the same program, so which layout a translation unit sees depends on link order.
  overload-set-removed:
    title: Overload set removed
    definition: An entire overload family is withdrawn, so every consumer call spelled against any of its members breaks.
  public-class-representation-changed:
    title: Public class representation changed
    definition: A published class changes how it is represented -- its size, its layout, or how it is passed -- for every consumer holding one.
  public-integer-model-width-changed:
    title: Public integer model width changed
    definition: An integer type the public interface is expressed in changes width, changing every signature and layout that spells it.
  symbol-export-namespace-changed:
    title: Symbol export namespace changed
    definition: Exported symbols move to a different namespace or version scope, so the names existing binaries import no longer exist.
  symbol-type-signature-hash-changed:
    title: Symbol type-signature hash changed
    definition: A checksum over a symbol's type signature changes, so a loader that enforces the checksum rejects existing modules.
  virtual-dispatch-contract-removed:
    title: Virtual dispatch contract removed
    definition: A type stops dispatching virtually, so consumer overrides that were previously called through the vtable are silently bypassed.
