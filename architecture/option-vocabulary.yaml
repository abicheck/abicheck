      - {id: run_compare(new_input), rule: name, accepted: true, rename: R19, note: python spelling breaks D1; the leaf is `operands`}
      - {id: run_dump(path), rule: name, accepted: true, rename: R19, note: python spelling breaks D1; the leaf is `operands`}
