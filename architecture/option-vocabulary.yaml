      - {id: CompareRequest.new, rule: name, accepted: true, rename: R19, note: python spelling breaks D1; the leaf is `operands`}
      - {id: DumpRequest.input, rule: name, accepted: true, rename: R19, note: python spelling breaks D1; the leaf is `operands`}
