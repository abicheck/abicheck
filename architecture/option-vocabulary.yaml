      - DumpRequest.input
      - run_compare(old_input)
      - run_compare(new_input)
      - run_dump(path)
      - run_dump(binary_fmt)
    exceptions:
      - {id: 'action:old-library', rule: name, accepted: true, rename: R20, note: action spelling breaks D1; the leaf is `operands`}
      - {id: 'action:new-library', rule: name, accepted: true, rename: R20, note: action spelling breaks D1; the leaf is `operands`}
      - {id: 'actions/check-target:new-library', rule: name, accepted: true, rename: R20, note: action spelling breaks D1; the leaf
          is `operands`}
      - {id: InputSpec.path, rule: name, accepted: true, rename: R19, note: python spelling breaks D1; the leaf is `operands`}
