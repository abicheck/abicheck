      - CompareRequest.old
      - CompareRequest.new
      - DumpRequest.input
      - run_compare(old_input)
      - run_compare(new_input)
      - run_dump(path)
      - run_dump(binary_fmt)
    exceptions:
      - {id: 'action:old-library', rule: name, rename: R20, note: action spelling breaks D1; the leaf is `operands`}
      - {id: 'action:new-library', rule: name, rename: R20, note: action spelling breaks D1; the leaf is `operands`}
      - {id: 'actions/check-target:new-library', rule: name, rename: R20, note: action spelling breaks D1; the leaf
          is `operands`}
      - {id: InputSpec.path, rule: name, rename: R19, note: python spelling breaks D1; the leaf is `operands`}
      - {id: CompareRequest.old, rule: name, rename: R19, note: python spelling breaks D1; the leaf is `operands`}
      - {id: CompareRequest.new, rule: name, rename: R19, note: python spelling breaks D1; the leaf is `operands`}
      - {id: DumpRequest.input, rule: name, rename: R19, note: python spelling breaks D1; the leaf is `operands`}
