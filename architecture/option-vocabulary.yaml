# replacements: ADR-091 Phase 7. Every Action or reusable-workflow input the
# inventory marks `retired` or `deprecated` (a tombstone or a still-working
# alias), and the live row that replaces it. `replaced_by` is an inventory id
# of a live row (any surface, including a config key), or null with a reason.
# The generated references render these as "RETIRED, use ..." rather than
# listing the tombstone as live; tests/test_option_cross_refs.py checks that
# each replacement's name appears in the tombstone's own description.
replacements:
  - {id: action:new-library-set, status: retired, replaced_by: null, reason: "the mode: scan artifact-set input is gone and nothing takes its place"}
