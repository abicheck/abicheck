# Option vocabulary registry (ADR-091 D6; plan option-vocabulary-unification.md Phase 0).
#
# Every user-settable option on the four surfaces, grouped into concepts.
# The rows themselves are generated into option-vocabulary-inventory.json by
# scripts/gen_option_vocabulary.py; this file is hand-curated and says which
# rows are the same concept. tests/test_option_vocabulary.py checks that every
# inventory row is claimed by exactly one concept (or an out_of_scope entry)
# and that every id named here exists.
#
# exceptions:        today's deviations from ADR-091 D1/D2 (Phase 1). Each names
#                    an inventory row, the rule it breaks (name|values) and the
#                    R-id that removes it; the test fails once one stops being
#                    a deviation.
# budget_exceptions: D4 surface counts recorded above their limit (no-growth).
# naming:            out_of_scope -- the concept is outside ADR-091's name rule
#                    (its "Out of scope" section); naming_reason says which.
# concept:  the canonical name -- the .abicheck.yml path where one exists,
#           the proposed path otherwise (ADR-091 D1).
# tier:     core     -- visible CLI flag + Action input + shim argument (D4)
#           config   -- .abicheck.yml / typed request / --set only (D4)
#           action   -- Action machinery with no CLI counterpart
#           python   -- typed-API-only capability
#           internal -- typed-API plumbing, not a user option
#           retired  -- every Action input the inventory marks `retired`
#                       (a fail-closed tombstone, kept declared per
#                       tests/test_action_retired_inputs_contract.py) or
#                       `ignored`; nothing else (R14)
# renames:  the ADR-091 D5 change ids that will move members of this
#           concept onto the canonical spelling; empty means already aligned
#           or no change planned.
# cli/config/action/python: inventory ids (cli "<command> <--option>",
#           action "<action>:<input>", python "<Class>.<field>" or
#           "<function>(<param>)").
schema_version: 1
out_of_scope:
  - pattern: actions/baseline:*
    reason: Baseline transport, no CLI counterpart.
    until: permanent
  - pattern: actions/stage-baseline:*
    reason: Baseline transport, no CLI counterpart.
    until: permanent
  - pattern: actions/resolve-baseline:*
    reason: Baseline transport, no CLI counterpart.
    until: permanent
  - pattern: actions/verify-baseline-source:*
    reason: Baseline provenance verification, no CLI counterpart.
    until: permanent
  - pattern: actions/report:*
    reason: Report publication (ADR-073), no CLI counterpart.
    until: permanent
  - pattern: actions/verify-source-run:*
    reason: Producer-run verification (ADR-073), no CLI counterpart.
    until: permanent
