e_registers, and the new arch-gating constant plus its docstring -- not extractable, since both fixes live at the one function/helper pair that already owns this pass's own coverage verdict. Raised again 1503 -> 1510 (2026-09-04, P1 review, fresh evidence, Codex, PR #784): _get_type_align already accepted its own `incomplete` out-param but did not forward it to `_unwrap_qualifiers` -- a member whose own DW_AT_type resolved fine but named a typedef/qualifier chain with an unresolvable *inner* DW_AT_type had that failure recorded by `_unwrap_qualifiers`' own accumulator and then silently discarded, since no accumulator was passed through to receive it, letting `_get_type_align` return 0 (the same value a legitimate composite-type skip returns) while evidence_state still reported \"parsed\". Fixed by threading `incomplete=incomplete` through that one call site, the same one-line forwarding fix as every other already-accumulator-bearing call in this chain. The growth is that argument plus its explanatory comment -- not extractable, since _unwrap_qualifiers already owns its own resolution verdict. Raised again 1510 -> 1551 (2026-09-04, P1 review, fresh evidence, Codex, PR #784): multiple exported names can legitimately share one address (a strong/weak symbol pair, or several public entry points the linker folded onto identical code), but _build_addr_to_sym's own first-seen-wins address map meant _parse_frame_registers attached a CFI/frame-register fact to whichever ONE name it kept while marking the whole *address* covered -- every other alias at that address silently never received its own frame_registers/callee_saved_regs entry, indistinguishable from having none, with the pass still reporting itself complete. Fixed with a new _build_addr_to_syms() sibling returning every alias per address (kept independent from _build_addr_to_sym, which stays as-is for its own existing direct unit tests), and _parse_frame_registers now attaching each FDE's decoded facts to every alias