its. Lowered 1542 -> 1409 (finding-disposition refactor): the five-site suppression loop collapsed into `policy.finding_disposition.dispose_by_suppression`, the post-processing glue into `dispose_findings` + `DispositionRules.from_policy_file`, and the private `diff_filtering` re-exports were deleted.",
