ll needs the resolved config values it previously read straight off kwargs -- loading .abicheck.yml here, ahead of that call, with the identical parse-or-raise UsageError translation the existing config-block rejection a few lines below already applies (so a malformed ambient config still fails loud, not as a raw ValueError). The load and its three resolved booleans are threaded through as new parameters to reject_unsupported_options and its own new_is_stored-only inner helper; the alternative (loading twice, once here and once at this file's pre-existing bundle_system_providers/cohorts read) would double-parse the same file, so the existing read was changed to reuse this one instead -- a net reduction against the naive per-flag patch, not new duplicated I/O. Raised 859 -> 876 (Codex review, PR #1159, fresh evidence): when NEW_INPUT resolves to neither a directory nor a recognized package archive, `compare_release_against_bundle_facts()` treats it as exactly one library file with no ELF-type check at all -- unlike the directory-walk case, where `discover_shared_libraries()`'s own ET_DYN/non-PIE filter already makes `release.dso_only` a no-op by construction. `release.dso_only`/`release.include_private_dso` would silently have no effect for a single-file NEW_INPUT, so this dispatch now computes that operand shape (`is_package`/`is_dir` check) ahead of `reject_unsupported_options()` and passes it through as a new `new_is_single_file` parameter, rejecting the combination with a `click.UsageError` the same way every other unsupported-for-this-shape flag already is. Raised 876 -> 886 (Codex review, PR #1174): `resource_limits.max_bundle_facts_decode_nodes` guards a pre-json.loads() decode-bomb budget over content that may itself be attacker-controlled, unlike the ordinary policy knobs this dispatch already reads off `_bundle_cfg` -- honoring it from an auto-discovered `.abicheck.yml` (which can be supplied by the same untrusted checkout being decoded, e.g. a PR's own working tree in CI) would let that checkout raise its own decode budget. `dispatch()` now takes a `config_explicit` parameter, threaded through unchanged from `compare_cmd`'s own `ctx.get_parameter_source(\"config\")` check (already computed there for `resolve_stored_bundle_lang`), and only honors the config value when it is true. Raised 886 -> 890 merging origin/main: this PR's own, independently-landed security fix (Codex review, PR #1154 follow-up) -- resolve_dispatch_compile_context()'s resolve_compile_context call passing config_explicit=_config_explicit (an existing local this function already computed for the stored-pair rejection two lines above), closing a trust-boundary bug where kwargs['config'] -- already overwritten with the cwd-upward auto-discovered path when --config wasn't given -- was passed through as if explicit, letting an untrusted compile.compiler select the header-extraction executable -- was absent from origin/main's own history above (a parallel track that never carried this fix) and survived the merge as a clean, non-conflicting 4-line addition. Actual, directly-measured post-merge count. Raised 890 -> 893 (same PR, Codex review, fresh evidence, \"Handle support promises on stored-bundle comparisons\"): `release.support_promise` -- a new Phase 7i config-only field -- has no channel into `compare_release_against_bundle_facts()` (no proven-inventory acquisition record is built on this path at all), so it is resolved off `_early_cfg` and threaded into `reject_unsupported_options()` alongside its sibling `gate.fail_on_removed_library` check, one keyword argument at the existing call site.",
