n's gate/exit code; `--crosscheck exported_not_public=warning --severity-preset strict` reported root `NO_CHANGE` while still listing the finding. Split the two: `diff.verdict`'s own recompute is now keyed on `_dropped` alone (a `KEY=off` check is genuinely suppressed, so excluding it from the technical verdict is correct, same as any other suppression); a new, separate `_gate_verdict` local (computed only for the *legacy* exit-code scheme, which has no other gate computation to filter unlike the severity-preset branch above it) supplies the demoted-population verdict `base_exit` derives from, leaving `diff.verdict` itself untouched. Third: the `summary` dict's own `exit` key (`diff.exit`, the persisted `ExitDecision`) was resolved earlier in this function, from `resolve_compare_exit_decision` reading the unfiltered `diff` -- before `base_exit`'s own `_non_gating` exclusion ever ran -- so a structured JSON consumer could see the real process exit and `diff.severity.exit_code` both at 0 while `diff.exit.code` still named `COMPATIBILITY_GATE` at a nonzero value for the identical run. Rebuilt post-hoc from the exact `base_exit` this function's own process exit is about to fold coverage/assurance onto, via `resolve_exit_decision` (added to `workflows/gate.py`'s existing `frontends -> policy` re-export list, alongside its own `resolve_compare_exit_decision`) -- the coverage/assurance halves are recomputed via the identical already-re-exported helpers `resolve_compare_exit_decision` used internally, over the same unchanged `diff`, so this is not a second, independently-drifting calculation. Nothing to move elsewhere: all three are this exact function's own post-hoc gate-decision correctness, the same shape every prior round's fix on this call site already is. Raised again, 1688 -> 1698 (same PR, round 17, CodeRabbit review, fresh evidence): `_build_severity_json`'s own `changes` parameter is explicitly documented as the *display* set (`severity.categories.*.count`), separate from the already-computed `gate` decision -- but this call site was handing it the same gate-filtered list `compute_gate_decision` uses, so a `--crosscheck KEY=info`/`=warning` demoted finding vanished from its category's count while staying present in `diff.findings`, contradicting this fix's own \"stays fully visible in the report\" contract one field over. Kept the filtered list scoped to `compute_gate_decision` only (an inline list comprehension, since the `_sev_changes` local it replaced had no other reader) and passed `list(diff.changes)` -- the full, unfiltered set -- to `_build_severity_json`, matching that function's own documented contract. Nothing to move elsewhere: the same call site's own post-hoc correctness, the same shape every prior round's fix here already is.",
