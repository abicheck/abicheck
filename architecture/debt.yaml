to severity_preset, checked against policy.severity.SEVERITY_PRESETS. Raised again 1047 -> 1058 (2026-09-03, Round 11 review): the policy_file_path fix (compatibility_evaluation_frontend.py) covered the accepted case where a file overrides an unknown policy name, but left the no-file case unchecked -- CompareRequest(policy=\"not_a_policy\") with no policy_file_path still only failed later inside builtin_policy_identity, after extraction had already run. validation_errors() now rejects a policy name outside VALID_BASE_POLICIES when no policy_file_path is given, mirroring stated_policy_base's own file-overrides-name rule. Raised again 1058 -> 1067 (2026-09-03, Codex review on 72fdf5b): CompareResult gained severity_config -- the same resolved GateOptions.severity exit_decision above was scored under -- so a typed caller can pass severity_config=result.severity_config into reporter.render_output/to_json and get a rendered severity block and exit code that agree with exit_decision, instead of the report silently recomputing a None-severity legacy exit that contradicted it. Raised again 1067 -> 1083 (2026-09-03, CodeRabbit review, fresh evidence, PR #1032): CompareResult's own fields (diff/old_snapshot/new_snapshot/suppression/exit_decision/severity_config) referenced six of this file's seven TYPE_CHECKING-only names directly, so typing.get_type_hints(CompareResult) raised NameError -- fixed by importing DiffResult/AbiSnapshot/SuppressionList/ExitDecision/SeverityConfig unconditionally (verified no import cycle), leaving only CompileContext/DumpManifest (referenced solely by InputSpec) under TYPE_CHECKING. Raised again 1083 -> 1099 (workstream F S1, vision-api-abi-evolution.md \"F. Header-only comparison\"): _path_required_errors now also accepts headers (not just sources/build_info/dump_manifest) as valid binary-less DumpRequest evidence, so a genuinely headers-only request reaches the new typed execution path instead of failing this check before it ever runs -- the widened rule and its docstring addition both belong on this existing per-field validator, not a new module. Raised again 1099 -> 1109 (CodeRabbit review on this PR): public_header_dirs was wrongly included in that same OR-chain -- it is a pure declaration-provenance classifier, never a source of headers to parse, so a binary-less request naming only public_header_dirs passed this check and then failed later, inside execute_source_only_dump_request, with a confusing error that never mentions public_header_dirs at all. Removed from the OR-chain and the docstring rewritten to explain why, on the same per-field validator. Raised 1109 -> 1121 (one-comparison-product.md Phase 2c/2d, ADR-068): CompareRequest gains the two per-run inputs the plan moves from scan onto compare -- changed_paths (the resolved --since/--changed-path seed, ADR-043 D7 POI scoping) and abi3_floor (the candidate-side stable-ABI audit's Py_LIMITED_API floor) -- each with the field comment this file's own convention requires. Both are intrinsically fields of this dataclass: the request object IS the front-end-independent contract both the CLI and the typed API resolve into, so there is no other module the fields could live in without splitting one request across two objects. Raised 1121 -> 1134 (one-comparison-product.md Phase 4 commit 2, ADR-068/ADR-055 amendment): CompareRequest gains collapse_versioned_symbols, the one genuine ScanRequest field with no prior CompareRequest equivalent found by that commit's field-by-field ScanRequest/CompareRequest audit -- a real typed-API-reachable knob (it already existed as a checker.compare()/compare_snapshots() parameter), not incidental growth, so there is no other module it could live in without splitting CompareRequest's fields across two objects. Raised 1134 -> 1139 (Phase 4 commit 2, ADR-068 \u00a73 #19, Codex review): CompareRequest gains budget_s, the typed-API counterpart of the native compare CLI's new --budget flag (a wall-clock guard on this request's own deadline-aware stages, absorbed from ScanRequest.budget) -- already comment-trimmed to four lines; no other module owns this dataclass's own request fields. Raised 1139 -> 1158 (Codex review, fresh evidence, PR #1178): validation_errors() now rejects a non-finite (nan/inf/-inf) or negative budget_s the same way the CLI's own --budget parser already does (_parse_budget's math.isfinite check) -- a typed caller reaches the identical deadline_scope(request.budget_s) with no CLI in between, so the same floor belongs on this dataclass's own validator, not only on the flag. Raised 1158 -> 1174 (PR #1180, Codex review, \"Prevent positional CompareRequest arguments from shifting\"): a KW_ONLY sentinel now sits exactly where the removed reconcile_build_context field used to be, so a positional caller reaching that far fails loudly (TypeError) at construction instead of silently rebinding every later field -- the sentinel plus its explanatory comment are the whole fix; there is no smaller diff that both closes the gap and documents why the boundary sits precisely there (matching the file's own lang_explicit/pack_policy_overrides precedent for a *new* field, extended here to a *removed* one). Raised 1174 -> 1177 (2026-09-09, ADR-068 Phase 4's typed-API slice): CompareRequest gained allow_build_query, the one field ADR-055's own field-by-field ScanRequest audit listed as a real, open gap and that survived ADR-068's second 2026-09-09 ruling table -- every other remaining ScanRequest field is ruled (a) already-covered or (b) dropped, so this is a net -6 fields across the two request types, not an addition. Three lines: the field, its one-line provenance comment (deliberately a single long line, matching this file's neighboring ADR-049 pack-field comments, rather than the wrapped block the first draft used), and the blank separator ruff format requires before validation_errors. No smaller diff exists -- the field cannot be expressed without a declaration, and omitting its provenance would leave the only absorbed field in the slice undocumented.",
