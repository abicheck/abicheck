onally, no `show_only` applied), and a new private `entry[\"findings_view\"]`/`entry[\"findings_view_truncated\"]` pair carries the `show_only`-filtered projection when a filter is active -- consumed (and stripped) only by `cli_compare_release_helpers._release_findings_for_render`, which a primary-format renderer calls with the real `show_only` and a secondary `--write` renderer calls with `None`. This is the one function that already owned computing this projection from the live DiffResult; splitting the two computations across two files would need to pass the DiffResult itself across the module boundary just to defer a filter call. Raised 878 -> 991 (Codex review, PR #1154 follow-ups, both Findings 6 and 7 together): (1) \"Reject unsupported impact views instead of silently dropping them\" -- `_strip_diff_results_and_adjust_verdict` gained a `show_impact` parameter computing each library's own impact-summary table via `reporter_markdown.compute_impact_table` over the same full display pool, stashed as `entry[\"impact_table\"]`/(when `show_only` is also active) a filtered `entry[\"impact_table_view\"]` sibling, mirroring the `findings`/`findings_view` pattern already established here -- this is the one function that already owns computing a per-library projection from the live `DiffResult` before it's discarded for memory, so the new computation belongs alongside the existing one, not split across files. (2) \"Filter the complete release finding set\" -- new `_release_display_buckets` walks every category (all four `categorize_changes` buckets under a severity scheme, or breaking/api_break/risk/compatible under the legacy scheme) rather than only the categories that gate the exit code, so a compatible `func_added`/other COMPATIBLE finding is reachable in the release's own findings list/`--view show=` pool the same way it is in a single-pair `compare` report; `_release_finding_dicts` now builds from this instead of the narrower `_release_gating_buckets`. Both fixes are irreducibly this module's own -- it already owns `_release_gating_buckets`/`_release_finding_dicts`/`_strip_diff_results_and_adjust_verdict`, the only place a library's real `DiffResult` is available before being discarded. Raised 991 -> 1009 (Codex review, PR #1154 follow-up: \"Preserve not-evaluated findings in release summaries\"): `_release_display_buckets`'s legacy (no-severity-config) branch walked `diff.breaking`/`diff.source_breaks`/`diff.risk`/`diff.compatible`, all four of which route through `_evaluated_changes()` and therefore silently excluded a finding contract evaluation left `NOT_EVALUATED` under `--contract` -- unlike the equivalent scalar `compare` report (serializes `diff.changes` directly) or `scan --against` (already surfaces its own `\"not_evaluated\"` bucket). Added a fifth `(\"not_evaluated\", diff.not_evaluated)` tuple to that branch's return list, mirroring the single-pair renderer's own dedicated not-evaluated disclosure rather than merging such findings into `\"compatible\"`, which would misrepresent an unresolved relevance as an actual compatibility verdict. One tuple plus its explanatory comment on the one function this file already owns as the release engine's display-bucket source of truth. Raised 1009 -> 1025 (Codex review, fresh evidence, follow-up: \"Count uncapped findings in release filter totals\"): `_strip_diff_results_and_adjust_verdict` is the one place a library's real, uncapped finding pool size (`total_gating`/`total_gating_view`) is still available before the live `DiffResult` is discarded for memory -- so it now stashes both as private `findings_total_count`/`findings_total_count_view` entry keys (mirroring the existing `findings_view` private-key pattern) for `cli_compare_release_helpers._format_release_json`'s own `release_filtered_summary` totals to read, rather than under-reporting from the already-capped `findings` display list. Two comments plus two one-line assignments on the one function that already computes