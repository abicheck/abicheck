      "rationale": "Not legacy debt: this file was one line under the 1200-line test-file cap until PR #1159's sixth review round required a `_mktemp_canonical_source()` extractor plus its own harness wiring (a relative $TMPDIR base broke add_compile_context_flags's overlay mktemp result once it crossed into the $_PY_SAFE_DIR-scoped merge subprocess, Codex review) -- the sibling `tests/test_action_release_topology_config.py` covers the identical fix's twin call site, staying comfortably under its own cap. Raised again 1207 -> 1294 merging main: a concurrent PR (#1162) independently fixed two more real Windows bugs in the identical function (a bare mktemp resolving under Git Bash's MSYS-internal /tmp mount unreadable by a native Python process; a POSIX-path-shaped env var silently rewritten by MSYS's own argv/envp auto-conversion) with their own new test classes (`TestCompileContextOverlayMktempIsRunnerTempAnchored`, `TestCompileContextInputsTravelViaStdinNotEnvVars`) merged in alongside this PR's own isolation/merge-architecture fixes -- reconciling both fixes into one function (RUNNER_TEMP-anchored mktemp + NUL-separated stdin data, still routed through $_PY_BIN/$_PY_SAFE_DIR isolation and the discovered-config merge) needed two of that merge's test assertions updated to the reconciled invocation shape, not a net-new test class. Raised again 1294 -> 1372: a Codex review round found the earlier `build.compile_db` unconditional-strip fix (added to guard against `embed.py`'s `compile_db_explicit` incorrectly hard-failing on a stale discovered path) was itself too aggressive -- it discarded a genuinely *resolving* discovered compile_db too, losing real L3-L5 evidence `inline.py`'s own fallback chain might not replicate. The fix threads an optional `sources` root into the shared merge helper so it can validate the glob before stripping; `TestCompileContextPreservesUsableDiscoveredCompileDb` (3 new tests) proves the resolving/non-resolving/relative-sources-root cases, adversarially confirmed against the pre-fix code. Raised again 1372 -> 1470: a further Codex review round found `embed_build_source()` (`abicheck/buildsource/embed.py`) reads `build:`/`compile:`/`source:`/`debug:` from `build_config or discover_build_config(raw_sources)` -- a separate, non-recursive lookup anchored at `--sources` itself, distinct from this merge helper's own checkout-root walk. Since this Action always ends up passing an explicit `--config` once any compile-context input is set, that discovery previously never ran at all, silently dropping a `--sources` directory's own build settings whenever it carried a distinct `.abicheck.yml` from the checkout root's. Fixed by additionally discovering a build config at the sources root (mirroring `discover_build_config` exactly) and having its `build:`/`compile:`/`source:`/`debug:` blocks replace (not merge into) the checkout-root document's own such blocks, matching `embed_build_source`'s exclusive-use-of-one-file semantics. `TestCompileContextDiscoversSourcesRootOwnConfig` (3 new tests: discovered-and-merged, wins-over-a-conflicting-checkout-root-block, falls-back-to-checkout-root-when-sources-has-none) proves this, adversarially confirmed against the pre-fix code (the first two fail; the fallback case is unaffected either way). Raised again 1470 -> 1498: a follow-up Codex review round found the block-replacement list only carried `source` (singular) and omitted the DISTINCT `sources` (plural -- `public_headers`/`exclude`/`graph`) block `embed_build_source()`'s `BuildConfig` also reads, silently narrowing a source root's own `sources.graph: full` back to `summary` before `collect_inline_pack()` reads `cfg.graph_detail`. Fixed by adding `sources` to the replacement list; `test_sources_root_sources_block_is_also_carried` proves it, adversarially confirmed against the pre-fix code. Raised again 1510 -> 1556 (a further Codex review round, fresh evidence): an EMPTY (or non-mapping) `--sources`-root `.abicheck.yml` is not \"no config found\" -- the file still exists, so `discover_build_config` still selects it, and `load_build_config`'s own `if not isinstance(raw, dict): return BuildConfig()` treats that as an empty (all-default) `BuildConfig`, never a fallback to the checkout-root document's own `build:`/`compile:`/`source:`/`debug:` blocks. Gating the whole block-replacement loop on `isinstance(sources_loaded, dict)` skipped it entirely for this case, silently leaving the checkout-root's own settings in place instead of clearing them. Fixed by using `sources_loaded if isinstance(..., dict) else {}` as the document the replacement loop reads from, unconditionally (not gated on the isinstance check); `test_empty_sources_root_config_clears_the_checkout_root_blocks` proves it, adversarially confirmed against the pre-fix code. Raised again 1556 -> 1593 merging `origin/main`: `main` independently landed its own fix in the identical function (a `PIPESTATUS`-based exit-status/empty-output check on the compile-context-helper invocation, since a failed interpreter would otherwise fall through with an empty overlay) on top of the pre-this-PR baseline (no discovered-config merge, no `$_PY_SAFE_DIR` isolation) -- reconciled by porting the same failure-detection idea onto this PR's own already-more-thorough shape (reading `$?` directly, since this script's own `set -o pipefail` already makes that the pipeline's real exit status, without needing `PIPESTATUS[1]`) rather than keeping two divergent implementations of one function. The corresponding test conflict (`TestCompileContextOverlayGenerationIsIsolated::test_helper_invocation_pipes_data_via_stdin`, two different assertions of the same invocation shape) resolved to this PR's own `$_PY_BIN`/`$_PY_SAFE_DIR` isolation assertion, since that mechanism (not `main`'s bare `${_PY_BIN:-python3}` fallback) is what actually ships. Raised again 1593 -> 1654, and folded in the sibling entry that used to track this same path separately (a duplicate-path schema violation `check_architecture.py` rejects): a second merge round found `add_compile_context_flags`'s own extra-args-supplied-config rejection (the guard the folded-in entry's history describes) had been superseded by main's own general `_cmd_has_config_flag && _extra_args_has_config_flag` check at the `extra-args` append site (covering dso-only/fail-on-removed-library/compile-context alike, not just this one function) -- removed the now-redundant guard and its duplicate `_extra_args_has_config_flag()` definition from `action/run.sh`, and dropped this file's own `TestCompileContextRejectsAutoDiscoveredConfig` class (both its build-config/auto-discovery rejection tests, superseded by the merge feature, and its extra-args rejection tests, superseded by the general check) in favor of main's own `TestCompileContextMergesWith*`/`TestCompileContextDiscoversSourcesRootOwnConfig`/`TestCompileContextOverlayGenerationIsIsolated` classes, which test the shipped merge-based behavior directly. Actual, directly-measured post-merge count. Merging PR #1171 (fifth review round on a separate branch, fresh evidence) into this history: that branch found the earlier `1593 -> 1653` mode-exclusion fix was itself wrong for three of its five promoted blocks -- compile:/source: (singular)/debug: are pair-wide (`resolve_compile_context` \"applies to both sides\", `resolved_cfg.source_method`, `resolved_cfg.debug_format`), and `embed_build_source()`'s own call site never actually reads any of the three. Fixed by making the exclusion mode-aware: a new `_compile_context_sources_pairwise()` helper (keyed on `$MODE`) and a 6th parameter on `_merge_config_overlay_with_discovered_project_config` gate whether compile:/source:/debug: are included in the sources-root block-replacement list -- excluded only when the caller's MODE is `compare` (single-pair), included otherwise (dump, scan). `found_path` is now reassigned to the sources root exactly when compile: was actually sourced from it, so `compile.include_dirs` anchors correctly either way. Test coverage split the empty-sources-root test into a dump-mode version (compile.sysroot cleared) and a pairwise-compare-mode companion (compile.sysroot survives), moved the compile-block-never-sourced test to compare mode, and added a dump-mode test proving compile:/source:/debug: ARE promoted there. Raised again to 1806 merging this branch with origin/main's own independent 1654-line fold-in above -- both fixes are real and additive, not overlapping; the merged file carries both. Raised again 1806 -> 1903: a sixth review round on this same PR found the fifth round's `$MODE == \"compare\"` pairwise check was itself still too coarse -- it doesn't distinguish a genuine live-pair compare from a compare whose OLD operand is a stored snapshot or resolved ABI baseline (which does no header/debug extraction at all, the same 'no other side to leak into' shape as dump/scan). Fixed by adding `_old_library_is_stored_snapshot()` (an extension-based check on `$INPUT_OLD_LIBRARY` -- `*.json`/`.json.gz`/`.json.zst` -- mirroring this script's own existing `[[ \"${INPUT_AGAINST:-}\" == *.json ]]` snapshot check and its `*.abicheck.json`/`.gz`/`.zst` glob triple used for baseline-asset discovery) and gating `_compile_context_sources_pairwise()` on it: `compare` is pairwise only when OLD is both `$MODE == \"compare\"` AND NOT a stored snapshot. Five new tests (`test_sources_root_compile_block_is_sourced_from_it_under_compare_with_stored_old_snapshot`, parametrized over `.abicheck.json`/`.json`/`.JSON`/`.json.gz`/`.json.zst`, plus a `..._stays_pairwise_when_old_library_is_a_live_binary_shaped_like_json` negative control) prove the fix, adversarially confirmed against the pre-fix code. Raised again 1903 -> 1991: a seventh review round on this same PR found the sixth round's `_old_library_is_stored_snapshot` was itself extension-only, so a live ELF/PE/Mach-O binary literally named e.g. `old.json` was misclassified as a stored snapshot even though `resolve_input()` checks binary magic bytes before any JSON/text sniffing -- the extension never overrides magic there. Fixed by content-sniffing in that same order (native-binary magic first via the `od -An -tx1` idiom `_is_release_style_operand` already uses, then gzip/zstd magic, then a bare `{` prefix for uncompressed JSON) rather than trusting the filename. The prior extension-only tests were rewritten to write real bytes carrying each case's own magic prefix instead of relying on a suggestively-named path, and three tests were added: the exact case the review named (a live ELF binary named `old.json`, asserting it stays pairwise), a plain live-binary negative control with real ELF bytes, and a does-not-exist-on-disk fallback case (stays pairwise, matching `_is_release_style_operand`'s own `-f` fallback) -- all adversarially confirmed against the pre-fix (extension-only) code. Raised again 1991 -> 2012: an eighth review round on this same PR found the seventh round's own content-sniffing was still enumerating individual stored formats one Codex round at a time (JSON/gzip/zstd magic only) -- a JSON snapshot with leading whitespace before the `{` (which `sniff_text_format()`'s own `.lstrip()` still accepts) and the Action's documented ABICC Perl-dump old-library input were both still misclassified as live, which would have excluded NEW's own sources-root `compile:`/`source:`/`debug:` settings for them too. Fixed by collapsing the rule to its actual invariant instead of adding a third format-specific case: NOT a recognized live-binary format (ELF/PE/Mach-O magic) IS a stored operand, full stop -- every non-binary shape `resolve_input()` accepts (JSON, compressed JSON, an ABICC Perl dump, a raw BTF/CTF blob, symvers) is equally extraction-free for this decision. Three new parametrized cases (leading-whitespace JSON, an ABICC Perl dump, and unrecognized content) prove the collapsed rule handles all three without a dedicated branch, adversarially confirmed against the pre-fix (seventh-round) code. Lowered back down 2012 -> 1739 immediately after: that eighth-round growth pushed the file past the AI-readiness `file-size` gate's 2000-line hard cap, so the six tests covering `_compile_context_sources_pairwise()`/`_old_library_is_stored_snapshot()`'s pairwise-vs-single-sided-OLD decision (and the bash-harness plumbing they need) were split into a new sibling module, `tests/test_action_compile_context_old_library_liveness.py` -- mirroring `test_action_release_topology_windows_paths.py`'s own identical split, including duplicating the small set of shared harness primitives rather than cross-importing them. Actual, directly-measured post-split count.",
