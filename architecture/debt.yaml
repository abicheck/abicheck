iew, PR #1178) landed alongside this branch's Raised 846 -> 61 (abicheck code-review report round, item 4 fix): classify_compare_pair's note_if_same_binary_compared(result) call gains a fallback -- a snapshot-input compare never populates old_metadata/new_metadata (collect_metadata() is a no-op for a JSON/text snapshot path), so the byte-identical-inputs warning could never fire on that pattern even when both snapshots are content-identical. Hashes the already-loaded old/new AbiSnapshot objects' canonical serialization (serialization.snapshot_to_json) and forwards the two digests as the new old_snapshot_digest/new_snapshot_digest keyword arguments confidence.note_if_same_binary_compared now accepts, only computed when metadata is absent on either side. No smaller diff: the digest computation is gated behind the exact condition that makes it necessary, and the two new keyword arguments are this call's whole job. 914 is this merge's actual, directly-measured post-merge line count rather than a hand-derived sum of both sides' independent deltas. Raised 914 -> 917 (2026-09-09, ADR-068 Phase 4's typed-API slice): _resolve_side gained build_config=side.build_config and allow_build_query=request.allow_build_query or None, plus one long provenance comment. Two of the three lines are the wiring that keeps the absorbed CompareRequest.allow_build_query from being an inert field (the pack_application.UNAPPLIED_PACK_FIELDS failure mode, applied to request surface); the third states why the default stays None rather than False. No smaller diff exists -- the two keywords are forwarded, not computed, at this one call site.",
