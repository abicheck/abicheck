r below the already-fixed field-list-reference gap -- the individual member/underlying-type reference itself, not the fieldlist pointing to it. Fixed with a new unresolved_type_ref_count property backed by a set populated the first time each method's fallback branch is actually reached (memoization means a cache hit would otherwise silently skip re-recording the gap), checked by pdb_metadata.py after struct/enum extraction. The growth is that tracking set, the property, its docstring, and one new proc/mfunc branch added to _resolve_type_size to keep it symmetric with type_name()'s own (so a legitimately-sizeless function-type reference isn't misflagged) -- not extractable, since each fallback is the one place that already owns its own resolution verdict.",
