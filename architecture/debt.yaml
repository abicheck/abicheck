      "rationale": "Existing implementation predates ADR-061 and cannot move safely without a behavior-preserving vertical slice. Baseline raised 1818 -> 1832 (ADR-067 C-S1, scalar disposition audit): the consumer-overlay suppression pass -- one of the four application points ADR-067 enumerates -- now records the finding it withholds into the run's conserved disposition ledger through the same `policy.disposition_ledger.record_suppressed_change` primitive the other four call sites use. The added lines are that one call plus the comment recording why an overlay built from a raw `missing_symbols` string needs no second record type. There is no responsibility to move: the suppression decision itself already lives here, and the ledger it now feeds is a `policy/` leaf. Raised again 1832 -> 1854 (Codex review on PR #1082): the consumer overlay now records into the ledger on *both* branches, not only when a suppression rule fires -- recording one side only made adding a matching rule change the *detected* total instead of moving the finding between dispositions, which is precisely the conservation ADR-067 D1 requires. Raised again 1854 -> 1865 in the same review round: `ledger_for` no longer attaches a lazily-built ledger to the result it is asked about (a projection must not mutate what it renders -- `tests/unit/report/test_render_html.py` states that executably), so this engine-side call site resolves the ledger once and attaches it explicitly. Raised again 1865 -> 1875 (Codex review round five): the scoping pass now re-closes the ledger it added to (`close_consumer_scope`), because it runs after `compare()` closed it -- so its own findings kept no verdict class and every gating label still described the whole-library gate rather than the scoped one that produces the run's exit code. One call, both consequences; the logic itself is in `policy/disposition_ledger.py`. Raised again 1875 -> 1887 (own sweep of the consumer-scoping path, no review report): `check_appcompat` is the standalone entry point that both scopes and owns its single consumer, so it makes the one closing call the `compare --used-by` orchestrator makes for many -- without it a caller reading `result.full_diff` saw that scoping's overlay findings with no verdict class and the whole-library gating labels. Raised again 1887 -> 1928 (ADR-063 T10, `docs/contribute/plans/duplication-and-convergence-assessment.md`'s track T10): `scope_diff_to_app`'s two free-standing mutations of the already-returned `diff` it was handed (the `disposition_ledger` attachment, previously right before the overlay loop, and the `_promote_scoped_contract` call, previously the last statement before building `AppCompatResult`) are now one named, called-once `_finalize_consumer_scope_diff` boundary, with its own docstring explaining why both are one instance of `close_consumer_scope`'s own \"a second producer joining after the close\" problem and why their relative order is fixed. No behavior changed -- the ledger attachment is provably safe to defer past the loop (every `record_consumer_overlay` call already goes through the local `overlay_ledger` reference, never `diff.disposition_ledger`) -- so the net growth is the new function's own docstring and signature, not new logic. There is no responsibility to move elsewhere: the mutation is intrinsically this function's own late-producer contribution to `diff`, the same reason `_promote_scoped_contract` itself already lives here rather than in `policy/`. Two independent 1928-based PRs each raised this baseline and were merged together, so both bumps are recorded and the combined total (1928 + 24 + 59 = 2011) reflects both: raised 1928 -> 1952 (ADR-067 C-S2, the acknowledged appcompat.py gap C-S2's own PR left open): `scope_diff_to_required_symbols` (the `--required-symbol(s)` plugin-host mirror of `scope_diff_to_app`) gained the identical missing-entrypoint overlay loop `scope_diff_to_app` already carries -- a real detected entrypoint contract's own missing symbol previously reached the CLI's `scoped_missing_labels` as a bespoke string, never a `Change`, so it was invisible to the disposition ledger and unsuppressible by an exact rule (the same gap ADR-044 P2 closed for `--used-by` long before this ledger existed). The evaluate/record/overreach sequence itself is not duplicated a third time: it moved to the new shared `policy.disposition_close.record_and_maybe_suppress_overlay`, and `scope_diff_to_app`'s own loop was rewritten to call it too, which is most of why the net growth here is smaller than the new loop's own line count. Separately raised 1928 -> 1987 (Workstream D-S1, vision-api-abi-evolution.md section D, consumer-specification slice): `parse_app_requirements`/`scope_diff_to_app`/`AppCompatResult` now accept a `model.consumer_spec.ConsumerSpec` (digest/platform/profile/provider-baseline provenance, advisory/required) in place of a bare `Path`, and `scope_diff_to_app` gained the try/except that turns an ADVISORY consumer's unreadable failure into a recorded, non-fatal result instead of raising. The identity/manifest-parsing/digest-check logic itself was moved to the new `model/consumer_spec.py` leaf module (per the ADR-061 routing table); what remains here is the minimum call-site wiring -- resolving the spec, verifying its digest, and the one new branch -- since `AppCompatResult`'s field set and `scope_diff_to_app`'s control flow are this file's own responsibility and cannot move without moving the function itself. Merging both PRs together landed 1987 -> 2011, both diffs applying cleanly (no textual overlap between the two additions).",
