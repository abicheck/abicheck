the round-12 inline filter, cross-referencing `cli_scan_baseline.py`'s sibling `verdict_scored_changes()` for the same plan-F-9 obligation at a different chokepoint) plus a short comment at each of the two new call sites. Raised 1446 -> 1455 (Codex review, PR #1221, no-baseline env-matrix audit findings 1/2): three of `_env_matrix_contract_changes`'s six standalone declared-runtime-floor/wheel-packaging checks (`PLATFORM_BASELINE_FLOOR_RAISED`/`MACOS_DEPLOYMENT_TARGET_RAISED`/`WHEEL_RPATH_NOT_PORTABLE`) default to a RISK verdict in the catalog even though each only ever fires on an actual floor violation, so neither this two-sided path nor the no-baseline audit path ever promoted them to BREAKING. Added one import and one call to the new shared `diff_versioning.promote_baseline_violation_findings(produced)` right before this function returns -- the promotion logic itself lives in `diff_versioning.py`, not here; this file's own growth is the irreducible import-plus-call-site cost, the same shape every other entry in this rationale already establishes. Raised 1455 -> 1473 (Codex review, PR #1221, follow-up findings 1/3): finding 1 removed `WHEEL_RPATH_NOT_PORTABLE` from the promoted-kinds set (a heuristic finding, not proof of a break -- see `diff_versioning.py`'s own updated rationale) and correspondingly widened this function's docstring paragraph explaining which two kinds are actually promoted and why the third is deliberately excluded. Finding 3 moved the `promote_baseline_violation_findings(check_changes)` call from once, after the loop, over the whole already-suppression-filtered `produced` list, to once per check inside the loop, over each check's raw `check_changes` list *before* `_filter_suppressed_changes` disposes of a match into `suppressed` -- otherwise a suppression rule matching a genuine floor violation recorded it at the unpromoted RISK default rather than the correctly-promoted BREAKING verdict the identical unsuppressed occurrence gets (AGENTS.md's