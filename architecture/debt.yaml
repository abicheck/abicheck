      "rationale": "Existing implementation predates ADR-061 and cannot move safely without a behavior-preserving vertical slice. +2 lines (2026-08-31): Phase 5 item 2's internal-caller facade migration (PR #965) split two facade imports (a TYPE_CHECKING GraphNode/SourceGraphSummary pair, and a DEPENDENCY_EDGE_KINDS/is_public_dependency_node pair spanning model/source_graph.py and the compare-classified source_graph_query.py) into their real-owner modules, which D8 requires for an internal caller and which this frozen baseline had no equal-size reduction available to offset. +28 lines (2026-09-10/11, four PR review rounds): _classify_outcome's OUTCOME_RECONCILED catch-all conflated two structurally opposite cases (both name+location changed vs. neither changed) under one outcome whose prose asserted the former unconditionally; splitting out OUTCOME_COORDINATES_ONLY needed one new outcome constant, one _OUTCOME_PROSE entry, one kind_by_outcome entry, and a branch (+3 lines). Round two (Codex) found the first-pass fix over-broad -- 'neither changed' also covers an alias/canonical-tier match whose raw qualified name was already identical (case197: a private helper's mangled name/signature changed, invisible to the name/file axes) -- and ADR-048 documents that exact shape as intentional `declaration_identity_reconciled`, not a bug; gating on the raw qualified name having provably differed and normalized away needed one more branch (+5 lines). Round three (Codex, fresh evidence) found THAT gate still insufficient: a structural-context match can carry a coordinate shift AND an independent real signature change at once (same raw-name-differed-but-normalized-equal shape, different param_types), which the name-only gate couldn't see; closing it needed a `_signature_tail` helper comparing normalized_signature's kind/arity/param-types tail (qn field stripped) (+9 lines). Round four (Codex, fresh evidence) found the real `source_graph_build_source_abi.py` source_decl producer tracks neither param_types nor mangled_name at all, so `_signature_tail` is vacuously equal for every real function/variable pair and cannot actually prove a signature didn't change; closing it needed a `_COORDINATE_ONLY_KINDS` set restricting the new outcome to type-shaped kinds (record_type/enum_type/typedef), which have no such untracked identity dimension to hide a change behind (+11 lines). Round five (Codex, fresh evidence) found an absent qualified name on either side (a real `GraphNode.from_dict()` shape) read as positive coordinate-churn evidence, since `old_qn != new_qn` is trivially true against an empty string; closed by requiring `bool(old_qn) and bool(new_qn)` too, mirroring `renamed`'s own guard (+6 lines). Round six (Codex, fresh evidence) found the symmetric gap on the file axis -- missing def_file/SOURCE_DECLARES evidence on either side left `moved` False without proving the file didn't change, so a coordinate-shifted pair with no file evidence at all could still be waved through; closed by requiring `bool(old_file) and bool(new_file)` too, mirroring `moved`'s own guard (+5 lines). No equal-size reduction available without cutting the fix's own correctness content (see AGENTS.md's 'never trim the file to fit' -- shrinking this entry needs the whole module moved to its ADR-061 target, not a squeezed comment).",
