      "rationale": "Existing implementation predates ADR-061 and cannot move safely without a behavior-preserving vertical slice. Baseline raised by 7 lines, to the file-size hard cap exactly (ADR-063 Phase 4, Codex review): run_scan_set() -- the typed API's own --artifact-set entry point -- had no Bazel target-scoping pre-flight of its own, so an unsupported request only failed after discover_artifact_set()/check_artifact_set_soname_collisions()/artifact_set_member_exports() had already run for every member. The actual guard logic lives in the new shared workflows.plan.scan_bazel_scoping_failure() (used by scan_engine.run_scan_core too, replacing each call site's own inlined copy and shrinking scan_engine.py in the process) -- this file's own footprint is the minimum call-site glue: one import (its own explanatory comment trimmed onto the import line itself), one resolve call, one guarded raise. No smaller diff was found that still calls the shared guard before the real discovery work below, while landing exactly at (not over) the file-size hard cap. Baseline lowered 2000 -> 1933, closing ADR-063 Phase 4's residual: run_scan_set()'s own scan_bazel_scoping_failure() call still hadn't forwarded sources=/build_config= (the config-sourced, no-explicit---build-target root-target-scope case this same phase's second slice already closed for run_scan_core() and both of cli_scan.py's own pre-flight sites), because the widened call plus its own comment didn't fit this file's line budget at the prior baseline and neither a LARGE_FILE_ALLOWLIST entry nor trimming unrelated content was accepted (see the known-gaps.md entry this baseline bump replaces). Closed instead by moving responsibility, not by raising the baseline: _descendant_pgids()/_kill_process_tree() -- the process-group kill machinery behind run_scan_subprocess()/run_scan_set_subprocess(), with zero dependency on anything scan-specific -- moved to the new abicheck/workflows/scan_subprocess.py (a genuine one-directional edge, mirroring cxx20_pair_dialect.py's own precedent; the worker/harness functions that call back into run_scan()/run_scan_set() stayed here, avoiding the mutual-dependency shape a full move would have created), re-exported for backward compatibility. That bought back ~90 lines of room, used to add the sources=/build_config= forwarding (plus its own explanatory comment) and land at the new, lowered baseline (1933) with real room left below the file-size hard cap (2000), rather than exactly at the cap the way the prior baseline did. Raised again 1933 -> 1934 (2026-09-03, Round 8 review): estimate_artifact_set's pinned-depth blocker message was corrected to name both the --artifact-set aggregate exit code (1) and the single-artifact exit code (7) it had been conflating, one line longer than the code it replaced. Raised again 1934 -> 1947 (2026-09-03, CodeRabbit review, fresh evidence, PR #1032): run_scan's resolve_scan_gate_options(req) call had no exception translation -- an invalid exit_code_scheme/severity_preset raised bare ValueError/PolicyError instead of the ValidationError every other malformed ScanRequest field raises, so a Tier-2 caller guarding with except ValidationError would miss it. Now wrapped in a try/except that translates, mirroring the existing _resolve_scan_contract_config -> resolve_scan_config translation just above it. Raised again 1947 -> 1950 (PR H, CLI cleanup phase two): ScanRequest gained bundle_manifest (the --artifact-set --manifest ownership assertion, an already-loaded InstantiationManifest object mirroring the existing policy_file field), forwarded from run_scan_set() into audit_bundle()'s own new manifest= parameter. Minimum footprint -- one TYPE_CHECKING import, one field, one call-site kwarg -- with the call already packed onto as few lines as ruff format allows. Raised again 1950 -> 1954 (PR H, follow-up round, Codex review, fresh evidence): a directly-constructed ScanRequest(bundle_manifest=...) reached audit_bundle() without ever going through load_manifest()'s own 'optional_provider: false requires a library' validation -- run_scan_set() now re-checks the identical, now-shared abicheck.bundle_manifest._require_library_for_required_providers() invariant explicitly, so the typed API can no longer bypass it. Four lines: the guard, its one-line rationale comment, the import, and the call, already packed onto as few lines as ruff format allows.",
