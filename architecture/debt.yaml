      "rationale": "Existing implementation predates ADR-061 and cannot move safely without a behavior-preserving vertical slice. Baseline raised 1606 -> 1627 (ADR-067 C-S1): `ApplySuppression.apply()` and `_merge_findings_respecting_suppression()` -- two of the five suppression application points -- now record each withheld finding, with the matched rule, through the shared `policy.disposition_ledger.record_suppressed_change` primitive, and `Pipeline.run` threads the ledger through. The recording logic itself is in that `policy/` leaf; what is added here is the call at each point plus the pipeline parameter. Raised again 1627 -> 1674 (Codex review on PR #1082): `Pipeline.run` now records any finding a step discards outright as `deduplicated` (`_record_dropped_duplicates`). `DeduplicateAstDwarf`/`DeduplicateCrossDetector` run before `FilterRedundant` and simply return a shorter list, so the detected total silently undercounted by exactly the duplicates they folded away. Written once at the pipeline level rather than patched into those two steps, which is what makes it cover the failure class (a collapse with no audit record) rather than its two instances. Raised again 1674 -> 1714 (Codex review round two): two more conservation holes. `_merge_findings_respecting_suppression` dropped a late finding whose (kind, symbol) was already present -- invisible to `Pipeline.run`'s sweep, since those objects are created by the step -- and `DetectCppPatterns._suppress_grouped_children` parked grouped children in `ctx.suppressed` with no rule, which the ledger then read as a user waiver and `semver.recommend_release` turned into a spurious MAJOR/REVIEW. Both now record through one new `_record_grouped_child` helper as `deduplicated`, with the real mechanism named in the application point. Raised again 1714 -> 1740 (Codex review round three): `--collapse-versioned-symbols` was the third step found parking rule-less findings in `ctx.suppressed`, so the two ad-hoc recording calls became one named `_record_collapsed_findings` whose docstring states the rule the three share -- the bucket does not identify the mechanism, so a step that writes to it without a rule names itself. That generalization is the whole point of the added lines; a fourth such step is now a one-line call rather than a rediscovered bug. Raised again 1740 -> 1786 (Codex review round four): a step now declares what its own dropped findings *mean* (`PipelineStep.dropped_finding_disposition`) -- folded into another finding, excluded as compatible noise, or substituted by a replacement object describing the same observation. None of the three is derivable from the before/after lists, and reading a substitution as a drop counted one observed change twice (`DowngradeOpaqueStructChanges` replaces a breaking layout finding with a compatible one). Most of the growth is the protocol attribute's documentation and the three per-step declarations. (+4: the sweep's per-step identity snapshot is skipped entirely when no ledger was supplied, so a caller that did not opt into the audit pays nothing for it.) Raised again 1790 -> 1823 (perf pass on the CI baseline-regression gate): the dropped-finding sweep now costs O(1) per step in the common case -- a count-based trigger (list length plus the buckets' own totals) decides whether to build the two identity sets at all, since a wide diff runs two dozen steps over thousands of findings and the sweep was ~6% of `compare()`. The added lines are that trigger and the comment establishing why it is sound (a step that both adds and drops in one call records its own drops, which `test_a_pipeline_step_can_never_drop_a_finding_unrecorded` checks against the real pipeline).",
