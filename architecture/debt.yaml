d lockstep SONAME suppression before folding audits\" -- `_suppress_lockstep_soname_findings` mutates `result.changes` after that library's own `disposition_audit` was already stamped (before the release-wide `worst_verdict` this suppression depends on was known), which left the hidden finding labelled `non_gating` with no suppression rule recorded; it now also records the suppression on a copy of the library's `disposition_ledger` (`policy.disposition_ledger.DispositionLedger.with_suppressed`, a new sibling of `with_gate`) and recomputes `entry[\"disposition_audit\"]` before the release-level fold reads it. Raised 906 -> 911 (Codex review, fresh evidence, follow-up: \"Move release suppression out of report projection\"): the ledger mutation was first routed through a new `report.disposition_audit.supersede_as_suppressed` crossing-point, but mutating the ledger is the policy decision itself, not a projection of one already made -- `report/`'s own contract is a pure projection over completed workflow facts. Moved to `workflows.disposition.supersede_as_suppressed` instead (the established \"a frontend touches the disposition ledger through here\" home this module's own docstring already describes for its two existing re-exports), and the caller here now imports from there. Raised 911 -> 927 (Codex review, fresh evidence, follow-up: \"Preserve lockstep findings in the suppression trail\"): `_suppress_lockstep_soname_findings` removed the coordinated-release `SONAME_BUMP_UNNECESSARY` finding from `result.changes` and recorded it on the disposition ledger, but never on `result.suppressed_changes`/`suppressed_count` -- the fields `to_json()`'s own `suppression` block actually reads (`checker._filter_suppressed_changes`'s own contract every other suppression path already follows), so the rewritten per-library `--output-dir` JSON reported `suppressed_count: 0` while its `disposition_audit` said one finding was suppressed. Two one-line assignments plus their explanatory comment on the one function that already owns this exact mutation.",
