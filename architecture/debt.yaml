      "rationale": "Existing implementation predates ADR-061 and cannot move safely without a behavior-preserving vertical slice. Baseline raised 1008 -> 1013, CLI cleanup phase two PR G2's typed-API parity slice (ADR-064): CompareRequest gained severity_preset/exit_code_scheme fields and CompareResult gained exit_decision (an ExitDecision, type-only imported under TYPE_CHECKING to avoid a new runtime dependency on the policy package) -- the minimum, already-comment-trimmed footprint for CompareRequest/CompareResult to carry the same severity/exit-code-scheme configuration and resolved decision the native compare CLI's report exit block already carries (abicheck.policy.release_gate_options.GateOptions, abicheck.policy.exit_decision.resolve_compare_exit_decision, both reused unchanged from service_compare_pipeline.classify_compare_pair). These are real typed-request/response fields, not incidental growth, so there is no responsibility to move elsewhere in this file -- CompareRequest/CompareResult are already this package's canonical home for exactly this kind of field. Raised again 1013 -> 1030 (2026-09-03, Round 6 review): CompareRequest.validation_errors() now rejects an unknown exit_code_scheme itself, so a typed caller fails fast (Tier-2 ValidationError) before resolve_compare_request runs any extraction, instead of only failing later inside classify_compare_pair's resolve_release_gate_options call once both sides have already been resolved -- this is the same kind of pre-existing, already-explicit fail-fast check every other validation_errors() rule in this method performs (contract_mode, policy_file_path, depth, ...), applied to a field this file already owns. Raised again 1030 -> 1047 (2026-09-03, Round 7 review): the exit_code_scheme fix above left its sibling field, severity_preset, unchecked -- a misspelled preset (e.g. \"strcit\") still only failed later inside resolve_release_gate_options, after extraction had already run. Same fail-fast rule now applied to severity_preset, checked against policy.severity.SEVERITY_PRESETS. Raised again 1047 -> 1058 (2026-09-03, Round 11 review): the policy_file_path fix (compatibility_evaluation_frontend.py) covered the accepted case where a file overrides an unknown policy name, but left the no-file case unchecked -- CompareRequest(policy=\"not_a_policy\") with no policy_file_path still only failed later inside builtin_policy_identity, after extraction had already run. validation_errors() now rejects a policy name outside VALID_BASE_POLICIES when no policy_file_path is given, mirroring stated_policy_base's own file-overrides-name rule. Raised again 1058 -> 1067 (2026-09-03, Codex review on 72fdf5b): CompareResult gained severity_config -- the same resolved GateOptions.severity exit_decision above was scored under -- so a typed caller can pass severity_config=result.severity_config into reporter.render_output/to_json and get a rendered severity block and exit code that agree with exit_decision, instead of the report silently recomputing a None-severity legacy exit that contradicted it. Raised again 1067 -> 1083 (2026-09-03, CodeRabbit review, fresh evidence, PR #1032): CompareResult's own fields (diff/old_snapshot/new_snapshot/suppression/exit_decision/severity_config) referenced six of this file's seven TYPE_CHECKING-only names directly, so typing.get_type_hints(CompareResult) raised NameError -- fixed by importing DiffResult/AbiSnapshot/SuppressionList/ExitDecision/SeverityConfig unconditionally (verified no import cycle), leaving only CompileContext/DumpManifest (referenced solely by InputSpec) under TYPE_CHECKING. Raised again 1083 -> 1099 (workstream F S1, vision-api-abi-evolution.md \"F. Header-only comparison\"): _path_required_errors now also accepts headers (not just sources/build_info/dump_manifest) as valid binary-less DumpRequest evidence, so a genuinely headers-only request reaches the new typed execution path instead of failing this check before it ever runs -- the widened rule and its docstring addition both belong on this existing per-field validator, not a new module. Raised again 1099 -> 1109 (CodeRabbit review on this PR): public_header_dirs was wrongly included in that same OR-chain -- it is a pure declaration-provenance classifier, never a source of headers to parse, so a binary-less request naming only public_header_dirs passed this check and then failed later, inside execute_source_only_dump_request, with a confusing error that never mentions public_header_dirs at all. Removed from the OR-chain and the docstring rewritten to explain why, on the same per-field validator. Raised 1109 -> 1121 (one-comparison-product.md Phase 2c/2d, ADR-068): CompareRequest gains the two per-run inputs the plan moves from scan onto compare -- changed_paths (the resolved --since/--changed-path seed, ADR-043 D7 POI scoping) and abi3_floor (the candidate-side stable-ABI audit's Py_LIMITED_API floor) -- each with the field comment this file's own convention requires. Both are intrinsically fields of this dataclass: the request object IS the front-end-independent contract both the CLI and the typed API resolve into, so there is no other module the fields could live in without splitting one request across two objects.",
