been investigated further. Not yet a routine reclassification. ADR-061 Phase 4 (service.py thinning slice, second pass) added `abicheck.serialization` to `architecture/modules.yaml`'s `public_root_surfaces` instead of attempting the full classification above: the new `abicheck/workflows/input_resolution.py` module (real `resolve_input`/`load_env_matrix`/`collect_metadata` implementations moved out of `service.py`, physically inside the `workflows` package) needs `load_snapshot`, and being `migrated_source` it is checked for unclassified imports unconditionally, unlike `service.py`'s own flat, `legacy_paths`-classified copy of the same import. `public_root_surfaces` is the documented exemption for exactly this shape -- a genuinely public, stable surface (`serialization.py`'s own docstring already calls `load_snapshot`/`save_snapshot`/`write_snapshot` 'the public compatibility surface') reached from a migrated package, without deciding the harder question this entry is still open on. It changes nothing about the five real `frontends -> storage`/`compare -> storage` edges above, and does not move this entry's `target` off 'blocked' -- `probe_harness.py`'s `compare -> storage` edge in particular has no available facade route (`compare`'s `may_import` is `[model]` only, not `workflows`) and would need its own investigation independent of this exemption. Raised by 10 for ADR-063 Phase 2's closing slice (schema v31): the encode/decode hookup and reconstruction keywords for the typedef_entity_ids/constant_entity_ids sidecars. The codec itself lives in storage/entity_id_codec.py, so only the call-site plumbing lands here.",
