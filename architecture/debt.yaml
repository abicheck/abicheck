ry one of the above callers -- fixed at the source by widening its return to (string, new_offset, terminated), with every one of its 11 call sites (LF_STRUCTURE/LF_UNION/LF_ENUM/LF_ARRAY names, LF_MEMBER/LF_ENUMERATE/LF_ONEMETHOD names, and _skip_subrecord's LF_STMEMBER/LF_NESTTYPE/LF_METHOD name skips) now folding the terminated flag into the same True/False completion contract those methods already return (the two DBI-module-name call sites, which have no completeness channel of their own, just discard the new third value). The growth is the widened docstring plus one extra bound variable and a `if ... else None`/return-substitution at each of the 11 call sites -- not extractable, since each is the one place that already owns its method's completion verdict. Raised again 1389 -> 1399 (2026-09-04, P2 review, fresh evidence): parse_tpi_stream's own per-record bounds check compared a record's declared rec_len against len(data) (the whole stream buffer) rather than end (the TPI header's own declared type-data boundary, header_size + type_bytes) -- a record whose length crossed the declared type section but still fit inside trailing hash/index substream bytes the PDB stream carries past it was accepted, consuming those non-type-record bytes as the record's own payload and potentially reaching ti_end with truncated=False despite never holding that many well-formed records. Fixed by additionally bounding against end. The growth is one added bounds-check term plus a comment naming the finding, both inline in the existing while-loop guard -- not extractable without splitting that guard across modules. Raised again 1399 -> 1405 (2026-09-04, P2 review, fresh evidence): _parse_lf_index's LF_INDEX continuation handling silently returned pos (success) when the referenced type index was missing or named a non-LF_FIELDLIST record -- the continuation's members were never resolved (never added to the caller's members list at all) yet the fieldlist was reported complete. Fixed by re