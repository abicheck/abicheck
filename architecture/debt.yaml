      "rationale": "New entry (2026-09-04, P2 review, fresh evidence, Codex, PR #784): two sibling fixes crossed the 800-line production soft cap for the first time. (1) A new extraction_failed field on BtfMetadata, set once at construction inside parse_btf_from_bytes (every one of its own early-return paths -- header/section-bound/type-table failures -- is reached only after being handed a real, existing section's bytes, so a genuine parse failure there was previously indistinguishable, through to_dwarf_metadata(), from has_btf=False on its own -- far more commonly, no .BTF section at all). to_dwarf_metadata() now maps it to evidence_state=\"failed\" ahead of the has_btf/extraction_partial checks; mirrors the identical CTF fix and its own debt-entry rationale (ctf_metadata.py). (2) _extra_data_size() wrongly consumed 4 extra bytes for BTF_KIND_FLOAT, which per include/uapi/linux/btf.h carries no trailing encoding word at all (unlike BTF_KIND_INT, which this module's own code -- and its own tests -- previously conflated it with); this shifted every subsequent type record's own offset, spuriously truncating (or misparsing) an otherwise perfectly valid type table containing a real float type. The growth is the extraction_failed field and its docstring, one constructor-argument change, the three-way branch in to_dwarf_metadata() replacing the previous two-way one, and the corrected FLOAT branch plus its own explanatory comment -- not extractable, since BtfMetadata/parse_btf_from_bytes already own these two receipts' own verdicts.",
