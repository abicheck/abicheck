t` to its `context.py`; what remains here is the step classes, each still awaiting its own owner. Lowered 1358 -> 1357 (2026-10-21): the leak overlay's ImpactAssessment cache is one call to `post_processing_reachability.cache_impact_assessments`, and the step's import block shrank to one line per module.",
