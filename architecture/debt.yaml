came one named `_record_collapsed_findings` whose docstring states the rule the three share -- the bucket does not identify the mechanism, so a step that writes to it without a rule names itself. That generalization is the whole point of the added lines; a fourth such step is now a one-line call rather than a rediscovered bug. Raised again 1740 -> 1786 (Codex review round four): a step now declares what its own dropped findings *mean* (`PipelineStep.dropped_finding_disposition`) -- folded into another finding, excluded as compatible noise, or substituted by a replacement object describing the same observation. None of the three is derivable from the before/after lists, and reading a substitution as a drop counted one observed change twice (`DowngradeOpaqueStructChanges` replaces a breaking layout finding with a compatible one). Most of the growth is the protocol attribute's documentation and the three per-step declarations. (+4: the sweep's per-step identity snapshot is skipped entirely when no ledger was supplied, so a caller that did not opt into the audit pays nothing for it.) Raised again 1790 -> 1823 (perf pass on the CI baseline-regression gate): the dropped-finding sweep now costs O(1) per step in the common case -- a count-based trigger (list length plus the buckets' own totals) decides whether to build the two identity sets at all, since a wide diff runs two dozen steps over thousands of findings and the sweep was ~6% of `compare()`. The added lines are that trigger and the comment establishing why it is sound (a step that both adds and drops in one call records its own drops, which `test_a_pipeline_step_can_never_drop_a_finding_unrecorded` checks against the real pipeline). Raised 1823 -> 1825 (public-contract-vs-name-shape fix): `PostProcessingPipeline.run` gained the `experimental_namespaces` parameter and the matching `PipelineContext` kwarg -- two lines, the irreducible call-site cost of threading the new `experimental_namespaces:` policy key to `Detec