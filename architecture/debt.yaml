Codex review, fresh evidence, follow-up: \"Record the active filter in release JSON\"): the release JSON substituted the `--view show=...`-filtered library/bundle/matrix projections with no trace of the active selector or pre/post-filter counts, so a filtered-to-empty `findings` list next to `verdict: BREAKING` was indistinguishable from missing/truncated detail -- unlike scalar `compare` JSON, which has always carried `show_only_filter`/`filtered_summary` for exactly this reason. `_format_release_json` (the one function that already owns the release document's own field assembly, immediately after the per-library/bundle/matrix projections it aggregates are built) now adds the identical two fields when `show_only` is active, aggregated across every projection this same filter was just applied to -- no new mechanism, the same fields scalar `compare` already exposes, applied one level up. Raised 1678 -> 1725 (Codex review, fresh evidence, follow-up round two: \"Preserve the scalar filtered_summary schema\" + \"Count uncapped findings in release filter totals\"): the prior fix's `filtered_summary` field name collided with scalar `compare` JSON's own differently-shaped field of the same name -- renamed to `release_filtered_summary` with an expanded docstring explaining why the shapes cannot be unified. Its `total`/`displayed` counts also switched from summing each library's already-display-capped `findings` list (under-reporting past `_MAX_RELEASE_FINDINGS_PER_LIBRARY`) to reading the real, uncapped `findings_total_count`/`findings_total_count_view` `_strip_diff_results_and_adjust_verdict` now stashes per-library (see that module's own entry below). `_release_findings_for_render` also gained the two-line strip for those new private keys, mirroring `findings_view`'s own existing pop -- the one function that already owns this exact private-key-stripping contract. Raised 1725 -> 1790 (Codex review, fresh evidence, follow-up round three: \"Disclose active filters in release