      "rationale": "Not legacy debt: this file was under the 800-line production cap until Phase 7d (one-comparison-product.md §4.1, ADR-068 D5) added four project-config fields the release/bundle topology CLI flags this workstream demotes needed: scope_on_incomplete (scope.on_incomplete, the former --on-incomplete-scope), gate_fail_on_removed_library (gate.fail_on_removed_library, a new top-level gate: block, the former --fail-on-removed-library), and release_dso_only/release_include_private_dso (a new top-level release: block, the former --dso-only/--include-private-dso). Each field needed its own dataclass field + docstring, from_dict() parse line, to_dict() block builder, and _KNOWN_TOP_KEYS/_KNOWN_BLOCK_KEYS/BOOL_SUBKEYS/STR_SUBKEYS schema entries (the last two split into the sibling build_config_schema.py already) -- this is this file's own canonical .abicheck.yml schema responsibility (every other project-contract block above it followed the identical shape), not logic a leaf module could own instead without splitting the schema across two files mid-block. Raised 857 -> 868 (Phase 7g): a fifth field, resource_limits_max_bundle_facts_decode_nodes (a new top-level resource_limits: block, the former --max-json-object-nodes), same identical shape -- the new INT_SUBKEYS type-check helper and the opt_int() reader it needs moved to the sibling build_config_schema.py (already this field's schema home for BOOL_SUBKEYS/STR_SUBKEYS/LIST_SUBKEYS), so only the irreducible dataclass-field/_KNOWN_TOP_KEYS/_KNOWN_BLOCK_KEYS/from_dict-call-site/to_dict-block cost landed here, minimized to one line each where the existing pattern allowed it. Raised 868 -> 877 (one-comparison-product.md Phase 7i, the whole-surface per-flag audit): two more CLI flags demoted to project config, each costing only its irreducible dataclass-field/parse/serialize lines here -- `release.support_promise` (the former `compare --support-promise`, which ADR-065 D1/D6 and the flag's own help text already c