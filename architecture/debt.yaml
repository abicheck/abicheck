entation style and \"appended at the true end\" positional-safety convention every other audit/state field on this dataclass already carries. Both additions merged together (a Workstream E S3/ADR-068 merge conflict): baseline raised 855/877 -> 883 to cover both fields. Raised 883 -> 885 independently on this branch (plan P2/ADR-068 D3): `Change` gained one further `kw_only` field, `cross_source_evolution` -- a second, deliberately distinct evolution axis from `evolution`: `FindingEvolution` (unqualified) tracks a finding's identity across a *chain* of separate `compare()` calls over time, while `CrossSourceEvolution` (a new, sibling enum in `checker_policy.py`) states how a cross-source hygiene check behaves across OLD->NEW *within one* `compare()` call. Same field-level documentation style; appended at the true end. Baseline raised 885 -> 891 (this merge, Workstream E S3/plan P2 conflict resolution): both branches' independent 883/885 growth reconciled to the file's real post-merge line count. Raised again, merging origin/main's Phase 1 addition with this branch's own, to 901 (one-comparison-product.md Phase 2d, ADR-068 D3): Change gains candidate_side_enrichment, the marking D3 requires for a finding produced by a candidate-only check (today compare --abi3's stable-ABI audit) so it can ride the same result document instead of creating a second one. Same field(kw_only=True)-appended-last convention as symbol_binding/evidence_provenance/entity_id above, and for the same reason those live here: it is a field of the public Change dataclass, which no sibling module can own. (Same PR, review round: the field moved from immediately after `entity_id` to after `disambiguator` -- `tests/test_evidence_provenance_completeness.py` pins the appended-last order, and the two extra lines are that move's own explanatory comment.) Raised 901 -> 919 (ADR-067 D5/D6, workstream C-S3): `DiffResult` gained two `kw_only` fields, `acknowledgments` and `unacknowledged_additions_review` -- t