      "owner": "workflows",
      "rationale": "Existing implementation predates ADR-061 and cannot move safely without a behavior-preserving vertical slice. Raised 1384 -> 1406 (`docs/contribute/plans/one-comparison-product.md` Phase 2b, ADR-068 D3/D4/D5): `compare()` gained the `pattern_preprocessor_scan` opt-out-only parameter (default `True`, no CLI/API/Action opt-in flag) and its call into `workflows.pattern_preprocessor_scan.compute_pattern_preprocessor_scan`, attaching the folded result onto the returned `DiffResult` after construction -- the same 'irreducible call-site cost, logic lives in a sibling workflow module' shape `cross_source_checks` already established for this file. Baseline raised 1286 -> 1339 (ADR-067 C-S1, scalar disposition audit): `compare()` builds one conserved `DispositionLedger` before the first disposition can apply and threads it into every suppression application point (`_filter_suppressed_changes`, `_filter_pattern_synthetic`, `_apply_surface_metrics`, `_apply_soname_policy`, `_apply_pattern_verdicts_step`, `_env_matrix_contract_changes`, the post-processing pipeline), closing it over the result at the end. Almost all of the growth is one added parameter per already-existing helper signature plus the two `record_suppressed_change` calls -- the ledger type, the recording primitive and the finalization logic all live in `abicheck/policy/disposition_ledger.py`, which is where the responsibility actually moved to. Raised 1339 -> 1345 (E-S2, cli-cleanup-phase-two.md Block 5): `compare()` gained the `comparability_assurance` local -- computed via the new `comparability.dimension_assurance()` helper and threaded into `DiffResult` -- plus a two-line docstring note on the `diagnostic_comparison` parameter pointing at it. A real new reviewed field, not incidental growth. Raised 1345 -> 1352 (Workstream E slice S3, vision-api-abi-evolution.md section E): compare() now serializes ContractEvaluationStage.conflicts into DiffResult.contract_conflicts alongside the existing contract_context assembly -- the minimum call-site wiring; the detection logic itself lives in policy/contract_conflicts.py and workflows/contract_conflicts.py, not here. Baseline raised 1352 -> 1357 independently on this branch (ADR-068 D3/plan P2): compare() gained the `cross_source_checks` opt-in parameter and its call into `workflows.cross_source_evolution.compute_cross_source_evolution`, threading the result onto the returned changes. Both branches' additions merged together (a Workstream E S3/ADR-068 D3 merge conflict): baseline raised 1352/1357 -> 1364 to cover both. Raised 1364 -> 1368 (ADR-067 D5/D6, workstream C-S3): `compare()` gained the `acknowledgments` opt-in parameter (one `TYPE_CHECKING` import, one parameter, one docstring line, one `DiffResult` constructor kwarg) -- the same 'irreducible dataclass-field/call-site cost lands here, the actual logic moves to a sibling module' shape policy_file.py's own ADR-066 D4/S2 entry already used. All of `resolve_acknowledgments`'s matching/recording logic and the additions-review gate evaluation live in `abicheck/policy/acknowledgment.py`/`acknowledgment_gate.py`/`policy/disposition_close.py`, not here. Raised 1368 -> 1381 (same slice, Codex review, fresh evidence): the additions-review gate's own evaluation call moved back into `compare()` from `disposition_close.finalize_ledger()`, where it had briefly landed -- `ledger_for()`'s fallback path also calls `finalize_ledger()` and is documented to 'never mutate *result*', so writing `result.unacknowledged_additions_review` there broke that contract for a hand-built `DiffResult`. `compare()` is the only caller that legitimately owns `result` at that point, so the assignment (one `if`/import/call, four lines) has to live here; the review-computation logic itself is still entirely in `acknowledgment_gate.py`. Raised 1381 -> 1384 (same slice, CodeRabbit review): `finalize_ledger()`'s own call site here now passes the new `strict_acknowledgments=True` keyword (D5's hard