      "rationale": "New entry, ADR-063 Phase 7: augment_report()'s two mutators (_neutralize_gate/_escalate_removed_library_severity) and the three synthetic report builders (build_operational_error_report/build_bootstrap_report/build_new_target_report) each gained the identical structured `run_outcome` treatment their legacy `severity`/`verdict` fields already had, across five call sites this module owns and no other module can substitute for -- the run_outcome-building helper itself was split out to the new sibling check_report_run_outcome.py to keep the added footprint to the minimum per-site glue (one import, one conditional 2-line write, or one dict-literal line). No smaller diff was found that still lands the required behavior at every one of the five sites this phase's plan names. Raised 812 -> 813 (same phase, Codex review, fresh evidence): a pre-existing report re-stamped to the current schema never carried `run_outcome` at all -- `augment_report` now calls the new `backfill_run_outcome` (in check_report_run_outcome.py, the same sibling module) alongside the pre-existing `backfill_exit_block_fields` call it already mirrors, one import name and one function call. Raised 813 -> 814 merging G42 phase 1 (PR #1008, `explicit_id`/`environment_id` params on `build_check_id()` and the four report builders) onto this already-landed ADR-063 baseline -- both branches touch this module independently and neither can substitute for the other's lines; the merge itself adds no new behavior beyond what each PR already carried on its own. Baseline raised 814 -> 882 by the one-time `ruff format` pass that made `fmt-check` a real CI gate (see docs/contribute/known-gaps.md). No responsibility was added or moved: the formatter only rewrapped call sites and expanded magic trailing commas, and the file's parsed statement count is byte-for-byte unchanged (verified by comparing `ast.dump` of this file before and after). This is the one bump that \"move responsibility instead of raising the baseline\" cannot be answered by moving anything; physical line counts are formatter-stable from here, because `fmt-check` now gates them. Raised 876 -> 884 (PR #1283, Codex review round 7): `extend_records`, the one API a merge of several comparisons' ledgers needs. A multi-library `compat check` dropped every per-library ledger, so a release whose policy demonstrably acted reported an empty policy trail -- ADR-067's \"every disposition keeps its rule and reason\" lost at the aggregation step. `record()` cannot serve the merge: it is keyed on the live `Change` object a disposition was applied to, and a merge holds the records rather than the objects behind them. The merge itself, and all of its reasoning, lives in the new `policy/disposition_merge.py`; what is here is the seven-line accessor into this class's own private list, which cannot live anywhere else without a cross-module private access. The alternative considered and rejected was a parallel merged-ledger type in the new module, which would have had to duplicate this class's whole query surface (`records`/`__len__`/`__iter__`/`detected_total`/`scope_reasons`/`suppressed_gating_records`) to be usable by the same reporters -- strictly more duplication than eight lines.",
