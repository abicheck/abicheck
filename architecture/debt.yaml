never raised the legacy exit code even while duplicated. `_strip_automatic_cross_source_findings` (new function, ~30 lines with its docstring) closes that regression generally, for every cross-source check, not just the two newly-API_BREAK ones -- nothing to move elsewhere, since this is this file's own pre-existing invariant losing its enforcement point to a sibling module's own default. 2026-09-09 (ADR-068 amendment, PR #1172): `_strip_automatic_cross_source_findings` deleted outright (a baseline scan now gates a cross-source finding exactly like `compare`, ADR-068 D3), shrinking the file well under baseline; then, two Codex review rounds on the same PR, raised back to 1435 for two real, minimal fixes the deletion itself needed: an `enabled_checks` parameter so `--crosscheck KEY=off` still disables a check against the now-unstripped automatic stage (mirroring `run_crosschecks`' own `CrosscheckConfig.enabled`), and -- found on the very next round -- routing that disable through `suppressed_changes`/the disposition ledger (via the new `workflows.disposition.record_suppressed_change` re-export, ADR-061's frontend-import rule) instead of a bare delete, per AGENTS.md's \"record before disposing\" rule. Nothing to move elsewhere: both are this file's own baseline-scan-specific policy application, the same shape `checker._filter_suppressed_changes` already applies at the `compare` layer. Raised again, 1435 -> 1443 (same PR, third Codex review round): `compare_snapshots()` already finalizes `diff.disposition_ledger` before this call site ever runs, so the previous round's `record_suppressed_change` call was itself a silent no-op (first-write-wins) -- swapped for the new `override_suppressed_change` (`policy/disposition_close.py`, not `disposition_ledger.py`: that leaf is already at its own 800-line cap), plus the doc comment explaining why the two are not interchangeable. No smaller diff: the swap is one import and one call-site rename, and the comment is what stops a fourth round rediscovering the same distinction. Raised again, 1443 -> 1459 (same PR, fourth Codex review round): `rule=None` on that `override_suppressed_change` call made `rule_provenance()` store `None` too, so `DispositionLedger.rules()`/`rule_for()` still could not report the `crosscheck:KEY=off` provenance even though `Change.suppression_rule` carried the string -- fixed by building a real `RuleProvenance` directly (`policy/disposition_close.py`'s `override_suppression` now accepts one alongside a real `Suppression`, and `workflows/disposition.py` re-exports the type) and passing it here instead of `None`. No smaller diff: the fix is inherent to this call site, since it is the only place a `--crosscheck KEY=off` rule/reason exists to construct. Raised again, 1459 -> 1489 (same PR, CodeRabbit review): two real correctness bugs in this same block. First, `diff.suppressed_count` (a distinct scalar `checker.compare()` sets to `len(suppressed)`, not derived from `len(suppressed_changes)`) went out of sync with the audit trail this block extends -- one added assignment. Second, the post-removal verdict recompute used `compute_verdict(diff.changes, ...)` alone, silently dropping `compare()`'s own `verdict_redundant` population (the non-rename-collapsed half of `redundant_changes`, which can independently drive a breaking exit code) from consideration -- `verdict_redundant` is a private local never exposed on `DiffResult`, so the fix reconstructs it by querying the already-finalized disposition ledger for which `redundant_changes` it disposed `GATING` (`disposition_close.finalize_ledger`'s own `verdict_scored` handling already recorded that distinction) rather than re-deriving the `caused_by_type` rule a second time. Nothing to move elsewhere: both are this call site's own post-hoc-recompute correctness, the same shape the three prior rounds' fixes on this exact block already are. Raised again, 1489 -> 1502 (same PR, same review): the ledger-query half of the verdict-population fix was pulled out into a module-level `gating_redundant_changes()` with its own docstring, purely for direct unit-testability without a full compare()/rename-collapse fixture -- the net line growth is the function's own doc, not new behavior. Raised again, 1502 -> 1511 (same PR, round-12 Codex review): the post-removal verdict recompute's `diff.changes` half still scored a `CrossSourceEvolution.RESOLVED` finding, even though `checker.compare()`'s own `all_unsuppressed` (and `policy/severity.py`'s `gate_eligible_changes`/`gate_contribution_for_change`) had just been fixed, in this same PR round, to exclude it (plan F-9) -- disabling one unrelated crosscheck here could still resurrect an already-fixed cross-source issue into a failing verdict. Filtered `diff.changes` through the same `checker_policy.is_cross_source_resolved` predicate before folding in `gating_redundant_changes()`, mirroring `checker.py`'s own shape exactly rather than inventing a second rule. No smaller diff: the filter is inherent to this call site, the only place a baseline scan recomputes its verdict after removing a disabled finding. Raised again, 1511 -> 1537 (same PR, same round): pulled both halves of that recompute (the RESOLVED filter and the `gating_redundant_changes()` fold) out into a module-level `verdict_scored_changes()` with its own docstring, the same testability-without-a-full-compare()-fixture reasoning as `gating_redundant_changes()`'s own prior extraction -- `tests/test_cli_scan_baseline.py`'s `TestVerdictScoredChanges` exercises the RESOLVED exclusion directly rather than only through a slower end-to-end CLI fixture. Net growth is the new function's own doc plus its class-level unit tests' fixture helper; the call site itself shrank. Raised again, 1537 -> 1546 (same PR, round 15 Codex review): `verdict_scored_changes()` also excludes a `contract_gating.NOT_EVALUATED` finding now, the same exclusion `checker.py`'s own first `all_unsuppressed` computation applies via `evaluated_for_policy` -- without it, disabling an unrelated crosscheck could resurrect an already-`PROVEN_OUT_OF_CONTRACT` finding into a failing verdict. One added `is_evaluated` import/check plus its docstring bullet; nothing to move elsewhere, since this is the same call site's own post-hoc-recompute correctness every prior round's fix on this exact function already is. Raised again, 1546 -> 1613 (same PR, round 16, Codex review): `--crosscheck KEY=info`/`=warning` kept a check enabled (finding stays visible) but had no effect on the automatic-stage finding's own gating -- it still scored at its `ChangeKind`'s own default severity, contradicting `scan_engine._crosscheck_severity_exit`'s own \"info/warning never gate\" contract for the sibling single-snapshot mechanism. Added a `severities` parameter and a `_non_gating` exclusion applied at both places a baseline scan's exit code is decided: the legacy `diff.verdict` recompute (this call site's own pre-existing population filter, extended) and the `exit_code_scheme == \"severity\"` branch much further down in the same function, which had to route around `gate_decision_for_result`'s own deliberate \"always reads `result.changes` in full\" contract (that module's own docstring: a display-only filter must never change the exit code) by calling the shared `compute_gate_decision` primitive directly with a locally filtered list instead. An `effective_verdict` stamp was tried first and rejected: `Verdict.COMPATIBLE` still classifies as `quality_issues`, which `--severity-preset strict` itself treats as `error`, so the demotion would have silently gated at a different, but still nonzero, exit code -- exactly the bug being fixed, one axis over. Nothing to move elsewhere: both are this exact function's own post-hoc gate-decision correctness, the same shape every prior round's fix on this call site already is. Raised again, 1613 -> 1618 (same PR, mypy fix following round 16): `computed_gate`'s two branches assign `GateDecision`