s the release engine's single format-dispatch choke point. Raised 1454 -> 1573 (Codex review, PR #1154 second follow-up: \"Apply release show filters inside each renderer\"): the prior `--view show=` fix filtered `library_results` once, upstream of both the primary `--format` render and a secondary `--write` render, which fed the filtered projection to `--write` too (contradicting `--write`'s documented always-full contract) and left JUnit's own primary render (which reads the unfiltered `diff_pairs`, not `library_results`) and the release-global bundle/matrix findings sections unfiltered outright. Fixed by moving the filter to each primary-format renderer's own call site: `_release_findings_for_render` (new) projects a per-library `show_only`-filtered view (already precomputed alongside the always-full one by `cli_compare_release_matrix._strip_diff_results_and_adjust_verdict`, since it needs the live DiffResult that's discarded right after) without mutating the shared `library_results` list, so `_format_release_json`/`_format_release_markdown` apply it to their own `--format` render while a secondary `--write` call (passing `show_only=None`) still gets the full projection from the same list; `_format_release_json`/`_format_release_markdown`/`_format_release_junit`/`_format_release_summary` each gain a `show_only` parameter, `_format_release_junit` forwards it into `to_junit_xml_multi` (which already supported it, just was never given it), and both JSON's `matrix_findings`/`bundle_findings` and Markdown's matrix/bundle sections now filter through the new shared `reporter_markdown.release_bundle_findings_for_view`/`release_matrix_changes_for_view` helpers -- kept in `reporter_markdown.py` rather than here so `report/render_release_markdown.py` (a `report`-layer module, which may not import `frontends`) can call the identical logic without an ADR-061 dependency-direction violation. Raised 1573 -> 1586 (Codex review, PR #1154 follow-up: \"Reject unsupported impact view