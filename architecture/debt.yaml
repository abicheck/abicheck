      "owner": "abicheck maintainers",
      "rationale": "New entry (2026-09-04, P2 review, fresh evidence, Codex, PR #784): _read_ctf_section discarded the container's ELF class entirely, so a 32-bit ELF carrying CTF had every pointer member reported at a hardcoded 8 bytes -- the exact bug btf_metadata.py's own _read_btf_section was already fixed for. Fixed by mirroring that fix: _read_ctf_section now returns (data, pointer_size), threaded through parse_ctf_metadata -> parse_ctf_from_bytes (default pointer_size=8, matching parse_btf_from_bytes's own default for the one caller with no ELF container to derive a class from) -> extract/ctf_type_resolver._TypeResolver, whose CTF_K_POINTER size branch now reads self._pointer_size instead of a hardcoded literal. This crossed the 800-line production soft cap for the first time as a direct consequence of that one-parameter threading (the docstring/comment growth on the size/param chain, not new logic of its own) -- test_ctf_metadata.py's own already-existing debt entry references this file's rationale by name, so this entry closes that dangling cross-reference rather than opening a new debt category. Raised 811 -> 823 (2026-09-04, P2 review, fresh evidence, Codex, PR #784): parse_ctf_from_bytes now validates the CTF string section's own mandatory leading-NUL sentinel (offset 0 is reserved for the empty string), mirroring the identical btf_metadata.py fix -- a missing/malformed sentinel previously let a name_off=0 (anonymous) reference fabricate a real struct/enum/typedef name with no completeness signal. Raised 823 -> 862 (2026-09-04, P2 review, fresh evidence, Codex, PR #784): split _parse_header() into a new _parse_preamble() (magic/version/flags only) plus the existing full-header-body parse, and reordered parse_ctf_from_bytes() to read the preamble, decompress if CTF_F_COMPRESS is set, and only then parse (and length-check) the real header body -- the previous order called the full-header-enforcing _parse_header() before decompression, rejecting a perfectly valid CTF_F_COMPRESS blob under _CTF_V3_HEADER_SIZE bytes in total (everything past the 4-byte preamble is still compressed at that point) as truncated. _decompress_if_needed() now takes the raw flags int rather than a full CtfHeader, since the header's other fields cannot be trusted before decompression either. The growth is the new preamble-parsing function plus the reordered call sequence -- not extractable, since parse_ctf_from_bytes already owns this pipeline's own stage ordering. Raised again 862 -> 883 (2026-09-04, P2 review, fresh evidence, Codex, PR #784): parse_ctf_from_bytes' own `empty = CtfMetadata()` was returned unmarked from every one of its six early-return paths (preamble/decompression/header/section-bound/type-section-ordering/type-table failures) -- indistinguishable, through to_dwarf_metadata(), from has_ctf=False on its own (a binary with no CTF section at all, far more common), so an explicitly requested extractor (--debug-format ctf) that failed on an existing but malformed section read back the same evidence_state=\"not_available\" as one with nothing to extract. Fixed with a new extraction_failed field, set once at construction (every one of this function's own early returns is reached only after being handed a real section's bytes -- a genuinely absent section is filtered out one layer up, in parse_ctf_metadata, before this function is ever called), and to_dwarf_metadata() now maps it to evidence_state=\"failed\" ahead of the has_ctf/extraction_partial checks. Mirrors the identical BTF fix. The growth is that one field, its docstring, one constructor-argument change, and the three-way branch in to_dwarf_metadata() replacing the previous two-way one -- not extractable, since CtfMetadata already owns this receipt's own state-mapping verdict.",
