g each dict entry shared -- the identical per-element gap contract_conflicts already fixed, recurring one field deeper; its own regression test. Raised 1389 -> 1450 (same PR, next Codex round): build_report_envelope threaded its captured today into gate_decision_for_result/build_report_findings but not into its own build_report_document call, so _add_changes_block/_add_policy_overrides/_build_severity_json (via _change_to_dict/active_reclassify_rules/categorize_changes) still resolved a fresh date.today() -- the ninth call site for the date-resolution half of this same bug-class pair, discriminated with a clock mock that simulates construction straddling midnight (a different, later value for date.today() reached only through the unthreaded path, not the captured one) since the JSON document is otherwise a static projection of what build_report_envelope already froze. Raised 1450 -> 1507 (PR #1193 merged; this is its direct follow-up PR, same branch name, same architectural gap and bug-class chain -- next Codex round on the new PR): the same document build's own _add_disposition_audit and _add_contract_context (its exit block via resolve_compare_exit_decision_with_abort_axes -> compute_exit_code, and its annotations block via annotation_report_entries -> _collect_annotations_detailed) still had no way to receive today even after the whole-document fix above -- the tenth and eleventh call sites for the same date-resolution bug class, this time reached through the disposition ledger (policy/disposition_ledger.py's _GateContext gained a today field) and the exit-decision/annotation resolvers rather than the JSON changes-block path; its own regression test reproduces the exact repro Codex gave (a compatible finalized finding and severity.exit_code: 0 beside a stale top-level exit.code: 4 and an ::error annotation). Raised 1507 -> 1609 (same follow-up PR, next Codex round): two more instances of this PR's bug-class pair -- DispositionLedger.with_gate() (the path an existing checker.compare()-built ledger takes) never re-ran resolve_reclassifications/resolve_verdict_classes, so a ledger's reclassified_by/verdict_class overlays stayed stamped at comparison time even after a dated rule expired by render time (the sharing/staleness half, now inside the disposition ledger rather than the snapshot boundary); and resolve_compare_exit_decision's legacy (no severity_config) branch translated the cached result.verdict instead of honoring today at all (the date-resolution half, now in the exit-decision resolver's untouched fallback path) -- each needed its own regression test. Baseline raised 1609 -> 1619 by the one-time `ruff format` pass that made `fmt-check` a real CI gate (see docs/contribute/known-gaps.md). No responsibility was added or moved: the formatter only rewrapped call sites and expanded magic trailing commas, and the file's parsed statement count is byte-for-byte unchanged (verified by comparing `ast.dump` of this file before and after). This is the one bump that \"move responsibility instead of raising the baseline\" cannot be answered by moving anything; physical line counts are formatter-stable from here, because `fmt-check` now gates them. Raised 876 -> 884 (PR #1283, Codex review round 7): `extend_records`, the one API a merge of several comparisons' ledgers needs. A multi-library `compat check` dropped every per-library ledger, so a release whose policy demonstrably acted reported an empty policy trail -- ADR-067's \"every disposition keeps its rule and reason\" lost at the aggregation step. `record()` cannot serve the merge: it is keyed on the live `Change` object a disposition was applied to, and a merge holds the records rather than the objects behind them. The merge itself, and all of its reasoning, lives in the new `policy/disposition_merge.py`; what is here is the seven-line accessor into this class's own private list, which cannot live anywhere else without a cross-module private access. The alternative considered and rejected was a parallel merged-ledger type in the new module, which would have had to duplicate this class's whole query surface (`records`/`__len__`/`__iter__`/`detected_total`/`scope_reasons`/`suppressed_gating_records`) to be usable by the same reporters -- strictly more duplication than eight lines.",
