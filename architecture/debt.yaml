      "rationale": "Existing implementation predates ADR-061 and cannot move safely without a behavior-preserving vertical slice. Raised 1346 -> 1350 (2026-09-04, P2 review, fresh evidence, PR #784): TpiStream gained a truncated field and TypeDatabase gained failed_record_count, both real completeness signals parse_pdb_debug_info now reads to correctly downgrade the basic debug-evidence channel from parsed to partial when the TPI stream stopped short of every promised type index or an individual record's decode raised -- previously silent (a debug-level log line only). Comments were trimmed to the minimum needed to name the finding; the remaining 4 lines are the field/kwarg/increment themselves, not extractable to another module without TypeDatabase reaching back into a sibling module to mutate its own state. Raised again 1350 -> 1381 (2026-09-04, P2 review, fresh evidence): the previous round's failed_record_count only counted an exception _parse_record caught; a *non-exception* early exit -- every individual _parse_struct/_parse_enum/_parse_fieldlist/_parse_procedure/_parse_mfunction/_parse_pointer/_parse_array/_parse_modifier/_parse_bitfield/_parse_arglist/_skip_subrecord returning early on a too-short payload without raising -- was still invisible to it, including a latent LF_VFUNCTAB bounds-check gap this fix also closed (it previously had no length check at all). Every one of those ~11 methods now returns True/False instead of None-implicitly, propagated up through _parse_record into the same failed_record_count. All added comments were trimmed to one line each; the remaining growth is the return True/False statements and completion-tracking variables themselves, which cannot be extracted to another module without breaking each method's own single-responsibility parse-and-report contract. Raised again 1381 -> 1389 (2026-09-04, P2 review, fresh evidence): _read_cstring's own silent (\"\", len(data)) return on a missing NUL terminator was itself invisible to every one of the above callers -- fixed at the source by widening its return to (string, new_offset, terminated), with every one of its 11 call sites (LF_STRUCTURE/LF_UNION/LF_ENUM/LF_ARRAY names, LF_MEMBER/LF_ENUMERATE/LF_ONEMETHOD names, and _skip_subrecord's LF_STMEMBER/LF_NESTTYPE/LF_METHOD name skips) now folding the terminated flag into the same True/False completion contract those methods already return (the two DBI-module-name call sites, which have no completeness channel of their own, just discard the new third value). The growth is the widened docstring plus one extra bound variable and a `if ... else None`/return-substitution at each of the 11 call sites -- not extractable, since each is the one place that already owns its method's completion verdict. Raised again 1389 -> 1399 (2026-09-04, P2 review, fresh evidence): parse_tpi_stream's own per-record bounds check compared a record's declared rec_len against len(data) (the whole stream buffer) rather than end (the TPI header's own declared type-data boundary, header_size + type_bytes) -- a record whose length crossed the declared type section but still fit inside trailing hash/index substream bytes the PDB stream carries past it was accepted, consuming those non-type-record bytes as the record's own payload and potentially reaching ti_end with truncated=False despite never holding that many well-formed records. Fixed by additionally bounding against end. The growth is one added bounds-check term plus a comment naming the finding, both inline in the existing while-loop guard -- not extractable without splitting that guard across modules. Raised again 1399 -> 1405 (2026-09-04, P2 review, fresh evidence): _parse_lf_index's LF_INDEX continuation handling silently returned pos (success) when the referenced type index was missing or named a non-LF_FIELDLIST record -- the continuation's members were never resolved (never added to the caller's members list at all) yet the fieldlist was reported complete. Fixed by returning None (the existing truncation convention) for that shape too. The growth is a new else branch plus a 4-line comment naming the finding -- not extractable, since the branch is the one place that already owns this sub-record's completion verdict. Raised again 1405 -> 1418 (2026-09-04, P2 review, fresh evidence): _parse_fieldlist's own `while pos + 2 <= len(d)` loop guard never examined a trailing tail shorter than 2 bytes -- a sub-record whose 2-byte leaf tag was itself cut to 0-1 bytes exited the loop silently with `complete` still True. Fixed by a post-loop pass that consumes any legitimate trailing LF_PAD* byte(s) and flags anything left over (including a pad claim overshooting the buffer) as truncated. The growth is that post-loop check plus a comment naming the finding -- not extractable, since it is the one place that already owns this fieldlist's own completion verdict. Raised again 1418 -> 1432 (2026-09-04, P2 review, fresh evidence, Codex): a fully-framed LF_STRUCTURE/LF_UNION/LF_ENUM whose field_list_ti named a type index the TPI stream never defined, or one that resolved to a real but non-LF_FIELDLIST record, previously collapsed to the same empty get_fieldlist() result as a struct/enum that legitimately has zero fields (field_list_ti == 0) -- indistinguishable, so pdb_metadata.py silently emitted an empty layout with no completeness signal. Fixed by a new has_fieldlist(ti) method letting callers (in pdb_metadata.py) distinguish the two before trusting an empty get_fieldlist() result. The growth is that one method plus its docstring naming the finding -- not extractable, since it is TypeDatabase's own index that already owns this answer. Raised again 1432 -> 1468 (2026-09-04, P2 review, fresh evidence, Codex): a valid LF_MEMBER/LF_ENUM whose type_ti/utype_ti (or a LF_POINTER/LF_MODIFIER/LF_ARRAY wrapper naming one) referenced no known TPI record previously fell through type_name()/type_size() to a \"<ti:0x...>\" placeholder and a size of 0, one layer below the already-fixed field-list-reference gap -- the individual member/underlying-type reference itself, not the fieldlist pointing to it. Fixed with a new unresolved_type_ref_count property backed by a set populated the first time each method's fallback branch is actually reached (memoization means a cache hit would otherwise silently skip re-recording the gap), checked by pdb_metadata.py after struct/enum extraction. The growth is that tracking set, the property, its docstring, and one new proc/mfunc branch added to _resolve_type_size to keep it symmetric with type_name()'s own (so a legitimately-sizeless function-type reference isn't misflagged) -- not extractable, since each fallback is the one place that already owns its own resolution verdict. Raised again 1468 -> 1487 (2026-09-04, P2 review, fresh evidence, Codex, PR #784): `_read_numeric_leaf()`'s own \"unknown leaf type\" fallback silently substituted 0 for the leaf's real value -- indistinguishable from a legitimately-zero-valued leaf to every caller that only reads back the returned value, so a discarded struct/array byte_size, member/enumerator offset-or-value, or LF_BCLASS/LF_VBCLASS/LF_IVBCLASS base-class offset could leave the enclosing record's own True/False completion verdict (and thus failed_record_count) reading success. Fixed by a keyword-only `unsupported: list[bool] | None = None` out-param, mirroring every other completeness-signal parameter in this same file, folded into each of the eight call sites' own existing True/False (or position-or-None) return convention. The growth is that out-param, its docstring, and one local list plus an `and not .../None if ... else` fold at each call site -- not extractable, since each caller already owns its own record's completion verdict. Raised again 1487 -> 1498 (2026-09-04, P2 review, fresh evidence, Codex, PR #784): type_name()/type_size()'s own `depth > 10` guard substitutes a placeholder (\"...\"/0) the same way an unresolved type index does, one layer up from that already-fixed gap -- a cyclic (or genuinely more-than-ten-level) pointer/modifier/array chain hits this guard instead, but previously did so without adding to _unresolved_type_refs, so unresolved_type_ref_count() could read 0 despite emitting degraded member facts. Fixed by adding to the same accumulator in both guards. The growth is two one-line additions plus a docstring naming the finding -- not extractable, since each guard already owns its own resolution verdict. Raised again 1498 -> 1521 (2026-09-04, P2 review, fresh evidence, Codex, PR #784): `_resolve_type_size()`'s own simple-pointer-mode branch checked `mode == 0x02` for \"near32\", but per CodeView's own SimpleTypeMode encoding (cvinfo.h / llvm/DebugInfo/CodeView/TypeIndex.h) 0x02 is the legacy 16-bit FarPointer mode, not near32 -- the real near32 constant is 0x04 (NearPointer32), which previously fell through to the generic 8-byte default, giving every ordinary 32-bit CodeView pointer member the wrong `byte_size` while `unresolved_type_ref_count` stayed untouched and the basic channel still reported \"parsed\". Fixed by correcting the mode check to 0x04; the sibling `_resolve_type_name()` branch that mirrored the same wrong 0x02 constant was simplified instead (its own `if mode in (0x02, 0x06)` was dead code -- both branches already returned the identical pointer-suffixed string, so any nonzero mode renders as a pointer regardless of which one). The growth is the corrected constant, its docstring citing the two spec sources, and a comment on the remaining unverified legacy 16-bit modes (mirrors this file's own established \"unverified exotic case stays approximate\" precedent, e.g. dwarf_advanced.py's PPC64 .opd case) -- not extractable, since _resolve_type_size already owns this one pointer-size verdict. Raised again 1521 -> 1532 (2026-09-04, P2 review, fresh evidence, round two, Codex, PR #784): the round-one fix corrected near32 (0x04) but left every OTHER pointer mode (0x01/0x02/0x03/0x05/0x07) falling to the same generic 8-byte default it had before -- silently wrong for e.g. NearPointer128 (0x07, really 16 bytes), the exact gap the reviewer named beyond the fixed near32 case. Since every mode 0x01-0x07 is a real, spec-documented width (not an unverified architecture-specific case like PPC64's .opd descriptors), fixed by decoding all of them via a new _SIMPLE_POINTER_MODE_SIZES lookup table; only a genuinely undefined mode value (0x08-0x0F, representable in the type index's 4-bit mode field but not spec-defined) now falls through to the default AND is recorded via unresolved_type_ref_count. The growth is that one lookup table plus its docstring citing the two spec sources, and the two-line lookup-or-mark-unresolved replacing the previous two-branch near32/near64-only check -- not extractable, since _resolve_type_size already owns this one pointer-size verdict. Raised again 1532 -> 1551 (2026-09-04, P2 review, fresh evidence, Codex, PR #784): a valid CodeView simple kind this module's own _SIMPLE_TYPE_NAMES/_SIMPLE_TYPE_SIZES tables don't cover (e.g. T_HRESULT 0x08) previously rendered as an opaque \"<simple:0x..>\" placeholder name and a size of 0 -- the same kind of substitution the ti>=_TI_BASE unresolvable-reference branch already records -- without ever recording it via unresolved_type_ref_count, so a struct/enum whose member only degrades via a missing simple-kind mapping (never a missing TPI entry or an undefined pointer mode, both already fixed) left the basic channel reading \"parsed\" despite an actually-degraded field. Fixed by recording every unmapped kind in both _resolve_type_name and _resolve_type_size independently (the name and size caches are populated separately, so either can be the first/only call for a given ti). The growth is those two checks plus their explanatory comments -- not extractable, since each resolver already owns its own resolution verdict.",
