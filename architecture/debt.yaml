ump that \"move responsibility instead of raising the baseline\" cannot be answered by moving anything; physical line counts are formatter-stable from here, because `fmt-check` now gates them. Raised 876 -> 884 (PR #1283, Codex review round 7): `extend_records`, the one API a merge of several comparisons' ledgers needs. A multi-library `compat check` dropped every per-library ledger, so a release whose policy demonstrably acted reported an empty policy trail -- ADR-067's \"every disposition keeps its rule and reason\" lost at the aggregation step. `record()` cannot serve the merge: it is keyed on the live `Change` object a disposition was applied to, and a merge holds the records rather than the objects behind them. The merge itself, and all of its reasoning, lives in the new `policy/disposition_merge.py`; what is here is the seven-line accessor into this class's own private list, which cannot live anywhere else without a cross-module private access. The alternative considered and rejected was a parallel merged-ledger type in the new module, which would have had to duplicate this class's whole query surface (`records`/`__len__`/`__iter__`/`detected_total`/`scope_reasons`/`suppressed_gating_records`) to be usable by the same reporters -- strictly more duplication than eight lines. 1271 -> 1285 (plan slice 7o, review round 4): this detector emits both experimental-namespace kinds for functions and for types, so it is the one place that knows which, and it now states it on each finding. The two-entry `_ENTITY_FOR_KIND_LABEL` mapping exists because the detector's own `kind_label` and the display dimension are different vocabularies -- the former spells a function `declaration`, the latter `function` -- so reusing one as the other resolved to nothing at all. Not movable: a detector stating what it observed is exactly this module's job. Raised further 1285 -> 1296 (review round 6): `_collect_versioned_entries` pools functions and record types, so `inline_namespace_version