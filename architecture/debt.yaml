haring this fallback (e.g. `int A::*` vs `long A::*`, both bare DW_TAG_ptr_to_member_type with no name) resolve to the identical tag-string placeholder on both sides, reading as NO_CHANGE with evidence_state=\"parsed\", silently masking a real field-type change. Fixed by threading `incomplete` into _compute_fallback_type_info (its one call site already had the parameter available) and appending only on the no-DW_AT_name branch (a fallback tag that DOES carry a real name is genuine information, not a placeholder). The growth is that one parameter, its docstring, and the append -- not extractable, since _compute_fallback_type_info already owns its own resolution verdict. Raised again 827 -> 838 (2026-09-04, P2 review, fresh evidence, Codex, PR #784): a named struct/union member DIE with no DW_AT_type attribute at all -- truncated/malformed debug info, not a legitimate type-less case, since a real member always carries DW_AT_type -- previously fell through _resolve_type's own \"DW_AT_type not in die.attributes\" branch with no completeness signal, since that branch has no reference to resolve and so never reaches the except-branch accounting the sibling malformed-reference case already fixed. Fixed by marking it at _process_member (the one call site that knows a type is mandatory) rather than widening _resolve_type's own no-type branch, which stays generic for its other hypothetical callers (a return type or a \"...\" vararg parameter, where a missing type is legitimate). The growth is that one check plus its explanatory comment -- not extractable, since _process_member already owns this one member's completion verdict. Raised again 838 -> 850 (2026-09-04, P2 review, fresh evidence, Codex, PR #784): _compute_fallback_type_info's own incomplete-marking was gated inside its \"if not name\" branch, so a NAMED tag reaching this same no-dedicated-branch fallback (e.g. a real GCC-compiled std::nullptr_t field, DW_TAG_unspecified_type named \"decltype(nullptr)\", which often carries no DW_AT_byte_size at all) was never flagged, even though this module has no more genuine understanding of that tag's own type semantics than the unnamed case -- only a raw best-effort name/size pair, and _attr_int can't tell a genuinely-absent DW_AT_byte_size from an explicit 0. Fixed by marking incomplete unconditionally on reaching this fallback, moved out of the name-conditional branch. The growth is that unconditional call plus its docstring explaining why a name alone doesn't make the fallback's output trustworthy -- not extractable, since _compute_fallback_type_info already owns this one DIE's own fallback-resolution verdict. Raised again 850 -> 867 (2026-09-04, two sibling Codex review findings, PR #784): (1) P2 finding, 'Mark type-less anonymous members incomplete' -- _expand_anonymous_member's own \"DW_AT_type not in die.attributes\" branch returned [] with no completeness signal, silently dropping that anonymous struct/union member's nested layout while evidence_state still reported \"parsed\" -- the identical gap _process_member's own named-member equivalent was already fixed for; a real anonymous aggregate member always names its own struct/union type, so this is genuinely malformed debug info, not a legitimate type-less case. Fixed by marking `incomplete` there too. (2) 'Preserve DWARF session-open failures' (the same PR #784 finding fixed in dwarf_advanced.py and dwarf_unified.py above): parse_dwarf_metadata's own bare `except (ELFError, OSError, ValueError)` branch returned a plain DwarfMetadata() on a genuine parse failure, indistinguishable from evidence_state=\"not_available\" for a file that was never valid DWARF to begin with. Fixed by returning DwarfMetadata(evidence_state=\"failed\") from that except clause. The growth is one incomplete-marking check plus its explanatory comment, and one changed constructor call plus its explanatory comment -- neither extractable, since each site already owns its own resolution/open-failure verdict.",
