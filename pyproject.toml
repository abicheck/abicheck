[build-system]
requires = ["setuptools>=68,<75"]
build-backend = "setuptools.build_meta"

[project]
name = "abicheck"
version = "0.5.0"
description = "ABI compatibility checker for C/C++ shared libraries"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Nikolay Petrov", email = "sfasp.post@gmail.com"}]
requires-python = ">=3.10"
keywords = ["abi", "api", "compatibility", "checker", "shared-library", "elf", "pe", "macho", "dwarf", "castxml"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "click>=8.0",
    "rich-click>=1.7",    # progressive-disclosure --help option grouping (G21.8/M1)
    "pyyaml>=6.0",
    "defusedxml>=0.7.1",
    "pyelftools>=0.29",   # ELF/DWARF parsing
    "packaging>=21.0",    # Version comparison for suppression version_range
    "pefile>=2023.2.7",   # Windows PE/COFF parsing
    "macholib>=1.16",     # macOS Mach-O parsing
    # Core snapshot storage (ADR-059): first-class `.abicheck.json.zst`
    # support for `dump`/`compare`/`scan --against`/baseline-set snapshots
    # needs one zstd backend that works identically across every supported
    # Python (3.10-3.14 have no stdlib zstd) and OS, without depending on a
    # system `zstd` binary. Previously scoped only to the `validation`
    # extra (conda-forge `.conda` archive extraction); that usage still
    # applies but no longer needs its own extra now that it's core.
    "zstandard>=0.21",
]

[project.scripts]
abicheck = "abicheck.cli:main"
abicheck-cc = "abicheck.cc_wrapper:main"

[project.urls]
Repository = "https://github.com/abicheck/abicheck"
Documentation = "https://abicheck.github.io/abicheck/"
"Bug Tracker" = "https://github.com/abicheck/abicheck/issues"
Changelog = "https://github.com/abicheck/abicheck/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "pytest-xdist>=3.0",
    # Per-test hang safety valve (see [tool.pytest.ini_options]'s `timeout`
    # below) -- not a perf gate, see that setting's own comment for the
    # distinction.
    "pytest-timeout>=2.3",
    "filelock>=3.0",
    "hypothesis>=6.0",
    # Pinned exactly, and kept in lockstep with .pre-commit-config.yaml's
    # `rev:` — tests/test_toolchain_pins.py asserts the two agree.
    #
    # `ruff>=0.3` meant CI resolved whatever was newest on the day it ran while
    # pre-commit pinned v0.9.0, so the lint gate's *rules* differed by entry
    # point: 0.9.0 flags a pre-existing F811 in cli_buildsource_helpers.py that
    # current ruff does not. A lint gate whose verdict depends on when it ran
    # is not a gate. Pinned forward rather than back for that reason — moving
    # to 0.9.0 would red the lint lane on existing code.
    #
    # Bumping is a deliberate, reviewable change: update both files together
    # and run `python scripts/verify.py --profile fast --only lint,fmt-check`.
    "ruff==0.16.3",
    # Pinned exact: an unpinned mypy (`mypy>=1.0` + `pip install mypy` in CI) made the
    # type gate non-reproducible — 2 errors slipped onto a branch and only surfaced on a
    # newer mypy (field-eval CI gap). Bump deliberately when adopting a new mypy.
    "mypy==1.19.1",
    "types-PyYAML",
    "jsonschema>=4.0",
    "scriv[toml]>=1.5",  # changelog-fragment tool, see changelog.d/README.md
]
# Real-world validation harness (validation/): fetches + extracts conda-forge
# packages. Modern conda-forge ships `.conda` (zstd-compressed) artifacts, so
# this lane also needs a zstd backend -- `zstandard` is now a core dependency
# (ADR-059) and this extra is kept empty rather than removed, so an existing
# `pip install "abicheck[validation]"` invocation in a script/CI job doesn't
# start failing on an unknown extra.
validation = []
# Mirrors [tool.pixi.feature.docs.pypi-dependencies] and the `lint-and-types`
# CI job's docs install — `pip install -e ".[dev,docs]"` is what
# `scripts/verify.py --profile pr`'s docs-build step needs to actually run
# instead of skipping (CLAUDE.md "M0-3": a skip must never be mistaken for a
# pass — see verify.py's incomplete-run warning).
docs = [
    "mkdocs",
    "mkdocs-material",
    "pymdown-extensions",
    "mkdocs-redirects",
]
# Mirrors [tool.pixi.feature.dist.pypi-dependencies] and the `fair-metadata`
# CI job's install — `pip install -e ".[dev,dist]"` is what
# `scripts/verify.py --profile pr`'s distribution-build step needs to
# actually run instead of skipping (same M0-3 rationale as `docs` above).
dist = [
    "build",
    "twine",
]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
# ``unused-ignore`` flips on/off depending on the mypy + pyelftools combo
# the developer or CI runner happens to have installed (different
# Python minor versions, different bundled stubs). Disabling it globally
# keeps the `# type: ignore[...]` comments scattered throughout the
# pyelftools call sites portable across environments without forcing a
# strict version pin on every contributor.
disable_error_code = ["unused-ignore"]

[[tool.mypy.overrides]]
# pyelftools has no type stubs or py.typed marker — all its APIs are untyped.
# Disable strict checks for modules that directly call pyelftools APIs.
module = [
    "abicheck.appcompat",
    "abicheck.elf_metadata",
    "abicheck.pe_metadata",
    "abicheck.macho_metadata",
    "abicheck.dwarf_metadata",
    "abicheck.dwarf_advanced",
    "abicheck.dwarf_unified",
    "abicheck.dwarf_presence",
    "abicheck.dumper",
    "abicheck.package",
    "abicheck.pdb_parser",
    "abicheck.pdb_metadata",
    "abicheck.pdb_utils",
    "abicheck.sycl_metadata",
    "abicheck.binary_fingerprint",
    "abicheck.buildsource.compiler_record",
]
disallow_untyped_calls = false
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
# Click decorators (@click.command, @click.option, etc.) are untyped.
# ``compat/cli.py`` additionally subclasses ``click.Group`` (typed as Any)
# and threads click-managed list[str] values through helper accessors, so
# we also relax ``no-any-return`` / ``misc`` there. ``cli_dump_helpers``
# similarly subclasses ``click.ClickException`` (typed as Any ->
# "cannot subclass Any" / ``misc``) for ``DumpDepthNotSatisfiedError``.
module = [
    "abicheck.cli",
    "abicheck.cli_resolve",
    "abicheck.cli_aggregate",
    "abicheck.cli_appcompat",
    "abicheck.cli_compare_release",
    # `cli_compare_release_matrix`/`cli_compare_release_pairwise` (G38 Phase
    # 15 file-split prerequisite) declare no Click decorator of their own --
    # unlike every other entry in this override, they need it only because
    # they call `.cli`'s own helpers (`_normalize_binary_input`,
    # `_safe_write_output`, ...), whose return types are themselves Any
    # under `cli`'s identical override; without the same relaxation here,
    # mypy reports `Any? not callable` (`misc`) at each call site (CodeRabbit
    # review on PR #973 questioned this entry; reproduced by removing it and
    # re-running mypy before restoring it).
    "abicheck.cli_compare_release_matrix",
    "abicheck.cli_compare_release_pairwise",
    "abicheck.cli_debian_symbols",
    "abicheck.cli_baseline",
    "abicheck.cli_buildsource",
    "abicheck.cli_dump_helpers",
    "abicheck.cli_graph",
    "abicheck.cli_inputs",
    "abicheck.cli_plugin",
    "abicheck.cli_pr_comment",
    "abicheck.cli_probe",
    "abicheck.cli_stack",
    "abicheck.cli_suggest",
    "abicheck.cli_surface",
    "abicheck.compat.cli",
    # ADR-061 Phase 4 moved `cli.py`'s command bodies and shared runtime here;
    # they carry the same click-decorator surface `cli` itself did.
    "abicheck.frontends.cli.commands.compare",
    "abicheck.frontends.cli.commands.dump",
    "abicheck.frontends.cli.runtime",
]
disallow_untyped_decorators = false
disable_error_code = ["no-any-return", "misc"]

[[tool.mypy.overrides]]
# ``cli_scan`` uses click decorators (untyped → ``no-any-return``/``misc``, as
# above) AND imports ``yaml`` for the optional ``--risk-rules`` profile (stubs
# may be absent → ``import-untyped``). One block so the codes don't conflict.
# ``cli_scan_baseline`` is the extracted ``--baseline``/``--estimate`` sub-flow
# (same ``yaml`` + engine-``Any`` surface), so it shares the same relaxations.
# ``cli_project`` (G30 P1.1/P1.4/P1.5, consolidated by ADR-054) reads
# ``.abicheck.yml`` directly for its ``project validate``/``plan`` commands,
# same ``yaml`` import.
module = [
    "abicheck.cli_scan",
    "abicheck.cli_scan_baseline",
    "abicheck.cli_project",
]
disallow_untyped_decorators = false
disable_error_code = ["no-any-return", "misc", "import-untyped"]

[[tool.mypy.overrides]]
# ``PolicyFileParam`` subclasses ``click.ParamType``. Depending on
# the installed click's type stubs, mypy treats the base either as ``Any``
# (-> ``misc``: "cannot subclass Any") or as a generic needing a type argument
# (-> ``type-arg``). Suppress both so the module stays portable across click /
# mypy versions without a runtime ``ParamType[...]`` subscription.
module = ["abicheck.frontends.cli.options.params"]
disallow_untyped_decorators = false
disable_error_code = ["no-any-return", "misc", "type-arg"]

[[tool.mypy.overrides]]
# types-PyYAML stubs may not be found in all environments;
# the package is listed in [project.optional-dependencies.dev].
module = [
    "abicheck.policy_file",
    "abicheck.suppression",
    "abicheck.suppression_yaml",
    "abicheck.environment_matrix",
    "abicheck.probe_harness",
    "abicheck.bundle",
    "abicheck.bundle_manifest",
    "abicheck.buildsource.build_config_io",
    "abicheck.buildsource.extractor_manifest",
    "abicheck.buildsource.inline",
    "abicheck.buildsource.project_targets",
    "abicheck.buildsource.toolchain_bindings",
    "abicheck.cli_compare_receipt",
    # ADR-061 Phase 4 moved this out of the flat root into `workflows/`; the
    # override did not follow it, so `mypy abicheck/` reports one error on a
    # clean `main` in any environment where the stubs are not visible.
    "abicheck.workflows.scan_config",
]
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
# Same stubless-PyYAML situation as the block above, plus a local
# ``class _StrictLoader(yaml.SafeLoader)`` (ADR-050 D3 duplicate-key
# rejection) — without stubs ``yaml.SafeLoader`` types as ``Any``, so
# subclassing it also trips ``misc`` ("cannot subclass Any").
# ``compatibility_evaluation_packs`` (ADR-049 D8 pack-manifest loader) adds
# its own, independent ``_StrictLoader`` for the identical reason;
# ``abicheck.impact.use_cases``'s ``_DuplicateKeyCheckingLoader`` (Codex
# review, G29 Phase 4 slice 2) is a fourth, independent instance of the
# identical pattern.
module = [
    "abicheck.dump_manifest",
    "abicheck.compatibility_evaluation_packs",
    "abicheck.impact.use_cases",
]
disable_error_code = ["import-untyped", "misc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: requires castxml, gcc/g++ installed",
    "libabigail: requires abidiff + gcc/g++ — libabigail parity tests",
    "abicc: requires abi-compliance-checker + gcc/g++ — ABICC parity tests",
    "msvc: requires MSVC cl.exe (Windows) — MSVC+PDB end-to-end lane",
    "slow: marks tests as slow (hypothesis / performance benchmarks)",
    "golden: golden-output snapshot tests",
]
# Global per-test hang safety valve (pytest-timeout), not a perf regression
# gate -- CI's own "Test-time report" step already says a *hard* wall-time
# gate would be flaky given CI-runner variance, and this isn't one: 600s is
# ~3x the slowest legitimate test observed in this suite (the production-
# scale snapshot-compression round trips in
# tests/test_snapshot_compression_public_api_scale.py, ~90-195s each), so it
# should never fire on ordinary CI variance. What it exists to catch is a
# genuine stuck test -- e.g. the real incident this was added for, where a
# macOS unit-tests leg sat inside a single non-`slow` compression test for
# ~20 minutes with no progress until the whole 30-minute job was cancelled,
# producing zero diagnostic signal about which test or why. pytest-timeout
# kills (or, under `-n`/xdist, reports and moves past) just that one test and
# dumps its stack, so the job's other tests still run and the log names the
# actual offender instead of a bare "operation was canceled". Uses
# pytest-timeout's own platform default `timeout_method` (`signal` on
# Linux/macOS -- the two platforms that actually hit this -- `thread` on
# Windows) rather than forcing one globally.
timeout = 600

[tool.setuptools.packages.find]
include = ["abicheck*"]

[tool.setuptools.package-data]
"abicheck.schemas" = ["*.json"]
"abicheck.policies" = ["*.yaml"]
# kinds.pyi (the ChangeKind mypy stub -- see kinds.py's own docstring) needs
# an explicit entry: automatic .pyi inclusion was only added in setuptools 69,
# while build-system.requires above still permits setuptools>=68. Without
# this, a wheel built with 68 would silently omit the stub, leaving every
# ChangeKind.FOO access unresolved for anyone installing from that wheel.
"abicheck.model.change_catalog" = ["*.pyi"]

[tool.coverage.run]
branch = true
source = ["abicheck"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.scriv]
# Changelog-fragment tool (avoids everyone editing the same CHANGELOG.md
# "Unreleased" section — see changelog.d/README.md and CONTRIBUTING.md).
format = "md"
fragment_directory = "changelog.d"
new_fragment_template = "file: fragment_template.md.j2"
categories = ["Added", "Changed", "Deprecated", "Removed", "Fixed", "Performance", "Security", "Documentation"]
output_file = "CHANGELOG.md"
md_header_level = "2"
entry_title_template = "[{{ version }}] — {{ date.strftime('%Y-%m-%d') }}"
version = "literal: pyproject.toml: project.version"

[tool.mutmut]
# Mutmut v3 config — mutation testing for core detector logic.
# Usage:
#   mutmut run                       # full run
#   mutmut results                   # view surviving mutants
#   mutmut show <id>                 # show a specific mutant
#
# NOTE on key names: mutmut 3.x renamed these. The v2 spellings this file used
# to carry (`paths_to_mutate`, `tests_dir`, `runner`) are not merely deprecated
# — `tests_dir = "tests/"` (a string, where 3.x wants a list) makes `mutmut run`
# abort with a TypeError before generating a single mutant, and `runner` is not
# a recognised key at all in 3.x, so the marker exclusion below was being
# silently dropped and every mutant would have re-run the integration and slow
# lanes. Both confirmed against mutmut 3.7.0. Keep these 3.x spellings.
#
# Focus on the core detection modules where surviving mutants indicate
# test gaps that could allow regressions:
# `source_paths` is what gets **copied** into `mutants/`, and mutmut runs the
# suite from inside that directory — so it has to be the whole importable
# package. Listing individual files here produced a `mutants/abicheck/` with
# no `__init__.py` and 14 of 272 modules, which shadows the real package as a
# namespace package: `import abicheck` resolved to that partial copy and
# `abicheck.__version__` / `abicheck.compat` were simply absent, so mutmut
# aborted at "failed to collect stats" before generating a single result.
# (The editable install cannot save it — its finder is *appended* to
# sys.meta_path, so the path finder reaches `mutants/` first.)
#
# `only_mutate` is the actual scope: the core detector logic where a
# surviving mutant means a test gap. Everything else is copied verbatim so
# imports resolve, and is never mutated.
source_paths = ["abicheck"]
# mutmut runs the suite with `mutants/` as the working directory, so a test
# that reads a repository file (`examples/ground_truth.json`,
# `.github/workflows/*.yml`, `scripts/*.py`, `docs/**`) resolves it relative to
# that copy and fails at collection — 37 collection errors on the first run
# that got this far, each of them a `FileNotFoundError`, and any one of them
# aborts the whole lane before a single mutant is measured. These are
# copy-only: nothing here is walked for mutation. Listing a path that does not
# exist is harmless (mutmut skips it), so this is deliberately generous rather
# than minimal — the failure mode of a missing entry is a dead lane.
also_copy = [
    ".github",
    ".pre-commit-config.yaml",
    "AGENTS.md",
    "CHANGELOG.md",
    "CLAUDE.md",
    "CONTRIBUTING.md",
    "README.md",
    # Real repository inputs that tests read directly, not just directories.
    "repo_facts.json",
    "action",
    "action.yml",
    "actions",
    "agent-evals",
    "changelog.d",
    "contrib",
    "docs",
    "eval",
    "examples",
    "mkdocs.yml",
    "pixi.lock",
    "scripts",
    "skills-src",
    # The three committed publication trees `scripts/gen_agent_skills.py`
    # generates from `skills-src/`. `test_gen_agent_skills.py` compares them
    # against it, so copying only the source reports every generated file as
    # missing (Codex review).
    ".agents",
    ".claude",
    ".gemini",
    "validation",
]
only_mutate = [
    "abicheck/diff_symbols.py",  # function/variable/parameter detectors
    "abicheck/diff_types.py",  # type/enum/union/typedef detectors
    "abicheck/diff_platform.py",  # ELF/DWARF/PE/Mach-O detectors
    "abicheck/diff_vtable_layout.py",  # G23 B2 vtable-group reconstruction
    "abicheck/diff_filtering.py",  # deduplication and redundancy logic
    "abicheck/checker_policy.py",  # verdict classification
    "abicheck/idioms.py",  # ADR-027 idiom & anti-pattern recognisers
    "abicheck/pattern_verdicts.py",  # ADR-027 A4 verdict modulation
    "abicheck/surface_graph.py",  # ADR-027 declaration-graph substrate
    "abicheck/finding_identity.py",  # canonical/normalized finding identity
    "abicheck/name_classification.py",  # internal/public name classification
    "abicheck/suppression.py",  # suppression rule matching
    "abicheck/policy/selectors.py",  # ADR-063 D10: shared selector-matching grammar (moved out of suppression.py)
    "abicheck/policy/selectors_namespace_glob.py",  # namespace-glob compile/match (moved out of suppression.py)
    "abicheck/snapshot_io.py",  # ADR-059 storage envelope (gzip/zstd)
    "abicheck/serialization.py",  # snapshot (de)serialization
]
pytest_add_cli_args_test_selection = ["tests/"]
pytest_add_cli_args = [
    "-x",
    "-q",
    # `--tb=line`, not `--tb=no`: with `-x`, the first failure ends the whole
    # lane, and "failed to collect stats" with no traceback says nothing about
    # which assertion broke. One line per failure costs nothing on the mutant
    # runs (where failures are the expected outcome and are counted, not read)
    # and is the difference between a diagnosable lane and a guess.
    "--tb=line",
    "-m",
    "not integration and not libabigail and not abicc and not slow",
    # Repository-structure tests, excluded because they cannot run from
    # `mutants/` at all: they read the real repository — its git history, the
    # generated agent-skill trees, the vendor instruction adapters — and the
    # copy is not a git repo and does not carry those paths. `-x` means any
    # one of them aborts the whole lane before a mutant is measured.
    #
    # Excluding them costs no measurement: none imports a mutated module, so
    # none can kill a detector mutant, and
    # tests/test_mutation_workflow_contract.py keeps that true — if one of
    # these ever starts importing one, the exclusion stops being free and
    # that test says so.
    # Two AI-readiness tests validate the tree they run in, and a mutants
    # tree is by construction full of 1M-line generated files — they cannot
    # pass there and are not about the detector core. Deselected rather than
    # ignored, so the rest of that file still runs.
    "--deselect=tests/test_ai_readiness.py::test_no_hard_file_size_violations",
    "--deselect=tests/test_ai_readiness.py::test_main_returns_zero_on_clean_tree",
    "--ignore=tests/test_action_check_target.py",
    # Split out of the file directly above for a `no_growth` file-size
    # reason (its own docstring), inheriting the identical re-entrant-
    # subprocess class via a shared `_run_finalize` helper imported from
    # it -- the split predates this entry and was never added alongside
    # it (Codex review, PR #1016, discovered because this PR's diff
    # touches enough tests/ paths to trip --scope-run-to-diff's own
    # "refuse to scope" fallback to a full, unscoped run, exercising this
    # gap for the first time; not caused by anything this PR's own diff
    # changed).
    "--ignore=tests/test_action_check_target_explicit_id.py",
    "--ignore=tests/test_action_collect_facts.py",
    # Same "subprocess re-enters the mutated tree with no mutmut config"
    # failure as the two entries above, discovered via this repo's own G38
    # bundle-facts PR (the first to trigger this path-filtered lane against
    # a serialization.py change with this test present). Its
    # TestRealAbicheckAnnotationsReachTheActionLog class shells out to
    # `action/run.sh`, which execs the real `abicheck` console script from a
    # scratch `cwd` — mutmut's PYTHONPATH-based redirection into `mutants/`
    # follows that subprocess, but the mutated tree's import machinery then
    # calls mutmut's own config loader fresh in that process, which can't
    # find `pyproject.toml`'s `[tool.mutmut]` section from a temp directory
    # and aborts with "Could not figure out where the code to mutate is."
    # before the compare command ever runs — failing the whole `-x` lane.
    "--ignore=tests/test_action_run_sh_annotate_renderer.py",
    # Same failure class as the entry immediately above, one more real
    # `action/run.sh` + real `abicheck` binary subprocess test tripped by
    # this same G38 bundle-facts PR once it touched a second
    # mutation-scoped module (bundle_signature_evidence.py):
    # TestRealAbicheckWritesPersistedAnnotationsForADirectoryOperand shells
    # out to a real `abicheck compare` from a scratch cwd the identical way,
    # and the mutant tree's re-entrant subprocess can't find
    # `pyproject.toml`'s `[tool.mutmut]` section from there either.
    "--ignore=tests/test_action_run_sh_compare_pr_json_write.py",
    "--ignore=tests/test_publish_baseline_upload_step.py",
    "--ignore=tests/test_publish_baseline_upload_step_evidence.py",
    "--ignore=tests/test_publish_baseline_upload_step_generation.py",
    "--ignore=tests/test_restore_git_mtimes.py",
    "--ignore=tests/test_reusable_workflows.py",
    # Same re-entrant-subprocess class as `test_reusable_workflows.py`
    # immediately above and `test_reusable_workflows_project_evidence.py`
    # below -- `test_precheck_script_threads_explicit_id_into_check_id`
    # drives check-project.yml's "Synthesize pre-check operational-error
    # report" step via a real `subprocess.run(["bash", "-c", script],
    # cwd=tmp_path, env={**os.environ, ...})`, so it inherits mutmut's own
    # PYTHONPATH into that scratch cwd the identical way. First surfaced by
    # PR #1033 (this PR touched enough `tests/` paths to trip
    # `--scope-run-to-diff`'s "refuse to scope" fallback to a full,
    # unscoped run, same discovery path as the `test_agent_evals.py` entry
    # below) as a bare `KeyError: 'check-id'` aborting `mutmut run`'s
    # baseline collection before a single mutant was measured -- this file
    # was simply added after its two siblings and missed here. Free
    # exclusion, no `_ACCEPTED_KILL_LOSS` entry needed: it imports no
    # `only_mutate` module, directly or via `test_reusable_workflows`
    # (confirmed by grep), the same as the sibling immediately above.
    "--ignore=tests/test_reusable_workflows_explicit_id.py",
    # Fourth member of the same re-entrant-subprocess class as the three
    # entries above: test_resolver_selects_only_the_current_targets_evidence
    # runs check-project.yml's "Resolve candidate binary/binaries" step
    # from a scratch cwd, and that step's own child imports `abicheck` --
    # resolved to the mutant tree through the inherited PYTHONPATH, so a
    # mutated module's trampoline pulls in `mutmut.__main__`, whose config
    # load cannot find `[tool.mutmut]` from that cwd and raises
    # FileNotFoundError. Reproduce in one line, without mutmut:
    #   PYTHONPATH=<mutants dir> python -m pytest \
    #     tests/test_reusable_workflows_project_evidence.py -k resolver_selects
    # The test is sound and keeps running in every unit lane; only
    # mutmut's clean-test phase cannot host it. Its kill cost is recorded
    # in tests/test_mutation_workflow_contract.py::_ACCEPTED_KILL_LOSS.
    "--ignore=tests/test_reusable_workflows_project_evidence.py",
    "--ignore=tests/test_skill_eval_pack.py",
    "--ignore=tests/test_skill_eval_scenarios.py",
    "--ignore=tests/test_verify_profiles.py",
    # Same "reads the real repository" class as the entries above: its
    # `_repo_reader_scan` fixture does one full `abicheck/**/*.py` AST walk
    # rooted at `Path(__file__).resolve().parent.parent`, asserting the real
    # repository has no unlisted `fact-field-readers` violation — not
    # something a `mutants/` copy can answer for itself. No mutation-kill
    # cost: it imports no `only_mutate` module (confirmed by grep), only
    # `scripts.check_ai_readiness`/`scripts.fact_field_readers`, matching
    # this file's own "costs no measurement" rule for every entry above.
    "--ignore=tests/test_fact_field_readers.py",
    # Same "reads the real repository" class as the entry immediately
    # above, one file over: `test_no_violation_in_real_repo` calls
    # `check_fact_detector_misuse()`, which does its own full
    # `abicheck/**/*.py` AST walk rooted at `_REPO_ROOT = Path(__file__).
    # resolve().parent.parent` to assert the real repository has no
    # unlisted `fact-detector-misuse` violation. A normal run completes
    # this in well under a minute (~52s observed); discovered here because
    # under `mutmut run`'s baseline collection specifically it instead ran
    # past pytest-timeout's 600s ceiling and aborted the whole lane with
    # `-x` before a single mutant was measured (PR #1036) -- consistent
    # with this same class of test being unsuited to mutmut's clean-test
    # phase, not a defect in the scan itself (every other lane exercising
    # it stays fast). No mutation-kill cost: it imports no `only_mutate`
    # module (confirmed by grep), only `scripts.check_ai_readiness`/
    # `scripts.fact_detector_misuse`, matching this file's own "costs no
    # measurement" rule for every entry above.
    "--ignore=tests/test_fact_detector_misuse.py",
    # Same class again, a fourth independent trigger site (PR #1016, this
    # PR's own diff -- discovered the same way as the `test_action_check_
    # target*`/`test_action_collect_facts.py` entries above: this PR's diff
    # touches enough `tests/` paths to trip `--scope-run-to-diff`'s "refuse
    # to scope" fallback to a full, unscoped run, exercising a pre-existing
    # gap this PR's own changes did not create). `test_manifest_base_commit_
    # exists_in_history` shells out to a real `git cat-file -e <sha>`
    # against `ROOT = Path(__file__).resolve().parent.parent` to confirm
    # each agent-eval task manifest's `base_commit` is a real, known commit;
    # it already tolerates a *shallow* checkout (skips rather than fails),
    # but mutmut's clean-test phase runs from a context where `git
    # rev-parse --is-shallow-repository` doesn't report "true" either (it's
    # not a shallow clone of this repo at all), so the shallow-fallback
    # never engages and the hard `assert proc.returncode == 0` fires for a
    # commit this context simply can't see. No mutation-kill cost: this
    # file imports no `only_mutate` module (confirmed by grep) -- only
    # stdlib, `jsonschema`, `pytest`, and `agent-evals/run_task.py` loaded
    # by path, none of which is mutated.
    "--ignore=tests/test_agent_evals.py",
]

# ---------------------------------------------------------------------------
# pixi (https://pixi.sh) — conda-forge-based dev environments.
#
# `pip install -e ".[dev]"` (see CONTRIBUTING.md) remains fully supported;
# pixi is an alternative that also manages the *system* tools (castxml, a
# C/C++ compiler, libabigail, abi-compliance-checker) that CONTRIBUTING.md's
# "Option A: conda-forge" section previously had to install by hand.
#
#   pixi install            # base dev environment (lint/type/unit-test tools)
#   pixi run test            # fast unit-test lane (same as CLAUDE.md quick reference)
#   pixi run check            # lint + format-check + typecheck + test + ai-readiness
#   pixi run -e integration test-integration   # + castxml/compiler (needs `integration` env)
#   pixi run -e parity test-libabigail          # + libabigail (linux-64 only)
#   pixi run -e parity test-abicc                # + abi-compliance-checker (linux-64 only)
#   pixi run -e docs docs-build                   # mkdocs --strict build
# ---------------------------------------------------------------------------
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[tool.pixi.pypi-dependencies]
abicheck = { path = ".", editable = true }

# All of the tasks below except `fmt`/`test-cov` (which mutate or vary a check
# rather than gate it) route through scripts/verify.py, the single
# implementation shared by pre-commit, CI, and contributor docs (CLAUDE.md
# "M0-3") — so `pixi run check` and the required CI checks can never drift
# apart again.
[tool.pixi.feature.dev.tasks]
verify-fast = "python scripts/verify.py --profile fast"
verify-pr = "python scripts/verify.py --profile pr"
verify-full = "python scripts/verify.py --profile full"
lint = "python scripts/verify.py --profile fast --only lint"
fmt = "ruff format abicheck/ tests/"
fmt-check = "python scripts/verify.py --profile fast --only fmt-check"
test = "python scripts/verify.py --profile fast --only unit-fast"
test-cov = "pytest tests/ -m \"not integration and not libabigail and not abicc and not slow and not golden\" --cov=abicheck --cov-report=term-missing"
typecheck = "python scripts/verify.py --profile fast --only typecheck"
ai-readiness = "python scripts/verify.py --profile pr --only ai-readiness"
# `pixi run check` == the exact PR gate (scripts/verify.py --profile pr), not
# a hand-picked subset — this is the definition-of-done contributors/agents
# should trust.
check = "python scripts/verify.py --profile pr"

# Shared castxml + C/C++ compiler, needed by both `integration` (header/DWARF
# parsing) and `parity` (feeding abidiff/abi-compliance-checker ABI dumps).
# Not offered for win-64: MSVC isn't installable from conda-forge alone (see
# the `windows-msvc` CI lane, which sets up cl.exe separately via
# ilammy/msvc-dev-cmd) — Windows contributors run the base `dev` environment.
[tool.pixi.feature.native-toolchain]
platforms = ["linux-64", "osx-64", "osx-arm64"]

[tool.pixi.feature.native-toolchain.dependencies]
castxml = "*"
c-compiler = "*"
cxx-compiler = "*"

# Explicit-major-version toolchain features for action.yml's
# dependency-source=conda-forge-gcc14/conda-forge-clang20 (G30 toolchain-profile
# audit §5 "environment split" — gcc14/clang20 pin an exact compiler family and
# major version, unlike `native-toolchain`'s unbound c-compiler/cxx-compiler
# metapackages, which resolve to "whatever conda-forge's default toolchain
# generation currently is" and can roll forward silently between `pixi lock`
# refreshes. Same castxml + platform restriction as native-toolchain, standalone
# (not derived from it) so each has its own solve-group and doesn't couple an
# explicit-version pin's resolution to the floating one's.
[tool.pixi.feature.native-toolchain-gcc14]
# linux-64 only: conda-forge's gcc/gxx packages don't build for macOS (macOS
# conda-forge environments use clang as the system compiler instead — see
# native-toolchain-clang20 below).
platforms = ["linux-64"]

[tool.pixi.feature.native-toolchain-gcc14.dependencies]
castxml = "*"
gcc = "14.*"
gxx = "14.*"

[tool.pixi.feature.native-toolchain-clang20]
platforms = ["linux-64", "osx-64", "osx-arm64"]

[tool.pixi.feature.native-toolchain-clang20.dependencies]
castxml = "*"
clang = "20.*"
clangxx = "20.*"

# `integration` marker (DWARF/header parsing tests) — adds cmake on top of
# the shared native-toolchain feature.
[tool.pixi.feature.integration.dependencies]
cmake = "*"

[tool.pixi.feature.integration.tasks]
test-integration = "pytest tests/ -v -m integration --tb=short"

# libabigail (abidiff/abipkgdiff) + abi-compliance-checker, for the
# `libabigail`/`abicc` parity markers. Both are conda-forge linux-64-only
# packages (see the `libabigail-parity`/`abicc-parity` CI jobs).
[tool.pixi.feature.parity]
platforms = ["linux-64"]

[tool.pixi.feature.parity.dependencies]
libabigail = "*"
abi-compliance-checker = "*"

[tool.pixi.feature.parity.tasks]
# Marker-scoped across all of tests/ (not a hard-coded file list) so newly
# added `libabigail`/`abicc`-marked files (e.g. the `_extended` parity
# suites) are picked up automatically.
test-libabigail = "pytest tests/ -v -m libabigail --tb=short"
test-abicc = "pytest tests/ -v -m abicc --tb=short"

# mkdocs site build (`docs/`), matching the `lint-and-types` CI job.
[tool.pixi.feature.docs.pypi-dependencies]
mkdocs = "*"
mkdocs-material = "*"
pymdown-extensions = "*"
mkdocs-redirects = "*"

[tool.pixi.feature.docs.tasks]
docs-build = "mkdocs build --strict"
docs-serve = "mkdocs serve"

# `python -m build` + `twine check`, matching the `fair-metadata` CI job's
# distribution-build step (now a required `pr`-profile gate — CLAUDE.md
# "M0-3": a skip must never be mistaken for a pass, so `default` below must
# provision this rather than let `pixi run check` skip-and-fail out of the box).
[tool.pixi.feature.dist.pypi-dependencies]
build = "*"
twine = "*"

[tool.pixi.environments]
# Includes `docs` and `dist` so `pixi run check` (== `--profile pr`) actually
# completes rather than skipping docs-build/distribution-build and failing
# the incomplete-run gate on a fresh `pixi install` — see the two features
# above.
default = { features = ["dev", "docs", "dist"], solve-group = "default" }
integration = { features = ["dev", "native-toolchain", "integration"], solve-group = "default" }
parity = { features = ["dev", "native-toolchain", "parity"], solve-group = "parity" }
docs = { features = ["docs"], solve-group = "docs" }
# Used by action.yml's dependency-source=conda-forge (action/install-deps-conda-forge.sh)
# — deliberately excludes "dev" (no test/lint/type tooling weight) and gets
# its own bin/-shim treatment there rather than a raw PATH prepend, since a
# Python interpreter still gets pulled in transitively by the workspace-level
# pypi-dependencies section above (see that script's own docstring for why).
scanner = { features = ["native-toolchain"], solve-group = "scanner" }
gcc14 = { features = ["native-toolchain-gcc14"], solve-group = "gcc14" }
clang20 = { features = ["native-toolchain-clang20"], solve-group = "clang20" }
