name: 'abicheck verify-source-run'
description: >-
  Select and unpack the producer run a trusted `workflow_run` publisher is
  about to report on: verify the run's repository, workflow, event, id,
  attempt and conclusion; resolve the pull request through the GitHub API
  rather than from the artifact; distinguish the PR head SHA from the
  commit that was actually analysed and verify their association; and
  extract the artifact as hostile input (ADR-073). Runs no analysis.

branding:
  icon: 'shield'
  color: 'blue'

inputs:
  source-run-id:
    description: >
      The producer run to publish from -- `github.event.workflow_run.id` in
      a `workflow_run` job.
    required: true
  expect-repository:
    description: >
      owner/repo the source run must belong to. Defaults to the current
      repository. This is the check that stops a publisher being pointed at
      an arbitrary run somewhere else on GitHub.
    required: false
    default: ''
  expect-workflow:
    description: >
      The workflow the source run must be, as its file path
      (`.github/workflows/abi.yml`) or its name. Strongly recommended: a
      run of a *different* workflow in the same repository may have been
      produced by a job with different trust.
    required: false
    default: ''
  expect-event:
    description: "Event the source run must have been triggered by, e.g. pull_request."
    required: false
    default: 'pull_request'
  expect-run-attempt:
    description: "Attempt number the source run must be. Empty means any."
    required: false
    default: ''
  allowed-conclusions:
    description: >
      Comma-separated conclusions that may be published, e.g.
      'success,failure'. Empty allows any, which is a real choice for a
      publisher that reports analysis failures.
    required: false
    default: 'success'
  artifact-name:
    description: "Name of the artifact to download from that run."
    required: true
  tested-sha:
    description: >
      The commit the producer actually analysed, if it recorded one. For a
      `pull_request` run this is normally the ephemeral merge commit, not
      the PR head; its association with the PR head is verified through the
      API. Empty means "the run's own head SHA".
    required: false
    default: ''
  provenance-from:
    description: >
      Read the commit the producer actually analysed out of THIS artifact,
      at this relative path inside it -- normally `aggregate.json`, whose
      `analysis_context` block `actions/aggregate` records when its caller
      asks it to.

      On a `pull_request` run the producer builds an ephemeral merge commit
      that no GitHub API endpoint names, so only the producer can say what
      was analysed. Setting this replaces the two-pass sequence a caller
      otherwise has to write -- run this Action once for the artifact, parse
      a sidecar in privileged shell, run it again with `tested-sha` -- which
      downloads the same bytes twice, with no guarantee the second copy is
      the first, and puts artifact parsing in the trusted job.

      The block is read through the same bounded reader as any other member
      and every field is shape-checked before it reaches a step output. It
      is still a CLAIM: its association with the pull request is verified
      through the API exactly as a `tested-sha` input would be.

      Mutually exclusive with `tested-sha` in practice; `tested-sha` stays
      for a caller that already holds a verified value.
    required: false
    default: ''
  require-provenance:
    description: >
      With `provenance-from` set, what an artifact that records no analysis
      context means. 'true' (default) refuses: the identity is unestablished
      and a publisher must not substitute the PR head, which names a tree the
      analysis never saw. 'false' falls back to the run's own head SHA and
      says so on `tested-sha-source`, for a caller whose producers have not
      all been updated yet.
    required: false
    default: 'true'
  report-from:
    description: >
      The report this publication is about, at this relative path inside the
      artifact -- normally `aggregate.json`. Returned on `report-path`
      together with the verified identity, so the document a caller renders
      is the one whose context was checked rather than a path the caller
      reassembled from `artifact-path`. A verified run that produced no such
      member sets `report-available` to 'false', which is an explicit
      unavailable-analysis answer, not a clean result.
    required: false
    default: ''
  claimed-pr-number:
    description: >
      A PR number the artifact states, if any. It is only ever
      cross-checked against the API's answer -- a disagreement fails the
      step. Never pass this *as* the PR number to publish to.
    required: false
    default: ''
  destination:
    description: 'Directory to extract the artifact into.'
    required: false
    default: 'abicheck-source-artifact'
  max-total-bytes:
    description: 'Total uncompressed bytes the artifact may expand to.'
    required: false
    default: '67108864'
  max-entry-bytes:
    description: 'Uncompressed bytes any single entry may expand to.'
    required: false
    default: '33554432'
  max-entries:
    description: 'Maximum number of entries in the artifact.'
    required: false
    default: '2000'
  max-ratio:
    description: 'Maximum uncompressed-to-compressed expansion ratio.'
    required: false
    default: '200'
  github-token:
    description: "Token with `actions: read` on the source repository."
    required: true
  python-version:
    description: 'Python version for setup-python.'
    required: false
    default: '3.13'
  abicheck-version:
    description: >
      PyPI version specifier to install instead of this Action's own
      checked-out source. Leave empty to install the checkout the Action ref
      already pins.
    required: false
    default: ''

outputs:
  verified:
    description: "'true' when every check passed."
    value: ${{ steps.verify.outputs.verified }}
  pr-number:
    description: 'The pull request the API associates with this run.'
    value: ${{ steps.verify.outputs.pr-number }}
  pr-head-sha:
    description: "The pull request's own head commit."
    value: ${{ steps.verify.outputs.pr-head-sha }}
  tested-sha:
    description: >
      The commit that was actually analysed, verified as the PR head or a
      merge of it. Display this, not the PR head, when they differ.
    value: ${{ steps.verify.outputs.tested-sha }}
  tested-sha-source:
    description: >
      Where `tested-sha` came from: 'analysis-context' when the producer
      recorded it and the API confirmed the association, 'input' when the
      caller stated it on `tested-sha` and it was verified against this
      pull request, 'run-head' when neither applied and the value is the
      producer run's own head commit. A publisher that must never display
      an unestablished identity branches on this rather than on whether the
      value is empty -- and 'input' stays distinct from 'run-head' because
      a caller-stated commit is not the fallback it would otherwise read as.
    value: ${{ steps.verify.outputs.tested-sha-source }}
  provenance:
    description: >
      'recorded' | 'absent' | 'not-requested'. Distinguishes "the producer
      said what it analysed" from "it did not" from "we never asked", which
      the tested-sha value alone cannot.
    value: ${{ steps.verify.outputs.provenance }}
  report-path:
    description: >
      The verified report named by `report-from`, or empty. Returned with
      the identity above so the two cannot disagree.
    value: ${{ steps.verify.outputs.report-path }}
  report-available:
    description: >
      "'false' when the verified run produced no `report-from` member -- an
      unavailable analysis, which is not a clean compatibility result."
    value: ${{ steps.verify.outputs.report-available }}
  from-fork:
    description: "'true' when the pull request head is in a different repository."
    value: ${{ steps.verify.outputs.from-fork }}
  artifact-path:
    description: 'Directory the artifact was extracted into.'
    value: ${{ steps.verify.outputs.artifact-path }}
  refusal-code:
    description: >
      Machine-readable reason the step refused, e.g. wrong-repository,
      ambiguous-pull-request, artifact-compression-bomb. Empty on success.
    value: ${{ steps.verify.outputs.refusal-code }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    # As in actions/report: abicheck itself and nothing else. This Action
    # analyses nothing, so it needs no toolchain at all.
    - name: Install abicheck
      shell: bash
      env:
        INPUT_ABICHECK_VERSION: ${{ inputs.abicheck-version }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        if [[ -n "${INPUT_ABICHECK_VERSION}" ]]; then
          python -m pip install --disable-pip-version-check "abicheck==${INPUT_ABICHECK_VERSION}"
        else
          python -m pip install --disable-pip-version-check "${ACTION_PATH}/../.."
        fi

    - name: Verify and extract
      id: verify
      shell: bash
      env:
        INPUT_SOURCE_RUN_ID: ${{ inputs.source-run-id }}
        INPUT_EXPECT_REPOSITORY: ${{ inputs.expect-repository }}
        INPUT_EXPECT_WORKFLOW: ${{ inputs.expect-workflow }}
        INPUT_EXPECT_EVENT: ${{ inputs.expect-event }}
        INPUT_EXPECT_RUN_ATTEMPT: ${{ inputs.expect-run-attempt }}
        INPUT_ALLOWED_CONCLUSIONS: ${{ inputs.allowed-conclusions }}
        INPUT_ARTIFACT_NAME: ${{ inputs.artifact-name }}
        INPUT_TESTED_SHA: ${{ inputs.tested-sha }}
        INPUT_PROVENANCE_FROM: ${{ inputs.provenance-from }}
        INPUT_REQUIRE_PROVENANCE: ${{ inputs.require-provenance }}
        INPUT_REPORT_FROM: ${{ inputs.report-from }}
        INPUT_CLAIMED_PR_NUMBER: ${{ inputs.claimed-pr-number }}
        INPUT_DESTINATION: ${{ inputs.destination }}
        INPUT_MAX_TOTAL_BYTES: ${{ inputs.max-total-bytes }}
        INPUT_MAX_ENTRY_BYTES: ${{ inputs.max-entry-bytes }}
        INPUT_MAX_ENTRIES: ${{ inputs.max-entries }}
        INPUT_MAX_RATIO: ${{ inputs.max-ratio }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: bash "${{ github.action_path }}/run.sh"
