name: 'abicheck check-target'
description: >-
  Compose resolve-baseline + collect-facts + the root abicheck Action for
  ONE resolved check (target or bundle), always emitting the ADR-047 §7
  report envelope regardless of outcome. Accepts gate-mode: local|deferred|
  advisory (ADR-047 §4/§7): local sets this job's own exit code (today's
  root-action behavior); deferred/advisory always emit the report and only
  fail this job on an operational error (resolve-baseline failure), leaving
  the compatibility gate to check-project.yml's trailing aggregate job
  (deferred) or nothing at all (advisory, shadow-rollout burn-in).

branding:
  icon: 'check-circle'
  color: 'blue'

inputs:
  # ── Identity (ADR-047 §5/§7) ────────────────────────────────────────────
  kind:
    description: "'target' (default) or 'bundle' -- which resolution/compare shape this check uses."
    required: false
    default: 'target'
  target-kind:
    description: >
      'library' (default), 'app-consumer', or 'plugin-contract' (ADR-047
      §3's targets: kind discriminator) -- only meaningful when kind:
      target. Selects which compare flags this check builds: a plain
      compare for library, --used-by for app-consumer, --required-symbols
      for plugin-contract. Never used for kind: bundle.
    required: false
    default: 'library'
  name:
    description: >
      The target id (kind: target) or bundle id (kind: bundle) -- this
      check's own reporting identity (check_id/target_id). For target-kind
      app-consumer/plugin-contract this is the contract target's own name
      (e.g. "myapp-consumer"), NOT the library it resolves through -- see
      baseline-target below (ADR-047 §3's "library redirect").
    required: true
  baseline-target:
    description: >
      Which target's baseline actually gets resolved -- defaults to name.
      Set this to the referenced library's id for target-kind: app-consumer/
      plugin-contract (ADR-047 §3: "resolve-baseline resolves the baseline
      for the target's library field ... while the check's own identity
      stays the contract target's name"). Ignored for kind: bundle (use
      bundle-members instead).
    required: false
    default: ''
  bundle-members:
    description: >
      JSON array of the bundle's member target ids, e.g.
      '["libpvxs", "libpvxsIoc"]'. Required when kind is bundle.
    required: false
    default: '[]'
  profile:
    description: 'The build profile.id this check runs under (ADR-047 §2/§3/§7).'
    required: true
  baseline-channel:
    description: >
      Baseline channel name (release-contract, accepted-main, explicit, or a
      project-defined custom channel), or the literal 'none' for a
      single-build audit with no baseline (ADR-047 §8 S5) -- when 'none',
      resolve-baseline is skipped entirely and this check runs the existing
      scan audit path directly (no --against) instead of compare.
    required: true
  baseline-path:
    description: >
      Path to baseline-channel's already-staged baseline-set (forwarded to
      resolve-baseline's baseline-path input). Required unless
      baseline-channel is 'none'.
    required: false
    default: ''
  baseline-required:
    description: >
      'true' (default) -- no baseline set yet is a hard failure. 'false' --
      explicit bootstrap opt-in (forwarded to resolve-baseline's required
      input). Ignored when baseline-channel is 'none'.
    required: false
    default: 'true'
  candidate-build-output:
    description: >
      Path to the candidate build's build-output.json, forwarded to
      resolve-baseline for its incompatible_evidence check. Omit to skip
      that check. Ignored when baseline-channel is 'none'.
    required: false
    default: ''
  expected-project-ref:
    description: >
      Forwarded to resolve-baseline's expected-project-ref input --
      require the resolved baseline-set's manifest.json project_ref to
      match this value exactly, failing closed with the wrong_project_ref
      outcome otherwise. Exists for an accepted-main PR gate built on this
      Action: pass the PR's base SHA (e.g.
      github.event.pull_request.base.sha) so a baseline-path staged via an
      Actions-cache restore-keys *prefix* match can't silently resolve to
      a newer default-branch commit than the PR actually compares against
      (see resolve-baseline's own input for the full rationale). Omit
      (default) to skip the check -- unchanged behavior, correct for
      release-contract and any channel resolved by tag/asset selection
      rather than a Git ref. Ignored when baseline-channel is 'none'.
    required: false
    default: ''
  expected-baseline-generation:
    description: >
      Forwarded to resolve-baseline's expected-baseline-generation input --
      require the resolved baseline-set's manifest.json baseline_generation
      to match this value exactly, failing closed with the
      stale_generation outcome otherwise. Omit (default) to skip the check.
      Ignored when baseline-channel is 'none'.
    required: false
    default: ''
  allow-new-target:
    description: >
      Forwarded to resolve-baseline's allow-new-target input -- 'false'
      (default) means a target absent from an otherwise-resolved
      baseline-set always fails as ambiguous; 'true' opts this check into
      the new_target outcome instead, an advisory, non-fatal lifecycle
      state for a target this check has explicitly designed to tolerate
      the first appearance of (e.g. a new library's first release, checked
      against a baseline-set that predates it -- see resolve-baseline's own
      input for the full rationale). Only meaningful for kind: target: a
      'true' value is a hard usage error (validate-inputs.sh, exit 64) when
      kind is bundle -- a bundle comparison needs one coherent release
      where every member already coexisted, so there is no well-defined
      old side for a member that's new -- and is a no-op (never even
      reaches resolve-baseline) when baseline-channel is 'none'. A
      run-plan check that sets this should also set baseline-required:
      'false', or a required-coverage gate would still block on the
      target's first appearance (see check_report.NEW_TARGET_VERDICT's own
      docstring).
    required: false
    default: 'false'
  requested-depth:
    description: 'Evidence-depth this check asks for: binary, headers, build, or source (ADR-047 §7).'
    required: true
  explicit-id:
    description: >
      This check's checks[].id (G42 "Explicit check identifiers"), if the
      project declared one -- folded into check_id's '~<explicit_id>' tail
      so two checks[] entries sharing (name, profile, baseline-channel,
      requested-depth) but declaring different analysis: each produce a
      distinct, non-colliding check_id/report. Omit (default) for the
      pre-G42, unqualified check_id shape.
    required: false
    default: ''
  gate-mode:
    description: "'local' (default), 'deferred', or 'advisory' (ADR-047 §7)."
    required: false
    default: 'local'
  project:
    description: 'Project identifier recorded in the report envelope, e.g. "owner/repo".'
    required: false
    default: ${{ github.repository }}
  head-sha:
    description: 'Candidate commit SHA recorded in the report envelope.'
    required: false
    default: ${{ github.sha }}
  base-ref:
    description: 'Base ref recorded in the report envelope, when known (e.g. a PR target branch).'
    required: false
    default: ''

  # ── Evidence collection composition (ADR-047 §4) ────────────────────────
  evidence-producer:
    description: >
      '' (default -- no source evidence needed, e.g. binary/headers depth),
      'replay', 'wrapper', or 'clang-plugin'. wrapper/clang-plugin compose
      collect-facts phase: verify (the caller's workflow must run
      collect-facts phase: prepare before its own build step, earlier in
      the job -- check-target runs after that build already happened and
      cannot retroactively instrument it). replay composes collect-facts
      phase: auto (no pre-build hook needed).
    required: false
    default: ''
  evidence-pack-path:
    description: >
      Path to the wrapper/clang-plugin abicheck_inputs/ pack an earlier
      collect-facts phase: prepare step wrote (must match that step's own
      output path). Forwarded to compare/dump's --build-info. Ignored for
      evidence-producer: replay/''.
    required: false
    default: 'abicheck_inputs'

  # ── Candidate/new-side inputs (forwarded to root action.yml) ────────────
  new-library:
    description: >
      Candidate binary (kind: target) or directory of candidate member
      binaries (kind: bundle). Required.
    required: true
  header:
    description: 'Public header file(s) applied to both sides (space-separated). Forwarded to the internal analysis step.'
    required: false
  old-header:
    description: 'Public header(s) for the baseline side only. Forwarded to the internal analysis step.'
    required: false
  new-header:
    description: 'Public header(s) for the candidate side only. Forwarded to the internal analysis step.'
    required: false
  include:
    description: 'Extra include directories, applied to both sides. Forwarded to the internal analysis step.'
    required: false
  old-include:
    description: 'Include directories for the baseline side only. Forwarded to the internal analysis step.'
    required: false
  new-include:
    description: 'Include directories for the candidate side only. Forwarded to the internal analysis step.'
    required: false
  lang:
    description: 'Language mode for header AST parsing: "c++" or "c". Forwarded to the internal analysis step.'
    required: false
    default: 'c++'
  ast-frontend:
    description: 'L2 header-AST frontend: auto, castxml, clang, or hybrid. Forwarded to the internal analysis step.'
    required: false
  gcc-path:
    description: 'Path to GCC/G++ cross-compiler binary (the CLI --compiler). Forwarded to the internal analysis step.'
    required: false
  gcc-prefix:
    description: 'Cross-toolchain prefix, e.g. aarch64-linux-gnu- (the CLI --compiler-prefix). Forwarded to the internal analysis step.'
    required: false
  gcc-options:
    description: 'Extra compiler flags passed through to the header frontend (the CLI --compiler-option). Forwarded to the internal analysis step.'
    required: false
  consumer-ast-frontend:
    description: 'Consumer-only L2 header frontend. When set, candidate headers are extracted in a separate pass against the same producer binary.'
    required: false
  consumer-gcc-path:
    description: 'Consumer-only compiler executable used by the separate candidate header extraction pass.'
    required: false
  consumer-gcc-options:
    description: 'Consumer-only compiler options used by the separate candidate header extraction pass.'
    required: false
  consumer-compile-active:
    description: >-
      Whether the profile declared a consumer_compile: overlay at all
      (independent of whether it resolved any of the three fields above to
      a non-empty value -- e.g. an overlay naming only a `binding:` with no
      matching --toolchain-bindings entry). Forces the separate candidate
      consumer-context dump below to run even when consumer-ast-frontend/
      consumer-gcc-path/consumer-gcc-options are all empty, so a declared
      overlay always isolates the candidate's header parse from the
      producer's own compiler options rather than silently falling back to
      them (Codex review).
    required: false
    default: 'false'
  sysroot:
    description: 'Alternative system root directory for cross-compilation. Forwarded to the internal analysis step.'
    required: false
  sources:
    description: 'Source checkout for L3/L4/L5 evidence (forwarded to compare/dump --sources and to collect-facts).'
    required: false
  build-info:
    description: >
      Out-of-tree L3 build context. When evidence-producer is
      wrapper/clang-plugin, this is set from evidence-pack-path
      automatically -- set it directly only for a producer-less
      build/source-depth check that already has an out-of-band pack.
    required: false
  compile-db:
    description: 'Explicit path to a compile_commands.json. Forwarded to the internal analysis step.'
    required: false
  build-config:
    description: 'Path to a trusted .abicheck.yml. Forwarded to the internal analysis step.'
    required: false
  consumer-binary:
    description: 'target-kind: app-consumer only. Consumer binary/binaries whose imports scope the comparison (forwarded as --used-by).'
    required: false
  contract-file:
    description: 'target-kind: plugin-contract only. A .syms file (one required linker symbol per line, # comments allowed), forwarded as --required-symbols.'
    required: false
  policy:
    description: 'Built-in policy profile: strict_abi (default), sdk_vendor, plugin_abi. Forwarded to the internal analysis step.'
    required: false
    default: 'strict_abi'
  policy-file:
    description: 'Path to a YAML policy file with per-kind verdict overrides. Forwarded to the internal analysis step.'
    required: false
  suppress:
    description: 'Path to a YAML suppression file to filter known/intentional changes. Forwarded to the internal analysis step.'
    required: false
  severity-preset:
    description: >
      Forwarded to the internal compare step. Defaults to 'default' (not
      left unset) so the analysis report always carries a severity block --
      without one, a legacy compare report has no severity to neutralize for
      gate-mode: advisory, and aggregate.py's own GateInfo.from_report_data
      falls back to legacy_from_verdict(verdict) instead, which would still
      see the real BREAKING/API_BREAK verdict and derive a blocking gate
      regardless of gate-mode. Ignored for a scan-mode audit (baseline-
      channel: none), which always carries its own top-level exit_code.
    required: false
    default: 'default'
  require-complete-analysis:
    description: >
      RETIRED (rulings.py deferred-option followup -- hard removal, no
      deprecation window, mirroring the root Action's own
      require-complete-analysis retirement, which this input forwarded
      to). The root Action's input it mapped onto is gone: P0.4's
      orthogonal ANALYSIS_INCOMPLETE axis is config-only now,
      `.abicheck.yml`'s `assurance.require_complete: true`, with no CLI or
      Action-input override. Still declared so a workflow that sets it
      gets an explicit `::error::` instead of a silently-ignored input.
      See `analysis-assurance-complete` below for how
      `checks[].analysis.assurance: complete` (product-gaps audit §3) is
      now enforced instead.
    required: false
    default: 'false'
  analysis-assurance-complete:
    description: >
      Set to 'true' when this cell declared `checks[].analysis.assurance:
      complete` (RunPlanCheck.analysis_assurance, validated at run-plan
      generation time by project_targets.py's analysis_assurance_gate.py,
      which still accepts only 'complete'). This is the config-overlay
      replacement `require-complete-analysis` above's own docstring used
      to name as a tracked gap: since neither a CLI flag nor an Action
      input can carry `assurance.require_complete` any more (see that
      input's docstring), this Action instead merges an
      `assurance: {require_complete: true}` fragment into whichever
      build-config the internal analysis step would otherwise read
      (`build-config`, possibly none) -- the same config-only mechanism a
      project author's own `.abicheck.yml` line would produce, so a
      declared 'complete' cell is enforced the identical way. check-project.yml
      is the intended caller (it already validates and carries
      `checks[].analysis.assurance` on the run-plan); a direct check-target
      caller may also set this explicitly. Ignored (no overlay generated)
      when not exactly 'true'.
    required: false
    default: 'false'
  extra-args:
    description: 'Additional CLI arguments passed directly to the internal abicheck invocation.'
    required: false
    default: ''
  python-version:
    description: 'Python version for setup-python.'
    required: false
    default: '3.13'
  install-deps:
    description: 'Install system dependencies (castxml, gcc). Set to false if pre-installed.'
    required: false
    default: 'true'
  dependency-source:
    description: >-
      How to install system dependencies: 'conda-forge',
      'conda-forge-gcc14', 'conda-forge-clang20', 'system', or 'none'.
      Forwarded verbatim to the root action's input of the same name, which
      owns both the accepted-value list and the fallback to the legacy
      `install-deps` boolean when this is empty. Set per check cell by
      check-project.yml from the profile's own `dependency_source:` (G34
      Phase C), so a GCC-profile cell and a Clang-profile cell in one run can
      each provision a matching toolchain.
    required: false
    default: ''
  action-version:
    description: 'Recorded in the report envelope as the abicheck Action ref that ran this check.'
    required: false
    default: ${{ format('{0}@{1}', github.action_repository || github.repository, github.action_ref || github.sha) }}
  abicheck-repository:
    description: >-
      Override this Action's own self-checkout identity (which repository
      it checks out for its nested resolve-baseline/root-action
      composition) instead of auto-detecting from github.action_repository/
      github.repository. Set this when check-target is invoked as a nested
      `uses: ./x` step from INSIDE another reusable workflow's own
      self-checkout copy of abicheck (check-project.yml/check-single.yml
      do this) -- from check-target's own perspective that local path
      reference is indistinguishable from a genuine same-repository
      invocation, so github.action_repository comes back empty and the
      auto-detected fallback (github.repository/github.sha) would silently
      resolve to the CALLER's own repository instead of abicheck's for an
      external consumer, sending its nested resolve-baseline checkout to
      the wrong place. Leave empty for a direct `uses: abicheck/abicheck/
      actions/check-target@ref` or a same-repository `uses: ./actions/
      check-target` invocation, where auto-detection is already correct.
    required: false
    default: ''
  abicheck-ref:
    description: 'Paired with abicheck-repository above -- the ref/SHA to check out.'
    required: false
    default: ''

outputs:
  outcome:
    description: 'resolve-baseline outcome (resolved, not_found, ambiguous, wrong_profile, stale_schema, incompatible_evidence, wrong_project_ref, stale_generation, new_target), or "skipped" when baseline-channel is none.'
    value: ${{ steps.finalize.outputs.outcome }}
  check-id:
    description: "This check's full identity: target@profile#baseline_channel@requested_depth."
    value: ${{ steps.finalize.outputs.check-id }}
  verdict:
    description: 'The legacy verdict field (a Verdict enum value, "ERROR" for an operational failure, "NO_BASELINE" for a bootstrap pass, or "NEW_TARGET" for an allow-new-target-opted-in pass).'
    value: ${{ steps.finalize.outputs.verdict }}
  compatibility-verdict:
    description: 'ADR-047 §7''s new compatibility_verdict field (empty when unavailable).'
    value: ${{ steps.finalize.outputs.compatibility-verdict }}
  policy-gate-decision:
    description: '"pass" or "fail" -- this check''s own real gate decision, before any advisory neutralization.'
    value: ${{ steps.finalize.outputs.policy-gate-decision }}
  report-path:
    description: 'Path to the final, enriched report JSON.'
    value: ${{ steps.finalize.outputs.report-path }}

runs:
  using: 'composite'
  steps:
    - name: Validate check-target inputs
      shell: bash
      env:
        INPUT_KIND: ${{ inputs.kind }}
        INPUT_TARGET_KIND: ${{ inputs.target-kind }}
        INPUT_NAME: ${{ inputs.name }}
        INPUT_PROFILE: ${{ inputs.profile }}
        INPUT_BUNDLE_MEMBERS: ${{ inputs.bundle-members }}
        INPUT_BASELINE_CHANNEL: ${{ inputs.baseline-channel }}
        INPUT_BASELINE_PATH: ${{ inputs.baseline-path }}
        INPUT_GATE_MODE: ${{ inputs.gate-mode }}
        INPUT_REQUESTED_DEPTH: ${{ inputs.requested-depth }}
        INPUT_EVIDENCE_PRODUCER: ${{ inputs.evidence-producer }}
        INPUT_CONSUMER_BINARY: ${{ inputs.consumer-binary }}
        INPUT_CONTRACT_FILE: ${{ inputs.contract-file }}
        INPUT_ALLOW_NEW_TARGET: ${{ inputs.allow-new-target }}
        INPUT_REQUIRE_COMPLETE_ANALYSIS: ${{ inputs.require-complete-analysis }}
        INPUT_ANALYSIS_ASSURANCE_COMPLETE: ${{ inputs.analysis-assurance-complete }}
      run: bash "${{ github.action_path }}/validate-inputs.sh"

    # ── Capture this Action's own identity before any nested `uses:` step ──
    # overwrites it. `github.action_repository`/`github.action_ref` describe
    # whichever action is *about to run* -- the runner updates them as it
    # prepares each step, including composite-nested ones, and critically
    # **before** evaluating that same step's own `with:` expressions. A
    # first attempt at the self-checkout step below read `github.
    # action_repository`/`github.action_ref` directly in its own `with:`
    # block and got back its own target's identity (`actions/checkout`/
    # `v6`) instead of check-target's -- confirmed against a real CI run
    # (job 89082423642). Reading them here instead, in a plain `run:` step
    # that is the *first* thing check-target does, captures the correct
    # values before anything nested has a chance to overwrite them.
    #
    # `abicheck-repository`/`abicheck-ref` (explicit `inputs:`, checked
    # first) take priority over `github.action_repository`/
    # `github.action_ref` (checked second): when check-project.yml/
    # check-single.yml invoke this Action via a local `uses: ./x` step
    # inside THEIR OWN self-checkout copy of abicheck, that local reference
    # is indistinguishable, from check-target's own perspective, from a
    # genuine same-repository invocation -- `github.action_repository`
    # comes back empty either way. Left to the `github.repository`/
    # `github.sha` fallback, an external consumer's nested resolve-baseline
    # checkout would silently resolve to the CALLER's own repository
    # instead of abicheck's (Codex review). check-project.yml/
    # check-single.yml already computed their own correct identity in
    # their own first step for exactly this reason, and pass it straight
    # through via these two inputs so check-target never has to guess.
    - name: Capture this Action's identity
      id: identity
      shell: bash
      env:
        INPUT_ABICHECK_REPOSITORY: ${{ inputs.abicheck-repository }}
        INPUT_ABICHECK_REF: ${{ inputs.abicheck-ref }}
        ACTION_REPOSITORY: ${{ github.action_repository }}
        ACTION_REF: ${{ github.action_ref }}
        FALLBACK_REPOSITORY: ${{ github.repository }}
        FALLBACK_REF: ${{ github.sha }}
      run: |
        echo "repository=${INPUT_ABICHECK_REPOSITORY:-${ACTION_REPOSITORY:-$FALLBACK_REPOSITORY}}" >> "$GITHUB_OUTPUT"
        echo "ref=${INPUT_ABICHECK_REF:-${ACTION_REF:-$FALLBACK_REF}}" >> "$GITHUB_OUTPUT"

    # ── Self-checkout for nested composite Actions ──────────────────────────
    # A relative `uses: ./x` step ALWAYS resolves against $GITHUB_WORKSPACE
    # (the calling workflow's own checkout) -- never against the repository
    # that contains *this* composite Action. This is a well-documented
    # GitHub Actions limitation (github/docs: "When referencing an action
    # using a relative path, the path is always relative to
    # $GITHUB_WORKSPACE"; see also actions/runner#1348). When check-target
    # is consumed externally (`uses: abicheck/abicheck/actions/check-target@
    # v1` from a caller's own repository), a bare `uses: ./actions/
    # resolve-baseline` below would resolve against the CALLER's own
    # checkout, which has no such path, and fail before ever reaching
    # baseline resolution -- confirmed by review; the existing
    # test-action.yml fixture never caught this because it invokes
    # check-target from *within* this same repository, the one case where a
    # bare relative path happens to already work. Fix: check out this exact
    # abicheck/abicheck ref into a side directory of the caller's own
    # workspace first, then reference every nested Action relative to that
    # directory instead of bare `./`. For a local `uses: ./actions/
    # check-target` call within this same repository (as `.github/
    # workflows/test-action.yml` does), `github.action_repository`/
    # `github.action_ref` are empty, so the identity step above falls back
    # to `github.repository`/`github.sha` -- checking out the same repo/
    # commit the caller's own workspace already has, redundant but
    # harmless.
    - name: Checkout abicheck (for nested Action composition)
      uses: actions/checkout@v6
      with:
        repository: ${{ steps.identity.outputs.repository }}
        ref: ${{ steps.identity.outputs.ref }}
        path: .abicheck-check-target-src
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install abicheck
      shell: bash
      run: pip install "${{ github.action_path }}/../.."

    # ── Baseline resolution (skipped entirely for baseline-channel: none, ──
    # ADR-047 §8 S5 -- never routed through not_found/bootstrap handling for
    # a check that never wanted a baseline in the first place) ─────────────
    - name: Resolve baseline
      id: resolve
      if: inputs.baseline-channel != 'none'
      continue-on-error: true
      uses: ./.abicheck-check-target-src/actions/resolve-baseline
      with:
        baseline-path: ${{ inputs.baseline-path }}
        channel: ${{ inputs.baseline-channel }}
        kind: ${{ inputs.kind }}
        target: ${{ inputs.kind == 'target' && (inputs.baseline-target != '' && inputs.baseline-target || inputs.name) || '' }}
        bundle: ${{ inputs.kind == 'bundle' && inputs.name || '' }}
        bundle-members: ${{ inputs.bundle-members }}
        profile: ${{ inputs.profile }}
        required: ${{ inputs.baseline-required }}
        candidate-build-output: ${{ inputs.candidate-build-output }}
        expected-project-ref: ${{ inputs.expected-project-ref }}
        expected-baseline-generation: ${{ inputs.expected-baseline-generation }}
        allow-new-target: ${{ inputs.allow-new-target }}
        python-version: ${{ inputs.python-version }}

    # ── Evidence collection (ADR-047 §4's collect-facts composition note: ──
    # phase: verify for wrapper/clang-plugin, phase: auto only for replay -- ─
    # check-target runs after the caller's own build, so phase: prepare must
    # be a separate, earlier step in the caller's workflow, not here) ───────
    - name: Collect source facts (verify)
      id: collect_verify
      if: |
        (inputs.evidence-producer == 'wrapper' || inputs.evidence-producer == 'clang-plugin') &&
        (inputs.baseline-channel == 'none' || steps.resolve.outputs.outcome == 'resolved')
      continue-on-error: true
      uses: ./.abicheck-check-target-src/actions/collect-facts
      with:
        phase: 'verify'
        producer: ${{ inputs.evidence-producer }}
        output: ${{ inputs.evidence-pack-path }}
        python-version: ${{ inputs.python-version }}

    - name: Collect source facts (replay)
      id: collect_replay
      if: |
        inputs.evidence-producer == 'replay' &&
        (inputs.baseline-channel == 'none' || steps.resolve.outputs.outcome == 'resolved')
      continue-on-error: true
      uses: ./.abicheck-check-target-src/actions/collect-facts
      with:
        phase: 'auto'
        producer: 'replay'
        sources: ${{ inputs.sources }}
        python-version: ${{ inputs.python-version }}

    # A consumer_compile overlay describes the client header context, not
    # the toolchain that produced the library.  Materialize the candidate
    # snapshot in a distinct dump invocation so the producer binary remains
    # unchanged while its public headers are interpreted by that client.
    # Placed before "Clean stale analysis output" (not after) so that step
    # still runs immediately before "Run analysis" -- this step never
    # writes check-target-analysis.json itself (its own output-file is
    # check-target-consumer.abi.json), so nothing is lost by running it
    # earlier, and the stale-cleanup invariant that step's own comment
    # documents stays exactly as simple to audit as before this step
    # existed (Codex review / test_action_check_target.py's
    # TestStaleAnalysisOutputIsCleanedBeforeEachRun).
    - name: Extract candidate consumer context
      id: consumer_context
      if: |
        inputs.kind == 'target' &&
        (inputs.consumer-compile-active == 'true' || inputs.consumer-ast-frontend != '' || inputs.consumer-gcc-path != '' || inputs.consumer-gcc-options != '') &&
        (inputs.baseline-channel == 'none' || steps.resolve.outputs.outcome == 'resolved') &&
        steps.collect_verify.outcome != 'failure' &&
        steps.collect_replay.outcome != 'failure'
      continue-on-error: true
      uses: ./.abicheck-check-target-src
      with:
        mode: dump
        new-library: ${{ inputs.new-library }}
        # mode: dump has no old/new distinction -- root action/run.sh's dump
        # path adds -H/-I for *both* `header`/`new-header` (and
        # `include`/`new-include`) unconditionally, so passing both here
        # would union them into one parse instead of letting the candidate-
        # specific value replace the shared one the way `compare` mode does
        # for its own new side. A stale shared header can then retain
        # declarations the candidate header set actually removed (Codex
        # review). Select the candidate-specific value when the caller gave
        # one, falling back to the shared value otherwise -- exactly
        # `compare`'s own new-side precedent.
        header: ${{ inputs.new-header != '' && inputs.new-header || inputs.header }}
        include: ${{ inputs.new-include != '' && inputs.new-include || inputs.include }}
        lang: ${{ inputs.lang }}
        ast-frontend: ${{ inputs.consumer-ast-frontend }}
        gcc-path: ${{ inputs.consumer-gcc-path }}
        gcc-prefix: ${{ inputs.gcc-prefix }}
        gcc-options: ${{ inputs.consumer-gcc-options }}
        sysroot: ${{ inputs.sysroot }}
        sources: ${{ inputs.sources != '' && inputs.sources || (inputs.evidence-producer == 'replay' && '.' || '') }}
        build-info: ${{ (inputs.evidence-producer == 'wrapper' || inputs.evidence-producer == 'clang-plugin') && inputs.evidence-pack-path || inputs.build-info }}
        compile-db: ${{ inputs.compile-db }}
        build-config: ${{ inputs.build-config }}
        depth: ${{ inputs.requested-depth }}
        output-file: check-target-consumer.abi.json
        add-job-summary: 'false'
        install-deps: ${{ inputs.install-deps }}
        dependency-source: ${{ inputs.dependency-source }}

    # ── Analysis: compare against the resolved baseline, or (baseline: ─────
    # none) a scan audit with no --against -- continue-on-error so the ─────
    # report-envelope step below always runs, per ADR-047 §7's required ─────
    # "internal analysis step must run with continue-on-error: true" rule. ──
    # Also skipped when a required collect-facts step failed: without this,
    # a broken/empty wrapper or clang-plugin pack (collect_verify failure)
    # would still be handed to compare as --build-info, silently running the
    # comparison against invalid evidence instead of surfacing the
    # collection failure as the operational error it is (review). ──────────
    # The analysis output filename below is a fixed workspace-relative path
    # (unlike the final envelope, which is already scoped per check-id) --
    # if a job runs check-target more than once and a LATER invocation's
    # nested root Action crashes before ever reaching its own report-write
    # step (e.g. a CLI usage/config error), an EARLIER invocation's file
    # would still be sitting at that same path. run.sh's own "only emit
    # report-path when a real report file was produced" check
    # (`-f "$OUTPUT_FILE"`) would then find the stale file and report it as
    # this run's own report-path, so the finalize step below would augment
    # the PREVIOUS check's JSON as if it were this check's real result --
    # with gate-mode: deferred/advisory, silently turning a genuine
    # operational failure into a false pass, since operational_errors would
    # be read from the stale (successful) report instead (Codex review).
    # Deleting any stale file first, unconditionally (not gated on this
    # step's own `if:` below), closes that window regardless of whether
    # analysis runs this time.
    # ── Assurance overlay: config-overlay replacement for the retired ───────
    # require-complete-analysis input/flag (see that input's own docstring
    # above), analogous to the CLI's own release-topology inputs
    # (dso-only/fail-on-removed-library). `analysis-assurance-complete`
    # carries `checks[].analysis.assurance == 'complete'` (RunPlanCheck.
    # analysis_assurance) forwarded from check-project.yml's own run-plan
    # cell; since P0.4's ANALYSIS_INCOMPLETE axis is config-only now (no CLI
    # flag or Action input can set it), the only way left to honor a
    # declared 'complete' cell is to merge an
    # `assurance: {require_complete: true}` fragment into whichever
    # build-config the internal analysis step below would otherwise read --
    # the same effect a project author's own `.abicheck.yml` line would
    # have, produced here instead of requiring the author to hand-author it.
    # Runs after "Install abicheck" so `yaml` (a hard abicheck dependency,
    # `buildsource/build_config.py`) is guaranteed importable regardless of
    # what the runner's own system Python carries. Placed BEFORE "Clean
    # stale analysis output" so that step still runs immediately before
    # "Run analysis" (tests/test_action_check_target.py pins that adjacency
    # so no other step can write check-target-analysis.json in between) --
    # this step writes to a private `mktemp`-created file under
    # `$RUNNER_TEMP` (forwarded to "Run analysis" as this step's own
    # `config-path` output, see below) rather than a fixed in-checkout name,
    # so it does not need that same adjacency guarantee.
    - name: Generate assurance-overlay config
      id: assurance_overlay
      if: inputs.analysis-assurance-complete == 'true'
      continue-on-error: true
      shell: bash
      env:
        BASE_CONFIG: ${{ inputs.build-config }}
        # The effective --sources root this run's own "Run analysis" step
        # below will actually pass (mirrors that step's own `sources:`
        # input formula exactly, see its comment there): a successful
        # `consumer_context` step means "Run analysis" forwards no
        # --sources at all (the synthesized consumer snapshot replaces it),
        # otherwise it's inputs.sources, defaulting to '.' only for a
        # replay evidence-producer. Needed so the discovered-config branch
        # below can validate build.compile_db against the SAME root the
        # nested compare/scan will resolve it against, instead of
        # unconditionally stripping it for want of any --sources context
        # (Codex review, fresh evidence: this step DOES have inputs.sources
        # available, unlike what a previous round assumed).
        SOURCES_ROOT: ${{ steps.consumer_context.outcome == 'success' && '' || (inputs.sources != '' && inputs.sources || (inputs.evidence-producer == 'replay' && '.' || '')) }}
        # Whether THIS step's own nested "Run analysis" invocation resolves
        # a --sources tree's compile:/source:(singular)/debug: blocks
        # PAIR-WIDE ("pairwise") or SINGLE-SIDED (empty) -- the same
        # distinction action/run.sh's own _compile_context_sources_pairwise
        # makes for its sibling overlay, computed here directly from THIS
        # step's own already-known inputs rather than guessed at (Codex
        # review, fresh evidence, PR #1222 fourth round: a previous round
        # excluded these three blocks unconditionally, believing this step
        # had "no reliable way to determine" single-sidedness -- it does).
        # "Run analysis" below always runs mode: ${{ inputs.baseline-channel
        # == 'none' && 'scan' || 'compare' }} with old-library: ${{
        # inputs.kind == 'bundle' && steps.resolve.outputs.binaries-dir ||
        # steps.resolve.outputs.snapshot-path }} (see that step's own
        # inputs) -- mirroring run.sh's own two independent rules:
        #   * mode: scan (baseline-channel: none, the "audit" path) is
        #     ALWAYS single-sided, regardless of kind -- native scan
        #     resolves ONE shared compile_context for the whole invocation
        #     and applies it to both the baseline and the candidate
        #     (run.sh's own _compile_context_sources_pairwise docstring).
        #   * mode: compare (baseline-channel set, the "baseline" path) is
        #     single-sided only when old-library is a STORED snapshot, not
        #     a live binary (_old_library_is_stored_snapshot). kind: target
        #     always resolves old-library to resolve-baseline's own
        #     snapshot-path -- documented as "Path to the resolved target's
        #     .abicheck.json snapshot" (actions/resolve-baseline/action.yml)
        #     -- a stored JSON document, never a live ELF/PE/Mach-O binary,
        #     so it is unconditionally single-sided. kind: bundle instead
        #     resolves old-library to binaries-dir, a directory of REAL,
        #     live ELF member binaries ("bundle analysis reads real ELF
        #     binaries, never JSON snapshots" -- that same action's own
        #     bundle-members docstring) -- genuinely pair-wide live
        #     extraction on both sides, exactly the ambiguous case
        #     run.sh's own rule excludes.
        # So the only ambiguous combination left is kind: bundle with
        # mode: compare; every other combination is unambiguously
        # single-sided.
        SOURCES_PAIRWISE: ${{ inputs.kind == 'bundle' && inputs.baseline-channel != 'none' && 'pairwise' || '' }}
        # Within the single-sided (non-pairwise) bucket above, `compile:`
        # does NOT always resolve the same way (Codex review, fresh
        # evidence, PR #1222 fourth round, second finding on this fix --
        # see `abicheck.action_config_overlay.apply_sources_root_config_
        # blocks`'s own `merge_compile` parameter docstring and `run.sh`'s
        # own `_compile_context_sources_merge_compile` for the full
        # account): `mode: scan` (baseline-channel: none) genuinely selects
        # `compile:` from exactly ONE document -- the `--sources` tree's
        # own, the identical single-document shape `build:`/`sources:`/
        # `source:`/`debug:` already use -- so this is "" (REPLACE) there.
        # `mode: compare` (baseline-channel set -- the only `compare` shape
        # that ever reaches this single-sided bucket at all, per the
        # SOURCES_PAIRWISE comment above) is different: the checkout-root
        # document's own `compile:` is ALREADY independently resolved
        # FIRST, unconditionally, and the live NEW side's own `--sources`
        # tree only folds ON TOP of that via a second `merge_compile_config`
        # call -- a genuine two-stage MERGE, so this is "true" there.
        SOURCES_MERGE_COMPILE: ${{ inputs.baseline-channel != 'none' && 'true' || '' }}
      run: |
        set -euo pipefail
        PY="$(command -v python3 || command -v python)"
        # Security (Codex review): this step's Python previously launched
        # directly from the workspace checkout. Python's own `site`
        # processing auto-imports any `sitecustomize.py`/`usercustomize.py`
        # reachable from CWD/PYTHONPATH during interpreter STARTUP -- before
        # this heredoc's own body ever runs -- including one a PR author
        # committed into this untrusted checkout. Since this whole step is
        # itself driven by a project's own `.abicheck.yml`
        # `checks[].analysis.assurance: complete` setting, a PR that plants a
        # top-level `sitecustomize.py` and declares that config value would
        # get arbitrary code execution here. Mirrors action/run.sh's own
        # `$_PY_SAFE_DIR`/cleared-`PYTHONPATH` mitigation exactly: a fresh,
        # private, empty temp directory (never the untrusted checkout) as
        # CWD, with `PYTHONPATH` cleared for this one invocation, so the
        # checkout is never on `sys.path` at any point during interpreter
        # startup. Fails loud if a private directory can't be created,
        # rather than silently falling back to a shared one.
        _real_pwd="$PWD"
        # Windows path qualification (Codex review, P1): on a Windows/
        # Git-Bash runner an explicit `build-config` commonly arrives as a
        # Windows-style absolute path (`C:/...`, `C:\...`, or a UNC
        # `\\server\share\...`), none of which start with `/`. A POSIX-only
        # leading-slash test below would misclassify every one of those as
        # RELATIVE and prefix it with `$_real_pwd`, producing a malformed,
        # doubled path. `_is_path_already_qualified` mirrors
        # `action/run.sh`'s own function of the same name EXACTLY (see its
        # docstring there for the `?:*` drive-relative caveat and why the
        # Windows-only patterns are gated on `$_RUNNING_ON_WINDOWS`) --
        # this step doesn't source `run.sh` (each composite-action step
        # here already duplicates run.sh's small shell snippets, tagged
        # with a "Mirrors action/run.sh's own ..." comment, rather than
        # sharing a sourced library file), so the exact logic is
        # duplicated here too rather than re-implemented from intent.
        case "$OSTYPE" in
          msys* | cygwin* | win32*) _RUNNING_ON_WINDOWS=true ;;
          *) _RUNNING_ON_WINDOWS=false ;;
        esac
        _is_path_already_qualified() {
          case "$1" in
            /*) return 0 ;;
          esac
          if [[ "$_RUNNING_ON_WINDOWS" == "true" ]]; then
            case "$1" in
              ?:* | \\*) return 0 ;;
            esac
          fi
          return 1
        }
        if ! _py_safe_dir="$(mktemp -d)"; then
          echo "::error::failed to create a private temporary directory (mktemp -d) -- required to safely run abicheck's own inline Python helper without risking the checked-out repository shadowing the installed package."
          exit 1
        fi
        trap 'rm -rf "$_py_safe_dir"' EXIT
        # Security (Codex review, second finding): the overlay's OUTPUT file
        # must NOT be a predictable path inside the untrusted checkout
        # (`$_real_pwd/check-target-assurance-config.yml`, as this used to
        # read) -- a malicious PR can commit a SYMLINK at exactly that path
        # pointing anywhere the runner user can write (e.g. a dotfile, or a
        # sibling job's workspace), and the plain `open(path, "w")` below
        # would follow it and overwrite whatever it points to with
        # attacker-influenced YAML. This is independent of the
        # sitecustomize.py fix above -- that one is about what code runs
        # during interpreter startup, this one is purely about where the
        # write lands. Mirrors action/run.sh's own established convention
        # for a config overlay it doesn't trust the destination of (see
        # `_COMPILE_CONTEXT_CONFIG_OVERLAY`/`_RELEASE_TOPOLOGY_CONFIG_OVERLAY`
        # and `_mktemp_canonical`): a `mktemp`-created file under
        # `$RUNNER_TEMP` has a runtime-random name nothing in the checkout
        # could have pre-planted a symlink at, and `mktemp` itself creates
        # the file atomically (O_EXCL-equivalent), so there is no window in
        # which a symlink could already occupy that exact path -- unlike
        # `$_py_safe_dir` above (whose whole lifetime is scoped to, and
        # removed at the end of, this one step's `trap`), this file must
        # outlive the step for "Run analysis" below to read it, so it gets
        # its own `mktemp` under `$RUNNER_TEMP` rather than reusing
        # `$_py_safe_dir`. `$RUNNER_TEMP` is documented by GitHub Actions to
        # already be an absolute path, but resolve it defensively the same
        # way `_mktemp_canonical` does, in case a self-hosted runner ever
        # configures `TMPDIR`/`RUNNER_TEMP` as a relative value.
        _assurance_out_path="$(mktemp "${RUNNER_TEMP:-/tmp}/abicheck-check-target-assurance-config.XXXXXX")"
        # Windows path qualification (Codex review, P1, second call site):
        # on a Windows/Git-Bash runner `mktemp` can return a path inherited
        # from `$RUNNER_TEMP` that is already Windows-drive-qualified (e.g.
        # `D:/a/_temp/tmp.XXXXXX`), which the POSIX-only `/*` case below
        # would misclassify as RELATIVE and prefix with `$PWD`, producing a
        # malformed doubled path. Reuse `_is_path_already_qualified` (see
        # its own definition/docstring above) rather than duplicating the
        # qualification check a second time in this same step.
        if ! _is_path_already_qualified "$_assurance_out_path"; then
          _assurance_out_path="$PWD/$_assurance_out_path"
        fi
        _base_config_abs=""
        if [[ -n "${BASE_CONFIG:-}" ]]; then
          if _is_path_already_qualified "$BASE_CONFIG"; then
            _base_config_abs="$BASE_CONFIG"
          else
            _base_config_abs="$_real_pwd/$BASE_CONFIG"
          fi
        fi
        # Same relative-path-vs-$_py_safe_dir bug class as $BASE_CONFIG
        # above: $SOURCES_ROOT (this step's own effective --sources value,
        # see the env: block's comment) is very often a checkout-relative
        # path (e.g. `sources: src`) too -- absolutize it against
        # $_real_pwd, mirroring action/run.sh's own
        # add_compile_context_flags identically, before it crosses into the
        # $_py_safe_dir-scoped Python subprocess below.
        _sources_root_abs=""
        if [[ -n "${SOURCES_ROOT:-}" ]]; then
          if _is_path_already_qualified "$SOURCES_ROOT"; then
            _sources_root_abs="$SOURCES_ROOT"
          else
            _sources_root_abs="$_real_pwd/$SOURCES_ROOT"
          fi
        fi
        (cd "$_py_safe_dir" \
         && ABICHECK_BASE_CONFIG="$_base_config_abs" \
            ABICHECK_DISCOVER_START="$_real_pwd" \
            ABICHECK_OUT_PATH="$_assurance_out_path" \
            ABICHECK_SOURCES_ROOT="$_sources_root_abs" \
            ABICHECK_SOURCES_PAIRWISE="${SOURCES_PAIRWISE:-}" \
            ABICHECK_SOURCES_MERGE_COMPILE="${SOURCES_MERGE_COMPILE:-}" \
            PYTHONPATH= "$PY" - <<'PYSCRIPT'
        import os
        import sys
        from pathlib import Path

        import yaml

        from abicheck.action_config_overlay import (
            apply_sources_root_config_blocks,
            discovered_compile_db_resolves,
            rebase_relative_config_paths,
            strip_untrusted_execution_keys,
            validate_base_config,
        )
        from abicheck.cli_helpers_compare import discover_project_config
        from abicheck.config_paths import discover_build_config

        def _validate_or_exit(doc: dict, source_desc: str) -> None:
            # Codex review (P2): a base document loaded below via a bare
            # `yaml.safe_load` is syntactically valid YAML, but was never run
            # through the real strict-schema check (`BuildConfig.from_dict`)
            # the native CLI's own `load_build_config`/
            # `discover_project_config` loading path always applies before any
            # command sees the parsed config. Left unchecked, a schema-invalid
            # value in a field this step goes on to STRIP (`build.query: 7`,
            # `compile.compiler: []`) or CAP (`resource_limits.
            # max_bundle_facts_decode_nodes: "no"`) is silently deleted/
            # replaced by strip_untrusted_execution_keys() below before the
            # nested "Run analysis" step's own CLI ever gets a chance to
            # reject it -- and a malformed `assurance:` value would otherwise
            # be silently overwritten by this step's own `assurance
            # ["require_complete"] = True` merge further down. Both turn a
            # config a direct `compare --config <file>` invocation would
            # refuse outright into a silently-accepted run purely because
            # `analysis-assurance-complete` happened to be enabled. Validating
            # here, before any stripping/merge happens, surfaces the identical
            # error the user would see running abicheck directly against this
            # file. Shared with action/run.sh's own equivalent merge helper
            # via abicheck.action_config_overlay.validate_base_config so the
            # two call sites can't independently drift on what counts as a
            # valid base document.
            try:
                validate_base_config(doc)
            except ValueError as exc:
                raise SystemExit(
                    f"::error::the config at {source_desc} is invalid: {exc}. "
                    "Refusing to silently proceed with (or merge on top of) a "
                    "malformed project config -- fix the file or remove it."
                ) from exc

        base_path_env = os.environ.get("ABICHECK_BASE_CONFIG", "")
        data: dict = {}
        source_desc = "<build-config>"
        # found_path anchors rebase_relative_config_paths() below -- the real,
        # on-disk location `data` was loaded from, used only to resolve a
        # config-relative `compile.include_dirs` entry against the correct
        # project root. None means no config was found at all (nothing to
        # rebase against, and nothing to merge onto but the bare overlay).
        found_path: Path | None = None
        if base_path_env:
            # An explicit build-config was given: use it as the base. This is
            # an operator's own deliberate action (the user named this exact
            # file), already the trusted case cli_options.py's own
            # `explicit_config = build_config is not None` check grants --
            # see strip_untrusted_execution_keys's own docstring -- so
            # build.query/compile.compiler/resource_limits are NOT stripped
            # here, unchanged from before. A relative compile.include_dirs
            # entry is still rebased below (Codex review, fresh evidence):
            # that is a pure correctness concern independent of trust -- an
            # explicit config with a relative include dir breaks exactly the
            # same way a discovered one does the moment its document moves to
            # this step's own $RUNNER_TEMP-located overlay file.
            base_path = Path(base_path_env)
            source_desc = str(base_path)
            found_path = base_path
            with open(base_path, encoding="utf-8") as fh:
                loaded = yaml.safe_load(fh)
            if loaded is not None:
                if not isinstance(loaded, dict):
                    raise SystemExit(
                        f"::error::{source_desc} does not parse to a YAML mapping "
                        "-- cannot merge an assurance.require_complete overlay "
                        "into it."
                    )
                _validate_or_exit(loaded, source_desc)
                data = loaded
        else:
            # No explicit build-config: discover the project's real
            # .abicheck.yml the same way the nested root Action's own CLI
            # would (Codex review). Without this, passing the bare overlay
            # as an explicit --config/build-config would DISABLE the root
            # Action's/CLI's normal auto-discovery, silently dropping every
            # other project setting (scope/severity/policy/compile/...) the
            # moment analysis.assurance: complete is enabled.
            discovered = discover_project_config(Path(os.environ["ABICHECK_DISCOVER_START"]))
            if discovered is not None:
                source_desc = str(discovered)
                found_path = discovered
                loaded = yaml.safe_load(discovered.read_text(encoding="utf-8"))
                if loaded is not None:
                    if not isinstance(loaded, dict):
                        raise SystemExit(
                            f"::error::{source_desc} does not parse to a YAML "
                            "mapping -- cannot merge an assurance.require_complete "
                            "overlay into it."
                        )
                    _validate_or_exit(loaded, source_desc)
                    data = loaded
            # Sources-root promotion (Codex review, P1, fresh evidence, PR
            # #1222 third round): `discover_project_config` above walks UP
            # from ABICHECK_DISCOVER_START (this Action's own checkout root)
            # -- it can never find a config that lives AT `inputs.sources`
            # itself when that tree sits below the checkout root, since an
            # upward walk never descends into a subdirectory. But the nested
            # "Run analysis" step below forwards this step's own overlay as
            # an EXPLICIT --build-config, which -- per cli_options.py's
            # `explicit_config = build_config is not None` -- permanently
            # short-circuits the nested compare/scan's own single-sided
            # `build_config or discover_build_config(sources)` resolution
            # (`abicheck/buildsource/embed.py`'s `embed_build_source()`,
            # `cli_options.py`'s compile-context resolution): without this
            # step performing the identical sources-root lookup itself and
            # folding it in, a sources-root `.abicheck.yml`'s own build:/
            # sources: settings (compile-DB selection, build-system targets,
            # graph-detail settings) would be silently shadowed the moment
            # `analysis-assurance-complete` synthesizes this overlay --
            # purely an artifact of how the overlay is generated, not
            # anything the caller asked for. `discover_build_config` (never
            # `discover_project_config`) is the correct lookup here --
            # non-recursive, anchored at the sources root itself, exactly
            # matching `embed_build_source()`'s own selection -- and, when it
            # finds a config DISTINCT from the checkout-root one just above,
            # that document's own build:/sources: blocks REPLACE (not merge
            # into) the checkout-root document's own such blocks, via the
            # identical shared primitive (abicheck.action_config_overlay.
            # apply_sources_root_config_blocks) action/run.sh's own
            # equivalent compile-context overlay merge uses, so the two
            # callers cannot independently drift on this selection.
            #
            # Whether compile:/source:(singular)/debug: are ALSO safe to
            # promote from this sources-root document (in addition to
            # build:/sources:, always promoted below) depends on whether
            # THIS step's own nested "Run analysis" invocation resolves
            # those three blocks single-sidedly or pair-wide for this
            # particular kind/mode combination -- computed by this step's
            # own `env:` block (see SOURCES_PAIRWISE's docstring there for
            # the exact kind/mode reasoning) rather than guessed at here, a
            # fix for a previous round's belief that "this step has no
            # reliable way to determine" that distinction. Mirrors
            # run.sh's own ABICHECK_SOURCES_PAIRWISE-gated block selection
            # exactly (Codex review, fresh evidence, PR #1222 fourth round).
            # `apply_sources_root_config_blocks` below promotes `compile:`
            # as a real per-field MERGE onto the checkout document's own
            # `compile:` block, not a wholesale replace -- a fresh
            # regression this same fourth round introduced and then fixed
            # (Codex review): `cli_options.merge_compile_config` folds a
            # sources-root document's `compile:` on TOP of an
            # already-resolved checkout-config context, field by field, so
            # replacing the whole block would silently drop a checkout-only
            # `compile:` setting (`compile.std`, an explicit
            # `include_dirs`, ...) the sources-root document doesn't happen
            # to also specify. `build:`/`sources:` stay genuine whole-block
            # replacements -- each is a real single-document selection in
            # the normal pipeline too. See `abicheck.action_config_overlay.
            # _merge_compile_block`'s own docstring for the exact per-field
            # precedence `compile:` reproduces.
            _sources_pairwise = (
                os.environ.get("ABICHECK_SOURCES_PAIRWISE", "") == "pairwise"
            )
            # Codex review, fresh evidence, PR #1222 fourth round, second
            # finding: within the single-sided bucket, `compile:` does NOT
            # always resolve the same way -- see the "Generate
            # assurance-overlay config" step's own SOURCES_MERGE_COMPILE
            # env docstring and `apply_sources_root_config_blocks`'s own
            # `merge_compile` parameter docstring for the exact
            # distinction (mode: scan's single-document REPLACE vs.
            # mode: compare's checkout-then-sources two-stage MERGE).
            _sources_merge_compile = (
                os.environ.get("ABICHECK_SOURCES_MERGE_COMPILE", "") == "true"
            )
            # `source:`(singular)/`debug:` are NOT safe to promote from the
            # sources-root document whenever this same `_sources_merge_
            # compile` flag is set (Codex review, P1, fresh evidence, PR
            # #1222 eighth round): that flag is true exactly for `mode:
            # compare`'s own single-sided shape (a stored-snapshot old
            # operand; see SOURCES_MERGE_COMPILE's own env docstring), and
            # `compare`'s real pipeline never resolves `source:`/`debug:`
            # from a per-side `--sources` tree's own document at all --
            # unlike `compile:`, which the checkout-then-sources two-stage
            # MERGE above genuinely folds. `frontends/cli/commands/
            # compare.py`'s `_embed_inline_source_side` receives BOTH as
            # already-frozen arguments (`_resolved_collect_mode`/
            # `_resolved_debug`), computed once from the checkout-side
            # `resolved_cfg` before any per-side tree is even considered,
            # and forwards them verbatim to the nested dump invocation via
            # its private `_resolved_collect_mode`/
            # `_resolved_debug` hooks -- `frontends/cli/dump_debug_config.
            # resolve_dump_debug_fields` only ever falls back to resolving
            # a tree's own document when `resolved_debug` is `None`, which
            # never happens on `compare`'s own call path. So promoting
            # these two blocks here for `mode: compare` would let a
            # sources-root document control this run's collection depth
            # (`source:`) or debug-info extraction (`debug:`) in a way the
            # real, non-overlay `compare` invocation never permits --
            # exactly the kind of overlay-only side effect `analysis.
            # assurance: complete` must never introduce. `dump`/`scan`
            # (`_sources_merge_compile` unset) are unaffected: their own
            # single-document selection genuinely takes `source:`/`debug:`
            # from the `--sources` tree's own document exclusively
            # (`resolve_dump_debug_config`'s `build_config or
            # discover_build_config(sources)`), the identical shape
            # `build:`/`sources:` already use -- see this function's own
            # module docstring and `apply_sources_root_config_blocks`'s own
            # docstring for the full account.
            _sources_root_blocks = (
                ("build", "sources")
                if _sources_pairwise
                else ("build", "sources", "compile")
                if _sources_merge_compile
                else ("build", "sources", "compile", "source", "debug")
            )
            _sources_root_env = os.environ.get("ABICHECK_SOURCES_ROOT", "")
            if _sources_root_env:
                _sources_found = discover_build_config(Path(_sources_root_env))
                if _sources_found is not None and _sources_found != found_path:
                    try:
                        _sources_loaded = yaml.safe_load(
                            _sources_found.read_text(encoding="utf-8")
                        )
                    except Exception as exc:
                        raise SystemExit(
                            "::error::failed to parse the discovered "
                            f"sources-root config {_sources_found}: {exc}. "
                            "Refusing to silently proceed as if it were "
                            "unconfigured."
                        ) from exc
                    # An empty (or non-mapping) sources-root .abicheck.yml is
                    # not "no config found" -- the file still EXISTS, so
                    # discover_build_config() still selects it exclusively;
                    # apply_sources_root_config_blocks() itself treats that
                    # as an empty document and clears both blocks, matching
                    # load_build_config()'s own empty-BuildConfig outcome
                    # (see that function's own docstring).
                    if isinstance(_sources_loaded, dict):
                        _validate_or_exit(_sources_loaded, str(_sources_found))
                    # Rebase EACH document's own compile.include_dirs
                    # against ITS OWN project root BEFORE merging (Codex
                    # review, fresh evidence): `compile:` is now a real
                    # per-field MERGE (see apply_sources_root_config_blocks'
                    # own docstring), so a merged include_dirs can hold
                    # entries from BOTH documents -- the single later
                    # rebase_relative_config_paths() call below anchors
                    # against only ONE root, which would silently
                    # mis-resolve the other document's own relative entries
                    # once compile: stopped being a whole-document
                    # selection. Pre-resolving each document's own entries
                    # to absolute paths here, before the merge, makes that
                    # later single-anchor call a safe no-op for both (an
                    # already-absolute path is left untouched).
                    if found_path is not None:
                        data = rebase_relative_config_paths(
                            data, found_path=found_path
                        )
                    if isinstance(_sources_loaded, dict):
                        _sources_loaded = rebase_relative_config_paths(
                            _sources_loaded, found_path=_sources_found
                        )
                    data = apply_sources_root_config_blocks(
                        data,
                        _sources_loaded,
                        blocks=_sources_root_blocks,
                        merge_compile=_sources_merge_compile,
                    )
                    # found_path anchors compile.include_dirs's own rebase
                    # below -- reassign it to the sources-root document ONLY
                    # when compile: was actually sourced from it (mirrors
                    # run.sh's own identical `if not sources_pairwise:
                    # found_path = sources_found`): a pairwise caller's own
                    # compile: block (never promoted from the sources root,
                    # per _sources_root_blocks above) must keep resolving
                    # against whichever document actually supplied
                    # base["compile"] (the checkout-root config, if any). Now
                    # that both documents' own include_dirs entries are
                    # already absolute (above), this reassignment only
                    # matters for a caller that never merges compile: at all
                    # (pairwise) -- the rebase call below is otherwise a
                    # no-op regardless of which root it names.
                    if not _sources_pairwise:
                        found_path = _sources_found
            # Security (Codex review, third round): this discovered document
            # is PR-controlled, untrusted content -- exactly what
            # cli_options.py's compile.compiler gate and ADR-032 D5's
            # build.query gate exist to withhold "explicit --config, operator
            # authorized this to run" status from. But every downstream
            # `--config`/`build-config` (this step's own `config-path` output,
            # forwarded to "Run analysis" below) IS an explicit one from the
            # nested root Action's own perspective -- forwarding this
            # document unchanged would launder an untrusted build.query/
            # compile.compiler into that trusted, executable-authorized
            # status the moment a PR merely declares
            # `analysis.assurance: complete` (or, on this Action's own
            # `analysis-assurance-complete` input, any project using this
            # check without an explicit build-config), a privilege-
            # escalation / command-injection path. Strip/cap exactly the
            # fields action/run.sh's own equivalent merge withholds from an
            # auto-discovered config, via the identical shared
            # implementation (abicheck.action_config_overlay -- see its
            # module docstring) so the two can't independently drift.
            data = strip_untrusted_execution_keys(data)
            build_blk = data.get("build")
            if isinstance(build_blk, dict) and "compile_db" in build_blk:
                # Codex review, fresh evidence: a previous round always
                # stripped here, believing this step had no --sources root
                # to validate the glob against -- but this step's own
                # `sources` Action input (mirrored into ABICHECK_SOURCES_ROOT
                # by the env: block above, identically to how "Run analysis"
                # below will itself resolve --sources) IS that root. Keep a
                # demonstrably-resolving discovered build.compile_db instead
                # of unconditionally discarding valid L3-L5 compiler-flag
                # evidence, via the identical shared resolution
                # action/run.sh's own compile-context overlay uses
                # (discovered_compile_db_resolves -- see its own docstring)
                # so the two callers can't independently drift on what
                # counts as "resolves".
                _sources_root = os.environ.get("ABICHECK_SOURCES_ROOT", "")
                if not discovered_compile_db_resolves(
                    build_blk["compile_db"], _sources_root
                ):
                    build_blk = dict(build_blk)
                    del build_blk["compile_db"]
                    data["build"] = build_blk
                    print(
                        "::warning::the discovered .abicheck.yml's "
                        "build.compile_db was dropped from this synthesized "
                        "--config overlay -- forwarding it would silently "
                        "promote it to an explicit, must-not-be-missing "
                        "compile-DB path; set build-config explicitly (naming a "
                        "config you reviewed) to opt in.",
                        file=sys.stderr,
                    )
        if found_path is not None:
            # Correctness (Codex review, fresh evidence): `data` is about to
            # be written to a FRESH path (this step's own $RUNNER_TEMP-
            # located overlay file, never `found_path`'s own directory), so a
            # config-relative compile.include_dirs entry must be rewritten to
            # an absolute path anchored at `found_path`'s own project root
            # first -- left unrebased, it would silently resolve against the
            # overlay file's own scratch location instead of the real
            # project the moment this step runs.
            data = rebase_relative_config_paths(data, found_path=found_path)
        assurance = data.get("assurance")
        # Only a missing key or an explicit null/empty value is safe to
        # treat as "no assurance block yet" and overlay onto. Normal
        # BuildConfig ingestion (buildsource/build_config.py) rejects any
        # other non-mapping assurance: value (a bool, a bare string, a
        # list, a number) as a schema error outright -- silently replacing
        # one with {} here would make an otherwise-invalid project config
        # "valid" the moment this workflow gate is enabled, discarding the
        # user's actual (malformed) value instead of surfacing their
        # mistake (Codex review).
        if assurance is None:
            assurance = {}
        elif not isinstance(assurance, dict):
            raise SystemExit(
                f"::error::{source_desc}: assurance: must be "
                "a mapping (or omitted/null), got "
                f"{type(assurance).__name__} ({assurance!r}) -- cannot merge "
                "an assurance.require_complete overlay into it."
            )
        else:
            # Codex review (P2): `yaml.safe_load()` resolves a YAML anchor/
            # alias pair (e.g. `assurance: &shared {}` / `gate: *shared`)
            # to the SAME dict object for both keys. Mutating `assurance`
            # in place below would therefore also mutate whatever OTHER
            # top-level key shares this object -- `yaml.safe_dump()`
            # preserves the alias relationship, so the written overlay
            # would carry `require_complete` under that unrelated key too
            # (e.g. `gate.require_complete`, which the nested CLI then
            # rejects as an unknown field on an otherwise perfectly valid
            # config). A shallow copy is enough here: only a scalar key is
            # being added, and this block never mutates one of
            # `assurance`'s own nested values in place, so nothing deeper
            # in the object graph is at risk of this same aliasing hazard.
            assurance = dict(assurance)
        # Additive over whatever the base config already declared under
        # assurance: -- only require_complete is forced to true, exactly the
        # one field this overlay exists to set.
        assurance["require_complete"] = True
        data["assurance"] = assurance
        with open(os.environ["ABICHECK_OUT_PATH"], "w", encoding="utf-8") as fh:
            yaml.safe_dump(data, fh, sort_keys=False)
        PYSCRIPT
        )
        # Forward the ABSOLUTE path of the freshly-`mktemp`-created file
        # (never the old in-checkout relative name) to "Run analysis" below,
        # which reads it back out as this step's own output rather than a
        # path re-derived (and therefore re-guessable) from a fixed string.
        echo "config-path=$_assurance_out_path" >> "$GITHUB_OUTPUT"

    - name: Clean stale analysis output
      shell: bash
      run: rm -f check-target-analysis.json

    - name: Run analysis
      id: analysis
      if: |
        (inputs.baseline-channel == 'none' || steps.resolve.outputs.outcome == 'resolved') &&
        steps.collect_verify.outcome != 'failure' &&
        steps.collect_replay.outcome != 'failure' &&
        steps.consumer_context.outcome != 'failure' &&
        steps.assurance_overlay.outcome != 'failure'
      continue-on-error: true
      uses: ./.abicheck-check-target-src
      with:
        mode: ${{ inputs.baseline-channel == 'none' && 'scan' || 'compare' }}
        old-library: ${{ inputs.kind == 'bundle' && steps.resolve.outputs.binaries-dir || steps.resolve.outputs.snapshot-path }}
        new-library: ${{ steps.consumer_context.outcome == 'success' && 'check-target-consumer.abi.json' || inputs.new-library }}
        header: ${{ steps.consumer_context.outcome == 'success' && '' || inputs.header }}
        old-header: ${{ inputs.old-header }}
        new-header: ${{ steps.consumer_context.outcome == 'success' && '' || inputs.new-header }}
        include: ${{ inputs.include }}
        old-include: ${{ inputs.old-include }}
        new-include: ${{ steps.consumer_context.outcome == 'success' && '' || inputs.new-include }}
        lang: ${{ inputs.lang }}
        ast-frontend: ${{ steps.consumer_context.outcome == 'success' && '' || inputs.ast-frontend }}
        gcc-path: ${{ steps.consumer_context.outcome == 'success' && '' || inputs.gcc-path }}
        gcc-prefix: ${{ inputs.gcc-prefix }}
        gcc-options: ${{ steps.consumer_context.outcome == 'success' && '' || inputs.gcc-options }}
        sysroot: ${{ inputs.sysroot }}
        # collect-facts' own replay phase defaults an empty `sources` to '.'
        # internally (run.sh: `SOURCES="${INPUT_SOURCES:-.}"`) but never
        # surfaces that resolved value as an output -- it only prints a
        # notice telling the caller to "pass sources: $SOURCES directly to
        # dump/scan/compare". Forwarding the raw (still-empty) inputs.sources
        # here instead left action/run.sh's add_single_flag skipping --sources
        # entirely (it omits the flag for an empty value), so a replay check
        # with sources: left unset would pass the collect-facts step but then
        # run compare/scan with NO source evidence at all -- silently missing
        # source-only findings at requested-depth: build/source (Codex
        # review). Mirror collect-facts' own default here so the analysis
        # step sees the same directory replay validated.
        sources: ${{ steps.consumer_context.outcome == 'success' && '' || (inputs.sources != '' && inputs.sources || (inputs.evidence-producer == 'replay' && '.' || '')) }}
        build-info: ${{ steps.consumer_context.outcome == 'success' && '' || ((inputs.evidence-producer == 'wrapper' || inputs.evidence-producer == 'clang-plugin') && inputs.evidence-pack-path || inputs.build-info) }}
        compile-db: ${{ steps.consumer_context.outcome == 'success' && '' || inputs.compile-db }}
        # "Generate assurance-overlay config" above (this step is skipped
        # entirely when analysis-assurance-complete != 'true', in which case
        # its own outcome reads 'skipped' and this falls back to the plain
        # build-config input unchanged).
        build-config: ${{ steps.assurance_overlay.outcome == 'success' && steps.assurance_overlay.outputs.config-path || inputs.build-config }}
        depth: ${{ inputs.requested-depth }}
        used-by: ${{ inputs.target-kind == 'app-consumer' && inputs.consumer-binary || '' }}
        required-symbols: ${{ inputs.target-kind == 'plugin-contract' && inputs.contract-file || '' }}
        policy: ${{ inputs.policy }}
        policy-file: ${{ inputs.policy-file }}
        suppress: ${{ inputs.suppress }}
        severity-preset: ${{ inputs.severity-preset }}
        # require-complete-analysis: RETIRED -- this Action's own input (see
        # its docstring above) is validated to 'false' before this step can
        # ever run, and the root Action's own input it used to forward to is
        # gone too, so there is nothing left to forward here.
        extra-args: ${{ inputs.extra-args }}
        format: 'json'
        output-file: 'check-target-analysis.json'
        add-job-summary: 'false'
        pr-comment: 'false'
        upload-sarif: 'false'
        python-version: ${{ inputs.python-version }}
        install-deps: ${{ inputs.install-deps }}
        dependency-source: ${{ inputs.dependency-source }}

    # ── Always write the report envelope, regardless of the above steps' ───
    # outcomes (ADR-047 §7: "always execute the report-envelope-writing ─────
    # step") and own check-target's actual composite exit code last. ───────
    - name: Write report envelope and finalize
      id: finalize
      shell: bash
      env:
        INPUT_KIND: ${{ inputs.kind }}
        INPUT_NAME: ${{ inputs.name }}
        INPUT_PROFILE: ${{ inputs.profile }}
        INPUT_BASELINE_CHANNEL: ${{ inputs.baseline-channel }}
        INPUT_REQUESTED_DEPTH: ${{ inputs.requested-depth }}
        INPUT_EXPLICIT_ID: ${{ inputs.explicit-id }}
        INPUT_GATE_MODE: ${{ inputs.gate-mode }}
        INPUT_PROJECT: ${{ inputs.project }}
        INPUT_HEAD_SHA: ${{ inputs.head-sha }}
        INPUT_BASE_REF: ${{ inputs.base-ref }}
        INPUT_ACTION_VERSION: ${{ inputs.action-version }}
        RESOLVE_RAN: ${{ inputs.baseline-channel != 'none' }}
        RESOLVE_OUTCOME: ${{ steps.resolve.outputs.outcome }}
        RESOLVE_BOOTSTRAP: ${{ steps.resolve.outputs.bootstrap }}
        RESOLVE_MESSAGE: ${{ steps.resolve.outputs.message }}
        ANALYSIS_RAN: ${{ steps.analysis.outcome != 'skipped' }}
        ANALYSIS_OUTCOME: ${{ steps.analysis.outcome }}
        ANALYSIS_VERDICT: ${{ steps.analysis.outputs.verdict }}
        ANALYSIS_REPORT_PATH: ${{ steps.analysis.outputs.report-path }}
        ANALYSIS_EXIT_CODE: ${{ steps.analysis.outputs.exit-code }}
        COLLECT_VERIFY_OUTCOME: ${{ steps.collect_verify.outcome }}
        COLLECT_REPLAY_OUTCOME: ${{ steps.collect_replay.outcome }}
        CONSUMER_CONTEXT_OUTCOME: ${{ steps.consumer_context.outcome }}
        ASSURANCE_OVERLAY_OUTCOME: ${{ steps.assurance_overlay.outcome }}
        ACTION_PATH: ${{ github.action_path }}
      run: bash "${{ github.action_path }}/run.sh"
