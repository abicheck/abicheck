name: 'abicheck baseline'
description: >-
  Dump a set of libraries into a baseline-set (one snapshot file per
  library plus a manifest.json recording fact-set identity, profile, and
  per-library content digests), instead of a single `*.abicheck.json` that
  a multi-library release has no honest way to fit into. Read-only: this
  Action never commits or pushes -- publishing the result is the calling
  workflow's job (see docs/use/baseline-management.md).

branding:
  icon: 'archive'
  color: 'blue'

inputs:
  libraries:
    description: >
      JSON array of libraries to dump, one object per library:
      `[{"name": "libfoo", "artifact": "build/libfoo.so", "header":
      "include/foo.h", "include": "include", "stage_binary": true}, ...]`.
      `name` and `artifact` are required per entry; `header`/`include` are
      optional (space-separated for multiple paths, matching the main
      Action's `header`/`include` inputs). `stage_binary` is an optional
      boolean (default false): when true, this library's real ELF binary is
      additionally copied into `<output-dir>/binaries/<name>` and recorded
      in the manifest (`binary`/`binary_sha256`) -- set it for any library
      that is a member of a release bundle (ADR-047 section 6/section 8 S14
      correction), since bundle-scoped analysis
      (`abicheck/bundle.py`'s `build_bundle_snapshot()`) reads real ELF
      binaries and skips non-ELF inputs, including this Action's own
      `.abicheck.json` snapshots.
    required: true
  output-dir:
    description: 'Directory to write the per-library snapshots and manifest.json into.'
    required: false
    default: '.abicheck-baseline'
  project-ref:
    description: 'Release/version label recorded in the manifest and passed as each dump''s --version (e.g. github.ref_name).'
    required: false
    default: ''
  profile:
    description: >
      Build-profile identifier recorded in the manifest (platform/
      architecture/compiler/ISA/debug-or-release, e.g.
      "linux-x86_64-icx-avx2-debug") -- see baseline-management.md#baseline-identity-is-more-than-a-version-number
      for why a version number alone is not a safe baseline identity for a
      project with more than one build profile.
    required: false
    default: ''
  build-info:
    description: >
      Shared build/source facts pack (e.g. from the collect-facts Action)
      passed as --build-info to every library's dump call. Omit for a
      binary/header-only (L0-L2) baseline-set.
    required: false
  depth:
    description: 'Evidence depth passed to every dump call (binary, headers, build, or source). Omit for the CLI default.'
    required: false
  baseline-generation:
    description: >
      Scanner-compatibility generation to record in the manifest (a
      non-negative integer) -- a caller-assigned identity for the subset of
      abicheck upgrades that actually invalidate a baseline (a fixed or
      newly-extracted fact, a changed normalization/hash recipe, a schema
      bump), distinct from the installed abicheck *version* (which also
      changes for report-format/policy/detector-only upgrades that don't
      need a new baseline). Omit to leave it unset (baseline_generation:
      null in the manifest). Leaving it unset does NOT by itself disable
      resolve-baseline's stale_generation check -- that check is opt-in on
      the CONSUMER side (resolve-baseline's own expected-baseline-generation
      input): if a consumer requires a specific generation while this
      producer input is left unset, every comparison against this
      baseline-set fails as stale_generation. Keep both sides in sync -- set
      this input whenever a consumer is given an expected-baseline-
      generation to check against. See
      docs/use/baseline-management.md#scanner-upgrades-and-baseline-generations.
    required: false
    default: ''
  previous-manifest:
    description: >
      Path to a previous manifest.json to diff against for the
      refresh-required/refresh-reasons outputs. Omit to skip the freshness
      comparison (refresh-required is always 'false' without one -- there
      is nothing to compare against, not a claim that no refresh is
      needed).
    required: false
  validation:
    description: >
      'strict' (default) round-trips each freshly-dumped snapshot through
      a self-compare (compare a.json against itself) as a sanity check
      that the file it just wrote is loadable and internally consistent;
      'none' skips it.
    required: false
    default: 'strict'
  snapshot-compression:
    description: >
      Storage encoding (ADR-059) for each library's dumped snapshot: 'none'
      (default, plain .abicheck.json -- unchanged behavior), 'gzip', or
      'zstd'. A large multi-library baseline-set's combined snapshot size
      can dominate CI artifact storage/transfer time; compression is a
      pure storage envelope around identical JSON content, transparently
      read back by `compare`/`scan --against`/resolve-baseline regardless
      of this setting. Every library in one baseline-set run uses the same
      encoding -- manifest.json records each artifact's actual encoding
      individually (informational; resolution never trusts it, only the
      snapshot's own magic bytes).
    required: false
    default: 'none'
  python-version:
    description: 'Python version for setup-python.'
    required: false
    default: '3.13'
  install-deps:
    description: 'Install system dependencies (castxml, gcc). Set to false if pre-installed.'
    required: false
    default: 'true'

outputs:
  baseline-path:
    description: 'The output-dir this run wrote into.'
    value: ${{ steps.run-baseline.outputs.baseline-path }}
  manifest-path:
    description: 'Path to the generated manifest.json.'
    value: ${{ steps.run-baseline.outputs.manifest-path }}
  library-count:
    description: 'Number of libraries successfully dumped into this baseline-set.'
    value: ${{ steps.run-baseline.outputs.library-count }}
  content-digest:
    description: 'SHA-256 over the manifest''s artifact list (library names + per-file digests, including each staged bundle-member binary''s own digest when present) -- changes whenever any library''s snapshot content, or a staged binary''s bytes, changes.'
    value: ${{ steps.run-baseline.outputs.content-digest }}
  refresh-required:
    description: >
      'true' when previous-manifest was given and this run's manifest
      differs from it in a way that means old comparisons against it are
      no longer trustworthy (snapshot_schema, baseline_generation,
      fact_set identity, or the library set changed). 'false' when no
      previous-manifest was given, or none of those changed.
    value: ${{ steps.run-baseline.outputs.refresh-required }}
  refresh-reasons:
    description: 'Semicolon-separated human-readable reasons refresh-required is true. Empty otherwise.'
    value: ${{ steps.run-baseline.outputs.refresh-reasons }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install system dependencies
      if: inputs.install-deps == 'true'
      shell: bash
      run: bash "${{ github.action_path }}/../../action/install-deps.sh"

    - name: Install abicheck
      shell: bash
      run: pip install "${{ github.action_path }}/../.."

    - name: Dump baseline-set
      id: run-baseline
      shell: bash
      env:
        INPUT_LIBRARIES: ${{ inputs.libraries }}
        INPUT_OUTPUT_DIR: ${{ inputs.output-dir }}
        INPUT_PROJECT_REF: ${{ inputs.project-ref }}
        INPUT_PROFILE: ${{ inputs.profile }}
        INPUT_BUILD_INFO: ${{ inputs.build-info }}
        INPUT_DEPTH: ${{ inputs.depth }}
        INPUT_BASELINE_GENERATION: ${{ inputs.baseline-generation }}
        INPUT_PREVIOUS_MANIFEST: ${{ inputs.previous-manifest }}
        INPUT_VALIDATION: ${{ inputs.validation }}
        INPUT_SNAPSHOT_COMPRESSION: ${{ inputs.snapshot-compression }}
        ACTION_PATH: ${{ github.action_path }}
      run: bash "${{ github.action_path }}/run.sh"
