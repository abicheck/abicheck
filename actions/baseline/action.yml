name: 'abicheck baseline'
description: >-
  Dump a set of libraries into a baseline-set (one snapshot file per
  library plus a manifest.json recording fact-set identity, profile, and
  per-library content digests), instead of a single `*.abicheck.json` that
  a multi-library release has no honest way to fit into. Read-only: this
  Action never commits or pushes -- publishing the result is the calling
  workflow's job (see docs/use/baseline-management.md).

branding:
  icon: 'archive'
  color: 'blue'

inputs:
  libraries:
    description: >
      JSON array of libraries to dump, one object per library:
      `[{"name": "libfoo", "artifact": "build/libfoo.so", "header":
      "include/foo.h", "include": "include", "stage_binary": true}, ...]`.
      `name` and `artifact` are required per entry; `header`/`include` are
      optional (space-separated for multiple paths, matching the main
      Action's `header`/`include` inputs). `stage_binary` is an optional
      boolean (default false): when true, this library's real ELF binary is
      additionally copied into `<output-dir>/binaries/<name>` and recorded
      in the manifest (`binary`/`binary_sha256`) -- set it for any library
      that is a member of a release bundle (ADR-047 section 6/section 8 S14
      correction), since bundle-scoped analysis
      (`abicheck/bundle.py`'s `build_bundle_snapshot()`) reads real ELF
      binaries and skips non-ELF inputs, including this Action's own
      `.abicheck.json` snapshots.

      Optional when `library-spec` is given, which produces this exact array
      from a declarative spec instead of the caller building it in shell.
    required: false
    default: ''
  library-spec:
    description: >
      Path to a JSON file declaring the libraries to dump *by pattern*
      rather than by resolved path -- the same entry vocabulary as
      `libraries` (`name`/`artifact`/`header`/`include`/`stage_binary`),
      except that every path field is a glob resolved against
      `library-root`, `header`/`include` additionally accept a JSON array,
      and `header_exclude` is accepted:

        [{"name": "libfoo",
          "artifact": "lib/libfoo.so*",
          "header": ["include/foo/*.h"],
          "header_exclude": ["include/foo/plugin.h"],
          "include": ["include", "/opt/dep/include"]},
         {"name": "libfooPlugin",
          "artifact": "lib/libfooPlugin.so*",
          "header": ["include/foo/plugin.h"],
          "include": ["include", "/opt/dep/include"]}]

      This exists so an integrator declaring "this component owns every
      installed public header except the one its sibling owns" does not have
      to hand-roll find/grep/readelf in shell. Resolution (see
      `abicheck.frontends.action.library_selection`) picks the single real
      shared object out of a directory that also holds its SONAME symlinks
      (aliases are de-duplicated by resolved identity, not banned -- only a
      link escaping `library-root`, or two genuinely distinct files, is
      refused), checks each artifact is an ELF shared object (ET_DYN) and
      that every component names the same machine, and refuses a header or
      exclusion pattern matching nothing rather than silently changing what
      a component owns. `include` roots are parser context only: they never
      widen the declarations a component is held responsible for, which is
      what lets two components share one installed header tree.

      Ignored when empty (default). Giving both `library-spec` and
      `libraries` is a usage error -- two declarations of one set is exactly
      the drift this input removes.
    required: false
    default: ''
  library-root:
    description: >
      Installation tree `library-spec`'s relative patterns resolve against.
      Defaults to the current working directory. An absolute pattern in the
      spec (a dependency's installed include prefix) is honoured as written
      and is not required to be under this root; a *relative* one never
      escapes it.
    required: false
    default: '.'
  library-spec-bindings:
    description: >
      Values to fill `${NAME}` placeholders in `library-spec` with, as one
      `NAME=VALUE` per line.

      A component declaration checked into a repository cannot spell the
      values its build system decides at build time -- a dependency's
      install prefix, or a host-arch directory component sitting in the
      middle of `lib/${HOST_ARCH}/libfoo.so*`. Without somewhere to bind
      those, a project writes its own substitution pass beside its own
      capture step, and a textual one mangles any value containing `&`, a
      quote, or a backslash.

      The given set is the WHOLE allowlist. An unbound `${...}` is refused
      rather than left as text (which fails later as a confusing "no such
      file") or read from the environment (which would make every variable
      on the runner an input to the component set). Values are inserted
      literally and never re-scanned, so this is a binding, not a templating
      language: no `$NAME`, no defaulting, no nesting, no recursion.
    required: false
    default: ''
  library-spec-require-elf:
    description: >
      'true' (default) -- every resolved artifact must be an ELF shared
      object. Set 'false' to declare a component whose artifact is a PE or
      Mach-O image, which also disables the same-machine agreement check.
    required: false
    default: 'true'
  output-dir:
    description: 'Directory to write the per-library snapshots and manifest.json into.'
    required: false
    default: '.abicheck-baseline'
  project-ref:
    description: 'Release/version label recorded in the manifest and passed as each dump''s --version (e.g. github.ref_name).'
    required: false
    default: ''
  profile:
    description: >
      Build-profile identifier recorded in the manifest (platform/
      architecture/compiler/ISA/debug-or-release, e.g.
      "linux-x86_64-icx-avx2-debug") -- see baseline-management.md#baseline-identity-is-more-than-a-version-number
      for why a version number alone is not a safe baseline identity for a
      project with more than one build profile.
    required: false
    default: ''
  build-info:
    description: >
      Shared build/source facts pack (e.g. from the collect-facts Action)
      passed as --build-info to every library's dump call. Omit for a
      binary/header-only (L0-L2) baseline-set.
    required: false
  depth:
    description: 'Evidence depth passed to every dump call (binary, headers, build, or source). Omit for the CLI default.'
    required: false
  build-config:
    description: >
      Path to the project config (`.abicheck.yml`) passed as `--config` to
      every library's dump call, the same input `actions/check-target`
      already takes. Without it, a baseline-set was dumped under abicheck's
      built-in defaults while the candidate side was analyzed under the
      project's own config -- so any config key that changes what a dump
      *extracts* (the `scope:`/`extraction:` families) made the two sides
      structurally non-comparable, with nothing in either artifact saying
      so. Passed verbatim; an explicit `--config` is a deliberate operator
      signal, so an unreadable/malformed path fails the run rather than
      falling back to auto-discovery. Omit to keep the previous behavior
      (dump's own auto-discovery from the working directory).
    required: false
    default: ''
  baseline-generation:
    description: >
      Scanner-compatibility generation to record in the manifest (a
      non-negative integer) -- a caller-assigned identity for the subset of
      abicheck upgrades that actually invalidate a baseline (a fixed or
      newly-extracted fact, a changed normalization/hash recipe, a schema
      bump), distinct from the installed abicheck *version* (which also
      changes for report-format/policy/detector-only upgrades that don't
      need a new baseline). Omit to leave it unset (baseline_generation:
      null in the manifest). Leaving it unset does NOT by itself disable
      resolve-baseline's stale_generation check -- that check is opt-in on
      the CONSUMER side (resolve-baseline's own expected-baseline-generation
      input): if a consumer requires a specific generation while this
      producer input is left unset, every comparison against this
      baseline-set fails as stale_generation. Keep both sides in sync -- set
      this input whenever a consumer is given an expected-baseline-
      generation to check against. See
      docs/use/baseline-management.md#scanner-upgrades-and-baseline-generations.
    required: false
    default: ''
  generator-git-sha:
    description: >
      Best-effort commit SHA of the abicheck checkout that produced this
      baseline-set, recorded in manifest.json's generator.git_sha for
      reproducibility/debugging (e.g. github.sha, when abicheck is
      vendored/checked out in the same job as this Action). Purely
      informational: unlike baseline-generation, it is never compared
      against an expectation and never affects refresh-required. Omit to
      leave it unset.
    required: false
    default: ''
  generator-action-ref:
    description: >
      Best-effort ref of this actions/baseline invocation, recorded in
      manifest.json's generator.action_ref (e.g. github.action_ref, when
      available in the calling context). Purely informational, same as
      generator-git-sha. Omit to leave it unset.
    required: false
    default: ''
  previous-manifest:
    description: >
      Path to a previous manifest.json to diff against for the
      refresh-required/refresh-reasons outputs. Omit to skip the freshness
      comparison (refresh-required is always 'false' without one -- there
      is nothing to compare against, not a claim that no refresh is
      needed).
    required: false
  validation:
    description: >
      'strict' (default) round-trips each freshly-dumped snapshot through
      a self-compare (compare a.json against itself) as a sanity check
      that the file it just wrote is loadable and internally consistent;
      'none' skips it.
    required: false
    default: 'strict'
  snapshot-compression:
    description: >
      Storage encoding (ADR-059) for each library's dumped snapshot: 'none'
      (default, plain .abicheck.json -- unchanged behavior), 'gzip', or
      'zstd'. A large multi-library baseline-set's combined snapshot size
      can dominate CI artifact storage/transfer time; compression is a
      pure storage envelope around identical JSON content, transparently
      read back by `compare`/`scan --against`/resolve-baseline regardless
      of this setting. Every library in one baseline-set run uses the same
      encoding -- manifest.json records each artifact's actual encoding
      individually (informational; resolution never trusts it, only the
      snapshot's own magic bytes).
    required: false
    default: 'none'
  python-version:
    description: 'Python version for setup-python.'
    required: false
    default: '3.13'
  install-deps:
    description: 'Install system dependencies (castxml, gcc). Set to false if pre-installed.'
    required: false
    default: 'true'

outputs:
  baseline-path:
    description: 'The output-dir this run wrote into.'
    value: ${{ steps.run-baseline.outputs.baseline-path }}
  manifest-path:
    description: 'Path to the generated manifest.json.'
    value: ${{ steps.run-baseline.outputs.manifest-path }}
  library-count:
    description: 'Number of libraries successfully dumped into this baseline-set.'
    value: ${{ steps.run-baseline.outputs.library-count }}
  resolved-libraries:
    description: >
      The concrete `libraries` array this run dumped. Echoes the `libraries`
      input when one was given; when `library-spec` was used instead, this is
      the resolved result -- so a caller can record exactly which artifact and
      headers each component resolved to, without re-globbing.
    value: ${{ steps.libraries.outputs.libraries || inputs.libraries }}
  machine:
    description: >
      The ELF machine every resolved artifact agreed on (e.g. `EM_X86_64`)
      when `library-spec` was used and agreement was checked. Empty otherwise.
    value: ${{ steps.libraries.outputs.machine }}
  content-digest:
    description: 'SHA-256 over the manifest''s artifact list (library names + per-file digests, including each staged bundle-member binary''s own digest when present) -- changes whenever any library''s snapshot content, or a staged binary''s bytes, changes.'
    value: ${{ steps.run-baseline.outputs.content-digest }}
  refresh-required:
    description: >
      'true' when previous-manifest was given and this run's manifest
      differs from it in a way that means old comparisons against it are
      no longer trustworthy (snapshot_schema, baseline_generation,
      fact_set identity, or the library set changed). 'false' when no
      previous-manifest was given, or none of those changed.
    value: ${{ steps.run-baseline.outputs.refresh-required }}
  refresh-reasons:
    description: 'Semicolon-separated human-readable reasons refresh-required is true. Empty otherwise.'
    value: ${{ steps.run-baseline.outputs.refresh-reasons }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install system dependencies
      if: inputs.install-deps == 'true'
      shell: bash
      run: bash "${{ github.action_path }}/../../action/install-deps.sh"

    - name: Install abicheck
      shell: bash
      run: pip install "${{ github.action_path }}/../.."

    - name: Resolve the declarative library spec
      id: libraries
      if: inputs.library-spec != ''
      shell: bash
      env:
        INPUT_LIBRARY_SPEC: ${{ inputs.library-spec }}
        INPUT_LIBRARY_ROOT: ${{ inputs.library-root }}
        INPUT_LIBRARY_SPEC_REQUIRE_ELF: ${{ inputs.library-spec-require-elf }}
        INPUT_LIBRARY_SPEC_BINDINGS: ${{ inputs.library-spec-bindings }}
        INPUT_LIBRARIES: ${{ inputs.libraries }}
      run: |
        set -euo pipefail
        if [[ -n "$INPUT_LIBRARIES" ]]; then
          echo "::error::give either 'libraries' or 'library-spec', not both -- two declarations of one component set is what library-spec exists to remove."
          exit 1
        fi
        elf_flag=--require-elf
        machine_flag=--require-same-machine
        if [[ "$INPUT_LIBRARY_SPEC_REQUIRE_ELF" != "true" ]]; then
          elf_flag=--no-require-elf
          machine_flag=--no-require-same-machine
        fi
        # One `--bind` per non-blank line, read with `IFS=` and `-r` so a
        # value keeps its leading/trailing spaces and its backslashes: an
        # install prefix is not this step's to normalise. A blank line is
        # skipped rather than becoming an empty binding, since a YAML block
        # scalar routinely ends with one.
        bind_args=()
        while IFS= read -r line; do
          [[ -n "${line//[[:space:]]/}" ]] || continue
          bind_args+=(--bind "$line")
        done <<< "${INPUT_LIBRARY_SPEC_BINDINGS:-}"

        python -m abicheck.frontends.action.cli resolve-libraries \
          "$INPUT_LIBRARY_SPEC" \
          --root "$INPUT_LIBRARY_ROOT" \
          "$elf_flag" "$machine_flag" \
          ${bind_args[@]+"${bind_args[@]}"} \
          --github-output "$GITHUB_OUTPUT" >/dev/null

    - name: Dump baseline-set
      id: run-baseline
      shell: bash
      env:
        INPUT_LIBRARIES: ${{ steps.libraries.outputs.libraries || inputs.libraries }}
        INPUT_OUTPUT_DIR: ${{ inputs.output-dir }}
        INPUT_PROJECT_REF: ${{ inputs.project-ref }}
        INPUT_PROFILE: ${{ inputs.profile }}
        INPUT_BUILD_INFO: ${{ inputs.build-info }}
        INPUT_DEPTH: ${{ inputs.depth }}
        INPUT_BUILD_CONFIG: ${{ inputs.build-config }}
        INPUT_BASELINE_GENERATION: ${{ inputs.baseline-generation }}
        INPUT_GENERATOR_GIT_SHA: ${{ inputs.generator-git-sha }}
        INPUT_GENERATOR_ACTION_REF: ${{ inputs.generator-action-ref }}
        INPUT_PREVIOUS_MANIFEST: ${{ inputs.previous-manifest }}
        INPUT_VALIDATION: ${{ inputs.validation }}
        INPUT_SNAPSHOT_COMPRESSION: ${{ inputs.snapshot-compression }}
        ACTION_PATH: ${{ github.action_path }}
      run: bash "${{ github.action_path }}/run.sh"
