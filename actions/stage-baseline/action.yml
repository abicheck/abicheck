name: 'abicheck stage-baseline'
description: >-
  Package a baseline-set directory (as produced by the `abicheck baseline`
  Action -- one snapshot file per library plus manifest.json) into a single
  distributable archive, named and encoded per a caller-supplied
  asset-name-template. Read-only over its input: this Action never commits,
  pushes, or uploads -- publishing the resulting archive (a GitHub Release
  asset, a workflow artifact, an external object store, ...) is the calling
  workflow's job, same division of responsibility as `abicheck baseline`
  itself and `resolve-baseline`.

  Exists so a caller that wants to publish a baseline-set through its own
  storage backend (not this repository's own publish-baseline.yml
  release-contract flow) doesn't have to hand-roll the archive-suffix
  dispatch itself -- `publish-baseline.yml` calls this exact Action for its
  own "Package baseline-set" step, so there is one implementation, not two
  that can drift apart.

branding:
  icon: 'package'
  color: 'blue'

inputs:
  baseline-path:
    description: >
      Directory containing a baseline-set's manifest.json plus per-library
      snapshots (and binaries/ for a bundle-scoped baseline) -- typically
      the `abicheck baseline` Action's own `baseline-path` output.
    required: true
  asset-name-template:
    description: >
      Archive filename to produce; "{profile}" is replaced with the
      profile input's value, and "{generation}" (optional -- see the
      generation input below) with the generation input's value. The
      archive encoding is chosen from this name's own extension --
      '.tar.zst' (zstd, requires a `tar` build with zstd support, e.g. GNU
      tar >= 1.31), '.tar.gz'/'.tgz' (gzip), or plain '.tar'
      (uncompressed). Any other extension is a hard usage error: a
      consumer (root action.yml's baseline-set fallback, resolve-baseline)
      picks its extractor from this exact suffix, so an unrecognized one
      would silently produce an asset nothing downstream can extract.
    required: false
    default: 'abicheck-baseline-{profile}.tar.zst'
  profile:
    description: >
      Substituted for "{profile}" in asset-name-template. Should match the
      `profile` this baseline-set's manifest.json itself records (the
      `abicheck baseline` Action's own `profile` input) -- a mismatch is
      not validated here, but a downstream consumer comparing against the
      manifest's own `profile` field (e.g. a release-publishing workflow's
      cross-profile collision guard) may reject it.
    required: false
    default: ''
  generation:
    description: >
      Substituted for "{generation}" in asset-name-template -- publishing
      a new scanner-compatibility generation (docs/use/baseline-
      management.md#scanner-upgrades-and-baseline-generations) as its own,
      separately-named archive rather than overwriting the previous
      generation's asset under the same name. Should match the
      `baseline_generation` this baseline-set's manifest.json itself
      records (the `abicheck baseline` Action's own `baseline-generation`
      input) -- a mismatch is not validated here. Omit (default) if
      asset-name-template doesn't reference "{generation}" at all -- e.g.
      the default template never does, so this input is a no-op unless the
      caller opts in by including the placeholder.
    required: false
    default: ''
  attest:
    description: >
      'false' (default) -- package only. 'true' -- also create a GitHub
      artifact attestation (SLSA build provenance, via
      actions/attest-build-provenance) for the archive, so a consumer can
      require it with verify-baseline-attestation: true on the root Action or
      actions/resolve-baseline. The calling job needs 'id-token: write' and
      'attestations: write' permissions. Unlike archive-sha256, which only
      helps when the consumer pins it somewhere an attacker cannot change,
      the attestation binds the archive's bytes to the repository and
      workflow that produced it.
    required: false
    default: 'false'

outputs:
  asset-name:
    description: 'The resolved archive filename (asset-name-template with {profile} substituted).'
    value: ${{ steps.package.outputs.asset-name }}
  archive-path:
    description: 'Path to the archive this Action wrote, relative to the workspace (same as asset-name -- the archive is written to the current working directory).'
    value: ${{ steps.package.outputs.asset-name }}
  archive-sha256:
    description: >
      Lowercase hex SHA-256 of the archive's raw bytes (no 'sha256:' prefix).
      Pass it, prefixed with 'sha256:' or bare, as expected-archive-digest to
      the root Action's baseline-set fallback or to actions/resolve-baseline
      to refuse any archive whose bytes differ from the ones staged here. The
      digest covers the whole archive file, so a consistently repacked archive
      (one whose manifest was rewritten to match) changes it too.
    value: ${{ steps.package.outputs.archive-sha256 }}
  attestation-url:
    description: "URL of the attestation created when attest is 'true'; empty otherwise."
    value: ${{ steps.attest.outputs.attestation-url }}

runs:
  using: 'composite'
  steps:
    - name: Package baseline-set
      id: package
      shell: bash
      env:
        BASELINE_PATH: ${{ inputs.baseline-path }}
        ASSET_NAME_TEMPLATE: ${{ inputs.asset-name-template }}
        PROFILE: ${{ inputs.profile }}
        GENERATION: ${{ inputs.generation }}
        ATTEST: ${{ inputs.attest }}
      run: bash "${{ github.action_path }}/run.sh"

    - name: Attest baseline-set archive
      id: attest
      if: inputs.attest == 'true'
      uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f  # v3.2.0
      with:
        subject-path: ${{ steps.package.outputs.asset-name }}
