site_name: abicheck
site_description: ABI compatibility checker for C/C++ shared libraries
site_url: https://abicheck.github.io/abicheck
repo_url: https://github.com/abicheck/abicheck
repo_name: abicheck/abicheck
edit_uri: edit/main/docs/

# docs/hooks.py:on_config stamps extra.latest_published_version from
# repo_facts.json's latest_release so docs/overrides/main.html's announcement bar (this site
# is always built from `main` -- see .github/workflows/pages.yml -- and can
# otherwise describe unreleased features with no version-boundary signal at
# all, a documentation review's P0.1 finding) never drifts from the tree
# actually being built.
hooks:
  - docs/hooks.py

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  # Track 2 (tool documentation), basics first: install & first check, then
  # day-to-day use, CI gating, specialised checks, then integrations/migration.
  - User Guide:
    - Start Here:
      - Getting Started: start/getting-started.md
      - Install abicheck: start/install.md
      - Run Your First Check: start/first-check.md
      - Understand Your First Report: start/first-report.md
      - Choose Your Workflow: start/choose-your-workflow.md
      - 'Worked Example: Real Library': start/real-world-example.md
      - 'Scanning a Conda-Forge Package': start/scanning-conda-packages.md
      - Upgrading to 0.6: start/upgrading-to-0.6.md
    - Everyday Use:
      - CLI Usage: use/cli-usage.md
      - Evidence, Build-Context & Debug Flags: use/dump-compare-flags.md
      - Source-Scan Depth: use/scan-levels.md
      - Producing Source Facts: use/producing-source-facts.md
      - Output Formats: use/output-formats.md
      - Baseline Management: use/baseline-management.md
      - Creating and Comparing a Baseline: use/create-baseline.md
      - Storing Baselines: use/baseline-storage.md
      - Troubleshooting: use/troubleshooting.md
    - CI & Gating:
      - CI Gating Pipeline: use/ci-gating.md
      - Contract Evaluation: use/contract-evaluation.md
      - Aggregate Reports: use/aggregate-reports.md
      - GitHub Action:
