      - Risk: reference/examples/by-category/risk.md
      - Addition: reference/examples/by-category/addition.md
      - Quality: reference/examples/by-category/quality.md
      - No Change: reference/examples/by-category/no_change.md
  # Contributor-facing docs. Internal planning artifacts (implementation plans,
  # backlog, roadmap audits, archived status notes) stay in the repo under
  # docs/contribute/ but are intentionally kept out of the published nav — see
