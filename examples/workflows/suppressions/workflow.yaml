# Executable contract for this workflow example (Phase 5 of the
# examples/catalog split). `validation/scripts/run_workflow_examples.py`
# copies the directory to a scratch tree, runs each `run:` line below as a
# single program invocation -- no shell, `shlex.split` + `shell=False` --
# and checks what it claims.
#
# Every `run:` line must appear verbatim in this directory's README.md
# (whitespace-normalized) -- that is the whole point: without it this file
# is a second copy of the walkthrough, free to keep passing while the
# documented commands rot. `tests/test_workflow_examples.py` enforces it in
# the fast lane, with no compiler needed.
id: suppressions
task: I renamed a function on purpose -- how do I stop CI from failing on it, without turning off detection for everything else?
platforms:
  - linux
  - macos
requires:
  - gcc
  # build_shared_lib.py needs python3 to pick the right link-mode flag
  # for the host platform (gcc -shared on Linux, -dynamiclib on macOS).
  - python3
  # Both compare steps pass --header, which goes through the default
  # CastXML AST backend. Declaring it here is what makes a host without
  # CastXML report an honest skip instead of a failure that looks like a
  # real ABI regression -- and what lets a CI lane that just installed
  # CastXML turn that skip back into a failure with `--require suppressions`.
  - castxml
  # The tool under test. Declaring it is not ceremony: without it a host
  # without abicheck on PATH reports a launch failure per step instead of
  # an honest skip.
  - abicheck
steps:
  - name: build-v1
    run: python3 build_shared_lib.py -fPIC -g v1/color.c -o libcolor_v1.so
  - name: build-v2
    run: python3 build_shared_lib.py -fPIC -g v2/color.c -o libcolor_v2.so
  - name: compare
    run: >-
      abicheck compare libcolor_v1.so libcolor_v2.so
      --header old=v1/color.h --header new=v2/color.h
    expect:
      exit_code: 4
      stdout_contains:
        - BREAKING
        - func_removed
  - name: compare-suppressed
    run: >-
      abicheck compare libcolor_v1.so libcolor_v2.so
      --header old=v1/color.h --header new=v2/color.h
      --suppress suppressions.yaml
    expect:
      exit_code: 0
      stdout_contains:
        - COMPATIBLE
        - suppressed
    # Re-run the identical command with a machine-readable format so the
    # verdict and the suppression record can be asserted structurally
    # rather than by grepping prose. The documented command above is still
    # what runs first.
    json_variant:
      - -o
      - json=-
    expect_json:
      verdict: COMPATIBLE
      suppression.suppressed_count: 1
      suppression.suppressed_changes[].symbol:
        - to_rgb
      suppression.suppressed_changes[].rule.rule_id:
        - "symbol='to_rgb'"
