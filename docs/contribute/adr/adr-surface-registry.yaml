# ADR surface registry — which use cases each ADR serves and which public
# surface (CLI command/flag, typed Python API symbol, GitHub Action input,
# report schema field or output format) reaches it. Contract: ADR-076.
#
# Validated by scripts/check_adr_surfaces.py (and tests/test_adr_surfaces.py):
#   - every ADR file under docs/contribute/adr/ has exactly one entry;
#   - every surface resolves against the code (CLI introspection, import,
#     action.yml inputs, abicheck/schemas/*.schema.json properties);
#   - an ADR whose index Status reads fully "implemented" must be `surfaced`
#     or `internal`; a retired (Deprecated/Superseded) ADR must be `internal`;
#   - `partial`/`gap` carry `missing`, `internal` carries `reason`;
#   - use_cases name real UC-* ids, and each UC's `adrs:` in
#     docs/contribute/usecase-registry.yaml mirrors this file exactly;
#   - nothing becomes less reachable than adr_surface_baseline.json records
#     unless the baseline is rewritten in the same PR (--write-baseline).
#
# disposition: surfaced | partial | gap | internal
# surface kinds:
#   {cli: "<command path> [--flag ...]"}       e.g. "compare --used-by", "deps tree"
#   {api: "<dotted.importable.symbol>"}
#   {action: "<root input>"} | {action: "actions/<name>"} | {action: "actions/<name>:<input>"}
#   {report: "<schema>.<top-level field>"} | {report: "format:<compare -o value>"}

