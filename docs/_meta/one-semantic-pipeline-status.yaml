# Machine-readable authority ledger for ADR-063 ("One Semantic Pipeline").
#
# Not published as a site page (docs/_meta/ holds machine-only registries,
# per docs/AGENTS.md's "Layout" section). Structurally validated by
# scripts/pipeline_status_ledger.py's `check_pipeline_status_ledger`
# (imported and called by scripts/check_docs_contract.py, which does not
# define it itself) — parses, required fields present, status/authority
# values from the declared enums, no unknown fields — a real, non-generated
# `docs/_meta/` registry has to
# be at least checked, not merely formatted as YAML (a review finding on
# PR #1019 caught the first version of this file claiming otherwise). It
# exists so a concept's status is recorded once, in one shape, instead of
# re-derived by hand into the ADR's prose and the plan's own per-phase
# "Landed"/"Still not landed" notes each time something changes. The
# *content* — which status/authority value is actually true for a concept
# — is still hand-maintained: no generator derives it from the codebase,
# so update it in the same PR that changes a concept's status, the same
# discipline `topics.yaml`/`terminology.yaml` rely on for their own
# hand-maintained content.
#
# Per concept:
#   primitive   — is the type/module itself defined and tested?
#   producers   — do extraction/construction sites populate it?
#   consumers   — does anything downstream (detector, checker, exit-code
#                 path, renderer) *read* it as its input, rather than the
#                 legacy representation it was meant to replace?
#   authority   — which representation actually decides behavior today:
#                 `self` (this concept is authoritative), `legacy` (the
#                 pre-existing representation still decides, this concept
#                 is additive), or `mixed` (some call sites migrated, most
#                 have not).
#   removal_gate — the condition (an AI-readiness/architecture check, a
#                 named future phase, or a specific still-open blocker)
#                 that has to hold before the legacy representation this
#                 concept replaces can be deleted.
#
# Status values: not_started | partial | complete.
#
# Sourced from ADR-063 (docs/contribute/adr/063-one-semantic-pipeline.md)
# and its implementation plan (docs/contribute/plans/one-semantic-pipeline.md)
# as of base commit bbce489e (the base this 2026-09-05 re-assessment update
# built on -- PR #1062, the --exit-code-scheme removal, is an ancestor of it,
# so this receipt covers the implementation the re-assessment inspected).
# bbce489e carries forward bfb40222 (Track 4's 7B ledger/plan-table drift fix --
# updating the run_outcome concept's removal_gate to describe the landed
# release-fan-out investigation and its parity test -- was built on and
# merges this content forward), which itself carries forward 2a88a5bd (the
# constant family's SemanticIR cutover -- Phase 6B's second detector
# cohort), 62679b1 (PR #1041, the typedef family's SemanticIR cutover --
# Phase 6B's first detector cohort), fd197d59 (PR #1025, the PDB
# EntityId/SemanticIR slice), b2d8eaaf (PR #1024, the multi-TU manifest
# occurrence-detail fix), bb14e8e (PR #1021), and PR #1019's own
# status-sync fixes. Update this file in the same PR that changes a
# concept's landed status.
#
# 2026-09-05 re-assessment (accepted; see docs/contribute/plans/
# duplication-and-convergence-assessment.md's "2026-09-05 re-assessment"
# section and its Phase 6): a concept's `authority` value must reflect
# which representation *decides*, not which one is populated. Two
# corrections this file now carries: `semantic_ir`'s landed cohorts are
# fidelity gates (both indexes built every comparison, legacy adjudicates),
# not authority transfers; and an "investigated and declined" disposition
# for a *behavioral* change never closes an *implementation* consolidation's
# removal gate. A future schema bump should make that ladder explicit
# (introduced -> wired -> authoritative -> retired, with
# investigated_declined as a separate disposition); until then it is stated
# in each affected removal_gate's prose.
#
# as_of_commit names a commit on the default branch, the same convention
# adr/index.md's `**Verified:**` receipt uses and for the identical reason:
# a PR-branch commit stops existing once the branch is squash-merged and
# deleted, so a receipt anchored to one is unresolvable in a clean checkout
# of retained history (a real review finding on PR #1019). Point it at the
# base commit this change built on (or a later reachable main commit, once
# merged) — never at a same-PR branch commit.

schema_version: 1
as_of_commit: bbce489e
as_of_date: "2026-09-05"

concepts:
  facts:
    primitive: complete
    producers: complete
    persistence: complete
    consumers: partial
    authority: legacy
    removal_gate: >-
      Phase 5B (fact-semantic-consumption): every detector reading an
      availability-bearing fact must branch on FactStatus instead of
      resolved_fact_value()'s uniform legacy-default collapse, for at
      least one full fact family, before FactLifecycle.CONSUMED is used
      anywhere in the registry. First slice landed 2026-09-03: the shared
      compare_facts()/FactComparison primitive, wired into two of the five
      named fields' primary finding-emitting call sites (bases/
      virtual_bases in diff_types._diff_type_bases, is_va_list in
      diff_param_qualifiers.param_va_list_changes). Second slice landed
      2026-09-03 (the "lower-risk batch"): every *other* bases/
      virtual_bases-reading call site was audited — diff_cxx_rules.py's
      _transitive_bases (the one genuine old/new pairwise fabrication risk
      among them, feeding virtual_method_addition's override check) is now
      evidence-completeness-gated the same way; diff_stdlib_impl.py,
      diff_time64.py, idioms.py, buildsource/header_graph.py, and
      surface_graph.py (already gated) are single-snapshot reachability/
      classification aids with no old/new pair to gate — each now carries
      an explicit ADR-063 Phase 5B docstring note recording why the plain
      resolved_fact_value() collapse is safe there (an evidence gap only
      narrows a closure or omits a graph edge, it cannot fabricate a
      finding). is_va_list has no other readers. Third slice (2026-09-03):
      vtable/vptr_offset_bits's own dedicated slice — diff_vtable_layout.
      _is_polymorphic/diff_layout._check_vptr_introduced now read
      FactStatus directly (additive, per-record); idioms.py's three vtable
      reads and diff_cpp_patterns._is_empty_record audited as already safe
      (single-snapshot, no old/new pair to gate). The one remaining piece
      — diff_types_vtable.py's own TYPE_VTABLE_CHANGED cluster
      (_vtable_transition_is_evidenced/
      _vtable_transition_rests_on_unresolved_evidence, since moved to
      compare/vtable_evidence.vtable_transition_is_evidenced) — is closed
      as a formal, investigated decline (Track 4, 2026-09-04).
      vtable_transition_is_evidenced's heuristic is unchanged from before
      this closure. Full three-round reasoning (declined, then a landed
      fix that regressed real detection coverage, then reverted) lives
      once, canonically, in diff_types_vtable.py's own module docstring
      ("Track 4, 5B final closure" section) — not repeated here. The PDB
      fabrication that closure's second round found remains real,
      reachable, and open, not fixed. This closes the Phase 5B
      *behavioral-investigation* gate for every one of the five
      originally-named fields
      (bases/virtual_bases/vtable/vptr_offset_bits/is_va_list) -- not the
      implementation-consolidation removal gate, which stays open for the
      vtable/TYPE_VTABLE_CHANGED cluster (see the 2026-09-05 re-assessment
      correction below). Residual,
      separately tracked: seven case-(a) fields (default, the five
      deprecated/is_scoped surfaces) left on the existing fact_provenance
      mechanism after their own fourth-through-seventh-slice investigation
      found no safe conversion without a legacy-hybrid load-path fix.
      **2026-09-05 re-assessment correction:** the vtable/
      TYPE_VTABLE_CHANGED "final closure" is an *investigated decline* of a
      behavioral change, which does not close this concept's implementation
      consolidation -- the PDB-driven fabricated-finding path it documents
      is still reachable and the authority transfer has not happened. The
      re-assessment's finding is that FactStatus alone is insufficient here
      by construction: the model must also carry observed-vs-inferred,
      producer and observation scope, and positive-observation-vs-
      completeness, so a detector can distinguish "I observed this virtual
      method" from "I established the complete set of virtual methods."
      Tracked as duplication-and-convergence-assessment.md Phase 6 item 4 /
      track T9.
  identity:
    primitive: complete
    producers: partial
    consumers: partial
    authority: mixed
    removal_gate: >-
      Phase 2B (identity-consumer-migration), partial as of 2026-09-03:
      the StableEntityId/SnapshotLocalIdentity split landed
      (abicheck/model/identity_tiers.py), and two post-parse consumers
      migrated onto it -- diff_filtering.py's opaque-type suppression
      (now compare/opaque_types.OpaqueTypeIndex, matching on
      StableEntityId first and the RecordType.name spelling second) and
      type_reachability.py's closure-walk record-tracking keys (now
      SnapshotLocalIdentity rather than bare str). Bare-name-collision
      narrowing landed 2026-09-03, through three review rounds that each
      tightened the completeness predicate: OpaqueTypeIndex now carries
      stable_by_local (the stable ids resolved per bare spelling), and
      intersect() computes complete as -- for every spelling both sides
      agree is opaque -- the two sides' own stable_by_local sets for it
      being EXACTLY EQUAL AND NON-EMPTY, not merely "each side resolved
      something" (that per-side-only condition passes even when the two
      sides resolve DIFFERENT ids for the same declaration) and not merely
      "the two sets intersect" (that passes even when only ONE of several
      declarations colliding on one spelling actually paired, since a
      shared id from one declaration keeps the intersection non-empty
      while a different declaration under the same spelling silently
      disagrees). Equal-and-empty is explicitly excluded too: two sides
      that BOTH resolved nothing for a spelling are not in agreement, they
      simply have no stable evidence for it, so counting that as paired
      would let strict=True reject a change against a contentless miss
      instead of falling through to the spelling tier. Only when this
      three-part predicate holds does contains(..., strict=True) trust a
      stable-tier miss as proof of non-opacity rather than falling back to
      the collision-prone spelling tier. Investigation for this slice
      found the completeness precondition already holds for every current
      producer's own output
      (castxml/clang/DWARF/PDB all populate RecordType.entity_id
      unconditionally, BTF/CTF inherits it via the shared DWARF builder) --
      the realistic incompleteness case is producer-version/schema skew
      (an archived pre-entity_id baseline, or a genuinely mixed
      header-AST/DWARF comparison), which the completeness gate degrades
      safely for. Still open: a change carrying no resolvable entity_id at
      all still falls through to the spelling tier unconditionally (no
      identity for strict to narrow). type_reachability.py's own
      spelling-matching machinery
      (_spelling_index/_stripped_signature_spelling/
      _non_stdlib_signature_spellings and _record_identity's three call
      sites) is deliberately NOT migrated: those strings are spellings
      that must appear inside a rendered Function.return_type/Param.type,
      not opaque identities -- the same conclusion Phase 2's ninth slice
      reached and recorded. The entity: alias is still not promoted into a
      real match tier -- investigated in depth 2026-09-03 rather than left
      unexamined: StableEntityId/entity_id_is_cross_snapshot_stable (the
      designated "entity: promotion gate", already built and tested) make
      the stability precondition un-forgettable, but investigating what
      concrete bug promotion would actually close today found none.
      resolve_change_identity's existing NORMALIZED tier for typedefs/
      constants already keys on their own alias/qualified-name spelling,
      which both header-AST backends already agree on (the remaining
      cross-backend risk in that data -- a VALUE spelling difference, e.g.
      "char const*" vs "char const *" -- is what canonicalize_values=True
      already normalizes, independently of entity_id); functions/variables
      already get the CANONICAL (mangled-name) tier, which is strictly more
      precise than an entity-derived one. So unlike the opaque-type
      bare-name collision (a demonstrated, testable false suppression this
      same investigation closed), there is no currently-identifiable
      finding that promotion would fix -- only the same production
      compatibility risk already named (changing what
      report_canonical_finding_id hashes for already-stored suppression
      rules). Wiring it in anyway would be exactly the "heuristic in search
      of a bug, not a fix for one" pattern AGENTS.md's own decision-making
      principles warn against elsewhere (see the constants normalizer's
      identical reasoning for declining a value-spelling canonicalizer with
      no observed divergence). Declined for now on that basis, not merely
      deferred for lack of sign-off; revisit only if a concrete
      cross-backend or cross-detector collision surfaces that only an
      entity-tier promotion can close, with the compatibility trade-off
      made explicitly to a maintainer at that point.
      Separately, producers remain partial: both
      PDB and BTF/CTF now populate entity_id for struct/enum types only
      (types only, 2026-09-03) -- PDB via extract/pdb_scope.py (an
      unverified-against-real-MSVC namespace-vs-record heuristic; no MSVC
      toolchain available to check it against), BTF/CTF via
      extract/debug_layout_semantic_ir.py (no scope heuristic needed at
      all, since both are pure-C formats with no namespace/class
      nesting). Function/variable/typedef identity remains unimplemented
      for all three backends (neither BTF's nor CTF's own richer parse
      carries that evidence across its own to_dwarf_metadata()
      conversion; PDB's own DBI module-symbol-stream parsing prerequisite
      is not attempted here). PDB also cannot distinguish a user-declared
      inline namespace from an ordinary one (CodeView's flat TPI names
      carry no source-level `inline` marker, unlike DWARF's
      DW_AT_export_symbols or Clang's isInline) and always emits a plain
      Namespace segment, a live EntityId mismatch against a header-AST
      backend's InlineNamespace for any declaration nested inside one --
      a structural, accepted gap (matching castxml's own documented
      inability to produce InlineNamespace at all), documented as
      extract/pdb_scope.py's 4th limitation, not expected to close
      without new evidence of a CodeView record this module does not
      parse today.

  semantic_ir:
    primitive: complete
    producers: partial
    consumers: partial
    # 2026-09-05 re-assessment: lowered from `mixed` to `legacy` (both
    # migrated cohorts ran behind a fidelity gate that could only select
    # the IR when it already reproduced the legacy projection exactly, so
    # the legacy projection was what decided). Track T3 ("typedef/constant
    # authority cutover") closed that gap the same day: `typedef_index_pair`/
    # `constant_index_pair` no longer build a legacy index at all when both
    # sides carry a real SemanticIR, and a real IR-vs-sidecar disagreement
    # is now a hard `SemanticIrAuthorityError` at snapshot construction
    # rather than a silent runtime fallback -- see this concept's own
    # removal_gate for the full account. Raised back to `mixed`, not `self`:
    # two cohorts are now genuinely authoritative, but every other detector
    # family still reads the legacy collections directly and does not
    # consume SemanticIR at all, so `self` (full authority, no legacy
    # consumer left standing anywhere) would overclaim.
    authority: mixed
    removal_gate: >-
      Phase 6B (semantic-ir-checker-cutover), two cohorts landed so far.
      First cohort (2026-09-03): the TYPEDEF family now reads SemanticIR
      through SemanticIRIndex (abicheck/compare/typedefs.py). Second
      cohort (2026-09-03): the CONSTANT family too
      (abicheck/compare/constants.py). Both share one
      legacy-flat-snapshot adapter
      (abicheck/model/semantic_ir_legacy_adapter.py) producing the same
      read shape for a snapshot carrying no SemanticIR, and both are
      forbidden -- by MIGRATED_COHORTS entries in the same
      semantic-ir-cutover AI-readiness check
      (scripts/semantic_ir_cutover.py, a real AST scan, no allowlist) --
      from reading AbiSnapshot.typedefs/typedefs_qualified/
      typedef_entity_ids and AbiSnapshot.constants/constant_entity_ids
      respectively. Which backing is used is decided per cohort by a
      fidelity gate requiring the IR's own rendered display
      names/values/identities to reproduce the comparison's legacy maps
      exactly on BOTH sides, so each cutover is behavior-preserving by
      construction. EVERY OTHER detector family remains unmigrated and
      still reads the legacy collections directly -- deliberately, per
      this phase's own non-goal of not widening coverage until one full
      vertical slice is proven; each further cohort needs its own
      MIGRATED_COHORTS entry, AND -- the finding this cohort's own
      investigation (2026-09-03) adds -- a genuine bug the migration
      would close, the same bar typedefs/constants themselves cleared
      (their pre-existing matching mechanism was a flat, unqualified
      alias map with no real identity story) and records/functions do
      not: checked both candidate families rather than assumed, and found
      neither is blocked the way the original cohort-1 framing described.
      Records: RecordType/TypeMap matching (diff_helpers.py, ADR-045) is
      already qualified-name-keyed with an ambiguity-safe bare-name
      alias, so it does not share the flat-bare-map weakness typedefs had
      before their own migration; and a record's simplest candidate
      layout facts (size_bits/alignment_bits) are a direct, single-source
      pass-through of the same RecordType field the SemanticIR normalizer
      would read to populate them, so a migrated reader could never see a
      value SemanticIR-vs-legacy comparison could actually disagree on --
      "records carry layout facts the IR does not yet model" was true but
      not itself the blocker once checked: modeling them is straightforward
      (verified by design, not implemented, since there is nothing to
      close by doing so). Functions: canonical_spelling (the
      cross-backend-safe "<return>(<param>, ...)" signature spelling,
      populated since Phase 2's third slice) already resolves the
      cross-backend signature-spelling agreement the original cohort-1
      framing named as the open blocker -- but separately, checked
      whether that spelling problem was ever actually reachable in
      today's detectors and found it is not: diff_symbols.py's own
      return-type/parameter-type comparisons already canonicalize via
      canonicalize_type_name directly, independent of SemanticIR, and
      function/variable *matching* already keys on the mangled name
      (resolve_function_identity's CANONICAL tier), an unambiguous,
      already-qualified identity with no bare-name collision to close.
      Declined for now on the same basis 2B's entity: alias promotion
      was (see the identity concept's own removal_gate): not blocked, but
      no currently-identifiable finding to justify the migration cost;
      revisit either family if a concrete cross-backed matching or
      spelling divergence surfaces that today's mechanisms cannot already
      close. Bare-name-collision narrowing (opaque-type suppression) is
      the one item from that original "not attempted" list that DID clear
      this bar and landed this same day -- see the identity concept's own
      removal_gate for the full account, including why entity: alias
      promotion was declined on the identical "no bug to fix" basis.
      SemanticIRIndex.references() is still
      unimplemented (it names a graph traversal belonging with the
      public-surface reference index, ADR-063 D5 / plan Phase 3), so
      neither landed cohort uses it.
      Producers remain partial regardless (CanonicalEntity.template_arguments
      is populated for records but not for function templates, and clang
      produces no occurrence at all for a template specialization).
      DWARF's own SemanticIR gap closed 2026-09-02 (Phase 6's fifth
      slice), the first non-header-AST producer to reach it.
      --dump-manifest's own occurrence-detail loss closed 2026-09-03: each
      contributing TU's raw, pre-merge fragment is now normalized
      independently and disambiguated by cross-fragment source-location
      variance and TU-local (internal) linkage, rather than reading
      tu_merge.merge_fragments's already-folded output. PDB's own
      SemanticIR gap closed 2026-09-03 (Phase 6's seventh slice, types
      only) via the new extract/pdb_scope.py -- PDB function/variable
      identity remains unimplemented (needs new DBI module-symbol-stream
      parsing). BTF/CTF's own SemanticIR gap closed 2026-09-03 (Phase 6's
      ninth slice, types only, via the new
      extract/debug_layout_semantic_ir.py) -- deliberately does not widen
      AbiSnapshot.types/.enums for a BTF/CTF-sourced snapshot;
      function/variable/typedef identity remains unimplemented for both
      formats.
      **2026-09-05 re-assessment correction:** both landed cohorts were
      *fidelity gates*, not authority transfers. typedef_index_pair and
      constant_index_pair used to construct the IR-backed AND the
      legacy-backed index on every comparison, and use the IR only when the
      legacy projection agreed on names, values, identities and ordering --
      the legacy representation adjudicated -- which is why this concept's
      own authority field read `legacy`, not `mixed`. Tracked as
      duplication-and-convergence-assessment.md Phase 6 item 2 / track T3.

      **Track T3 landed (2026-09-05), same day:** the gate closes exactly
      as this note specified. `typedef_index_pair`/`constant_index_pair`
      now decide EACH SIDE independently (not both-or-neither -- a Codex
      review round on the landing PR found the first both-or-neither cut
      would have discarded a side's real SemanticIR in favor of a legacy
      reconstruction of it whenever the *other* side lacked one, which is
      safe only by the accident of today's producers always keeping their
      flat collections and SemanticIR in sync; a hand-built or
      future-producer snapshot violating that would have fabricated a
      removal). A side with a real SemanticIR builds no legacy index at all
      for itself and reads it directly; a side with none reads through the
      legacy adapter's projection of its own flat collection. The two
      shapes are matched by rendered alias name, not by EntityId, so mixing
      an IR-backed side with a legacy-adapted one is safe -- EXCEPT for one
      exception a second Codex round found: when one side does not trust
      qualified typedef naming (pre-v25, which also predates SemanticIR),
      `typedef_index_pair` renders BOTH sides through the legacy adapter
      over the comparison's own bare-keyed maps, since a real SemanticIR
      always renders fully qualified and using it directly there would key
      one side "ns::Alias" against the other's bare "Alias", fabricating a
      removal. A third Codex round found `diff_constants` still silently
      compared a value as unchanged when its canonical SemanticIR spelling
      was Fact.unsupported() on both sides (real for a same-backend
      compound-initializer/bool-literal edit) -- fixed by falling back to
      each snapshot's own flat `AbiSnapshot.constants` raw text, gated
      through the existing fingerprint-unreliability predicate. A fourth
      Codex round found the strict `render_display_name` made an
      anonymous-namespace typedef/constant disappear from comparison
      entirely once a real SemanticIR is used directly (the legacy
      adapter's own synthetic identity for the identical declaration always
      renders, since it is built from the flat map's own string key with an
      empty scope) -- fixed by a new `render_display_name_or_leaf` that
      keeps every named scope segment and only omits the unrenderable one
      (matching the header-AST parsers' own qualified-name convention for
      the flat legacy collections), used by both cohorts' own name-keying
      projections. A current-format
      snapshot's IR disagreeing, by identity, with its own
      `typedef_entity_ids`/`constant_entity_ids` sidecar is no longer a
      case this selector can even reach: it is caught earlier, at snapshot
      construction (`AbiSnapshot.__post_init__` calling
      `model.semantic_ir_legacy_adapter.assert_typedef_ir_consistent`/
      `assert_constant_ir_consistent`), which raises
      `errors.SemanticIrAuthorityError` -- an explicit consistency failure,
      not a silent fallback, and also re-run explicitly after
      `serialization.snapshot_from_dict` decodes a stored SemanticIR onto
      an already-constructed snapshot (a second Codex-review finding: that
      assignment bypasses `__post_init__` entirely). The name/value
      equality half of the old gate (an IR's own rendered names/values
      reproducing the legacy alias map's) is deliberately NOT preserved as
      a comparison-time or construction-time check: requiring it would make
      a populated legacy collection an accidental prerequisite of
      SemanticIR-only construction -- exactly the outcome authority
      transfer exists to end. Only the identity half survives, because it
      is the one piece checking two representations the *same producer*
      wrote for the *same* declaration, not a value comparison against a
      collection this migration is meant to make optional. A side with no
      real IR (DWARF-only, a producer with no typedef/constant identity, a
      pre-v38 reload) still reads through the legacy adapter for that side
      alone -- unchanged, and correctly so: there is no real producer
      output there for an IR to be authoritative over.

      **Two further Codex review rounds (2026-09-05, same PR) found real
      gaps in the per-side-independence design itself, both fixed.** A
      sixth round found `_aliases`/`_values` collapsed every entity
      colliding on one rendered alias down to a single `setdefault` winner
      -- harmless for the legacy adapter (its own flat map already
      collapses a bare-name collision upstream, a pre-existing, accepted,
      different failure mode), but a real `SemanticIR` genuinely keeps two
      colliding occurrences (e.g. two anonymous-scoped typedefs sharing a
      leaf name) distinct, so a value change on whichever occurrence lost
      the race was silently read as "unchanged". Fixed by grouping every
      colliding entity into a list per alias and comparing the sorted value
      *multiset* on each side, picking a symmetric-difference
      representative pair only when reporting a real difference -- mirrored
      identically in both `compare/typedefs.py` and `compare/constants.py`.
      A seventh round found the bare-key-space branch (one side pre-v25,
      forcing both sides through the legacy adapter over the comparison's
      own bare-keyed maps) trusted the caller-supplied bare map alone, so a
      side carrying a real `SemanticIR` but an incomplete bare map (not
      reachable from any current real header-AST producer -- both backends
      populate `typedefs`/`typedefs_qualified`/`semantic_ir` from one
      shared filtered-element pass, so the bare map is empty if and only if
      the qualified map and `semantic_ir` are too -- but exactly the kind
      of hand-built-or-future-producer case this design's own per-side
      independence reasoning already declines to assume can't occur) had
      its real evidence silently discarded, fabricating a removal. Fixed by
      `_bare_typedef_side_index`, which projects a side's own real
      `SemanticIR` down onto bare aliases when it has one, rather than
      trusting the bare map parameter alone; constants have no
      bare/qualified split (no schema-versioned bare-only baseline
      predates them), so this round is typedef-only.

      **An eighth round found two further gaps in the sixth round's own
      collision fix, both fixed the same day.** `diff_constants`'s multiset
      comparison filtered out unsupported (`None`) values *before*
      comparing, so a colliding group's own membership shrinking (an
      unsupported occurrence disappearing, alongside an unchanged
      comparable one) produced an identical *filtered* value list on both
      sides and read as "unchanged" -- fixed by also comparing each side's
      raw occurrence count, reporting a change (no recoverable value text)
      whenever the counts disagree even though the filtered values agree;
      typedefs have no equivalent gap, since `_underlying` never returns
      `None` (an unresolved chain uses the `"?"` sentinel, always
      comparable). Separately, `_assert_sidecar_identity_consistent` keyed
      its lookup by the strict `render_display_name`, which refuses to
      render for an `Anonymous`/`LocalToFunction` segment -- so an
      anonymous-scoped identity's sidecar disagreement passed construction
      silently, even though the same producer's own sidecar is keyed by the
      flattened name (the `render_display_name_or_leaf` convention), not
      skipped for such a declaration at all. Fixed by keying the check by
      `render_display_name_or_leaf` instead, grouping colliding entities and
      flagging a disagreement only when none of them match the sidecar's
      recorded id (the sidecar itself, a plain `dict` comprehension over the
      same colliding key, can only ever reflect one member).

      **A ninth round found two further gaps in the collision path itself,
      both closed by rebuilding it around `collections.Counter` multiset
      subtraction instead of sorted-list equality.** A colliding group that
      grew or shrank by a value already present elsewhere in the group
      (e.g. a second anonymous-namespace `X=1` alongside an existing
      `X=1`) read as a value change under sorted-list comparison,
      reporting `CONSTANT_CHANGED` (an API break) for what is a purely
      compatible addition -- `Counter` subtraction now classifies a pure
      net-addition/net-removal as `CONSTANT_ADDED`/`CONSTANT_REMOVED`,
      reserving `CONSTANT_CHANGED` for a group with both a net addition
      and a net removal. Separately, the per-name legacy fallback text
      reflects only one raw value per bare name -- whichever occurrence's
      own parse happened to win that same collision upstream -- so
      applying it to every unresolved occurrence in a colliding group
      risked masking a real difference (both sides coincide on borrowed
      text) or fabricating one (the borrowed text differs between sides
      for reasons unrelated to either occurrence's own value); the
      collision path no longer consults it at all, representing an
      unresolved occurrence with an internal sentinel instead. Typedefs
      have no equivalent gap for either round: `_underlying` never returns
      `None` (an unresolved chain uses the always-comparable `"?"`
      sentinel), so there is no per-occurrence fallback ambiguity to
      misattribute and no unresolved-value cardinality question distinct
      from an ordinary value multiset.

      **A tenth round found the sixth round's typedef collision fix never
      received the ninth round's own `Counter`-based correction, plus one
      further gap in the ninth round's own mixed-group handling, plus one
      direction the sidecar-identity check still didn't cover.**
      `diff_typedefs` compared its colliding group by sorted-list equality
      still, sharing the identical blind spot `diff_constants` had before
      the ninth round: a group that grew or shrank by a value already
      present (a duplicate `Alias=int`) read as `TYPEDEF_BASE_CHANGED`
      with an identical `old_value`/`new_value` instead of a pure,
      untracked-and-compatible addition or a `TYPEDEF_REMOVED`. Fixed by
      the identical `Counter` multiset-subtraction rewrite, adapted for
      typedefs having no `ADDED` `ChangeKind` at all (a pure addition's
      leftover is simply never reported, mirroring how a brand-new alias
      absent from the old side is already never visited). Separately,
      `diff_constants`'s own mixed-group case (both a net removal and a
      net addition present at once) picked one representative pair from
      each side and emitted a single `CONSTANT_CHANGED`, silently dropping
      whichever removed/added value didn't get picked -- fixed by pairing
      off exactly one removed value with one added value as that one
      `CONSTANT_CHANGED`, then reporting every other leftover distinct
      value in either set as its own `CONSTANT_ADDED`/`CONSTANT_REMOVED`.
      Finally, `_assert_sidecar_identity_consistent` only checked a
      `SemanticIR` occurrence's rendered name against the sidecar when
      present -- a sidecar entry naming a declaration `SemanticIR` has no
      occurrence for at all passed construction silently, even though such
      a declaration would never reach a comparison at all (the sole
      comparison-time source omits it entirely). The check now also
      iterates the sidecar's own keys, raising
      `errors.SemanticIrAuthorityError` for any name with no corresponding
      `SemanticIR` occurrence.

      **An eleventh round found three further defects in the ninth/tenth
      rounds' own `Counter`-based collision fix, in both families.**
      Converting a `Counter` multiset difference to a `set` for iteration
      -- done to pick the one removed/added value pairing into a
      `CHANGED` finding -- has two failure modes: `set` iteration order
      depends on `PYTHONHASHSEED` (string hashing), so which value paired
      into the `CHANGED` finding, and therefore the outcome of the
      `is_fingerprint_comparison_unreliable` gate applied to that specific
      pairing, could differ between runs of the identical comparison; and
      converting to a `set` collapses repeated identical values to one
      entry, so three colliding occurrences sharing one value shrinking to
      one occurrence reported only one removal, silently dropping the
      second. Separately, every finding emitted for a colliding name
      shared a single `entity_id` computed once from
      `old_ids[0]`/`new_ids[0]`, so a residual `CONSTANT_ADDED`/
      `CONSTANT_REMOVED` was attributed to whichever entity happened to
      occupy that position, not the occurrence that actually changed.
      Fixed in both `compare/constants.py` and `compare/typedefs.py` by
      replacing the `Counter`/`set` machinery entirely with
      occurrence-level bookkeeping: `old_by_value`/`new_by_value` group
      each side's own entities by value in a plain, insertion-ordered
      `dict` (deterministic regardless of hash seed, matching the same
      `SemanticIR`'s own occurrence order every run), so the excess count
      for a value on one side over the other is exactly that many
      removed/added *occurrences*, each still carrying its own real
      entity_id.

      **A twelfth round found two further gaps.** First, both families'
      whole-name/whole-alias membership paths (`CONSTANT_REMOVED`/
      `CONSTANT_ADDED` in `compare/constants.py`,
      `TYPEDEF_REMOVED`/`TYPEDEF_VERSION_SENTINEL` in `compare/
      typedefs.py`) still stamped only `old_ids[0]`/`new_ids[0]` when the
      whole colliding group vanished or newly appeared, even though such a
      group can carry more than one distinct entity -- each now emits one
      finding per contributing entity. Second, `_bare_typedef_side_index`
      (the seventh round's own bare-projection fix) projected a side's
      real `SemanticIR` straight into a `dict[str, str]` and handed it to
      `legacy_typedef_ir`, which can only construct one occurrence per
      key -- so two qualified entities sharing a bare leaf name (an
      unchanged `a::Alias` and a newly-added `b::Alias`) silently
      overwrote each other, fabricating a `TYPEDEF_BASE_CHANGED` for an
      unchanged declaration. Fixed by giving each real IR entity its own
      synthetic, collision-safe bare identity (an `Anonymous` scope
      wrapper that renders to nothing but keeps the identity distinct)
      instead of collapsing into a shared dict key, so the existing
      occurrence-level collision handling in `diff_typedefs` -- already
      correct once given the chance -- compares them properly. Constants
      have no bare/qualified split at all (no schema-versioned bare-only
      baseline predates them), so this second fix is typedef-only.

      **A thirteenth round found the collision path still matched purely
      by value, never by shared identity.** Both `diff_constants` and
      `diff_typedefs` now compute `set(old_ids) & set(new_ids)` first --
      an entity present under the identical `EntityId` on both sides is
      the same declaration, so comparing its own old/new value directly is
      exact, not a heuristic pairing. Without this, a stable entity
      changing value (`X=1` -> `X=2`) while a different, newly-added
      colliding entity happened to carry the old value (`X=1`) let
      value-only multiset subtraction cancel the stable entity's old value
      against the new entity's, reporting only a compatible-looking
      addition and losing both the real change and the genuine addition.
      Only the remaining, identity-unmatched occurrences on each side feed
      the existing value-based bookkeeping. Separately,
      `diff_constants`'s whole-group vanish/appear loops (the twelfth
      round's own per-entity fix) still called the per-name legacy
      fallback for every member of a multi-entity group, crediting the
      same borrowed text to genuinely different declarations -- the
      fallback is now used only for a single-entity group, matching the
      ninth round's identical rule for the general collision path.

      **A fourteenth round found the identity-matched set itself was not
      restricted to cross-snapshot-stable identities.** An
      `Anonymous`/`LocalToFunction` scope segment's own ordinal is not
      stable across two snapshots by design (inserting an earlier
      anonymous sibling shifts every later one's ordinal, even though
      nothing about those later declarations changed -- see
      `model/identity_stability.py`'s own docstring, which names exactly
      this class of consumer as needing this gate before trusting a raw
      `EntityId` match across snapshots). Both functions now filter their
      identity-matched set through
      `entity_id_is_cross_snapshot_stable` -- the first real call site for
      that predicate, which existed with no consumer specifically because
      it needed one with this same review rigor before being wired in.
      Without the gate, an old colliding group `X=[1, 2]` becoming
      `[3, 1, 2]` after inserting an earlier-declared sibling (shifting
      the original two declarations' ordinals by one) would have paired
      old ordinal 0 against new ordinal 0 and old ordinal 1 against new
      ordinal 1 by raw `EntityId` equality -- two fabricated `CHANGED`
      findings for declarations that never changed, instead of the one
      real, provable addition.

      **A fifteenth round found the collision helpers themselves still
      read through `SemanticIRIndex`'s reduced view.**
      `compare/typedefs.py`'s `_aliases`/`_underlying` and
      `compare/constants.py`'s `_values`/`_value` answered off
      `entities_of_kind()`/`.fact()` -- both backed by
      `SemanticIR.canonical_entities()`'s explicit one-entry-per-`EntityId`
      reduction, whose own docstring already warns it must never back a
      legacy-shape projection. Two genuine occurrences sharing one
      `EntityId` (an ODR-duplicate/multi-TU pair, distinguished only by
      `OccurrenceId.disambiguator`) collapsed to a single "most facts
      present, then `canonical_key` order" winner, silently discarding the
      other occurrence's own value evidence -- exactly the distinction
      `SemanticIR.occurrences` (keyed by `OccurrenceId`, not bare
      `EntityId`) exists to keep. All four helpers, plus
      `_bare_typedef_side_index`'s own bare-projection loop (which shared
      the bug and additionally passed a now-mistyped `EntityId` into
      `_underlying` once it started expecting an `OccurrenceId`, making
      every bare-projected typedef read as permanently unresolved), now
      iterate `SemanticIRIndex.ir.occurrences` directly and key by
      `OccurrenceId` -- a same-identity pair is just another instance of
      the alias-collision multiset comparison the twelfth-through-
      fourteenth rounds already handle correctly.

      **A sixteenth round found the occurrence-level findings themselves
      did not survive the public pipeline's own post-processing.**
      `diff_typedefs`/`diff_constants` correctly emit one finding per
      contributing entity when a whole colliding group vanishes or newly
      appears (twelfth round), but `diff_filtering._dedup_exact` -- the
      first pass `checker.compare()` runs over every detector's output --
      keyed only on `(kind, description)`. Two entities in one colliding
      group render identical description text by construction, so this
      pass silently collapsed the independently-provable findings back
      down to one before a caller ever saw them (`test_diff_layout.py` had
      already named the identical risk for a bare-name-keyed `RecordType`
      detector as a known, then-unaddressed concern). Fixed generically,
      not just for this cohort: the key now also includes `symbol`,
      `old_value`/`new_value` (via the existing `compare.dedup_key.
      hashable_value`, since those slots are not guaranteed hashable
      scalars), and `entity_id` (the compare-time `EntityId`'s own `.key`,
      when a producer set one) -- additive for a producer that predates
      entity identity, since two `None`s still compare equal.
