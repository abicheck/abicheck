# Machine-readable authority ledger for ADR-063 ("One Semantic Pipeline").
#
# Not published as a site page (docs/_meta/ holds machine-only registries,
# per docs/AGENTS.md's "Layout" section). Structurally validated by
# scripts/pipeline_status_ledger.py's `check_pipeline_status_ledger`
# (imported and called by scripts/check_docs_contract.py, which does not
# define it itself) — parses, required fields present, status/authority
# values from the declared enums, no unknown fields — a real, non-generated
# `docs/_meta/` registry has to
# be at least checked, not merely formatted as YAML (a review finding on
# PR #1019 caught the first version of this file claiming otherwise). It
# exists so a concept's status is recorded once, in one shape, instead of
# re-derived by hand into the ADR's prose and the plan's own per-phase
# "Landed"/"Still not landed" notes each time something changes. The
# *content* — which status/authority value is actually true for a concept
# — is still hand-maintained: no generator derives it from the codebase,
# so update it in the same PR that changes a concept's status, the same
# discipline `topics.yaml`/`terminology.yaml` rely on for their own
# hand-maintained content.
#
# Per concept:
#   primitive   — is the type/module itself defined and tested?
#   producers   — do extraction/construction sites populate it?
#   consumers   — does anything downstream (detector, checker, exit-code
#                 path, renderer) *read* it as its input, rather than the
#                 legacy representation it was meant to replace?
#   authority   — which representation actually decides behavior today:
#                 `self` (this concept is authoritative), `legacy` (the
#                 pre-existing representation still decides, this concept
#                 is additive), or `mixed` (some call sites migrated, most
#                 have not).
#   removal_gate — the condition (an AI-readiness/architecture check, a
#                 named future phase, or a specific still-open blocker)
#                 that has to hold before the legacy representation this
#                 concept replaces can be deleted.
#
# Status values: not_started | partial | complete.
#
# Sourced from ADR-063 (docs/contribute/adr/063-one-semantic-pipeline.md)
# and its implementation plan (docs/contribute/plans/one-semantic-pipeline.md)
# as of base commit bfb40222 (Track 4's 7B ledger/plan-table drift fix --
# updating the run_outcome concept's removal_gate to describe the landed
# release-fan-out investigation and its parity test -- was built on and
# merges this content forward), which itself carries forward 2a88a5bd (the
# constant family's SemanticIR cutover -- Phase 6B's second detector
# cohort), 62679b1 (PR #1041, the typedef family's SemanticIR cutover --
# Phase 6B's first detector cohort), fd197d59 (PR #1025, the PDB
# EntityId/SemanticIR slice), b2d8eaaf (PR #1024, the multi-TU manifest
# occurrence-detail fix), bb14e8e (PR #1021), and PR #1019's own
# status-sync fixes. Update this file in the same PR that changes a
# concept's landed status.
#
# as_of_commit names a commit on the default branch, the same convention
# adr/index.md's `**Verified:**` receipt uses and for the identical reason:
# a PR-branch commit stops existing once the branch is squash-merged and
# deleted, so a receipt anchored to one is unresolvable in a clean checkout
# of retained history (a real review finding on PR #1019). Point it at the
# base commit this change built on (or a later reachable main commit, once
# merged) — never at a same-PR branch commit.

schema_version: 1
as_of_commit: bfb40222
as_of_date: "2026-09-03"

concepts:
  facts:
    primitive: complete
    producers: complete
    persistence: complete
    consumers: partial
    authority: legacy
    removal_gate: >-
      Phase 5B (fact-semantic-consumption): every detector reading an
      availability-bearing fact must branch on FactStatus instead of
      resolved_fact_value()'s uniform legacy-default collapse, for at
      least one full fact family, before FactLifecycle.CONSUMED is used
      anywhere in the registry. First slice landed 2026-09-03: the shared
      compare_facts()/FactComparison primitive, wired into two of the five
      named fields' primary finding-emitting call sites (bases/
      virtual_bases in diff_types._diff_type_bases, is_va_list in
      diff_param_qualifiers.param_va_list_changes). Second slice landed
      2026-09-03 (the "lower-risk batch"): every *other* bases/
      virtual_bases-reading call site was audited — diff_cxx_rules.py's
      _transitive_bases (the one genuine old/new pairwise fabrication risk
      among them, feeding virtual_method_addition's override check) is now
      evidence-completeness-gated the same way; diff_stdlib_impl.py,
      diff_time64.py, idioms.py, buildsource/header_graph.py, and
      surface_graph.py (already gated) are single-snapshot reachability/
      classification aids with no old/new pair to gate — each now carries
      an explicit ADR-063 Phase 5B docstring note recording why the plain
      resolved_fact_value() collapse is safe there (an evidence gap only
      narrows a closure or omits a graph edge, it cannot fabricate a
      finding). is_va_list has no other readers. Not yet closed: vtable/
      vptr_offset_bits (diff_types_vtable.py/diff_layout.py/
      diff_vtable_layout.py's own pre-existing, individually-reasoned
      evidence-gap heuristics, plus their downstream readers in
      diff_cxx_rules.py's own vtable comparison, idioms.py, and
      diff_cpp_patterns.py — deliberately left alone pending their own
      dedicated slice, per the plan's own 5B note).

  identity:
    primitive: complete
    producers: partial
    consumers: partial
    authority: mixed
    removal_gate: >-
      Phase 2B (identity-consumer-migration), partial as of 2026-09-03:
      the StableEntityId/SnapshotLocalIdentity split landed
      (abicheck/model/identity_tiers.py), and two post-parse consumers
      migrated onto it -- diff_filtering.py's opaque-type suppression
      (now compare/opaque_types.OpaqueTypeIndex, matching on
      StableEntityId first and the RecordType.name spelling second) and
      type_reachability.py's closure-walk record-tracking keys (now
      SnapshotLocalIdentity rather than bare str). Bare-name-collision
      narrowing landed 2026-09-03, through three review rounds that each
      tightened the completeness predicate: OpaqueTypeIndex now carries
      stable_by_local (the stable ids resolved per bare spelling), and
      intersect() computes complete as -- for every spelling both sides
      agree is opaque -- the two sides' own stable_by_local sets for it
      being EXACTLY EQUAL AND NON-EMPTY, not merely "each side resolved
      something" (that per-side-only condition passes even when the two
      sides resolve DIFFERENT ids for the same declaration) and not merely
      "the two sets intersect" (that passes even when only ONE of several
      declarations colliding on one spelling actually paired, since a
      shared id from one declaration keeps the intersection non-empty
      while a different declaration under the same spelling silently
      disagrees). Equal-and-empty is explicitly excluded too: two sides
      that BOTH resolved nothing for a spelling are not in agreement, they
      simply have no stable evidence for it, so counting that as paired
      would let strict=True reject a change against a contentless miss
      instead of falling through to the spelling tier. Only when this
      three-part predicate holds does contains(..., strict=True) trust a
      stable-tier miss as proof of non-opacity rather than falling back to
      the collision-prone spelling tier. Investigation for this slice
      found the completeness precondition already holds for every current
      producer's own output
      (castxml/clang/DWARF/PDB all populate RecordType.entity_id
      unconditionally, BTF/CTF inherits it via the shared DWARF builder) --
      the realistic incompleteness case is producer-version/schema skew
      (an archived pre-entity_id baseline, or a genuinely mixed
      header-AST/DWARF comparison), which the completeness gate degrades
      safely for. Still open: a change carrying no resolvable entity_id at
      all still falls through to the spelling tier unconditionally (no
      identity for strict to narrow). type_reachability.py's own
      spelling-matching machinery
      (_spelling_index/_stripped_signature_spelling/
      _non_stdlib_signature_spellings and _record_identity's three call
      sites) is deliberately NOT migrated: those strings are spellings
      that must appear inside a rendered Function.return_type/Param.type,
      not opaque identities -- the same conclusion Phase 2's ninth slice
      reached and recorded. The entity: alias is still not promoted into a
      real match tier -- investigated in depth 2026-09-03 rather than left
      unexamined: StableEntityId/entity_id_is_cross_snapshot_stable (the
      designated "entity: promotion gate", already built and tested) make
      the stability precondition un-forgettable, but investigating what
      concrete bug promotion would actually close today found none.
      resolve_change_identity's existing NORMALIZED tier for typedefs/
      constants already keys on their own alias/qualified-name spelling,
      which both header-AST backends already agree on (the remaining
      cross-backend risk in that data -- a VALUE spelling difference, e.g.
      "char const*" vs "char const *" -- is what canonicalize_values=True
      already normalizes, independently of entity_id); functions/variables
      already get the CANONICAL (mangled-name) tier, which is strictly more
      precise than an entity-derived one. So unlike the opaque-type
      bare-name collision (a demonstrated, testable false suppression this
      same investigation closed), there is no currently-identifiable
      finding that promotion would fix -- only the same production
      compatibility risk already named (changing what
      report_canonical_finding_id hashes for already-stored suppression
      rules). Wiring it in anyway would be exactly the "heuristic in search
      of a bug, not a fix for one" pattern AGENTS.md's own decision-making
      principles warn against elsewhere (see the constants normalizer's
      identical reasoning for declining a value-spelling canonicalizer with
      no observed divergence). Declined for now on that basis, not merely
      deferred for lack of sign-off; revisit only if a concrete
      cross-backend or cross-detector collision surfaces that only an
      entity-tier promotion can close, with the compatibility trade-off
      made explicitly to a maintainer at that point.
      Separately, producers remain partial: both
      PDB and BTF/CTF now populate entity_id for struct/enum types only
      (types only, 2026-09-03) -- PDB via extract/pdb_scope.py (an
      unverified-against-real-MSVC namespace-vs-record heuristic; no MSVC
      toolchain available to check it against), BTF/CTF via
      extract/debug_layout_semantic_ir.py (no scope heuristic needed at
      all, since both are pure-C formats with no namespace/class
      nesting). Function/variable/typedef identity remains unimplemented
      for all three backends (neither BTF's nor CTF's own richer parse
      carries that evidence across its own to_dwarf_metadata()
      conversion; PDB's own DBI module-symbol-stream parsing prerequisite
      is not attempted here). PDB also cannot distinguish a user-declared
      inline namespace from an ordinary one (CodeView's flat TPI names
      carry no source-level `inline` marker, unlike DWARF's
      DW_AT_export_symbols or Clang's isInline) and always emits a plain
      Namespace segment, a live EntityId mismatch against a header-AST
      backend's InlineNamespace for any declaration nested inside one --
      a structural, accepted gap (matching castxml's own documented
      inability to produce InlineNamespace at all), documented as
      extract/pdb_scope.py's 4th limitation, not expected to close
      without new evidence of a CodeView record this module does not
      parse today.

  semantic_ir:
    primitive: complete
    producers: partial
    consumers: partial
    authority: mixed
    removal_gate: >-
      Phase 6B (semantic-ir-checker-cutover), two cohorts landed so far.
      First cohort (2026-09-03): the TYPEDEF family now reads SemanticIR
      through SemanticIRIndex (abicheck/compare/typedefs.py). Second
      cohort (2026-09-03): the CONSTANT family too
      (abicheck/compare/constants.py). Both share one
      legacy-flat-snapshot adapter
      (abicheck/model/semantic_ir_legacy_adapter.py) producing the same
      read shape for a snapshot carrying no SemanticIR, and both are
      forbidden -- by MIGRATED_COHORTS entries in the same
      semantic-ir-cutover AI-readiness check
      (scripts/semantic_ir_cutover.py, a real AST scan, no allowlist) --
      from reading AbiSnapshot.typedefs/typedefs_qualified/
      typedef_entity_ids and AbiSnapshot.constants/constant_entity_ids
      respectively. Which backing is used is decided per cohort by a
      fidelity gate requiring the IR's own rendered display
      names/values/identities to reproduce the comparison's legacy maps
      exactly on BOTH sides, so each cutover is behavior-preserving by
      construction. EVERY OTHER detector family remains unmigrated and
      still reads the legacy collections directly -- deliberately, per
      this phase's own non-goal of not widening coverage until one full
      vertical slice is proven; each further cohort needs its own
      MIGRATED_COHORTS entry, AND -- the finding this cohort's own
      investigation (2026-09-03) adds -- a genuine bug the migration
      would close, the same bar typedefs/constants themselves cleared
      (their pre-existing matching mechanism was a flat, unqualified
      alias map with no real identity story) and records/functions do
      not: checked both candidate families rather than assumed, and found
      neither is blocked the way the original cohort-1 framing described.
      Records: RecordType/TypeMap matching (diff_helpers.py, ADR-045) is
      already qualified-name-keyed with an ambiguity-safe bare-name
      alias, so it does not share the flat-bare-map weakness typedefs had
      before their own migration; and a record's simplest candidate
      layout facts (size_bits/alignment_bits) are a direct, single-source
      pass-through of the same RecordType field the SemanticIR normalizer
      would read to populate them, so a migrated reader could never see a
      value SemanticIR-vs-legacy comparison could actually disagree on --
      "records carry layout facts the IR does not yet model" was true but
      not itself the blocker once checked: modeling them is straightforward
      (verified by design, not implemented, since there is nothing to
      close by doing so). Functions: canonical_spelling (the
      cross-backend-safe "<return>(<param>, ...)" signature spelling,
      populated since Phase 2's third slice) already resolves the
      cross-backend signature-spelling agreement the original cohort-1
      framing named as the open blocker -- but separately, checked
      whether that spelling problem was ever actually reachable in
      today's detectors and found it is not: diff_symbols.py's own
      return-type/parameter-type comparisons already canonicalize via
      canonicalize_type_name directly, independent of SemanticIR, and
      function/variable *matching* already keys on the mangled name
      (resolve_function_identity's CANONICAL tier), an unambiguous,
      already-qualified identity with no bare-name collision to close.
      Declined for now on the same basis 2B's entity: alias promotion
      was (see the identity concept's own removal_gate): not blocked, but
      no currently-identifiable finding to justify the migration cost;
      revisit either family if a concrete cross-backed matching or
      spelling divergence surfaces that today's mechanisms cannot already
      close. Bare-name-collision narrowing (opaque-type suppression) is
      the one item from that original "not attempted" list that DID clear
      this bar and landed this same day -- see the identity concept's own
      removal_gate for the full account, including why entity: alias
      promotion was declined on the identical "no bug to fix" basis.
      SemanticIRIndex.references() is still
      unimplemented (it names a graph traversal belonging with the
      public-surface reference index, ADR-063 D5 / plan Phase 3), so
      neither landed cohort uses it.
      Producers remain partial regardless (CanonicalEntity.template_arguments
      is populated for records but not for function templates, and clang
      produces no occurrence at all for a template specialization).
      DWARF's own SemanticIR gap closed 2026-09-02 (Phase 6's fifth
      slice), the first non-header-AST producer to reach it.
      --dump-manifest's own occurrence-detail loss closed 2026-09-03: each
      contributing TU's raw, pre-merge fragment is now normalized
      independently and disambiguated by cross-fragment source-location
      variance and TU-local (internal) linkage, rather than reading
      tu_merge.merge_fragments's already-folded output. PDB's own
      SemanticIR gap closed 2026-09-03 (Phase 6's seventh slice, types
      only) via the new extract/pdb_scope.py -- PDB function/variable
      identity remains unimplemented (needs new DBI module-symbol-stream
      parsing). BTF/CTF's own SemanticIR gap closed 2026-09-03 (Phase 6's
      ninth slice, types only, via the new
      extract/debug_layout_semantic_ir.py) -- deliberately does not widen
      AbiSnapshot.types/.enums for a BTF/CTF-sourced snapshot;
      function/variable/typedef identity remains unimplemented for both
      formats.

  public_surface:
    primitive: complete
    producers: complete
    consumers: complete
    authority: self
    removal_gate: >-
      None outstanding for the shipped design (a deterministic closure
      walk over snapshot declarations). D5's own literal "traversal over
      one authoritative mergeable graph" text remains unfulfilled by
      design (see Phase 3 (D5) amendment) rather than by an open gap;
      AbiSnapshot.surface_graph itself still has no production reader.

  analysis_plan:
    primitive: complete
    producers: complete
    consumers: partial
    authority: mixed
    removal_gate: >-
      Phase 4B (resolved-execution-context): a ResolvedExecutionContext
      built for real (non-dry-run) execution, carrying resolved
      policy/pack/contract/evidence-depth state so downstream code stops
      independently re-resolving each of them per call site. A first real
      call site landed 2026-09-03: service_compare_pipeline.
      resolve_compare_request builds one from its own already-resolved
      AnalysisPlan and attaches it on ResolvedComparePair, additive and
      unread by any consumer -- resolve_dump_request remains unwired, and
      no evaluation_config/compile_contexts/with_assurance() caller exists
      yet, so this gate stays open.

  run_outcome:
    primitive: complete
    producers: complete
    consumers: partial
    authority: mixed
    removal_gate: >-
      Phase 7B (boundary-consumer-migration): action/run.sh reads
      run_outcome/exit from the machine report instead of decoding the
      raw process exit code and stderr text itself. First PR landed
      2026-09-03, scoped narrowly after inspection showed most of
      run.sh's raw-exit-code dispatch is not actually closable this way
      (the Click-usage-error-vs-real-verdict disambiguation has no
      run_outcome to read at all, and scan's evidence-contract/budget-
      overflow/not-comparable exit codes are deliberately exit-code-only
      by ADR-037 D5's own design): _report_compat_verdict/
      _severity_gate_exit -- the two shared functions compare and scan
      alike consult -- now read run_outcome.compatibility/run_outcome.gate
      first, falling back to the pre-existing verdict/severity.exit_code
      field only when no run_outcome block is present. The release
      fan-out's own "independent pair-semantics reimplementation" half of
      this sub-phase's scope was investigated 2026-09-03 (see the plan's
      own "7B's release-fan-out investigation landed" note) rather than
      rewritten wholesale: depth, suppression, pack policy/namespace
      overrides, compile context, and contract evaluation already route
      through one service.run_compare chokepoint per pair; report
      composition has nothing to unify (compare-release exposes neither
      --use-cases nor a suppression-audit equivalent for a shared executor
      to fold in); and the build-config matrix's own third
      _load_suppression_and_policy/policy_file_with_packs call site is a
      structurally-required pseudo-pair, not a divergent duplicate. The one
      concrete gap that investigation found -- policy.release_gate_options.
      apply_release_gate_pack mirrors, rather than calls,
      pack_application.apply_to_compare_config, because the release
      fan-out has no ResolvedCompareConfig-shaped object of its own to fold
      packs onto -- remains open as ADR-064's own named, deferred "PR G2"
      prerequisite work; guarded meanwhile against silent drift by
      tests/test_release_gate_pack_fold_parity.py's Hypothesis property
      test pinning both fold implementations to agree on outcome.

  sectioned_storage:
    primitive: complete
    producers: complete
    consumers: partial
    authority: mixed
    removal_gate: >-
      Phase 8B (multi-artifact-canonical-storage): typed DTOs for every
      section beyond semantic_ir, multi-artifact ProjectSnapshot
      packages, and baseline-set/BundleFacts folded into sections. First
      PR landed 2026-09-03: storage.types_section_codec.TypesSection is
      the "types" legacy section's own typed DTO (wired through
      storage.dto.types_to_dto/types_from_dto in place of the generic
      legacy_section_to_dto pass-through envelope), chosen first because
      it is the simplest case -- exactly one field, always required when
      the section is present, with none of the schema-version-dependent
      optional-field sparsity that made provenance/debug/binary
      considered-and-deferred. On-disk payload shape is unchanged. The
      remaining seven legacy sections (binary/declarations/layout/debug/
      build/graph/provenance), multi-artifact ProjectSnapshot packages,
      and folding baseline-set/BundleFacts into sections all remain open.

  report_document:
    primitive: complete
    producers: complete
    consumers: complete
    authority: self
    removal_gate: >-
      None outstanding. Markdown's leaf/root-cause render modes have
      since converged onto ReportDocument too
      (report/render_markdown_alternate.py's build_leaf_document/
      build_root_cause_document, reached from reporter_markdown.py's
      _to_markdown_leaf/_to_markdown_root_cause) -- ADR-061's own item 1
      is now closed for every renderer/format (JSON/SARIF/JUnit/--stat,
      HTML, and every Markdown mode). Not currently assigned to a
      numbered ADR-063 phase.

  l5_source_graph_identity:
    primitive: complete
    producers: complete
    consumers: complete
    authority: self
    removal_gate: >-
      Out of ADR-063's stated scope by design (Phase 2's own named
      boundary) — buildsource/entity_identity.py's CanonicalIdentity
      stays a second, permanently separate identity system unless a
      future, separately-justified phase bridges or reclassifies it.
