name: Set up pinned CastXML
description: >-
  Installs the pinned CastXML Superbuild via action/install-castxml.sh, with an
  actions/cache wrapped around the install root so the ~100 MB release tarball
  is downloaded and extracted once per (runner, pin) instead of once per job.

runs:
  using: composite
  steps:
    # install-castxml.sh installs into
    # ${ABICHECK_CASTXML_INSTALL_ROOT:-$RUNNER_TEMP/abicheck-castxml} and
    # short-circuits its whole download/verify/extract block when the resolved
    # castxml binary is already executable (`if [ ! -x "$castxml_bin" ]`). The
    # default root is RUNNER_TEMP, which is wiped between jobs, so that guard
    # could never fire in CI and every job re-fetched the tarball from GitHub
    # releases. Pinning the root to a stable, cacheable path is what lets the
    # guard do its job.
    - name: Pin the CastXML install root to a cacheable path
      shell: bash
      run: |
        echo "ABICHECK_CASTXML_INSTALL_ROOT=${HOME}/.cache/abicheck-castxml" >> "$GITHUB_ENV"
        # The installer selects its asset (and its install dir) by
        # "$VERSION_ID:$(uname -m)", so an Ubuntu 22.04 build and a 24.04 build
        # are different artifacts that must not share a cache key. runner.os +
        # runner.arch cannot tell them apart: both are "Linux"/"X64". Sharing
        # one key is not merely a wasted download, it is a permanent
        # restore-hit / reinstall / save-skipped cycle, because actions/cache
        # will not overwrite an existing key. Fold the distro identity in.
        if [ -r /etc/os-release ]; then
          . /etc/os-release
          echo "ABICHECK_CASTXML_CACHE_TAG=${ID:-unknown}-${VERSION_ID:-unknown}-$(uname -m)" >> "$GITHUB_ENV"
        else
          echo "ABICHECK_CASTXML_CACHE_TAG=$(uname -s)-$(uname -m)" >> "$GITHUB_ENV"
        fi

    # Unlike the AST-dump cache next door, this content is immutable for a given
    # pin, so it needs no run_id/restore-keys "growing cache" idiom: a hit is
    # complete and a miss repopulates. Hashing the installer script itself is
    # what versions the key — CASTXML_TAG, the per-distro asset names, their
    # SHA256s and the expected castxml/Clang versions all live in that one file,
    # so any re-pin changes the hash and invalidates the cache automatically.
    # The key carries the full distro identity (id-version-arch, resolved above),
    # not just runner.os/runner.arch, because the installer picks a different
    # asset per Ubuntu release as well as per architecture.
    # SHA-pinned, unlike the sibling cache-ast-dumps action which may stay on
    # a mutable tag: this composite is invoked from ci.yml's integration-tests,
    # which grants `id-token: write`, and AGENTS.md requires a full commit SHA
    # for actions running in ci.yml's OIDC-enabled jobs — a re-pointed tag
    # there would execute with access to that job's OIDC credential.
    # (Codex review on PR #685.)
    - name: Cache pinned CastXML
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
      with:
        path: ~/.cache/abicheck-castxml
        key: castxml-${{ env.ABICHECK_CASTXML_CACHE_TAG }}-${{ hashFiles('action/install-castxml.sh') }}

    # Still always run the installer: on a cache hit it skips straight to the
    # version probe and the PATH/GITHUB_PATH export, which the cache cannot
    # restore, so the job is set up identically either way.
    #
    # Note what this does NOT give you: the installer's short-circuit only
    # tests that the binary is executable, so a corrupted cache entry is not
    # silently used, but neither is it repaired -- it hard-fails the version
    # probe, and because the key is content-addressed there is no way to
    # refresh it short of changing the installer. Accepted: the cache stores a
    # checksum-verified extraction, so corruption means the runner's own cache
    # storage misbehaved, not something this pipeline can produce.
    - name: Set up pinned CastXML
      shell: bash
      run: bash action/install-castxml.sh
