name: Use-case paths

# Which abicheck code each use case runs, and what a PR changes about it
# (scripts/usecase_paths.py). Report-only: nothing here fails a PR.
#
#   pr-diff  -- every PR touching the package or the scenario catalog:
#               records the automated scenarios on the PR base and head and
#               writes the difference to the step summary: the functions the
#               PR edits, most relied-on first; runs whose path changed; and
#               functions no use case reaches any more.
#   full     -- weekly and on demand: adds the real-binary flows
#               (scripts/usecase_flows.yaml, real compiled catalog cases and
#               castxml) and publishes the importance ranking, the
#               dead-code candidate list and the ADR-reach report. It also
#               runs the one gating step here: the unreached-function
#               ratchet (`usecase_paths.py ratchet --strict`) over a
#               scenarios-only recording against
#               scripts/usecase_unreached_baseline.json. Weekly, never on a
#               PR -- the PR lane stays report-only.

on:
  pull_request:
    branches: [main]
    paths:
      - 'abicheck/**'
      - 'tests/scenarios/**'
      - 'tests/test_scenarios.py'
      - 'scripts/usecase_paths.py'
      - 'scripts/usecase_adr_reach.py'
      - 'scripts/usecase_unreached_baseline.json'
      - 'scripts/usecase_flows.yaml'
      - 'scripts/production_references.py'
      - '.github/workflows/usecase-paths.yml'
      - '.github/actions/setup-castxml/action.yml'
      - '.github/actions/install-system-deps/**'
      - 'action/install-castxml.sh'
      - 'pyproject.toml'
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install
        run: pip install -e ".[dev]"

      - name: Check out the PR base beside the head
        # The head's recorder measures both checkouts; `--root` makes the
        # child processes import the base checkout's own abicheck.
        run: git worktree add ../base "${{ github.event.pull_request.base.sha }}"

      - name: Record base and head
        run: |
          python scripts/usecase_paths.py record --root ../base --out base-paths.json
          python scripts/usecase_paths.py record --out head-paths.json

      - name: Diff
        run: |
          python scripts/usecase_paths.py diff base-paths.json head-paths.json \
            --git-base "${{ github.event.pull_request.base.sha }}" \
            --json usecase-paths-diff.json --step-summary

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: usecase-paths-pr
          path: |
            base-paths.json
            head-paths.json
            usecase-paths-diff.json

  full:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.13'
          cache: 'pip'

      - uses: ./.github/actions/install-system-deps
        with:
          packages: cmake g++ clang

      - uses: ./.github/actions/setup-castxml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Record scenarios and real-binary flows
        run: |
          python scripts/usecase_paths.py record --source scenarios --source flows \
            --build-catalog "$RUNNER_TEMP/catalog-build" --out usecase-paths.json

      - name: Rank
        run: |
          python scripts/usecase_paths.py rank usecase-paths.json --json usecase-rank.json \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # Unreached functions no production code references (to a fixpoint),
      # split from documented and ADR/plan-named API -- the review list
      # docs/contribute/plans/dead-code-and-single-owner.md works from.
      - name: Dead-code candidates
        run: |
          python scripts/usecase_paths.py dead usecase-paths.json --json usecase-dead.json \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # Which ADRs' named abicheck/ code the use cases execute: reached /
      # reached-elsewhere / not-reached / untraced / no-code-refs.
      - name: ADR reach
        run: |
          python scripts/usecase_paths.py adr-reach usecase-paths.json \
            --json usecase-adr-reach.json --step-summary

      # The baseline is recorded from the compiler-free scenarios alone, so
      # the ratchet re-records exactly that source: the flows' set depends
      # on which toolchains this runner has.
      - name: Unreached-function ratchet
        run: |
          python scripts/usecase_paths.py record --source scenarios --out usecase-paths-scenarios.json
          python scripts/usecase_paths.py ratchet usecase-paths-scenarios.json --strict --step-summary

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: success() || failure()
        with:
          name: usecase-paths
          path: |
            usecase-paths.json
            usecase-paths-scenarios.json
            usecase-rank.json
            usecase-dead.json
            usecase-adr-reach.json
