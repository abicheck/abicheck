name: Docs Review Triggers

# Advisory-only signal: flags docs pages whose front-matter `depends_on`
# list overlaps this PR's changed files (docs/AGENTS.md's "Page front
# matter" section). Never fails the build -- see
# scripts/check_docs_review_triggers.py's module docstring for why this is
# deliberately a notice/step-summary signal, not a gate.

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs-review-triggers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch PR base ref
        # No --depth here: fetch-depth: 0 above already gives a full,
        # unshallow history, and the diff below needs a real merge-base walk
        # (see changelog-check.yml's identical comment for why a shallow
        # fetch of just base.sha would break that).
        run: git fetch origin "${{ github.event.pull_request.base.sha }}"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install PyYAML (front-matter parsing)
        run: pip install pyyaml

      - name: Check docs review triggers
        run: |
          python3 scripts/check_docs_review_triggers.py \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}"
