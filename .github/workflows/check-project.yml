name: 'abicheck check-project'

# G30 P1.4 (ADR-047 §4/§5): the multi-target CI run-plan + matrix + trailing
# aggregate gate. Four jobs (three on the normal path, `no-checks` only when
# the run-plan resolved to zero checks -- see its own comment below):
#
#   plan      Generate run-plan.json from .abicheck.yml's targets:/bundles:/
#             profiles: block (G30 P1.5) plus each contract profile's
#             build-output.json (G30 P1.1, downloaded as an artifact this
#             workflow expects the caller's own build job(s) to have
#             uploaded earlier in the same workflow run -- this workflow
#             never runs a build itself, "build once, scan many").
#   check     One actions/check-target invocation per run-plan.json cell
#             (matrix, fail-fast: false). Downloads that cell's candidate
#             binaries + (unless baseline-channel: none) that channel's
#             baseline-set, both as artifacts this workflow expects to
#             already exist -- it never fetches from a baseline channel's
#             storage backend itself, the same "this Action never fetches"
#             boundary actions/resolve-baseline and actions/baseline already
#             draw (ADR-047 §10). Always uploads its report, even on an
#             operational error (if: always()) -- a required sub-task ADR-047
#             §4 flags: under gate-mode: deferred, check-target's own exit
#             can fail this matrix job even though it already wrote a report,
#             and a later step in a failed job is skipped by default unless
#             it too carries an always-on condition.
#   aggregate Runs `abicheck aggregate --run-plan run-plan.json` over every
#             downloaded report -- `--run-plan` projects run-plan.json to the
#             expected-target set internally (using each check's own
#             check_id, ADR-047 §5's required sub-task), no separate
#             projection step. Runs with if: always() (never a bare needs: with no
#             if:) -- plain needs: semantics skip a dependent job when any
#             matrix leg fails, and a skipped job reports success, which
#             would silently green a branch-protection-required status past
#             a real gate-mode: deferred operational failure -- exactly the
#             failure mode ADR-047 exists to close (second required
#             sub-task).
#
# **Artifact-naming convention this workflow establishes (not yet exercised
# against a real external-consumer run in this session -- no second
# repository was available to validate cross-repo artifact staging end to
# end; see docs/reference/reusable-workflows.md for the full contract):**
# the calling workflow's own job(s) must, before or in parallel with calling
# this reusable workflow non-blockingly via `needs:`, upload:
#   - one `<build-output-artifact-prefix><profile-id>` artifact per contract
#     profile, containing that profile's `abicheck-build-<profile>/` directory
#     (build-output.json + whatever it references) -- G30 P1.1.
#   - one `<candidate-artifact-prefix><profile-id>` artifact per contract
#     profile, containing the tree each target's `binary_pattern`/
#     `consumer_binary_pattern` globs against for THIS run's candidate side.
#   - one `<baseline-artifact-prefix><profile-id>-<channel>` artifact per
#     (contract profile, baseline channel) pair referenced by any check on
#     that profile (unless every such check uses `baseline-channel: none`),
#     containing that pair's staged baseline-set (`manifest.json` +
#     snapshots, `actions/baseline`'s own output shape) -- keyed by profile
#     as well as channel because a baseline-set is itself profile-specific
#     (`actions/baseline`'s manifest records exactly one `profile`, and
#     resolve-baseline rejects a mismatch as `wrong_profile`); a project
#     with two profiles sharing one channel needs two distinct baseline-set
#     artifacts, not one shared by both (Codex review). This workflow never
#     fetches from a channel's storage backend itself (ADR-047 §10),
#     matching resolve-baseline's own documented boundary.

on:
  workflow_call:
    inputs:
      config-path:
        description: 'Path to the project''s .abicheck.yml, relative to the repository root.'
        type: string
        default: '.abicheck.yml'
      build-output-artifact-prefix:
        description: 'Each contract profile''s build-output.json is downloaded from an artifact named <this><profile-id>.'
        type: string
        default: 'abicheck-build-'
      candidate-artifact-prefix:
        description: 'Each contract profile''s candidate binaries are downloaded from an artifact named <this><profile-id>.'
        type: string
        default: 'abicheck-candidate-'
      baseline-artifact-prefix:
        description: >-
          Each (contract profile, baseline channel) pair's staged
          baseline-set is downloaded from an artifact named
          <this><profile-id>-<channel> -- keyed by profile as well as
          channel since a baseline-set is itself profile-specific, not
          just channel-specific.
        type: string
        default: 'abicheck-baseline-'
      run-plan-artifact-name:
        description: 'Artifact name the generated run-plan.json is uploaded under.'
        type: string
        default: 'run-plan'
      toolchain-bindings-path:
        description: >-
          Path (relative to the repository root) to a trusted
          toolchain-bindings file (schema abicheck.toolchain-bindings/v1,
          P1 toolchain-profile audit) resolving profiles.<id>.compile.binding
          logical ids to exact executable paths, forwarded to `abicheck
          project plan --toolchain-bindings`. Empty (default) skips
          binding resolution entirely -- every cell's gcc-path stays this
          workflow's own gcc-path input, unchanged from before this option
          existed. A profile's compile.standard/stdlib/target/abi_macros/
          args are composed into that cell's gcc-options regardless of this
          input (they need no trusted-path resolution).
        type: string
        default: ''
      report-artifact-prefix:
        description: 'Each check''s report is uploaded under an artifact named <this><sanitized-check-id>.'
        type: string
        default: 'abicheck-check-report-'
      aggregate-artifact-name:
        description: 'Artifact name the final aggregate result (JSON + text) is uploaded under.'
        type: string
        default: 'abicheck-aggregate-result'
      project:
        description: 'Project identifier recorded in every report envelope. Defaults to this repository.'
        type: string
        default: ''
      head-sha:
        description: 'Candidate commit SHA recorded in every report envelope and the run-plan. Defaults to this workflow''s own SHA.'
        type: string
        default: ''
      base-ref:
        description: 'Base ref recorded in every report envelope, when known.'
        type: string
        default: ''
      python-version:
        description: 'Python version for setup-python, every job.'
        type: string
        default: '3.13'
      # `abicheck aggregate`'s missing-required/unexpected-target gate policy
      # (CLI cleanup phase two, PR 2's original manifest-carried policy, and
      # its PR 2 follow-up) is no longer a workflow input here: `project
      # plan`'s own --gate-missing-required/--gate-unexpected-target flags
      # were removed (no CLI alias), so the only way to set it is CONFIG's
      # own `aggregate: gate:` block, read directly by the "Generate
      # run-plan.json" step below. Set it there instead of here.

      # ── Shared analysis options, forwarded to every check-target cell ────
      # (a per-cell override of any of these is out of scope for this first
      # version -- see docs/reference/reusable-workflows.md. EXCEPTION:
      # gcc-path/gcc-options below now get a per-cell override from that
      # cell's profiles.<id>.compile overlay, via toolchain-bindings-path
      # above -- P1 toolchain-profile audit. Every other option here stays
      # workflow-global-only.)
      header:
        type: string
        default: ''
      old-header:
        type: string
        default: ''
      new-header:
        type: string
        default: ''
      include:
        type: string
        default: ''
      old-include:
        type: string
        default: ''
      new-include:
        type: string
        default: ''
      lang:
        type: string
        default: 'c++'
      ast-frontend:
        type: string
        default: ''
      gcc-path:
        type: string
        default: ''
      gcc-prefix:
        type: string
        default: ''
      gcc-options:
        type: string
        default: ''
      sysroot:
        type: string
        default: ''
      evidence-producer:
        type: string
        default: ''
      evidence-pack-path:
        type: string
        default: 'abicheck_inputs'
      sources:
        type: string
        default: ''
      build-info:
        type: string
        default: ''
      compile-db:
        type: string
        default: ''
      build-config:
        type: string
        default: ''
      policy:
        type: string
        default: 'strict_abi'
      policy-file:
        type: string
        default: ''
      suppress:
        type: string
        default: ''
      severity-preset:
        type: string
        default: 'default'
      extra-args:
        type: string
        default: ''
      install-deps:
        type: boolean
        default: true
      dependency-source:
        description: >
          How each check cell installs its system dependencies —
          'conda-forge', 'conda-forge-gcc14', 'conda-forge-clang20',
          'system', or 'none' (see the root action.yml's own input of the
          same name). Workflow-level default; a profile that declares its
          own `dependency_source:` overrides it for that profile's cells
          only (G34 Phase C), the same precedence `compile:`'s
          gcc-path/gcc-options overlay already uses. Leave empty to keep the
          legacy `install-deps` boolean deciding.
        type: string
        default: ''
      expected-project-ref:
        description: >
          Forwarded to check-target's own expected-project-ref input, but
          ONLY for a cell whose baseline-channel is accepted-main -- require
          that cell's resolved baseline-set manifest.json project_ref to
          match this value exactly (e.g. github.event.pull_request.base.sha
          for an accepted-main PR gate), failing closed with
          wrong_project_ref otherwise. A release-contract (or any
          tag/asset-selected) cell's manifest records a release tag, not a
          Git ref, so this value is never applicable there -- forwarding it
          unscoped to every cell in a mixed-channel matrix would make every
          release-contract cell fail closed on a project_ref it was never
          going to match (Codex review). Omit to skip the check on every
          cell.
        type: string
        default: ''
      expected-baseline-generation:
        description: >
          Forwarded to check-target's own expected-baseline-generation
          input for every cell, regardless of baseline-channel -- require
          each cell's resolved baseline-set manifest.json
          baseline_generation to match this value exactly, failing closed
          with stale_generation otherwise. Unlike expected-project-ref
          (which only makes sense for a Git-ref-scoped channel like
          accepted-main), a scanner-compatibility generation is a property
          of the baseline-set itself and applies uniformly across channels
          -- a release-contract baseline can be just as stale a generation
          as an accepted-main one. Omit to skip the check on every cell.
        type: string
        default: ''

    outputs:
      gate-exit-code:
        description: "abicheck aggregate's own exit code (0 pass / 1 coverage or policy gap / 2 API break / 4 ABI break)."
        value: ${{ jobs.aggregate.outputs.exit-code }}
      run-plan-artifact-name:
        description: 'The artifact name run-plan.json was uploaded under (== inputs.run-plan-artifact-name, echoed for convenience).'
        value: ${{ jobs.plan.outputs.run-plan-artifact-name }}

jobs:
  # ── Job 1: generate run-plan.json ───────────────────────────────────────
  plan:
    name: 'Generate run-plan'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has-checks: ${{ steps.plan.outputs.has-checks }}
      run-plan-artifact-name: ${{ inputs.run-plan-artifact-name }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # `pip install .` on the preceding checkout installs whatever is at
      # the CALLER's own repository root -- fine when this workflow is
      # invoked from within abicheck/abicheck itself (as test-action.yml
      # does), but wrong (or a hard failure, if the caller isn't even a
      # Python package) for any external consumer
      # (`uses: abicheck/abicheck/.github/workflows/check-project.yml@v1`
      # from their own repository). This job needs the real `abicheck` CLI,
      # not the caller's own code. Self-checkout into a side directory
      # (identical technique to the `check` job's own nested-Action
      # composition below, and to check-target's own established pattern)
      # and install from there instead (Codex review).
      #
      # Uses `job.workflow_ref`/`job.workflow_sha` -- NOT
      # `github.workflow_ref`/`github.workflow_sha`. GitHub's own docs are
      # explicit that "when a reusable workflow is triggered by a caller
      # workflow, the `github` context is always associated with the caller
      # workflow" (reusing-workflow-configurations#github-context), so
      # `github.workflow_ref` here would resolve to the CALLING repository/
      # ref for any external consumer, not this repository -- exactly wrong
      # for a self-checkout meant to install abicheck's own CLI.
      # `job.workflow_ref`/`job.workflow_sha` are the documented-correct
      # fields instead (contexts-reference#job-context: "For jobs defined in
      # a [reusable workflow], this refers to the reusable workflow file").
      # A prior revision of this comment had the caller/callee association
      # backwards; caught by a fresh Codex review and confirmed against
      # GitHub's current docs directly before reverting. `actionlint` still
      # flags `job.workflow_ref`/`job.workflow_sha` as "not defined in
      # object type" -- a known false negative, since its hardcoded `job`
      # context type table hasn't caught up with these (real, documented)
      # properties. See check-single.yml's identical step for the fuller
      # writeup.
      - name: Capture this reusable workflow's identity
        id: identity
        shell: bash
        env:
          WORKFLOW_REF: ${{ job.workflow_ref }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          FALLBACK_REPOSITORY: ${{ github.repository }}
          FALLBACK_REF: ${{ github.sha }}
        run: |
          repository="${WORKFLOW_REF%%/.github/workflows/*}"
          echo "repository=${repository:-$FALLBACK_REPOSITORY}" >> "$GITHUB_OUTPUT"
          echo "ref=${WORKFLOW_SHA:-$FALLBACK_REF}" >> "$GITHUB_OUTPUT"

      - name: Checkout abicheck (for installing the CLI)
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.identity.outputs.repository }}
          ref: ${{ steps.identity.outputs.ref }}
          path: .check-project-src
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install abicheck
        shell: bash
        run: pip install ./.check-project-src

      - name: Download build-output artifacts
        uses: actions/download-artifact@v8
        with:
          path: build-outputs
          pattern: '${{ inputs.build-output-artifact-prefix }}*'
          merge-multiple: false

      # actions/download-artifact only nests a downloaded artifact under
      # `path/<artifact-name>/` when its `pattern` matches TWO OR MORE
      # artifacts -- when it matches exactly one (the common single-contract-
      # profile case, and this is what test-check-project-failure-path.yml's
      # own fixture hit), the content is extracted FLAT into `path` instead,
      # with no subdirectory at all. Deriving `--build-output`'s PROFILE from
      # the artifact/directory NAME is therefore ambiguous by construction --
      # this silently produced zero --build-output args (and a spuriously
      # empty run-plan) the first time this workflow's plan job ever actually
      # ran end to end (it could never schedule any jobs before this PR's own
      # continue-on-error/zero-jobs fix). Sidestep the directory-naming
      # question entirely: `find` every build-output.json regardless of
      # nesting depth and read its OWN `profile.id` field -- already the
      # source of truth per ADR-047 §2 ("one build-output.json = one build
      # profile, always") -- instead of reconstructing it from a path.
      - name: Generate run-plan.json
        id: plan
        shell: bash
        env:
          CONFIG_PATH: ${{ inputs.config-path }}
          PROJECT: ${{ inputs.project != '' && inputs.project || github.repository }}
          HEAD_SHA: ${{ inputs.head-sha != '' && inputs.head-sha || github.sha }}
          TOOLCHAIN_BINDINGS_PATH: ${{ inputs.toolchain-bindings-path }}
        run: |
          set -euo pipefail
          args=()
          if [[ -n "$TOOLCHAIN_BINDINGS_PATH" ]]; then
            args+=(--toolchain-bindings "$TOOLCHAIN_BINDINGS_PATH")
          fi
          if [[ -d build-outputs ]]; then
            while IFS= read -r -d '' bo_file; do
              bo_dir="$(dirname "$bo_file")"
              profile_id="$(python3 -c "
          import json, sys
          print(json.load(open(sys.argv[1])).get('profile', {}).get('id', ''))
          " "$bo_file")"
              if [[ -z "$profile_id" ]]; then
                echo "::error::$bo_file has no profile.id set -- cannot determine which contract profile it belongs to" >&2
                exit 1
              fi
              args+=(--build-output "${profile_id}=${bo_dir}")
            done < <(find build-outputs -name build-output.json -print0)
          fi
          # --allow-empty: `abicheck project plan` is fail-closed by default
          # (ADR-054) -- an empty run-plan otherwise exits 1 here. This
          # workflow already has its own, more specific empty-plan guard
          # right below (the `no-checks` job, with a much more actionable
          # error message than a bare CLI exit), so --allow-empty defers to
          # that guard instead of stopping mid-script with a less helpful one.
          #
          # run-plan.json's own gate policy (stamped from CONFIG's optional
          # `aggregate: gate:` block, CLI cleanup phase two, PR 2 follow-up)
          # is what `to_aggregate_manifest()` projects into the aggregate
          # manifest's `gate` block -- the equivalent of the removed
          # `aggregate --on-missing-required`/`--on-unexpected-target` CLI
          # flags, now riding inside the plan artifact instead of a second
          # pair of CLI arguments at the aggregate step (see "Run aggregate"
          # below). There is no per-workflow-call override any more (the
          # underlying `project plan --gate-missing-required`/
          # `--gate-unexpected-target` flags were removed too, no CLI
          # alias) -- set the policy in CONFIG directly.
          abicheck project plan "$CONFIG_PATH" \
            --project "$PROJECT" --head-sha "$HEAD_SHA" \
            --allow-empty "${args[@]}" -o run-plan.json
          python3 -c "
          import json
          plan = json.load(open('run-plan.json'))
          checks = plan.get('checks', [])
          print('matrix=' + json.dumps({'include': checks}))
          print('has-checks=' + ('true' if checks else 'false'))
          " >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.run-plan-artifact-name }}
          path: run-plan.json

  # ── Guard: a zero-check run-plan must not silently succeed ─────────────
  # `abicheck project plan` is fail-closed by default on an empty checks[]
  # (ADR-054), but this step passes --allow-empty so it degrades to a
  # WARNING here instead -- a config with no targets:/bundles: at all, or an
  # implicit sweep that matched no downloaded profile, are both legitimate
  # reasons not to hard-fail the plan step itself -- but both `check` and
  # `aggregate` below are gated on has-checks == 'true', so a run that resolves to zero checks
  # skips both of them and this workflow reports success having gated
  # nothing. That is exactly the "a skipped job reports success" failure
  # mode this file's other if: always() placements exist to close (see the
  # header comment above), but this path had no equivalent guard until now
  # (self-review finding). Fail loud instead of leaving it invisible.
  no-checks:
    name: 'Fail: run-plan resolved to zero checks'
    needs: plan
    if: needs.plan.outputs.has-checks != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Fail
        run: |
          echo "::error::run-plan.json resolved to zero checks -- this check-project.yml run would otherwise report success having gated nothing. This almost always means .abicheck.yml's targets:/bundles: checks[] didn't resolve against any downloaded build-output.json (a profile-id mismatch, a renamed target, or an implicit sweep matching nothing) -- see the 'Generate run-plan.json' step's own log above for the exact reason. If an empty run is genuinely expected (e.g. bootstrapping this workflow before any targets are declared yet), don't call check-project.yml until there is at least one check to run." >&2
          exit 1

  # ── Job 2: one check-target invocation per run-plan.json cell ──────────
  # `runs-on` comes from the cell itself (G34 Phase C): `abicheck project
  # plan` derives `runs_on` from each profile's own `os:`, so an `os:
  # windows` profile's cell is scheduled natively instead of on the Linux
  # runner every cell used to hardcode. `project plan` always emits the key
  # and defaults it to `ubuntu-latest` for a profile with no `os:` -- which
  # is every profile in every project written before this phase, so their
  # scheduling is unchanged. The `|| 'ubuntu-latest'` is for one real case
  # only: a run-plan.json produced by an older abicheck than this workflow,
  # which carries no `runs_on` at all. Without it that cell would resolve
  # `runs-on:` to the empty string and never be scheduled -- a silently
  # missing check, which is exactly what this file's other guards exist to
  # prevent.
  check:
    name: ${{ matrix.check_id }}
    needs: plan
    if: needs.plan.outputs.has-checks == 'true'
    runs-on: ${{ matrix.runs_on || 'ubuntu-latest' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # See the `plan` job's identical steps for the "install abicheck, not
      # the caller's own repo" rationale (and for the `job.workflow_ref`/
      # `job.workflow_sha` vs. `github.workflow_ref`/`github.workflow_sha`
      # writeup) -- this job needs the same fix, and additionally needs this
      # same checked-out copy for its own nested
      # `uses: ./.check-project-src/actions/check-target` step below, so one
      # self-checkout now serves both purposes.
      - name: Capture this reusable workflow's identity
        id: identity
        shell: bash
        env:
          WORKFLOW_REF: ${{ job.workflow_ref }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          FALLBACK_REPOSITORY: ${{ github.repository }}
          FALLBACK_REF: ${{ github.sha }}
        run: |
          repository="${WORKFLOW_REF%%/.github/workflows/*}"
          echo "repository=${repository:-$FALLBACK_REPOSITORY}" >> "$GITHUB_OUTPUT"
          echo "ref=${WORKFLOW_SHA:-$FALLBACK_REF}" >> "$GITHUB_OUTPUT"

      - name: Checkout abicheck (for installing the CLI and nested Action composition)
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.identity.outputs.repository }}
          ref: ${{ steps.identity.outputs.ref }}
          path: .check-project-src
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install abicheck
        shell: bash
        run: pip install ./.check-project-src

      # The three downloads below are all `continue-on-error: true` -- a
      # missing/failed download is meant to fall through to the later
      # resolve/consume steps' own "nothing landed" handling, not fail the
      # job outright. But the earlier `actions/checkout` step already
      # populated the whole workspace from the caller's own repository, so
      # if that repository happens to contain checked-in `candidate/`,
      # `build-output/`, or `baseline-sets/...` directories at these same
      # paths, a swallowed download failure would silently fall through to
      # comparing against those stale repository files instead of the
      # intended build artifact (Codex review). Clear every path these
      # tolerated downloads write to first, so a failed download always
      # leaves an empty (or absent) directory behind, never stale
      # pre-existing content.
      - name: Clear staging directories before tolerated downloads
        shell: bash
        env:
          BASELINE_STAGING_DIR: 'baseline-sets/${{ matrix.profile_id }}-${{ matrix.baseline_channel }}'
        run: |
          rm -rf candidate build-output "$BASELINE_STAGING_DIR"

      - name: Download candidate artifact
        uses: actions/download-artifact@v8
        with:
          name: '${{ inputs.candidate-artifact-prefix }}${{ matrix.profile_id }}'
          path: candidate
        continue-on-error: true

      # Keyed by profile as well as channel -- a baseline-set is itself
      # profile-specific (actions/baseline's manifest records exactly one
      # `profile`; resolve-baseline rejects a mismatch as `wrong_profile`),
      # so two contract profiles sharing one baseline_channel each need
      # their own artifact, not one shared download (Codex review).
      - name: Download baseline-set artifact
        if: matrix.baseline_channel != 'none'
        uses: actions/download-artifact@v8
        with:
          name: '${{ inputs.baseline-artifact-prefix }}${{ matrix.profile_id }}-${{ matrix.baseline_channel }}'
          path: 'baseline-sets/${{ matrix.profile_id }}-${{ matrix.baseline_channel }}'
        continue-on-error: true

      # Forwarded to check-target's own candidate-build-output input, which
      # forwards it to resolve-baseline's incompatible_evidence check --
      # without it, a baseline produced by a different evidence-producer/
      # tool-version than this run's candidate can be treated as resolved
      # and compared anyway (Codex review). continue-on-error here matches
      # the two downloads above: the "Resolve candidate binary/binaries"
      # step below checks the file actually landed before referencing it,
      # the same way it already resolves new-library from candidate/.
      #
      # Gated on baseline_channel alone would wrongly skip this download for
      # a channel: none audit-only cell whose evidence-producer is wrapper/
      # clang-plugin: `evidence-pack-path` (docs/reference/check-target.md)
      # "must match an earlier collect-facts phase: prepare step's own
      # output path", which can legitimately live inside this same
      # build-output artifact ("whatever it references", per this
      # workflow's own artifact-staging contract above) -- independent of
      # whether the cell has a baseline to compare against at all (Codex
      # review). Download whenever either consumer might need it.
      # No continue-on-error here (issue #628, correcting the G30 P1.4 known
      # gap the plan doc's round-5/round-8/round-9 addenda tracked): this
      # download is only attempted (per the `if:` above) when this cell
      # genuinely needs it -- a baseline to compare against, or a wrapper/
      # clang-plugin evidence pack to verify. Swallowing a failure here used
      # to silently weaken resolve-baseline's incompatible_evidence check
      # (candidate-build-output would forward empty) with no report at all
      # explaining why. Letting it fail loud, caught by the "Synthesize
      # pre-check operational-error report" step below (mirroring how "Run
      # check-target" itself is deliberately not continue-on-error'd, per
      # that step's own comment), makes this a typed, aggregate-visible
      # operational error instead.
      - name: Download build-output artifact
        id: download_build_output
        if: matrix.baseline_channel != 'none' || matrix.requested_depth == 'build' || matrix.requested_depth == 'source' || inputs.evidence-producer == 'wrapper' || inputs.evidence-producer == 'clang-plugin'
        uses: actions/download-artifact@v8
        with:
          name: '${{ inputs.build-output-artifact-prefix }}${{ matrix.profile_id }}'
          path: build-output

      # Resolves this cell's `new-library` from the downloaded `candidate/`
      # tree: a single glob match for kind: target (the redirected library's
      # own binary_pattern for app-consumer/plugin-contract), or a staged
      # directory of member binaries for kind: bundle. Uses Python's `glob`
      # rather than bash globbing so `binary_pattern`/`member_binary_patterns`
      # can use `**` recursive patterns without depending on `shopt -s
      # globstar` semantics matching across shells/runners. Also emits
      # `build-output=` (the downloaded build-output.json path, or empty if
      # the download above didn't land one) for the candidate-build-output
      # forward.
      # continue-on-error (issue #628): this step still fails loud
      # internally (::error:: + exit 1) on every guard above -- unchanged.
      # What changes is that the step's own failure no longer silently ends
      # the job with no report for `aggregate` to see: continue-on-error
      # lets the job reach the "Synthesize pre-check operational-error
      # report" step below, which detects this step's real outcome and
      # writes a typed envelope instead. "Run check-target" immediately
      # below is explicitly gated on this step having actually succeeded, so
      # it never runs against a half-resolved candidate.
      - name: Resolve candidate binary/binaries
        id: candidate
        continue-on-error: true
        shell: bash
        env:
          MATRIX_JSON: ${{ toJSON(matrix) }}
        run: |
          set -euo pipefail
          # G34 Phase C: this job can now be scheduled on a Windows runner
          # (its runs-on comes from the cell's own profile), where Git Bash
          # resolves `python` but not necessarily `python3` -- the Windows
          # CPython layout ships `python.exe` only. Resolve it the same way
          # `action/run.sh` already does rather than assuming a name
          # (Codex review).
          PY="$(command -v python3 || command -v python)"
          "$PY" -c "
          import glob, json, os, shutil, sys

          cell = json.loads(os.environ['MATRIX_JSON'])
          root = 'candidate'
          root_abs = os.path.realpath(root)

          def resolve(pattern, *, label):
              if not pattern:
                  return None
              # binary_pattern/consumer_binary_pattern/member_binary_patterns
              # come from the project's own .abicheck.yml -- os.path.join
              # discards 'root' entirely for an absolute pattern, and a
              # '../' pattern walks back out of it, so an absolute or
              # escaping pattern can otherwise glob against the runner's
              # checkout (this side checkout or the caller's own) instead of
              # the downloaded candidate/ artifact, comparing/scoping
              # against arbitrary files (Codex review). Reject the pattern
              # itself before ever calling glob.glob: a recursive absolute
              # or escaping pattern (e.g. '/**/*', '../**/*') would otherwise
              # walk and allocate paths from outside candidate/ FIRST, only
              # to be rejected after the fact by the commonpath confinement
              # check below -- a needlessly slow/heavy pre-check failure
              # instead of a contained, immediate validation error (a second
              # Codex review, catching that the confinement check alone only
              # rejects escaping matches after the expensive glob already
              # ran).
              if os.path.isabs(pattern) or any(part == '..' for part in pattern.split('/')):
                  print(f'::error::{label}: pattern {pattern!r} is absolute or contains a \'..\' path component -- absolute or ../-escaping patterns are not allowed', file=sys.stderr)
                  sys.exit(1)
              matches = sorted(glob.glob(os.path.join(root, pattern), recursive=True))
              # Confine every match to actually live under candidate/ before
              # accepting it -- belt-and-suspenders alongside the upfront
              # pattern rejection above (e.g. a symlink inside candidate/
              # pointing back out could still produce an escaping match even
              # from a pattern that looked confined).
              escaped = [
                  m for m in matches if os.path.commonpath([root_abs, os.path.realpath(m)]) != root_abs
              ]
              if escaped:
                  print(f'::error::{label}: pattern {pattern!r} matched {escaped} outside {root}/ -- absolute or ../-escaping patterns are not allowed', file=sys.stderr)
                  sys.exit(1)
              # A resolved path is about to be written as a bare key=value
              # line to \$GITHUB_OUTPUT, which GitHub documents as
              # line-oriented -- an embedded newline/carriage-return in a
              # candidate artifact's filename could inject or override a
              # later output line (e.g. a spoofed consumer-binary=), bypassing
              # every check above (Codex review). Reject outright rather than
              # switching to the multiline delimiter form, since a legitimate
              # build artifact has no reason to contain one.
              newlines = [m for m in matches if '\\n' in m or '\\r' in m]
              if newlines:
                  print(f'::error::{label}: pattern {pattern!r} matched a path containing a newline character -- rejected to avoid corrupting \$GITHUB_OUTPUT', file=sys.stderr)
                  sys.exit(1)
              if len(matches) > 1:
                  # A pattern like '*.so*' commonly matches both a linker
                  # symlink and the real versioned DSO -- silently picking
                  # matches[0] would compare/scope against whichever one
                  # happens to sort first, an arbitrary artifact rather
                  # than the intended build product (Codex review). Fail
                  # loud instead of guessing.
                  print(f'::error::{label}: pattern {pattern!r} matched more than one candidate under {root}/: {matches} -- narrow the pattern so it matches exactly one file', file=sys.stderr)
                  sys.exit(1)
              return matches[0] if matches else None

          if cell['kind'] == 'bundle':
              staging = 'bundle-staging'
              # exist_ok=True alone would silently reuse a pre-existing
              # bundle-staging/ directory -- the earlier checkout populates
              # the whole workspace from the caller's own repository first,
              # so a checked-in bundle-staging/ tree would leave its own
              # files sitting alongside the members copied below. compare
              # fans out a directory operand by collecting every supported
              # file under it, so a stale leftover file would silently join
              # the comparison even though it was never part of this run's
              # candidate upload (Codex review). Clear it first so staging
              # always starts from nothing.
              shutil.rmtree(staging, ignore_errors=True)
              os.makedirs(staging)
              missing = []
              # Two distinct members can resolve to files that share a
              # basename (e.g. build/linux/libfoo.so vs. build/plugins/
              # libfoo.so) -- copy2 into one shared flat staging directory
              # would then silently overwrite the first with the second,
              # dropping a member from the bundle comparison without any
              # signal (Codex review). Track which member claimed each
              # destination basename and fail loud on a second claim,
              # instead of guessing.
              staged_by_basename = {}
              for member, pattern in cell.get('member_binary_patterns', {}).items():
                  match = resolve(pattern, label=f'bundle {cell[\"name\"]!r} member {member!r}')
                  if match is None:
                      missing.append(member)
                      continue
                  basename = os.path.basename(match)
                  if basename in staged_by_basename:
                      print(f'::error::bundle {cell[\"name\"]!r}: members {staged_by_basename[basename]!r} and {member!r} both resolve to a candidate named {basename!r} -- staging would silently drop one', file=sys.stderr)
                      sys.exit(1)
                  staged_by_basename[basename] = member
                  shutil.copy2(match, os.path.join(staging, basename))
              if missing:
                  print(f'::error::bundle {cell[\"name\"]!r}: no candidate binary matched for member(s) {missing}', file=sys.stderr)
                  sys.exit(1)
              print(f'new-library={staging}')
          else:
              match = resolve(cell.get('binary_pattern', ''), label=f'target {cell[\"name\"]!r}')
              if match is None:
                  print(f'::error::target {cell[\"name\"]!r}: no candidate binary matched binary_pattern {cell.get(\"binary_pattern\")!r} under {root}/', file=sys.stderr)
                  sys.exit(1)
              print(f'new-library={match}')
              # target_kind: app-consumer only -- consumer_binary_pattern
              # locates the CONSUMER executable, a distinct artifact from
              # the library binary_pattern already resolved above (both
              # matched separately: reusing new-library here would pass
              # check-target the library itself as --used-by instead of
              # the actual consumer, scoping the comparison against the
              # wrong binary).
              consumer_pattern = cell.get('consumer_binary_pattern', '')
              if consumer_pattern:
                  consumer_match = resolve(consumer_pattern, label=f'target {cell[\"name\"]!r} consumer_binary_pattern')
                  if consumer_match is None:
                      print(f'::error::target {cell[\"name\"]!r}: no candidate binary matched consumer_binary_pattern {consumer_pattern!r} under {root}/', file=sys.stderr)
                      sys.exit(1)
                  print(f'consumer-binary={consumer_match}')
              else:
                  print('consumer-binary=')

          build_output_path = 'build-output/build-output.json'
          if os.path.isfile(build_output_path):
              print(f'build-output={build_output_path}')
              # build-output.json is the authority for target-scoped source
              # evidence.  Resolve the library target represented by this
              # cell (redirected contract checks use baseline_target) rather
              # than forwarding one workflow-global pack to every target.
              with open(build_output_path, encoding='utf-8') as f:
                  build_output = json.load(f)
              target_id = cell.get('baseline_target') or cell.get('name')
              target = next(
                  (t for t in build_output.get('targets', []) if t.get('id') == target_id),
                  None,
              )
              target_evidence = (target or {}).get('evidence')
              if isinstance(target_evidence, dict):
                  # validate_build_output() must run whenever the target
                  # declares an evidence OBJECT at all, not only once it
                  # happens to carry a non-empty path -- gating validation
                  # on a truthy path let a malformed claim (e.g.
                  # projection: declared with an empty/missing path, which
                  # validate_build_output() would reject as \"not a readable
                  # abicheck_inputs pack\") silently fall through to the
                  # sources-based-evidence fallback below instead of
                  # failing closed (Codex review).
                  #
                  # Path confinement alone only proves evidence_path
                  # *points* somewhere safe -- it says nothing about
                  # whether the build-output.json making this 'declared'
                  # claim is actually trustworthy (e.g. two targets
                  # sharing one pack, or a pack whose own manifest.library
                  # names a different target). validate_build_output() is
                  # the same check 'project validate-build' runs, and
                  # 'project plan' never calls it -- run it here, before
                  # this target's evidence is treated as scoped to it,
                  # rather than inferring validity from path confinement
                  # alone (Codex review).
                  from abicheck.buildsource.build_output import validate_build_output

                  # validate_build_output() only reports structural findings
                  # (a shared pack, a manifest/target mismatch, ...) via its
                  # returned report -- it still raises FileNotFoundError/
                  # ValueError outright for a build-output.json that isn't
                  # even readable as one (missing/wrong schema, non-object
                  # JSON), matching load_build_output()'s own contract. Catch
                  # both here so an untrusted, malformed artifact fails with
                  # the same clean ::error:: shape as every other guard in
                  # this script, instead of an uncaught Python traceback.
                  try:
                      validation = validate_build_output('build-output')
                      validation_errors = validation.errors
                  except (FileNotFoundError, ValueError) as exc:
                      validation_errors = [str(exc)]
                  if validation_errors:
                      print(f'::error::target {target_id!r}: build-output.json failed validation, so its evidence.path cannot be trusted as scoped to this target: {\"; \".join(validation_errors)}', file=sys.stderr)
                      sys.exit(1)
                  # A 'declared' claim means the build itself asserts this
                  # pack belongs to exactly this target -- validate_build_output()
                  # above already confirmed it is not shared with another
                  # 'declared' target. An 'inferred' claim is different: two
                  # targets legitimately reference the SAME build-wide pack
                  # and rely on evidence.attribution_path plus this target's
                  # id to filter which TUs actually belong to it. Nothing in
                  # this workflow -- nor any real dump/compare CLI caller of
                  # inputs_pack.ingest_inputs_pack() -- currently threads that
                  # attribution/target-id filtering through, so forwarding an
                  # inferred pack unfiltered would let one target's build/
                  # source check silently incorporate every other target
                  # sharing the same pack (Codex review). Reject rather than
                  # analyze it as if it were scoped, until that filtering is
                  # actually wired up end to end.
                  projection = target_evidence.get('projection', '')
                  if projection == 'inferred':
                      print(f'::error::target {target_id!r}: evidence.projection is \'inferred\', but no dump/compare entry point yet filters an inferred packs TUs by attribution_path/target id before analysis -- forwarding it here would let this target incorporate every other targets evidence too. Rejecting until attribution-based filtering is wired end to end; use a per-target \'declared\' evidence pack instead', file=sys.stderr)
                      sys.exit(1)
                  evidence_path = target_evidence.get('path', '')
                  if evidence_path:
                      if os.path.isabs(evidence_path) or '..' in evidence_path.replace('\\\\', '/').split('/'):
                          print(f'::error::target {target_id!r}: evidence.path {evidence_path!r} is absolute or escapes the build-output artifact', file=sys.stderr)
                          sys.exit(1)
                      resolved_evidence = os.path.realpath(os.path.join('build-output', evidence_path))
                      build_output_root = os.path.realpath('build-output')
                      if os.path.commonpath([build_output_root, resolved_evidence]) != build_output_root:
                          print(f'::error::target {target_id!r}: evidence.path {evidence_path!r} escapes the build-output artifact', file=sys.stderr)
                          sys.exit(1)
                      if not os.path.exists(resolved_evidence):
                          print(f'::error::target {target_id!r}: evidence.path {evidence_path!r} does not exist in the downloaded build-output artifact', file=sys.stderr)
                          sys.exit(1)
                      if '\\n' in resolved_evidence or '\\r' in resolved_evidence:
                          print(f'::error::target {target_id!r}: evidence.path contains a newline character', file=sys.stderr)
                          sys.exit(1)
                      print(f'evidence-pack={resolved_evidence}')
                      producer = build_output.get('evidence_producer', {})
                      producer_kind = producer.get('kind', '') if isinstance(producer, dict) else ''
                      if not isinstance(producer_kind, str):
                          producer_kind = ''
                      # producer_kind is read from an untrusted build artifact
                      # and written straight to the line-oriented \$GITHUB_OUTPUT
                      # file below -- an embedded newline/carriage-return could
                      # inject or override a later output line the same way an
                      # embedded newline in a resolved candidate path could
                      # above (Codex review). Reject outright, matching that
                      # same defensive pattern, rather than trusting a value
                      # this script never controlled.
                      if '\\n' in producer_kind or '\\r' in producer_kind:
                          print(f'::error::target {target_id!r}: build-output.json evidence_producer.kind contains a newline character', file=sys.stderr)
                          sys.exit(1)
                      print(f'evidence-producer={producer_kind}')
                  else:
                      print('evidence-pack=')
                      print('evidence-producer=')
              else:
                  print('evidence-pack=')
                  print('evidence-producer=')
          else:
              print('build-output=')
              print('evidence-pack=')
              print('evidence-producer=')
          " >> "$GITHUB_OUTPUT"

      # Closes the G30 P1.4 known gap tracked by issue #628 (the plan doc's
      # round-5/round-8/round-9 addenda): a pre-check failure -- the
      # required "Download build-output artifact" download above, or the
      # "Resolve candidate binary/binaries" step above -- used to end this
      # job with no report at all for `aggregate` to see, indistinguishable
      # from "this optional cell legitimately had nothing to check." Reuses
      # actions/check-target/report_envelope.py's own `--mode
      # operational-error` directly -- the same script check-target's own
      # run.sh drives for a real resolve-baseline failure -- rather than
      # reimplementing its envelope-construction logic inline here (the
      # duplication the G30 plan doc's original framing of this gap wanted
      # to avoid) or restructuring check-target's own interface to accept a
      # "resolution already failed" case (its other option): this cell's
      # identity fields (name/profile/baseline_channel/requested_depth/
      # gate_mode) are already known from the matrix, so no other
      # check-target input is needed to synthesize the envelope directly.
      # `--resolve-outcome ambiguous` matches how check-target/run.sh itself
      # already reuses resolve-baseline's "ambiguous" outcome as the generic
      # catch-all for other pre-analysis infrastructure failures (a
      # collect-facts verify/replay failure, a missing analysis report) that
      # aren't literally a resolve-baseline outcome either.
      - name: Synthesize pre-check operational-error report
        id: precheck
        if: always() && (steps.download_build_output.outcome == 'failure' || steps.candidate.outcome == 'failure')
        shell: bash
        env:
          MATRIX_NAME: ${{ matrix.name }}
          MATRIX_PROFILE_ID: ${{ matrix.profile_id }}
          MATRIX_BASELINE_CHANNEL: ${{ matrix.baseline_channel }}
          MATRIX_REQUESTED_DEPTH: ${{ matrix.requested_depth }}
          MATRIX_EXPLICIT_ID: ${{ matrix.explicit_id || '' }}
          MATRIX_GATE_MODE: ${{ matrix.gate_mode }}
          PROJECT: ${{ inputs.project != '' && inputs.project || github.repository }}
          HEAD_SHA: ${{ inputs.head-sha != '' && inputs.head-sha || github.sha }}
          BASE_REF: ${{ inputs.base-ref }}
          ACTION_VERSION: ${{ format('{0}@{1}', steps.identity.outputs.repository, steps.identity.outputs.ref) }}
          BUILD_OUTPUT_FAILED: ${{ steps.download_build_output.outcome == 'failure' }}
        run: |
          set -euo pipefail
          if [[ "$BUILD_OUTPUT_FAILED" == "true" ]]; then
            MESSAGE="the required build-output artifact download failed for profile '$MATRIX_PROFILE_ID' -- see the 'Download build-output artifact' step's own log for the reason."
          else
            MESSAGE="candidate binary resolution failed for '$MATRIX_NAME' -- see the 'Resolve candidate binary/binaries' step's own log for the specific reason."
          fi
          # See "Resolve candidate binary/binaries" for why the interpreter is
          # resolved rather than named -- this step matters most on exactly the
          # path where that one failed, so it must not fail for a second,
          # unrelated reason.
          PY="$(command -v python3 || command -v python)"
          set +e
          ENVELOPE_STDOUT=$("$PY" ./.check-project-src/actions/check-target/report_envelope.py \
            --mode operational-error \
            --name "$MATRIX_NAME" \
            --profile-id "$MATRIX_PROFILE_ID" \
            --baseline-channel "$MATRIX_BASELINE_CHANNEL" \
            --requested-depth "$MATRIX_REQUESTED_DEPTH" \
            --explicit-id "$MATRIX_EXPLICIT_ID" \
            --gate-mode "$MATRIX_GATE_MODE" \
            --resolve-outcome "ambiguous" \
            --resolve-message "$MESSAGE" \
            --project "$PROJECT" \
            --head-sha "$HEAD_SHA" \
            --base-ref "$BASE_REF" \
            --action-version "$ACTION_VERSION" \
            --report-out precheck-report.json)
          ENVELOPE_EXIT=$?
          set -e
          echo "$ENVELOPE_STDOUT"
          if [[ $ENVELOPE_EXIT -ne 0 ]]; then
            echo "::error::failed to write the pre-check operational-error report envelope (see the output above)."
            exit 1
          fi
          # Same grep -v / || true caution as check-target/run.sh's own
          # identical pattern: there are always other lines to pass through
          # (check-id/verdict/... precede exit-code=), but the guard is kept
          # anyway against `set -o pipefail` above.
          echo "$ENVELOPE_STDOUT" | grep -v '^exit-code=' >> "$GITHUB_OUTPUT" || true
          FINAL_EXIT=$(echo "$ENVELOPE_STDOUT" | sed -n 's/^exit-code=//p')
          echo "pre-check operational-error report: precheck-report.json (exit-code: $FINAL_EXIT)"
          exit "${FINAL_EXIT:-1}"

      # Deliberately no continue-on-error here: check-target's own finalize
      # step (ADR-047 §7) already computes its correct composite exit code
      # per gate-mode before this step's outer conclusion is decided, and
      # `steps.run.outputs.*` are captured at the point its internal
      # finalize step wrote them -- before that exit code is returned --
      # so they stay available to the always()-conditioned steps below even
      # when this step's own conclusion is "failure". Letting this step's
      # natural failure propagate (instead of swallowing it) is what makes
      # this whole matrix job correctly report failure for a real
      # gate-mode: local break or an operational error, which
      # branch-protection-required status checks depend on.
      #
      # Gated on steps.candidate.outcome == 'success' (issue #628): a
      # skipped candidate step (the build-output download above failed
      # first) or a failed one (continue-on-error'd, so this step would
      # otherwise still attempt to run by default) must not reach
      # check-target with a half-resolved/missing new-library -- the
      # "Synthesize pre-check operational-error report" step above already
      # covers both cases.
      - name: Run check-target
        id: run
        if: steps.candidate.outcome == 'success'
        uses: ./.check-project-src/actions/check-target
        with:
          kind: ${{ matrix.kind }}
          target-kind: ${{ matrix.target_kind || 'library' }}
          name: ${{ matrix.name }}
          baseline-target: ${{ matrix.baseline_target || '' }}
          bundle-members: ${{ toJSON(matrix.bundle_members || fromJSON('[]')) }}
          profile: ${{ matrix.profile_id }}
          baseline-channel: ${{ matrix.baseline_channel }}
          baseline-path: 'baseline-sets/${{ matrix.profile_id }}-${{ matrix.baseline_channel }}'
          baseline-required: ${{ matrix.required }}
          candidate-build-output: ${{ steps.candidate.outputs.build-output }}
          expected-project-ref: ${{ matrix.baseline_channel == 'accepted-main' && inputs.expected-project-ref || '' }}
          expected-baseline-generation: ${{ inputs.expected-baseline-generation }}
          allow-new-target: ${{ matrix.allow_new_target || 'false' }}
          requested-depth: ${{ matrix.requested_depth }}
          explicit-id: ${{ matrix.explicit_id || '' }}
          gate-mode: ${{ matrix.gate_mode }}
          project: ${{ inputs.project != '' && inputs.project || github.repository }}
          head-sha: ${{ inputs.head-sha != '' && inputs.head-sha || github.sha }}
          base-ref: ${{ inputs.base-ref }}
          # A build-emitted target pack carries its producer identity with
          # it. Keep the workflow input only for replay/legacy callers that
          # have no target evidence entry in build-output.json.
          evidence-producer: ${{ steps.candidate.outputs.evidence-producer || inputs.evidence-producer }}
          # Never fall back to the workflow-global pack here: a project cell
          # without declared target evidence must not consume another
          # target's build-wide pack.
          evidence-pack-path: ${{ steps.candidate.outputs.evidence-pack }}
          new-library: ${{ steps.candidate.outputs.new-library }}
          consumer-binary: ${{ matrix.target_kind == 'app-consumer' && steps.candidate.outputs.consumer-binary || '' }}
          contract-file: ${{ matrix.target_kind == 'plugin-contract' && matrix.contract_file || '' }}
          # RunPlanCheck.header (run_plan.py's own field docstring): a
          # target's `public_headers:` (ADR-047's own worked example),
          # space-joined -- the same per-cell-first precedence as
          # ast-frontend/gcc-path/gcc-options above/below (`matrix.header ||
          # inputs.header`, never merged with the workflow-global value).
          # Gated on `kind != 'bundle'` for the identical reason those three
          # already are: RunPlanCheck.header is never set for a bundle cell
          # (per-bundle-member header staging doesn't exist yet -- see
          # BUNDLE_CHECK_DEPTHS's own docstring), so this expression is a
          # no-op for one today, but the explicit guard keeps this cell's
          # behaviour pinned to "falls back to the workflow-global input"
          # rather than silently depending on the field always being empty.
          header: ${{ matrix.kind != 'bundle' && matrix.header || inputs.header }}
          old-header: ${{ inputs.old-header }}
          new-header: ${{ inputs.new-header }}
          include: ${{ inputs.include }}
          old-include: ${{ inputs.old-include }}
          new-include: ${{ inputs.new-include }}
          lang: ${{ inputs.lang }}
          # G34 Phase B: same per-cell-first precedence as the compile
          # overlay below, from that cell's own profiles.<id>.compile.frontend
          # (run_plan.RunPlanCheck.compile_ast_frontend). This is the step
          # that makes a per-profile frontend real rather than projected: a
          # GCC profile's cell can resolve `castxml` while a Clang/DPC++
          # profile's cell in the same run resolves `clang`, which one
          # workflow-global --ast-frontend cannot express.
          #
          # Gated on `kind != 'bundle'` (Codex review): a bundle cell's
          # new-library is the `bundle-staging` *directory* it stages its
          # members into, and the root Action rejects every non-`auto`
          # ast-frontend for a directory/package operand outright
          # (action/run.sh's `_is_release_style_operand` guard) because the
          # per-library fan-out never threads an L2 compile context to each
          # pair's header dump. Forwarding a profile's `frontend:` there
          # would turn a previously working bundle check into a hard
          # operational error. Falling back to `inputs.ast-frontend` rather
          # than to the empty string is deliberate: it leaves a bundle
          # cell's behaviour exactly as it was before this line existed,
          # including that guard still firing loudly on a workflow-global
          # non-`auto` value -- declining to add a new source of the error
          # is this line's job, not silencing the existing one.
          ast-frontend: ${{ matrix.kind != 'bundle' && matrix.compile_ast_frontend || inputs.ast-frontend }}
          # An omitted consumer_compile FIELD defers to the caller's
          # workflow-global input, the same as an omitted producer compile
          # field does two lines up -- not to the empty string, which would
          # silently apply the frontend/binding/options *default* instead of
          # the caller's actual selection whenever a profile's
          # consumer_compile: overlay sets some fields but not others (e.g.
          # only `standard:`) (Codex review). That fallback is gated on
          # `matrix.consumer_compile_active` (the overlay's own presence,
          # independent of what its fields resolve to) rather than firing
          # whenever any of these three expressions is merely non-empty --
          # without that gate, a profile with NO consumer_compile: overlay
          # at all would still get a non-empty consumer-ast-frontend/
          # gcc-path/gcc-options the moment the caller sets any
          # workflow-global --ast-frontend/--gcc-path/--gcc-options, which
          # would activate check-target's separate consumer-context dump
          # (and its "replace the candidate snapshot" behavior) for every
          # cell, not just the ones that actually declare an overlay
          # (Codex review, second round).
          consumer-ast-frontend: ${{ (matrix.kind != 'bundle' && matrix.consumer_compile_active) && (matrix.consumer_compile_ast_frontend || inputs.ast-frontend) || '' }}
          consumer-gcc-path: ${{ (matrix.kind != 'bundle' && matrix.consumer_compile_active) && (matrix.consumer_compile_gcc_path || inputs.gcc-path) || '' }}
          consumer-gcc-options: ${{ (matrix.kind != 'bundle' && matrix.consumer_compile_active) && (matrix.consumer_compile_gcc_options || inputs.gcc-options) || '' }}
          # An overlay declaring only e.g. `binding:` with no matching
          # --toolchain-bindings entry (and no workflow-global compiler
          # input to fall back to above) resolves all three fields above to
          # the empty string even though the profile genuinely declared a
          # consumer_compile: overlay -- check-target's own activation
          # condition previously required at least one of those three
          # fields to be non-empty, so this cell would silently skip the
          # separate consumer dump and let the producer's own compiler
          # options (e.g. its `-std=`) leak into what the schema documents
          # as an isolated client view (Codex review). Forward the marker
          # itself so check-target can activate on it directly.
          consumer-compile-active: ${{ (matrix.kind != 'bundle' && matrix.consumer_compile_active) && 'true' || 'false' }}
          # P1 toolchain-profile audit: this cell's profiles.<id>.compile
          # overlay (project plan --toolchain-bindings), when the
          # profile declares one, takes precedence over these workflow-
          # global inputs -- the whole point of a per-profile compile
          # overlay is that it, not one shared flag set, drives that
          # profile's compiler invocation. A profile with no overlay (or a
          # run-plan generated without --toolchain-bindings, so
          # compile_gcc_path stays empty) falls back to the global input
          # unchanged, so an existing project with no profiles.*.compile
          # block sees no behavior change at all.
          #
          # Also gated on `kind != 'bundle'`, for the identical reason
          # ast-frontend above is: a bundle cell's operand is the
          # bundle-staging *directory*, and cli_resolve.py's
          # `_reject_compile_context_for_set_inputs` hard-rejects
          # gcc-path/gcc-options for a directory/package compare (the
          # per-library release fan-out never threads a single-pair L2
          # compile context to each pair). Before this line, a profile that
          # set compile.binding for its target cells would have that same
          # per-cell override silently reach every bundle cell too, turning
          # a previously working bundle check into a hard operational
          # error -- flagged as a known, unfixed pre-existing bug in the
          # G34 producer/consumer-compiler-profile-separation plan
          # (Phase B) until this change. Falling back to the workflow-
          # global input for a bundle cell (rather than to the empty
          # string) matches ast-frontend's own precedent exactly: it
          # leaves a bundle cell's behaviour exactly as it was before any
          # per-cell overlay existed, including that a workflow-global
          # non-default gcc-path/gcc-options still hard-errors a bundle
          # cell loudly, same as it always has -- this line declines to
          # add a *new* source of the error via the per-cell mechanism, it
          # does not silence the pre-existing one.
          #
          # `sysroot` has no per-cell overlay field at all (unlike
          # gcc-path/gcc-options, no `profiles.<id>.compile.sysroot` is
          # wired into RunPlanCheck), so its forwarding here is unchanged
          # by the P1 toolchain-profile audit and is deliberately left
          # unconditional rather than gated: gating it would be a new,
          # speculative behaviour change (silently dropping an explicit
          # workflow-global --sysroot for bundle cells specifically) the
          # G34 plan doc explicitly flags as needing its own decision --
          # "не молча удалять параметры" applies here as much as it does
          # to the per-cell fields above, so this fix does not invent a
          # third option beyond what was already reviewed.
          gcc-path: ${{ matrix.kind != 'bundle' && matrix.compile_gcc_path || inputs.gcc-path }}
          gcc-prefix: ${{ inputs.gcc-prefix }}
          gcc-options: ${{ matrix.kind != 'bundle' && matrix.compile_gcc_options || inputs.gcc-options }}
          sysroot: ${{ inputs.sysroot }}
          sources: ${{ inputs.sources }}
          # check-target's own build-info gate only converts evidence-pack-path
          # into --build-info for evidence-producer: wrapper/clang-plugin --
          # for replay (or no producer at all), a per-target pack this cell
          # resolved from build-output.json above would otherwise never
          # reach dump/compare, silently losing source-only evidence for
          # exactly the build/source-depth cells this resolution exists for
          # (Codex review). build-info's own docs already cover this case
          # ("set it directly ... for a producer-first build/source-depth
          # check that already has an out-of-band pack") -- forward the
          # resolved pack there directly rather than widening check-target's
          # own evidence-producer-gated conversion. Must test the SAME
          # resolved producer the evidence-producer field below actually
          # forwards (steps.candidate.outputs.evidence-producer, falling
          # back to the legacy workflow-global input only when this cell
          # resolved none) -- testing the bare global input here let a
          # target whose build-output.json names 'replay' but whose caller
          # still passes the legacy wrapper/clang-plugin default silently
          # skip forwarding its resolved pack at all (Codex review).
          build-info: ${{ ((steps.candidate.outputs.evidence-producer || inputs.evidence-producer) != 'wrapper' && (steps.candidate.outputs.evidence-producer || inputs.evidence-producer) != 'clang-plugin' && steps.candidate.outputs.evidence-pack != '') && steps.candidate.outputs.evidence-pack || inputs.build-info }}
          compile-db: ${{ inputs.compile-db }}
          build-config: ${{ inputs.build-config }}
          policy: ${{ inputs.policy }}
          policy-file: ${{ inputs.policy-file }}
          suppress: ${{ inputs.suppress }}
          severity-preset: ${{ inputs.severity-preset }}
          extra-args: ${{ inputs.extra-args }}
          python-version: ${{ inputs.python-version }}
          install-deps: ${{ inputs.install-deps }}
          # Per-cell first, workflow-level second (G34 Phase C). Both empty
          # leaves the legacy `install-deps` boolean deciding, exactly as
          # before -- the root action.yml resolves that fallback itself, so
          # this stays one expression rather than a second copy of its rule.
          dependency-source: ${{ matrix.dependency_source || inputs.dependency-source }}
          action-version: ${{ format('{0}@{1}', steps.identity.outputs.repository, steps.identity.outputs.ref) }}
          # This job's own already-resolved identity (captured in "Capture
          # this reusable workflow's identity" above) -- check-target's own
          # github.action_repository/github.action_ref auto-detection can't
          # tell a nested `uses: ./.check-project-src/...` local reference
          # apart from a genuine same-repository invocation, which would
          # silently misresolve for an external consumer (Codex review; see
          # check-target/action.yml's abicheck-repository/abicheck-ref
          # input docs for the full explanation).
          abicheck-repository: ${{ steps.identity.outputs.repository }}
          abicheck-ref: ${{ steps.identity.outputs.ref }}

      # `check-id` is `target@profile#baseline_channel@depth` (ADR-047 §7) --
      # artifact names disallow `"`/`:`/`<`/`>`/`|`/`*`/`?`/`\`/`/` outright,
      # and `#` in particular is a *documented, reproducible bug*
      # (actions/upload-artifact#473: a `#` in the name triggers an
      # Authorization error against the underlying Actions API, even though
      # it isn't in the officially-disallowed list), not just a style
      # preference. `actions/check-target/run.sh`'s own precedent for its
      # per-check report *filename* collapses every disallowed character to
      # `_` via `tr -c 'A-Za-z0-9._-' '_'` -- fine there (informational only,
      # not used to address anything), but lossy for an artifact *name*:
      # target `a`/profile `b_c` and target `a_b`/profile `c` on the same
      # channel/depth have distinct check_ids that both collapse to the same
      # `tr` output, so one legitimate report upload can collide with
      # another and `aggregate` then treats a cell as missing (Codex
      # review). Keep the readable `tr` form but append a short content
      # hash of the *original* check_id so two check_ids that collide under
      # `tr` still produce distinct artifact names.
      # Picks whichever of "Run check-target" / "Synthesize pre-check
      # operational-error report" actually produced a report this cell --
      # exactly one of the two ever runs per matrix cell (issue #628).
      - name: Sanitize check-id for artifact name
        id: sanitized
        if: always() && (steps.run.outputs.report-path != '' || steps.precheck.outputs.report-path != '')
        shell: bash
        env:
          CHECK_ID: ${{ steps.run.outputs.check-id || steps.precheck.outputs.check-id }}
        run: |
          # Same cross-platform interpreter resolution as the two steps above.
          # This one runs under `if: always()`, so it is on the path that must
          # still produce a report artifact when everything else went wrong.
          PY="$(command -v python3 || command -v python)"
          "$PY" -c "
          import hashlib
          import os

          check_id = os.environ['CHECK_ID']
          safe = ''.join(c if c.isalnum() or c in '._-' else '_' for c in check_id)
          digest = hashlib.sha256(check_id.encode()).hexdigest()[:12]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
              fh.write(f'id={safe}-{digest}\n')
          "

      # Required sub-task (ADR-047 §4): this upload step must carry its own
      # always-on condition, not just the trailing aggregate job -- under
      # gate-mode: local a real ABI break, or under any gate-mode a genuine
      # operational failure, fails the "Run check-target" step above (see
      # its own comment for why that's deliberately not swallowed), and a
      # subsequent step in a job whose earlier step failed is skipped by
      # default unless it too is always()-conditioned. Without this, the
      # report artifact for exactly the failing cells `aggregate` most
      # needs to see would never upload. `steps.run.outputs.report-path`
      # stays populated even for a failed step, per the comment above --
      # `steps.precheck.outputs.report-path` is this same guarantee's
      # pre-check-failure counterpart (issue #628).
      - name: Upload report
        if: always() && (steps.run.outputs.report-path != '' || steps.precheck.outputs.report-path != '')
        uses: actions/upload-artifact@v7
        with:
          name: '${{ inputs.report-artifact-prefix }}${{ steps.sanitized.outputs.id }}'
          path: ${{ steps.run.outputs.report-path || steps.precheck.outputs.report-path }}

  # ── Job 3: fan-in gate ───────────────────────────────────────────────────
  aggregate:
    name: 'Aggregate'
    needs: [plan, check]
    # Required sub-task (ADR-047 §4): always(), never a bare `needs:` -- plain
    # needs: semantics skip this job when any matrix leg fails, and a skipped
    # job reports success, silently greening a branch-protection-required
    # status past a real gate-mode: deferred operational failure.
    if: always() && needs.plan.outputs.has-checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      exit-code: ${{ steps.aggregate.outputs.exit-code }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # See the `plan` job's identical steps for the "install abicheck, not
      # the caller's own repo" rationale (and for the `job.workflow_ref`/
      # `job.workflow_sha` vs. `github.workflow_ref`/`github.workflow_sha`
      # writeup).
      - name: Capture this reusable workflow's identity
        id: identity
        shell: bash
        env:
          WORKFLOW_REF: ${{ job.workflow_ref }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          FALLBACK_REPOSITORY: ${{ github.repository }}
          FALLBACK_REF: ${{ github.sha }}
        run: |
          repository="${WORKFLOW_REF%%/.github/workflows/*}"
          echo "repository=${repository:-$FALLBACK_REPOSITORY}" >> "$GITHUB_OUTPUT"
          echo "ref=${WORKFLOW_SHA:-$FALLBACK_REF}" >> "$GITHUB_OUTPUT"

      - name: Checkout abicheck (for installing the CLI)
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.identity.outputs.repository }}
          ref: ${{ steps.identity.outputs.ref }}
          path: .check-project-src
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install abicheck
        shell: bash
        run: pip install ./.check-project-src

      - name: Download run-plan.json
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.run-plan-artifact-name }}

      # The earlier `actions/checkout` step already populated the whole
      # workspace from the caller's own repository -- if that repository
      # happens to contain a checked-in reports/*.json directory,
      # merge-multiple: true below extracts every downloaded report into
      # that same directory without first removing what's already there.
      # `abicheck aggregate` loads every *.json under reports/ and rejects
      # duplicate target IDs, so a stale checked-in report can fail this
      # job even though the matrix produced the correct report (Codex
      # review). Clear it first so only the real downloads land there.
      - name: Clear reports staging before download
        shell: bash
        run: rm -rf reports

      - name: Download every check report
        uses: actions/download-artifact@v8
        with:
          path: reports
          pattern: '${{ inputs.report-artifact-prefix }}*'
          merge-multiple: true

      - name: Run aggregate
        id: aggregate
        shell: bash
        run: |
          # --run-plan projects run-plan.json to the expected-target set
          # internally (ADR-054) -- no separate `run-plan to-aggregate-
          # manifest` step needed. The gate policy (CONFIG's own
          # `aggregate: gate:` block) rides inside run-plan.json itself
          # (CLI cleanup phase two, PR 2 -- see the "Generate run-plan.json"
          # step above), not as CLI flags here.
          set +e
          abicheck aggregate reports --run-plan run-plan.json \
            --format json -o aggregate-result.json
          code=$?
          abicheck aggregate reports --run-plan run-plan.json \
            --format text
          echo "exit-code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Upload aggregate result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.aggregate-artifact-name }}
          path: aggregate-result.json
