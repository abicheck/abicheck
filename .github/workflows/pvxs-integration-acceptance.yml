name: PVXS integration acceptance

on:
  push:
    branches: [validation/pvxs-integration-20260814]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pvxs-matrix:
    name: PVXS ${{ matrix.old }} -> ${{ matrix.new }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { old: '1.4.0', new: '1.5.0' }
          - { old: '1.5.0', new: '1.5.1' }
          - { old: '1.5.1', new: '1.5.2' }
          - { old: '1.5.2', new: 'master' }
    env:
      SETUP_PATH: .ci-local
      SET: defaults
      CMP: gcc
      BCFG: default
      BASE: 'R7.0.10'
      _PVXS_ABORT_ON_CRIT: '1'
      PVXS_LOG: 'pvxs.*=WARN'

    steps:
      - name: Checkout abicheck under test
        uses: actions/checkout@v6

      - name: Checkout PVXS
        uses: actions/checkout@v6
        with:
          repository: epics-base/pvxs
          path: pvxs
          fetch-depth: 0
          submodules: true

      - name: Install PVXS and legacy ABI dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install build-essential cmake libreadline-dev libevent-dev \
            abi-dumper vtable-dumper abi-compliance-checker universal-ctags jq time
          abi-dumper --version || true
          abi-compliance-checker --version || true
          gcc --version | head -1

      - name: Install current abicheck
        run: |
          python -m pip install .
          abicheck --version

      - name: Prepare pinned EPICS Base
        working-directory: pvxs
        run: |
          python .ci/cue.py prepare
          grep EPICS_BASE configure/RELEASE.local
          git -C "$(sed -n 's/^EPICS_BASE=//p' configure/RELEASE.local)" describe --tags --always || true

      - name: Build both PVXS revisions
        id: build
        working-directory: pvxs
        env:
          OLD_REF: ${{ matrix.old }}
          NEW_REF: ${{ matrix.new }}
        run: |
          set -euxo pipefail
          ROOT="$PWD"
          WORK="$RUNNER_TEMP/pvxs-${OLD_REF}-to-${NEW_REF}"
          rm -rf "$WORK" && mkdir -p "$WORK/old" "$WORK/new"
          prepare_tree() {
            git archive "$1" | tar -C "$2" -x
            cp "$ROOT/configure/RELEASE.local" "$2/configure/"
            [ ! -f "$ROOT/configure/CONFIG_SITE.local" ] || cp "$ROOT/configure/CONFIG_SITE.local" "$2/configure/"
            for f in "$2"/configure/*.local; do [ ! -f "$f" ] || sed -i -e "s|\$(TOP)|$ROOT|g" -e 's|-Werror||g' "$f"; done
          }
          prepare_tree "$OLD_REF" "$WORK/old"
          prepare_tree "$NEW_REF" "$WORK/new"
          /usr/bin/time -v -o "$WORK/build-old.time" make -C "$WORK/old" CROSS_COMPILER_TARGET_ARCHS= OPT_CFLAGS='-g -Og' OPT_CXXFLAGS='-g -Og' ioc -j2
          /usr/bin/time -v -o "$WORK/build-new.time" make -C "$WORK/new" CROSS_COMPILER_TARGET_ARCHS= OPT_CFLAGS='-g -Og' OPT_CXXFLAGS='-g -Og' ioc -j2
          old_pvxs=$(readlink -f "$(ls "$WORK"/old/lib/linux-*/libpvxs.so.* | head -1)")
          new_pvxs=$(readlink -f "$(ls "$WORK"/new/lib/linux-*/libpvxs.so.* | head -1)")
          old_ioc=$(readlink -f "$(ls "$WORK"/old/lib/linux-*/libpvxsIoc.so.* | head -1)")
          new_ioc=$(readlink -f "$(ls "$WORK"/new/lib/linux-*/libpvxsIoc.so.* | head -1)")
          file "$old_pvxs" "$new_pvxs" "$old_ioc" "$new_ioc"
          {
            echo "work=$WORK"; echo "old_pvxs=$old_pvxs"; echo "new_pvxs=$new_pvxs"
            echo "old_ioc=$old_ioc"; echo "new_ioc=$new_ioc"
            echo "old_headers=$WORK/old/include"; echo "new_headers=$WORK/new/include"
          } >> "$GITHUB_OUTPUT"

      - name: Binary self-compare invariant
        env:
          LIB: ${{ steps.build.outputs.new_pvxs }}
        run: |
          /usr/bin/time -v -o self-binary.time abicheck compare "$LIB" "$LIB" --format json -o self-binary.json
          jq '{verdict, change_count: (.changes | length?)}' self-binary.json
          test "$(jq -r '.verdict' self-binary.json)" = COMPATIBLE

      - name: Full Action compare libpvxs with supported toolchain
        id: action_pvxs
        continue-on-error: true
        uses: ./
        with:
          mode: compare
          old-library: ${{ steps.build.outputs.old_pvxs }}
          new-library: ${{ steps.build.outputs.new_pvxs }}
          old-header: ${{ steps.build.outputs.old_headers }}
          new-header: ${{ steps.build.outputs.new_headers }}
          old-version: ${{ matrix.old }}
          new-version: ${{ matrix.new }}
          dependency-source: conda-forge
          format: json
          output-file: libpvxs.json
          pr-comment: false
          github-token: ''
          fail-on-breaking: false
          fail-on-api-break: false

      - name: Full Action compare libpvxsIoc with supported toolchain
        id: action_ioc
        continue-on-error: true
        uses: ./
        with:
          mode: compare
          old-library: ${{ steps.build.outputs.old_ioc }}
          new-library: ${{ steps.build.outputs.new_ioc }}
          old-header: ${{ steps.build.outputs.old_headers }}
          new-header: ${{ steps.build.outputs.new_headers }}
          old-version: ${{ matrix.old }}
          new-version: ${{ matrix.new }}
          dependency-source: conda-forge
          format: json
          output-file: libpvxsIoc.json
          pr-comment: false
          github-token: ''
          fail-on-breaking: false
          fail-on-api-break: false

      - name: Header-aware self-compare through current CLI
        env:
          LIB: ${{ steps.build.outputs.new_pvxs }}
          HDR: ${{ steps.build.outputs.new_headers }}
        run: |
          set +e
          /usr/bin/time -v -o self-header.time abicheck compare "$LIB" "$LIB" \
            --header "old=$HDR" --header "new=$HDR" --format json -o self-header.json
          rc=$?
          set -e
          echo "rc=$rc"
          test -s self-header.json && jq '{verdict, change_count: (.changes | length?)}' self-header.json || true
          test "$rc" -eq 0

      - name: Existing PVXS ABI checker side-by-side
        working-directory: pvxs
        run: |
          set +e
          ./abi-diff.sh '${{ matrix.old }}' '${{ matrix.new }}' > "$RUNNER_TEMP/abicc.log" 2>&1
          rc=$?
          set -e
          echo "legacy rc=$rc"
          tail -100 "$RUNNER_TEMP/abicc.log"
          cp "$RUNNER_TEMP/abicc.log" ../abicc.log

      - name: Validate Action transport
        run: |
          echo "libpvxs: outcome=${{ steps.action_pvxs.outcome }} verdict=${{ steps.action_pvxs.outputs.verdict }} exit=${{ steps.action_pvxs.outputs.exit-code }}"
          echo "ioc: outcome=${{ steps.action_ioc.outcome }} verdict=${{ steps.action_ioc.outputs.verdict }} exit=${{ steps.action_ioc.outputs.exit-code }}"
          test -s libpvxs.json
          test -s libpvxsIoc.json
          jq '{verdict, summary, evidence_tiers, change_count: (.changes | length?)}' libpvxs.json
          jq '{verdict, summary, evidence_tiers, change_count: (.changes | length?)}' libpvxsIoc.json

      - name: Upload acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pvxs-${{ matrix.old }}-to-${{ matrix.new }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            self-binary.json
            self-header.json
            libpvxs.json
            libpvxsIoc.json
            self-binary.time
            self-header.time
            abicc.log
            ${{ steps.build.outputs.work }}/build-old.time
            ${{ steps.build.outputs.work }}/build-new.time
