name: Examples Validation

on:
  push:
    branches: [main]
    paths:
      - "examples/**"
      - "abicheck/**"
      - "tests/**"
      - "validation/scripts/**"
      - "scripts/check_examples_validation_status_sync.py"
      - "scripts/check_build_source_release_proof.py"
      - ".github/workflows/examples-validation.yml"
      - ".github/actions/install-system-deps/action.yml"
  pull_request:
    branches: [main]
    paths:
      - "examples/**"
      - "abicheck/**"
      - "tests/**"
      - "validation/scripts/**"
      - "scripts/check_examples_validation_status_sync.py"
      - "scripts/check_build_source_release_proof.py"
      - ".github/workflows/examples-validation.yml"
      - ".github/actions/install-system-deps/action.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # The curated, task-oriented workflow examples under examples/workflows/
  # (Phase 5 of the examples/catalog split). Unlike every job above, this one
  # does not touch the caseNN_* calibration catalog at all -- it runs the
  # exact commands each workflow's own README documents and checks the exit
  # code and verdict the walkthrough claims. Deliberately *not*
  # continue-on-error: there is no artifact-collecting step downstream to
  # re-derive its result from, and a rotted walkthrough is a user-facing
  # defect. `--require compare-release` fails the job if that workflow is
  # skipped, so a toolchain regression can't turn this lane green with zero
  # work done (the same silent-skip guard tests/conftest.py's
  # ABICHECK_MIN_EXECUTED provides for the marker lanes).
  workflow-examples:
    name: Validate workflow examples
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install abicheck
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run workflow examples
        run: |
          mkdir -p results
          PYTHONPATH=. python validation/scripts/run_workflow_examples.py \
            --require compare-release --json results/workflow-examples.json

      - name: Upload workflow-example receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: workflow-examples
          path: results/
          retention-days: 14

  # Blocking core matrix: the full debug-headers catalog under both producers.
  # GCC is the historical lane; Clang is promoted to a first-class validator so
  # producer-sensitive cases (e.g. case64 ms_abi calling convention, which GCC
  # cannot emit DW_AT_calling_convention for) are gated, not just benchmarked.
  #
  # Sharded 3 ways per toolchain. The cross-check step below runs the ~195-case
  # catalog through one sequential process; measured on real runs it took
  # 5m21s (gcc) / 8m10s (clang), and once the artifact-mode job was split it
  # became this workflow's critical path. The runner needs no changes to be
  # shardable -- it already takes a positional case-name filter -- so a shard
  # is just "the same command over a third of the names".
  # tests/example_shards.py owns which names those are (round-robin over the
  # sorted catalog, so each leg gets a mix of cheap and expensive cases rather
  # than one leg inheriting the whole expensive tail), and the
  # merge-validate-examples job below reassembles the pieces into the single
  # whole-catalog artifact the downstream collector requires.
  validate-examples:
    name: Validate examples (${{ matrix.toolchain }}, debug-headers, shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        toolchain: [gcc, clang]
        shard: [1, 2, 3]

    steps:
      # fetch-depth: 0 (full history) is required by the AST-cache step below:
      # scripts/restore_git_mtimes.py needs each file's real last-commit time,
      # which a shallow (default depth-1) clone can't see — every file would
      # resolve to the single boundary commit's timestamp instead.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Create results dir
        run: mkdir -p results

      - name: Install system deps
        uses: ./.github/actions/install-system-deps
        with:
          packages: gcc g++ clang cmake curl ca-certificates

      - uses: ./.github/actions/setup-castxml

      # Per-shard cache key: the six legs dump disjoint case sets, so a shared
      # key would have them overwrite each other's cache every run.
      - uses: ./.github/actions/cache-ast-dumps
        with:
          key-suffix: ${{ matrix.toolchain }}-shard${{ matrix.shard }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Select toolchain
        run: |
          if [ "${{ matrix.toolchain }}" = "clang" ]; then
            echo "CC=clang" >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          else
            echo "CC=gcc" >> "$GITHUB_ENV"
            echo "CXX=g++" >> "$GITHUB_ENV"
          fi

      - name: Validate ground_truth.json
        run: |
          test -f examples/ground_truth.json || { echo "::error::ground_truth.json missing"; exit 1; }
          python -c "import json; d=json.load(open('examples/ground_truth.json')); print('ground_truth.json OK:', len(d['verdicts']), 'cases')"

      # Both consumers below take the *same* shard assignment from one source,
      # so the pytest lane and the cross-check lane can never drift onto
      # different case subsets.
      - name: Resolve this shard's case list
        run: |
          # Assign first, THEN echo. `echo "V=$(cmd)" >> $GITHUB_ENV` exits 0
          # even when cmd fails -- the echo succeeds -- so a failing resolver
          # would silently export an EMPTY value. Empty is the worst possible
          # value here: an empty positional filter means "the whole catalog"
          # and an empty -k means "every test", so all six legs would quietly
          # run all 195 cases and still report green, turning the shard split
          # into a 6x duplication. It would also defeat example_shards.py's own
          # assert_names_are_unambiguous guard, whose whole job is to fail
          # loudly here rather than as a puzzling "duplicate case ids" error in
          # the merge two jobs later. A plain assignment propagates the
          # command's exit status under the default `bash -e`, and the explicit
          # emptiness check covers a resolver that exits 0 with no output.
          cases="$(python tests/example_shards.py list --shard ${{ matrix.shard }} --of 3)"
          pytest_k="$(python tests/example_shards.py list --shard ${{ matrix.shard }} --of 3 --pytest-k)"
          if [ -z "$cases" ] || [ -z "$pytest_k" ]; then
            echo "::error::shard ${{ matrix.shard }}/3 resolved to an empty case list"
            exit 1
          fi
          echo "resolved $(printf '%s' "$cases" | wc -w) cases for shard ${{ matrix.shard }}/3"
          echo "SHARD_CASES=$cases" >> "$GITHUB_ENV"
          echo "SHARD_K=$pytest_k" >> "$GITHUB_ENV"

      # NOTE on the -k filter's source of truth: the shard list comes from
      # examples/ground_truth.json, while test_example_pipeline is parametrized
      # from the examples/case*/ directory listing. Those agree today, and the
      # ai-readiness `examples-ground-truth` check (ERROR severity) is what
      # keeps them agreeing — it fails when a case directory has no ground-truth
      # entry. Without that check a case dir missing from ground truth would be
      # deselected in *every* shard, i.e. silently lose coverage rather than
      # fail. Don't relax that check without giving this filter its own guard.
      - name: Run example cases (pytest autodiscovery)
        env:
          # This workflow checks out and executes repository-owned fixtures only.
          ABICHECK_TRUSTED_SOURCE_SMOKE_RUN: "1"
        run: |
          PYTHONPATH=. pytest tests/test_example_autodiscovery.py -v --tb=short -m integration \
            -k "$SHARD_K" \
            --junit-xml=results/examples-autodiscovery-${{ matrix.toolchain }}-shard${{ matrix.shard }}.xml

      - name: Cross-check via validate_examples.py (this shard)
        if: always()
        env:
          # Preserve the safe default for all other validator invocations.
          ABICHECK_TRUSTED_SOURCE_SMOKE_RUN: "1"
        run: |
          PYTHONPATH=. python tests/validate_examples.py $SHARD_CASES --toolchain ${{ matrix.toolchain }} --json \
            > results/validate_examples-${{ matrix.toolchain }}-shard${{ matrix.shard }}.json
          # check_validate_results.py / summarize_validate_results.py both read
          # this fixed path; per-shard it gives each leg its own fail-fast.
          cp results/validate_examples-${{ matrix.toolchain }}-shard${{ matrix.shard }}.json results/validate_examples.json
          python tests/check_validate_results.py

      # Not sharded: this walks its own case list, costs under a minute, and
      # produces one artifact the collector reads whole.
      - name: Runtime smoke examples
        if: ${{ always() && matrix.toolchain == 'gcc' && matrix.shard == 1 }}
        run: |
          PYTHONPATH=. python validation/scripts/run_example_runtime_smoke.py --json > results/example-runtime-smoke.json

      - name: Upload shard results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: examples-shard-${{ matrix.toolchain }}-${{ matrix.shard }}
          path: results/
          retention-days: 14

      - name: Job summary
        if: always()
        run: |
          echo "## Examples Validation (${{ matrix.toolchain }}, shard ${{ matrix.shard }}/3)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          test -f results/validate_examples.json && python tests/summarize_validate_results.py >> $GITHUB_STEP_SUMMARY || true

  # Reassembles the sharded legs into the one whole-catalog artifact per
  # toolchain that everything downstream expects. This is not bookkeeping:
  # validation/scripts/collect_full_example_matrix.py deliberately rejects an
  # artifact whose case set isn't exactly the catalog (no missing ids, no
  # duplicates, selected_cases == catalog size), so a bare shard artifact
  # cannot be consumed and the merge is what restores that contract.
  # Artifact names are unchanged from before the split, so the collector and
  # the README-sync check needed no edits.
  merge-validate-examples:
    name: Merge example shards (${{ matrix.toolchain }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [validate-examples]
    # Merge whatever the legs produced even if one *failed* — a failed leg
    # still uploads its artifact, the collector re-derives pass/fail from the
    # recorded per-case statuses, and a genuinely missing shard fails the merge
    # loudly (missing case ids). Deliberately `!cancelled()` and not
    # `always()`: always() also fires when the whole run is superseded by a
    # newer push (concurrency cancel-in-progress), where every shard is
    # cancelled and no artifact exists at all — that turned an ordinary
    # superseded run into two spurious red checks.
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        toolchain: [gcc, clang]

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Create results dir
        run: mkdir -p results shards

      - name: Download this toolchain's shards
        uses: actions/download-artifact@v8
        with:
          path: shards
          pattern: examples-shard-${{ matrix.toolchain }}-*

      - name: Merge shard artifacts into the whole-catalog artifact
        run: |
          # Carried through untouched: the per-shard junit XMLs (named per
          # shard, so they don't collide) and the gcc runtime-smoke JSON the
          # collector reads. Deliberately NOT copied: each shard's own
          # results/validate_examples.json, which is the same fixed filename in
          # every shard and is superseded by the merged file written below.
          cp shards/*/examples-autodiscovery-*.xml results/ 2>/dev/null || true
          cp shards/*/example-runtime-smoke.json results/ 2>/dev/null || true
          # nullglob + an explicit count: without it a non-matching glob is
          # passed through literally and surfaces as a FileNotFoundError naming
          # a path with a '*' in it, which says nothing about what went wrong.
          shopt -s nullglob
          shard_files=(shards/*/validate_examples-${{ matrix.toolchain }}-shard*.json)
          if [ ${#shard_files[@]} -eq 0 ]; then
            echo "::error::no ${{ matrix.toolchain }} shard artifacts were downloaded — every shard leg must upload one"
            exit 1
          fi
          echo "merging ${#shard_files[@]} shard artifact(s): ${shard_files[*]}"
          python tests/example_shards.py merge "${shard_files[@]}" \
            --out results/validate_examples-${{ matrix.toolchain }}.json
          cp results/validate_examples-${{ matrix.toolchain }}.json results/validate_examples.json

      - name: Upload merged results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: examples-validation-results-${{ matrix.toolchain }}
          path: results/
          retention-days: 14

      - name: Job summary
        if: always()
        run: |
          echo "## Examples Validation Summary (${{ matrix.toolchain }}, merged)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          test -f results/validate_examples.json && python tests/summarize_validate_results.py >> $GITHUB_STEP_SUMMARY || true

  clang-header-fallback:
    name: Clang header fallback regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Create results dir
        run: mkdir -p results

      - name: Install system deps
        uses: ./.github/actions/install-system-deps
        with:
          packages: gcc g++ clang cmake curl ca-certificates

      - uses: ./.github/actions/setup-castxml

      - uses: ./.github/actions/cache-ast-dumps
        with:
          key-suffix: clang-fallback

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Unit and live clang-backend regressions
        run: |
          PYTHONPATH=. pytest -q \
            tests/test_dumper_clang.py::test_parse_anonymous_typedef_enum_uses_typedef_name \
            tests/test_clang_header_backend_integration.py::test_clang_backend_recovers_c_anonymous_typedef_enum

      - name: Force clang header backend on remote-gap examples
        run: |
          export ABICHECK_AST_FRONTEND=clang
          PYTHONPATH=. pytest -q --tb=short -m integration \
            'tests/test_example_autodiscovery.py::test_example_pipeline[case31_enum_rename]' \
            'tests/test_example_autodiscovery.py::test_example_pipeline[case62_type_field_added_compatible]'
          PYTHONPATH=. python tests/validate_examples.py \
            case31_enum_rename case62_type_field_added_compatible \
            --toolchain gcc --json > results/validate_examples.json
          python tests/check_validate_results.py

      - name: Upload clang fallback results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: examples-clang-header-fallback
          path: results/
          retention-days: 14

  # Non-default artifact modes (release / stripped full-catalog / build-source
  # smoke). All three change the available evidence — release/stripped binaries
  # drop the DWARF a layout/calling-convention break needs — so verdicts are
  # reported-only (a downgrade like case129 is expected evidence loss). The
  # blockable invariant across all three is the false-positive guard: a case the
  # debug ground truth calls COMPATIBLE/NO_CHANGE must never become BREAKING.
  #
  # Split as a 3-way matrix (one leg per mode) rather than one job running all
  # three modes sequentially. Measured on a real run (workflow run 31317496678,
  # 2026-08-09) the combined job took 15m33s wall-clock, of which
  # release-headers (7m06s) and stripped-headers (6m58s) each ran back-to-back
  # on the *same* runner despite having no data dependency on one another —
  # only build-source (42s, a 10-case smoke subset — see its own comment
  # below for why it isn't the full catalog) was cheap. Splitting these onto
  # separate runners overlaps that ~14m of sequential work; the ~35s of
  # per-leg setup (checkout/apt/castxml/python/deps) that gets duplicated
  # three times instead of once is the trade-off, and is small next to the
  # ~7-8m saved off the workflow's critical path (this job, not the gcc/clang
  # `validate-examples` legs, was what `full-example-matrix` was waiting on).
  artifact-modes:
    name: Artifact modes (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mode: [release-headers, stripped-headers, build-source]

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Create results dir
        run: mkdir -p results

      - name: Install system deps
        uses: ./.github/actions/install-system-deps
        with:
          packages: gcc g++ clang cmake binutils curl ca-certificates

      - uses: ./.github/actions/setup-castxml

      - uses: ./.github/actions/cache-ast-dumps
        with:
          key-suffix: artifact-modes-${{ matrix.mode }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Non-default artifact modes change the available evidence: a release or
      # stripped binary drops the DWARF a layout/calling-convention break needs,
      # so a verdict downgrade (e.g. case129 BREAKING→COMPATIBLE) is expected
      # evidence loss, NOT a failure. The verdict run is therefore reported-only;
      # the blockable invariant across all three modes is the false-positive
      # guard — a reduced/changed-evidence run must never manufacture a spurious
      # BREAKING on a case the debug ground truth calls compatible.
      #
      # build-source runs castxml source-replay per case (expensive), so it
      # stays a representative fixed set rather than the full catalog. Unlike
      # release/stripped artifact lanes, it is a required proof lane: it is the
      # only release evidence that detects the C++ floor/concept/uninstantiated
      # template regressions in cases 98/105/122, so do not mask a non-zero
      # validator exit behind the reduced-evidence reported-only policy.
      - name: Run artifact-mode validation (build-source release proof + reported-only FP guard)
        if: always()
        run: |
          if [ "${{ matrix.mode }}" = "build-source" ]; then
            CASES="case01 case04 case98 case105 case122 case129 case130 case131 case132 case133"
            PYTHONPATH=. python tests/validate_examples.py $CASES --artifact-variant build-source --json \
              > results/validate_examples-build-source.json
            cp results/validate_examples-build-source.json results/validate_examples.json
            ABICHECK_STRICT_KINDS=1 python tests/check_validate_results.py
            python scripts/verify.py --profile full --only build-source-release-proof
          else
            set +e
            PYTHONPATH=. python tests/validate_examples.py --artifact-variant ${{ matrix.mode }} --json \
              > results/validate_examples-${{ matrix.mode }}.json
            echo "${{ matrix.mode }} run rc=$?"
            set -e
            python tests/check_stripped_fp.py results/validate_examples-${{ matrix.mode }}.json ${{ matrix.mode }}
          fi

      - name: Upload artifact-mode results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: examples-validation-artifact-modes-${{ matrix.mode }}
          path: results/
          retention-days: 14

      - name: Job summary
        if: always()
        run: |
          echo "## Artifact-mode Summary (${{ matrix.mode }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          f="results/validate_examples-${{ matrix.mode }}.json"
          test -f "$f" && \
            python -c "import json;d=json.load(open('$f'));print('summary:',json.dumps(d['summary']))" >> $GITHUB_STEP_SUMMARY || true

  full-example-matrix:
    name: Full example matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [merge-validate-examples, artifact-modes, clang-header-fallback]
    # Same reasoning as merge-validate-examples above: still collect when an
    # upstream job *failed* (the collector re-derives pass/fail from the
    # recorded per-case statuses, which is the whole point of running anyway),
    # but not when the run was cancelled. `always()` fires on cancellation too,
    # so a run superseded by a newer push reached this job with no artifacts at
    # all and turned an ordinary supersede into a red check. Pre-dates the
    # sharding work, but it is the identical failure mode fixed one job up.
    if: ${{ !cancelled() }}

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Create results dir
        run: mkdir -p results downloaded

      - name: Download validation artifacts
        uses: actions/download-artifact@v8
        with:
          path: downloaded
          pattern: examples-validation-*

      - name: Install system deps
        uses: ./.github/actions/install-system-deps
        with:
          packages: gcc g++ clang cmake binutils curl ca-certificates

      - uses: ./.github/actions/setup-castxml

      # The owner-proofs/bundle/special-cli validators below also dump
      # bundle/G20/special-shape example headers through the same castxml/
      # clang AST cache as the other jobs.
      - uses: ./.github/actions/cache-ast-dumps
        with:
          key-suffix: full-matrix

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # These runners exit non-zero when any owned case fails, but they still
      # write a complete artifact before doing so. continue-on-error keeps a
      # per-case failure here from skipping the collector below — the
      # collector re-derives the job's pass/fail from the recorded per-case
      # statuses in each artifact, so a real failure still fails the job.
      - name: Validate non-default example owners
        continue-on-error: true
        run: |
          PYTHONPATH=. python validation/scripts/run_example_owner_proofs.py --json \
            > results/example-owner-proofs.json

      - name: Validate bundle examples
        continue-on-error: true
        run: |
          PYTHONPATH=. python validation/scripts/run_bundle_examples.py --json \
            > results/bundle-examples.json

      - name: Validate special-shape examples through public CLI
        continue-on-error: true
        run: |
          PYTHONPATH=. python validation/scripts/run_special_cli_examples.py --json \
            > results/special-cli-examples.json

      - name: Build full example matrix
        if: always()
        run: |
          PYTHONPATH=. python validation/scripts/collect_full_example_matrix.py \
            --gcc downloaded/examples-validation-results-gcc/validate_examples-gcc.json \
            --clang downloaded/examples-validation-results-clang/validate_examples-clang.json \
            --runtime downloaded/examples-validation-results-gcc/example-runtime-smoke.json \
            --build-source downloaded/examples-validation-artifact-modes-build-source/validate_examples-build-source.json \
            --bundle results/bundle-examples.json \
            --special-cli results/special-cli-examples.json \
            --proofs results/example-owner-proofs.json \
            --out results/full-example-matrix.json

      - name: Upload full matrix
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: examples-full-matrix
          path: results/
          retention-days: 14

      # examples/README.md's "Current Validation Status" table is hand-typed
      # prose summarizing these same artifacts; nothing previously checked it
      # against a real run, so it silently drifted for several releases. This
      # step is the fix: fail the job (rather than warn) when the table's
      # Result cells don't match the JSON artifacts just produced above.
      - name: Check examples/README.md validation-status table is in sync
        if: always()
        run: |
          PYTHONPATH=. python scripts/check_examples_validation_status_sync.py \
            --gcc downloaded/examples-validation-results-gcc/validate_examples-gcc.json \
            --clang downloaded/examples-validation-results-clang/validate_examples-clang.json \
            --runtime downloaded/examples-validation-results-gcc/example-runtime-smoke.json \
            --release downloaded/examples-validation-artifact-modes-release-headers/validate_examples-release-headers.json \
            --stripped downloaded/examples-validation-artifact-modes-stripped-headers/validate_examples-stripped-headers.json \
            --build-source downloaded/examples-validation-artifact-modes-build-source/validate_examples-build-source.json \
            --full-matrix results/full-example-matrix.json \
            --check

      - name: Job summary
        if: always()
        run: |
          echo "## Full Example Matrix" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          test -f results/full-example-matrix.json && \
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open("results/full-example-matrix.json"))
          print("summary:", json.dumps(d["summary"], sort_keys=True))
          print("coverage by provenance:", json.dumps(d["coverage_by_provenance"], sort_keys=True))
          print("direct coverage:", json.dumps(d["direct_coverage"], sort_keys=True))
          if d["unresolved_cases"]:
              print("unresolved:", ", ".join(d["unresolved_cases"]))
          if d["failed_cases"]:
