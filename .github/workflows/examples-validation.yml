name: Examples Validation

on:
  push:
    branches: [main]
    paths:
      - "examples/**"
      - "catalog/**"
      - "abicheck/**"
      - "tests/**"
      - "skills-src/evaluation/validation/scripts/**"
      - "scripts/workflow_examples.py"
      - "scripts/check_examples_validation_status_sync.py"
      - "scripts/check_build_source_release_proof.py"
      - ".github/workflows/examples-validation.yml"
      # Every composite action this workflow's jobs use -- install-system-deps,
      # setup-castxml, cache-ast-dumps -- matching ci.yml's own
      # `.github/actions/**` infrastructure trigger. The narrower per-action
      # path this replaced named only one of the three, so a change to the
      # CastXML pin could merge without scheduling the jobs that depend on it.
      - ".github/actions/**"
      # This workflow's own build infrastructure, not just the inputs it
      # validates: every job here `pip install -e ".[dev]"`s this package,
      # and sets up CastXML through a composite action that shells out to
      # `action/install-castxml.sh`, restores mtimes through
      # `scripts/restore_git_mtimes.py`, and drives the build-source proof
      # through `scripts/verify.py`. A change to one of those
      # decides how this workflow runs, so omitting it let such a change
      # merge without a single job that depends on it having run --
      # `ci.yml`'s `heavy-parity-gate` already names the same set for the
      # same reason ("re-pinning CastXML in action/install-castxml.sh ...
      # would otherwise land without a single job that uses CastXML having
      # run"). Enforced by tests/test_workflow_path_filter_closure.py,
      # which derives the set from what this workflow actually executes.
      - "pyproject.toml"
      - "action/**"
      - "scripts/restore_git_mtimes.py"
      - "scripts/verify.py"
  pull_request:
    branches: [main]
    paths:
      - "examples/**"
      - "catalog/**"
      - "abicheck/**"
      - "tests/**"
      - "skills-src/evaluation/validation/scripts/**"
      - "scripts/workflow_examples.py"
      - "scripts/check_examples_validation_status_sync.py"
      - "scripts/check_build_source_release_proof.py"
      - ".github/workflows/examples-validation.yml"
      # Every composite action this workflow's jobs use -- install-system-deps,
      # setup-castxml, cache-ast-dumps -- matching ci.yml's own
      # `.github/actions/**` infrastructure trigger. The narrower per-action
      # path this replaced named only one of the three, so a change to the
      # CastXML pin could merge without scheduling the jobs that depend on it.
      - ".github/actions/**"
      # This workflow's own build infrastructure, not just the inputs it
      # validates: every job here `pip install -e ".[dev]"`s this package,
      # and sets up CastXML through a composite action that shells out to
      # `action/install-castxml.sh`, restores mtimes through
      # `scripts/restore_git_mtimes.py`, and drives the build-source proof
      # through `scripts/verify.py`. A change to one of those
      # decides how this workflow runs, so omitting it let such a change
      # merge without a single job that depends on it having run --
      # `ci.yml`'s `heavy-parity-gate` already names the same set for the
      # same reason ("re-pinning CastXML in action/install-castxml.sh ...
      # would otherwise land without a single job that uses CastXML having
      # run"). Enforced by tests/test_workflow_path_filter_closure.py,
      # which derives the set from what this workflow actually executes.
      - "pyproject.toml"
      - "action/**"
      - "scripts/restore_git_mtimes.py"
      - "scripts/verify.py"
  workflow_dispatch:

concurrency:
  # A PR groups by PR number, so a new push supersedes the stale run for
  # the same PR. A `push` to `main` must group by *ref*, not `run_id`:
  # every push run has a distinct `run_id`, so the previous spelling gave
  # each one its own group and `cancel-in-progress` never cancelled a
  # superseded main run at all — the newer commit's run simply queued
  # behind the obsolete one. `schedule`/`workflow_dispatch` deliberately
  # keep keying off `run_id` (unique per run) so two manual or scheduled
  # runs stay isolated from each other and from PR runs, matching
  # `mutation.yml`'s own grouping. This workflow is read-only validation;
  # do not copy this to a workflow with persistent side effects (release
  # publication, baseline rotation), where cancelling a superseded run can
  # leave partial state.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: true

jobs:
  # Layout (measured 2026-10-02, see the PR that introduced it): GitHub
  # Actions queueing, not execution, dominated this workflow's wall time --
  # it fanned out to 14 runners, of which the two shard-merge jobs waited ~5
  # minutes for 10 seconds of work and the collector ~9 minutes for 2. So the
  # work is packed into three toolchain legs plus one toolchain-free
  # collector, each leg running its catalog with `validate_examples.py
  # --jobs 0` (one case per CPU, result order unchanged) instead of six
  # one-case-at-a-time shards.
  #
  # Every independent step in a leg is `if: ${{ !cancelled() }}`, so one
  # failing check still fails the leg without skipping the checks after it --
  # the per-check isolation the separate jobs used to provide.
  #
  # Case-coverage ownership (who runs which assertion), so nothing here is
  # re-added as a duplicate:
  #   * Python-API pipeline (tests/test_example_autodiscovery.py), gcc on
  #     Linux/macOS/Windows: ci.yml `integration-tests` (it collects the whole
  #     file). Only its clang run lives here (the `clang` leg).
  #   * CLI pipeline + expected kinds (validate_examples.py): gcc and clang
  #     legs here, debug-headers; release/stripped/build-source variants in
  #     the `reduced-evidence` and `gcc` legs.
  examples-gcc:
    name: Examples (gcc; debug-headers, runtime smoke, build-source, owner lanes)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # This workflow checks out and executes repository-owned fixtures only.
      # Without it every source_smoke run-mode case silently SKIPs.
      ABICHECK_TRUSTED_SOURCE_SMOKE_RUN: "1"
    steps:
      # fetch-depth: 0 is required by cache-ast-dumps:
      # scripts/restore_git_mtimes.py needs each file's last-commit time.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install system deps
        uses: ./.github/actions/install-system-deps
        with:
          packages: gcc g++ clang cmake binutils curl ca-certificates

      - uses: ./.github/actions/setup-castxml

      - uses: ./.github/actions/cache-ast-dumps
        with:
          key-suffix: gcc

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Validate ground_truth.json
        run: |
          test -f catalog/ground_truth.json || { echo "::error::ground_truth.json missing"; exit 1; }
          python -c "import json; d=json.load(open('catalog/ground_truth.json')); print('ground_truth.json OK:', len(d['verdicts']), 'cases')"

      # The whole catalog in one process pool. The gcc run of the Python-API
      # pytest pass is not repeated here: ci.yml's integration-tests Linux leg
      # runs that identical file under gcc on every PR this workflow runs on.
      - name: Validate examples via CLI (gcc, debug-headers)
        if: ${{ !cancelled() }}
        env:
          CC: gcc
          CXX: g++
        run: |
          mkdir -p results
          PYTHONPATH=. python tests/validate_examples.py --toolchain gcc --jobs 0 --json \
            > results/validate_examples-gcc.json
          # check/summarize_validate_results.py read this fixed path.
          cp results/validate_examples-gcc.json results/validate_examples.json
          python tests/summarize_validate_results.py >> "$GITHUB_STEP_SUMMARY" || true
          python tests/check_validate_results.py

      - name: Runtime smoke examples
        if: ${{ !cancelled() }}
        env:
          CC: gcc
          CXX: g++
        run: |
          PYTHONPATH=. python skills-src/evaluation/validation/scripts/run_example_runtime_smoke.py --json \
            > results/example-runtime-smoke.json

      # build-source runs castxml source-replay per case (expensive), so it
      # stays a representative fixed set rather than the full catalog. It is a
      # required proof lane: the only release evidence that detects the C++
      # floor/concept/uninstantiated-template regressions in cases 98/105/122,
      # so a non-zero validator exit is never masked here.
      - name: Build-source release proof
        if: ${{ !cancelled() }}
        run: |
          mkdir -p results
          CASES="case01 case04 case98 case105 case122 case129 case130 case131 case132 case133"
          PYTHONPATH=. python tests/validate_examples.py $CASES --artifact-variant build-source --jobs 0 --json \
            > results/validate_examples-build-source.json
          cp results/validate_examples-build-source.json results/validate_examples.json
          ABICHECK_STRICT_KINDS=1 python tests/check_validate_results.py
          python scripts/verify.py --profile full --only build-source-release-proof

      # These runners exit non-zero when any owned case fails, but write a
      # complete artifact first. continue-on-error keeps a per-case failure
      # from hiding the others; the collector job re-derives pass/fail from
      # the recorded per-case statuses, so a real failure still fails the run.
      - name: Validate non-default example owners
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          PYTHONPATH=. python skills-src/evaluation/validation/scripts/run_example_owner_proofs.py --json \
            > results/example-owner-proofs.json

      - name: Validate bundle examples
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          PYTHONPATH=. python skills-src/evaluation/validation/scripts/run_bundle_examples.py --json \
            > results/bundle-examples.json

      - name: Validate special-shape examples through public CLI
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          PYTHONPATH=. python skills-src/evaluation/validation/scripts/run_special_cli_examples.py --json \
            > results/special-cli-examples.json

      - name: Upload gcc results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: examples-gcc
          path: results/
          retention-days: 14

  examples-clang:
    name: Examples (clang; debug-headers, header fallback, workflow examples)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ABICHECK_TRUSTED_SOURCE_SMOKE_RUN: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install system deps
        uses: ./.github/actions/install-system-deps
        with:
          packages: gcc g++ clang cmake curl ca-certificates

      - uses: ./.github/actions/setup-castxml

      - uses: ./.github/actions/cache-ast-dumps
        with:
          key-suffix: clang

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Clang is a first-class validator so producer-sensitive cases (e.g.
      # case64 ms_abi, which GCC cannot emit DW_AT_calling_convention for) are
      # gated, not just benchmarked. This is the only clang run of the
      # Python-API pipeline anywhere in CI (ci.yml's integration legs use the
      # platform-native compiler), so it stays; xdist parallelises it the way
      # ci.yml's Windows leg already does (builds share a filelock'd dir).
      - name: Run example cases (pytest autodiscovery, clang)
        if: ${{ !cancelled() }}
        env:
          CC: clang
          CXX: clang++
        run: |
          mkdir -p results
          PYTHONPATH=. pytest tests/test_example_autodiscovery.py -v --tb=short -m integration \
            -n auto --dist worksteal \
            --junit-xml=results/examples-autodiscovery-clang.xml

      - name: Validate examples via CLI (clang, debug-headers)
        if: ${{ !cancelled() }}
        env:
          CC: clang
          CXX: clang++
        run: |
          mkdir -p results
          PYTHONPATH=. python tests/validate_examples.py --toolchain clang --jobs 0 --json \
            > results/validate_examples-clang.json
          cp results/validate_examples-clang.json results/validate_examples.json
          python tests/summarize_validate_results.py >> "$GITHUB_STEP_SUMMARY" || true
          python tests/check_validate_results.py

      # Formerly its own job (clang-header-fallback): regressions for the
      # clang header-AST backend, forced on the cases where it once diverged.
      - name: Clang header fallback — unit and live regressions
        if: ${{ !cancelled() }}
        run: |
          PYTHONPATH=. pytest -q \
            tests/test_dumper_clang.py::test_parse_anonymous_typedef_enum_uses_typedef_name \
            tests/test_clang_header_backend_integration.py::test_clang_backend_recovers_c_anonymous_typedef_enum

      - name: Clang header fallback — forced backend on remote-gap examples
        if: ${{ !cancelled() }}
        env:
          ABICHECK_AST_FRONTEND: clang
        run: |
          mkdir -p results
          PYTHONPATH=. pytest -q --tb=short -m integration \
            'tests/test_example_autodiscovery.py::test_example_pipeline[case31_enum_rename]' \
            'tests/test_example_autodiscovery.py::test_example_pipeline[case62_type_field_added_compatible]'
          PYTHONPATH=. python tests/validate_examples.py \
            case31_enum_rename case62_type_field_added_compatible \
            --toolchain gcc --json > results/validate_examples-clang-fallback.json
          cp results/validate_examples-clang-fallback.json results/validate_examples.json
          python tests/check_validate_results.py
          # Leave the fixed path holding the leg's own whole-catalog result.
          cp results/validate_examples-clang.json results/validate_examples.json 2>/dev/null || true

      # Formerly its own job (workflow-examples): the curated walkthroughs
      # under examples/workflows/, run exactly as each README documents.
      # `--require` (one per workflow) fails the step if any is skipped, so a
      # toolchain regression can't turn it green with zero work done.
      - name: Run workflow examples
        if: ${{ !cancelled() }}
        run: |
          mkdir -p results
          PYTHONPATH=. python skills-src/evaluation/validation/scripts/run_workflow_examples.py \
            --require compare-release --require audit-release \
            --require suppressions --require python-api \
            --require github-actions --require compare-project \
            --require evidence-depth \
            --json results/workflow-examples.json

      - name: Upload clang results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: examples-clang
          path: results/
          retention-days: 14

  # release-headers / stripped-headers: the full catalog with DWARF reduced or
  # removed. Verdicts are reported-only (a downgrade like case129 is expected
  # evidence loss); the blockable invariant is the false-positive guard -- a
  # case the debug ground truth calls COMPATIBLE/NO_CHANGE must never become
  # BREAKING (check_stripped_fp.py). The two modes share one runner: they
  # have no data dependency, and with --jobs each takes a few minutes.
  examples-reduced-evidence:
    name: Examples (reduced evidence; release-headers, stripped-headers)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ABICHECK_TRUSTED_SOURCE_SMOKE_RUN: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install system deps
        uses: ./.github/actions/install-system-deps
        with:
          packages: gcc g++ clang cmake binutils curl ca-certificates

      - uses: ./.github/actions/setup-castxml

      - uses: ./.github/actions/cache-ast-dumps
        with:
          key-suffix: reduced-evidence

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: release-headers (reported-only verdicts + FP guard)
        if: ${{ !cancelled() }}
        run: |
          mkdir -p results
          set +e
          PYTHONPATH=. python tests/validate_examples.py --artifact-variant release-headers --jobs 0 --json \
            > results/validate_examples-release-headers.json
          echo "release-headers run rc=$?"
          set -e
          python tests/check_stripped_fp.py results/validate_examples-release-headers.json release-headers

      - name: stripped-headers (reported-only verdicts + FP guard)
        if: ${{ !cancelled() }}
        run: |
          mkdir -p results
          set +e
          PYTHONPATH=. python tests/validate_examples.py --artifact-variant stripped-headers --jobs 0 --json \
            > results/validate_examples-stripped-headers.json
          echo "stripped-headers run rc=$?"
          set -e
          python tests/check_stripped_fp.py results/validate_examples-stripped-headers.json stripped-headers

      - name: Upload reduced-evidence results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: examples-reduced-evidence
          path: results/
          retention-days: 14

  # Builds the whole-catalog matrix from the three legs' artifacts and checks
  # examples/README.md's status table against it. Pure stdlib Python over JSON
  # (collect_full_example_matrix.py, check_examples_validation_status_sync.py
  # import only scripts/example_catalog.py), so no toolchain or package
  # install. `!cancelled()` rather than `always()`: still collect when a leg
  # *failed* (the collector re-derives pass/fail from per-case statuses), but
  # not when a newer push superseded the run and no artifact exists.
  full-example-matrix:
    name: Full example matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [examples-gcc, examples-clang, examples-reduced-evidence]
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Download leg artifacts
        uses: actions/download-artifact@v8
        with:
          path: downloaded
          pattern: examples-*

      - name: Build full example matrix
        run: |
          mkdir -p results
          d=downloaded
          PYTHONPATH=. python skills-src/evaluation/validation/scripts/collect_full_example_matrix.py \
            --gcc $d/examples-gcc/validate_examples-gcc.json \
            --clang $d/examples-clang/validate_examples-clang.json \
            --runtime $d/examples-gcc/example-runtime-smoke.json \
            --build-source $d/examples-gcc/validate_examples-build-source.json \
            --bundle $d/examples-gcc/bundle-examples.json \
            --special-cli $d/examples-gcc/special-cli-examples.json \
            --proofs $d/examples-gcc/example-owner-proofs.json \
            --out results/full-example-matrix.json

      - name: Upload full matrix
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: full-example-matrix
          path: results/
          retention-days: 14

      # examples/README.md's "Current Validation Status" table is hand-typed
      # prose summarizing these same artifacts; fail rather than warn when its
      # Result cells don't match the JSON just produced.
      - name: Check examples/README.md validation-status table is in sync
        if: ${{ !cancelled() }}
        run: |
          d=downloaded
          PYTHONPATH=. python scripts/check_examples_validation_status_sync.py \
            --gcc $d/examples-gcc/validate_examples-gcc.json \
            --clang $d/examples-clang/validate_examples-clang.json \
            --runtime $d/examples-gcc/example-runtime-smoke.json \
            --release $d/examples-reduced-evidence/validate_examples-release-headers.json \
            --stripped $d/examples-reduced-evidence/validate_examples-stripped-headers.json \
            --build-source $d/examples-gcc/validate_examples-build-source.json \
            --full-matrix results/full-example-matrix.json \
            --check

      - name: Job summary
        if: always()
        run: |
          test -f results/full-example-matrix.json || exit 0
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open("results/full-example-matrix.json"))
          print("## Full Example Matrix\n")
          print("summary:", json.dumps(d["summary"], sort_keys=True))
          print("coverage by provenance:", json.dumps(d["coverage_by_provenance"], sort_keys=True))
          print("direct coverage:", json.dumps(d["direct_coverage"], sort_keys=True))
          if d["unresolved_cases"]:
              print("unresolved:", ", ".join(d["unresolved_cases"]))
          if d["failed_cases"]:
              print("failed:", ", ".join(d["failed_cases"]))
          PY
