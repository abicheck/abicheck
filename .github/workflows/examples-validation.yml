name: Examples Validation

on:
  push:
    branches: [main]
    paths:
      - "examples/**"
      - "abicheck/**"
      - "tests/**"
      - "validation/scripts/**"
      - "scripts/check_examples_validation_status_sync.py"
      - ".github/workflows/examples-validation.yml"
  pull_request:
    branches: [main]
    paths:
      - "examples/**"
      - "abicheck/**"
      - "tests/**"
      - "validation/scripts/**"
      - "scripts/check_examples_validation_status_sync.py"
      - ".github/workflows/examples-validation.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Blocking core matrix: the full debug-headers catalog under both producers.
  # GCC is the historical lane; Clang is promoted to a first-class validator so
  # producer-sensitive cases (e.g. case64 ms_abi calling convention, which GCC
  # cannot emit DW_AT_calling_convention for) are gated, not just benchmarked.
  validate-examples:
    name: Validate examples (${{ matrix.toolchain }}, debug-headers)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        toolchain: [gcc, clang]

    steps:
      # fetch-depth: 0 (full history) is required by the AST-cache step below:
      # scripts/restore_git_mtimes.py needs each file's real last-commit time,
      # which a shallow (default depth-1) clone can't see — every file would
      # resolve to the single boundary commit's timestamp instead.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Create results dir
        run: mkdir -p results

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc g++ clang cmake curl ca-certificates

      - name: Set up pinned CastXML
        run: bash action/install-castxml.sh

      - uses: ./.github/actions/cache-ast-dumps
        with:
          key-suffix: ${{ matrix.toolchain }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Select toolchain
        run: |
          if [ "${{ matrix.toolchain }}" = "clang" ]; then
            echo "CC=clang" >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          else
            echo "CC=gcc" >> "$GITHUB_ENV"
            echo "CXX=g++" >> "$GITHUB_ENV"
          fi

      - name: Validate ground_truth.json
        run: |
          test -f examples/ground_truth.json || { echo "::error::ground_truth.json missing"; exit 1; }
          python -c "import json; d=json.load(open('examples/ground_truth.json')); print('ground_truth.json OK:', len(d['verdicts']), 'cases')"

      - name: Run example cases (pytest autodiscovery)
        env:
          # This workflow checks out and executes repository-owned fixtures only.
          ABICHECK_TRUSTED_SOURCE_SMOKE_RUN: "1"
        run: |
          PYTHONPATH=. pytest tests/test_example_autodiscovery.py -v --tb=short -m integration \
            --junit-xml=results/examples-autodiscovery-${{ matrix.toolchain }}.xml

      - name: Cross-check via validate_examples.py (full catalog)
        if: always()
        env:
          # Preserve the safe default for all other validator invocations.
          ABICHECK_TRUSTED_SOURCE_SMOKE_RUN: "1"
        run: |
          PYTHONPATH=. python tests/validate_examples.py --toolchain ${{ matrix.toolchain }} --json \
            > results/validate_examples-${{ matrix.toolchain }}.json
          cp results/validate_examples-${{ matrix.toolchain }}.json results/validate_examples.json
          python tests/check_validate_results.py

      - name: Runtime smoke examples
        if: ${{ always() && matrix.toolchain == 'gcc' }}
        run: |
          PYTHONPATH=. python validation/scripts/run_example_runtime_smoke.py --json > results/example-runtime-smoke.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: examples-validation-results-${{ matrix.toolchain }}
          path: results/
          retention-days: 14

      - name: Job summary
        if: always()
        run: |
          echo "## Examples Validation Summary (${{ matrix.toolchain }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          test -f results/validate_examples.json && python tests/summarize_validate_results.py >> $GITHUB_STEP_SUMMARY || true

  clang-header-fallback:
    name: Clang header fallback regressions
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Create results dir
        run: mkdir -p results

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc g++ clang cmake curl ca-certificates

      - name: Set up pinned CastXML
        run: bash action/install-castxml.sh

      - uses: ./.github/actions/cache-ast-dumps
        with:
          key-suffix: clang-fallback

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Unit and live clang-backend regressions
        run: |
          PYTHONPATH=. pytest -q \
            tests/test_dumper_clang.py::test_parse_anonymous_typedef_enum_uses_typedef_name \
            tests/test_clang_header_backend_integration.py::test_clang_backend_recovers_c_anonymous_typedef_enum

      - name: Force clang header backend on remote-gap examples
        run: |
          export ABICHECK_AST_FRONTEND=clang
          PYTHONPATH=. pytest -q --tb=short -m integration \
            'tests/test_example_autodiscovery.py::test_example_pipeline[case31_enum_rename]' \
            'tests/test_example_autodiscovery.py::test_example_pipeline[case62_type_field_added_compatible]'
          PYTHONPATH=. python tests/validate_examples.py \
            case31_enum_rename case62_type_field_added_compatible \
            --toolchain gcc --json > results/validate_examples.json
          python tests/check_validate_results.py

      - name: Upload clang fallback results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: examples-clang-header-fallback
          path: results/
          retention-days: 14

  # Non-default artifact modes (release / stripped full-catalog / build-source
  # smoke). All three change the available evidence — release/stripped binaries
  # drop the DWARF a layout/calling-convention break needs — so verdicts are
  # reported-only (a downgrade like case129 is expected evidence loss). The
  # blockable invariant across all three is the false-positive guard: a case the
  # debug ground truth calls COMPATIBLE/NO_CHANGE must never become BREAKING.
  #
  # Split as a 3-way matrix (one leg per mode) rather than one job running all
  # three modes sequentially. Measured on a real run (workflow run 31317496678,
  # 2026-08-09) the combined job took 15m33s wall-clock, of which
  # release-headers (7m06s) and stripped-headers (6m58s) each ran back-to-back
  # on the *same* runner despite having no data dependency on one another —
  # only build-source (42s, a 10-case smoke subset — see its own comment
  # below for why it isn't the full catalog) was cheap. Splitting these onto
  # separate runners overlaps that ~14m of sequential work; the ~35s of
  # per-leg setup (checkout/apt/castxml/python/deps) that gets duplicated
  # three times instead of once is the trade-off, and is small next to the
  # ~7-8m saved off the workflow's critical path (this job, not the gcc/clang
  # `validate-examples` legs, was what `full-example-matrix` was waiting on).
  artifact-modes:
    name: Artifact modes (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mode: [release-headers, stripped-headers, build-source]

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Create results dir
        run: mkdir -p results

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc g++ clang cmake binutils curl ca-certificates

      - name: Set up pinned CastXML
        run: bash action/install-castxml.sh

      - uses: ./.github/actions/cache-ast-dumps
        with:
          key-suffix: artifact-modes-${{ matrix.mode }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Non-default artifact modes change the available evidence: a release or
      # stripped binary drops the DWARF a layout/calling-convention break needs,
      # so a verdict downgrade (e.g. case129 BREAKING→COMPATIBLE) is expected
      # evidence loss, NOT a failure. The verdict run is therefore reported-only;
      # the blockable invariant across all three modes is the false-positive
      # guard — a reduced/changed-evidence run must never manufacture a spurious
      # BREAKING on a case the debug ground truth calls compatible.
      #
      # build-source runs castxml source-replay per case (expensive), so it
      # stays a representative smoke (fixed case list) rather than the full
      # catalog the other two modes run — that was already true before this
      # split and is unrelated to it.
      - name: Run artifact-mode validation (reported-only + FP guard)
        if: always()
        run: |
          set +e
          if [ "${{ matrix.mode }}" = "build-source" ]; then
            CASES="case01 case04 case98 case105 case122 case129 case130 case131 case132 case133"
          else
            CASES=""
          fi
          PYTHONPATH=. python tests/validate_examples.py $CASES --artifact-variant ${{ matrix.mode }} --json \
            > results/validate_examples-${{ matrix.mode }}.json
          echo "${{ matrix.mode }} run rc=$?"
          set -e
          python tests/check_stripped_fp.py results/validate_examples-${{ matrix.mode }}.json ${{ matrix.mode }}

      - name: Upload artifact-mode results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: examples-validation-artifact-modes-${{ matrix.mode }}
          path: results/
          retention-days: 14

      - name: Job summary
        if: always()
        run: |
          echo "## Artifact-mode Summary (${{ matrix.mode }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          f="results/validate_examples-${{ matrix.mode }}.json"
          test -f "$f" && \
            python -c "import json;d=json.load(open('$f'));print('summary:',json.dumps(d['summary']))" >> $GITHUB_STEP_SUMMARY || true

  full-example-matrix:
    name: Full example matrix
    runs-on: ubuntu-24.04
    needs: [validate-examples, artifact-modes, clang-header-fallback]
    if: always()

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Create results dir
        run: mkdir -p results downloaded

      - name: Download validation artifacts
        uses: actions/download-artifact@v8
        with:
          path: downloaded
          pattern: examples-validation-*

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc g++ clang cmake binutils curl ca-certificates

      - name: Set up pinned CastXML
        run: bash action/install-castxml.sh

      # The owner-proofs/bundle/special-cli validators below also dump
      # bundle/G20/special-shape example headers through the same castxml/
      # clang AST cache as the other jobs.
      - uses: ./.github/actions/cache-ast-dumps
        with:
          key-suffix: full-matrix

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # These runners exit non-zero when any owned case fails, but they still
      # write a complete artifact before doing so. continue-on-error keeps a
      # per-case failure here from skipping the collector below — the
      # collector re-derives the job's pass/fail from the recorded per-case
      # statuses in each artifact, so a real failure still fails the job.
      - name: Validate non-default example owners
        continue-on-error: true
        run: |
          PYTHONPATH=. python validation/scripts/run_example_owner_proofs.py --json \
            > results/example-owner-proofs.json

      - name: Validate bundle examples
        continue-on-error: true
        run: |
          PYTHONPATH=. python validation/scripts/run_bundle_examples.py --json \
            > results/bundle-examples.json

      - name: Validate special-shape examples through public CLI
        continue-on-error: true
        run: |
          PYTHONPATH=. python validation/scripts/run_special_cli_examples.py --json \
            > results/special-cli-examples.json

      - name: Build full example matrix
        if: always()
        run: |
          PYTHONPATH=. python validation/scripts/collect_full_example_matrix.py \
            --gcc downloaded/examples-validation-results-gcc/validate_examples-gcc.json \
            --clang downloaded/examples-validation-results-clang/validate_examples-clang.json \
            --runtime downloaded/examples-validation-results-gcc/example-runtime-smoke.json \
            --build-source downloaded/examples-validation-artifact-modes-build-source/validate_examples-build-source.json \
            --bundle results/bundle-examples.json \
            --special-cli results/special-cli-examples.json \
            --proofs results/example-owner-proofs.json \
            --out results/full-example-matrix.json

      - name: Upload full matrix
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: examples-full-matrix
          path: results/
          retention-days: 14

      # examples/README.md's "Current Validation Status" table is hand-typed
      # prose summarizing these same artifacts; nothing previously checked it
      # against a real run, so it silently drifted for several releases. This
      # step is the fix: fail the job (rather than warn) when the table's
      # Result cells don't match the JSON artifacts just produced above.
      - name: Check examples/README.md validation-status table is in sync
        if: always()
        run: |
          PYTHONPATH=. python scripts/check_examples_validation_status_sync.py \
            --gcc downloaded/examples-validation-results-gcc/validate_examples-gcc.json \
            --clang downloaded/examples-validation-results-clang/validate_examples-clang.json \
            --runtime downloaded/examples-validation-results-gcc/example-runtime-smoke.json \
            --release downloaded/examples-validation-artifact-modes-release-headers/validate_examples-release-headers.json \
            --stripped downloaded/examples-validation-artifact-modes-stripped-headers/validate_examples-stripped-headers.json \
            --build-source downloaded/examples-validation-artifact-modes-build-source/validate_examples-build-source.json \
            --check

      - name: Job summary
        if: always()
        run: |
          echo "## Full Example Matrix" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          test -f results/full-example-matrix.json && \
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open("results/full-example-matrix.json"))
          print("summary:", json.dumps(d["summary"], sort_keys=True))
          print("coverage by provenance:", json.dumps(d["coverage_by_provenance"], sort_keys=True))
          print("direct coverage:", json.dumps(d["direct_coverage"], sort_keys=True))
          if d["unresolved_cases"]:
              print("unresolved:", ", ".join(d["unresolved_cases"]))
          if d["failed_cases"]:
              print("failed:", ", ".join(d["failed_cases"]))
          PY
