name: Security & Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Only what this workflow analyses can change its answer on a PR:
    # first-party Python (CodeQL + bandit), the dependency manifest
    # (pip-audit), and this workflow/its CodeQL config. tests/ is excluded
    # because the CodeQL config ignores it and bandit skips it, so a
    # tests-only PR would re-analyse an unchanged tree. Every other PR
    # (docs, workflows, fixtures) starts no runner. Advisories published
    # against unchanged dependencies are caught by the push-to-main and
    # weekly runs below, which carry no path filter.
    paths:
      - '**/*.py'
      - '!tests/**'
      - 'pyproject.toml'
      - '.github/workflows/security.yml'
      - '.github/codeql/**'
  schedule:
    # Sunday 03:37 UTC: off the Monday 04:00-07:00 pile-up most weekly
    # crons share, and still weekly so new advisories and CodeQL query-pack
    # updates reach main without a commit.
    - cron: '37 3 * * 0'
  workflow_dispatch:

concurrency:
  # A PR groups by PR number, so a new push supersedes the stale run for
  # the same PR. A `push` to `main` must group by *ref*, not `run_id`:
  # every push run has a distinct `run_id`, so the previous spelling gave
  # each one its own group and `cancel-in-progress` never cancelled a
  # superseded main run at all — the newer commit's run simply queued
  # behind the obsolete one. `schedule`/`workflow_dispatch` deliberately
  # keep keying off `run_id` (unique per run) so two manual or scheduled
  # runs stay isolated from each other and from PR runs, matching
  # `mutation.yml`'s own grouping. This workflow is read-only validation;
  # do not copy this to a workflow with persistent side effects (release
  # publication, baseline rotation), where cancelling a superseded run can
  # leave partial state.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # NOTE: dependency review lives in its own workflow (dependency-review.yml),
  # not here. This file used to carry a second, near-identical job running the
  # same action at the same pinned SHA, so every PR paid for the scan twice and
  # reported two check rows for one answer. The surviving job absorbed this
  # one's stricter settings — see that file's comment — so consolidating cost
  # no coverage. Don't re-add a copy here.
  # One job, one runner: CodeQL plus pip-audit/bandit. These were two
  # parallel jobs; pip-audit+bandit take ~30 s of a ~45 s job, so a
  # second runner (and its 10-17 min queue wait, measured 2026-10-02) bought
  # nothing. pip-audit/bandit run after Analyze under `!cancelled()`, so a
  # CodeQL failure never hides their result and vice versa.
  security:
    name: Security Scan & CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
      - name: Initialize CodeQL
        uses: github/codeql-action/init@7188fc363630916deb702c7fdcf4e481b751f97a  # v4
        with:
          languages: python
          # Python needs no build; `none` replaces the no-op Autobuild step.
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
      - name: Analyze
        uses: github/codeql-action/analyze@7188fc363630916deb702c7fdcf4e481b751f97a  # v4
        with:
          # Unchanged category, so code-scanning alert history carries over.
          category: "/language:python"
      - name: Set up Python
        if: ${{ !cancelled() }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.14'
          cache: 'pip'
      - name: Install dependencies
        if: ${{ !cancelled() }}
        run: |
          pip install pip-audit bandit
      - name: pip-audit
        if: ${{ !cancelled() }}
        run: pip-audit .
      - name: bandit (high severity gate)
        if: ${{ !cancelled() }}
        run: bandit -r abicheck/ -x tests -lll
