name: Security & Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  # A PR groups by PR number, so a new push supersedes the stale run for
  # the same PR. A `push` to `main` must group by *ref*, not `run_id`:
  # every push run has a distinct `run_id`, so the previous spelling gave
  # each one its own group and `cancel-in-progress` never cancelled a
  # superseded main run at all — the newer commit's run simply queued
  # behind the obsolete one. `schedule`/`workflow_dispatch` deliberately
  # keep keying off `run_id` (unique per run) so two manual or scheduled
  # runs stay isolated from each other and from PR runs, matching
  # `mutation.yml`'s own grouping. This workflow is read-only validation;
  # do not copy this to a workflow with persistent side effects (release
  # publication, baseline rotation), where cancelling a superseded run can
  # leave partial state.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # NOTE: dependency review lives in its own workflow (dependency-review.yml),
  # not here. This file used to carry a second, near-identical job running the
  # same action at the same pinned SHA, so every PR paid for the scan twice and
  # reported two check rows for one answer. The surviving job absorbed this
  # one's stricter settings — see that file's comment — so consolidating cost
  # no coverage. Don't re-add a copy here.
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.14'
          cache: 'pip'
      - name: Install dependencies
        run: |
          pip install pip-audit bandit
      - name: pip-audit
        run: pip-audit .
      - name: bandit (high severity gate)
        run: bandit -r abicheck/ -x tests -lll

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      matrix:
        language: [python]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
      - name: Initialize CodeQL
        uses: github/codeql-action/init@7188fc363630916deb702c7fdcf4e481b751f97a  # v4
        with:
          languages: ${{ matrix.language }}
      - name: Autobuild
        uses: github/codeql-action/autobuild@7188fc363630916deb702c7fdcf4e481b751f97a  # v4
      - name: Analyze
        uses: github/codeql-action/analyze@7188fc363630916deb702c7fdcf4e481b751f97a  # v4
        with:
          category: "/language:${{ matrix.language }}"
