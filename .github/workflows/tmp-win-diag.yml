# TEMPORARY diagnostic for the Windows integration timeout; removed before merge.
name: tmp-win-diag
on:
  push:
    branches: [fix/windows-integration-timeout]
permissions:
  contents: read
jobs:
  diag:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          persist-credentials: false
      - name: Install system deps (Windows)
        run: |
          & "$env:CONDA\condabin\conda.bat" install --yes -c conda-forge castxml
          Add-Content -Path $env:GITHUB_PATH -Value "$env:CONDA\Library\bin"
          Add-Content -Path $env:GITHUB_PATH -Value "$env:CONDA\Scripts"
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.14'
          cache: 'pip'
      - run: pip install -e ".[dev]"
      - name: tool locations
        run: |
          where.exe gcc g++ clang clang++ castxml cl
          Measure-Command { g++ -E -x c++ -v - 2>&1 < NUL | Out-Null }
      - name: one-cell profile (serial)
        shell: bash
        env:
          PYTHONPATH: .github/diag
          DIAG_OUT: serial
        run: |
          python -m cProfile -o cell.prof -m pytest -p subproc_timing -p no:xdist -p no:cacheprovider -q --durations=10 \
            "tests/test_family_f2_live_route_matrix.py::test_live_route_matrix[addition_only-default]" \
            "tests/test_family_f2_live_route_matrix.py::test_live_route_matrix[addition_only-suppress_strict]" \
            "tests/test_family_f2_live_route_matrix.py::test_live_route_matrix[addition_only-policy_file]"
          cat serial-*.txt
          python -c "import pstats; pstats.Stats('cell.prof').sort_stats('cumulative').print_stats(45)" | head -120
          python -c "import pstats; pstats.Stats('cell.prof').sort_stats('tottime').print_stats(25)" | head -60
