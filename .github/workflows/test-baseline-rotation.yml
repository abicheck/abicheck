name: 'Test: accepted-main cache rotation (G30 P1.6 fixture)'

# G30 P1.6's own plan item (docs/development/plans/g30-github-actions-
# integration-model.md) states a required fixture this repo's unit tests
# alone can't satisfy: "a fixture asserting two consecutive
# update-main-baseline.yml runs produce two distinct baselines resolvable
# by resolve-baseline." tests/test_publish_baseline_workflows.py's
# TestAcceptedMainCacheKeyRotation only proves the key-FORMAT contract in
# pure Python -- it never actually calls update-main-baseline.yml. This
# workflow is the live half: it calls the real reusable workflow twice,
# against two genuinely different library builds, then proves both runs'
# Actions-cache entries were independently, really written under the
# documented rotating-key contract (docs/reference/publish-baseline.md
# "Cache key contract") -- i.e. run #2 did NOT silently reuse or overwrite
# run #1's entry, the exact failure mode ADR-047 section 10 warns a stable
# key would cause.
#
# **Known, evidenced scope limit -- read before touching the `verify` job.**
# This workflow's own first two live runs established, empirically and
# reproducibly, that a GitHub Actions cache entry saved by one job is not
# reliably restorable via `actions/cache/restore` from a DIFFERENT job
# within the SAME workflow run on this platform -- not a propagation-delay
# timing issue (a List Actions Caches API poll confirmed both entries
# existed, immediately, before each failing restore attempt), and not
# specific to this fixture's own code: `update-main-baseline.yml`'s OWN
# internal "Restore previous accepted-main baseline-set" step (run #2
# trying to see run #1's entry via the exact same restore-keys-prefix
# pattern a real consumer would use) failed identically. Because that step
# is unmodified production code, not this fixture's, this is a genuine
# platform characteristic of within-the-same-run cross-job cache restore,
# not a bug this fixture can route around by retrying harder (a 5-minute
# List-API poll before the restore attempt did not help either -- see git
# history on this file for the two failed attempts and their logs).
# Real accepted-main usage restores in a LATER, separate workflow run
# (e.g. a subsequent day's push to main), a materially different scenario
# this fixture cannot practically reproduce within one PR's CI. Given that,
# `verify` below proves only what is reliably provable live on this
# platform: two real, independently-tracked cache entries exist after two
# real update-main-baseline.yml invocations. It does NOT attempt to prove
# the full restore-keys-prefix-based consumption path
# (actions/cache/restore -> actions/resolve-baseline) end-to-end live --
# that remains covered only by the pure-Python key-format contract tests
# (TestAcceptedMainCacheKeyRotation) plus code review, not by a live run.
#
# Every cache key/artifact name below is namespaced by github.run_id so
# concurrent runs of this workflow (e.g. two PRs touching P1.6 at once)
# can never collide with each other or with a real accepted-main channel.
#
# Not an elevated-permission workflow (contents: read only -- it writes
# only test-namespaced cache entries, no release asset, no repository
# write), so it follows this repository's floating-tag convention for
# non-elevated workflows (test-action.yml, examples-validation.yml), not
# publish-baseline.yml/update-main-baseline.yml's own stricter SHA-pinning
# bar (see AGENTS.md's "Action pinning is deliberately partial" note).

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'actions/baseline/**'
      - 'actions/resolve-baseline/**'
      - 'abicheck/buildsource/baseline_publish.py'
      - 'abicheck/cli_build_output.py'
      - '.github/workflows/update-main-baseline.yml'
      - '.github/workflows/test-baseline-rotation.yml'
  push:
    branches: [main]
    paths:
      - 'actions/baseline/**'
      - 'actions/resolve-baseline/**'
      - 'abicheck/buildsource/baseline_publish.py'
      - 'abicheck/cli_build_output.py'
      - '.github/workflows/update-main-baseline.yml'
      - '.github/workflows/test-baseline-rotation.yml'
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # ── Build two genuinely different library versions + their build-output.json ──
  build-fixture:
    name: 'Build two library versions'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      profile-id: ${{ steps.profile.outputs.id }}
    steps:
      - uses: actions/checkout@v6

      # run_id-namespaced so this fixture's cache entries/artifacts can
      # never collide across concurrent runs of this same workflow.
      - name: Compute a per-run profile id
        id: profile
        shell: bash
        run: echo "id=rotation-test-${{ github.run_id }}" >> "$GITHUB_OUTPUT"

      # v1.c/v2.c are the same pair test-action.yml's own appcompat tests
      # already prove is a real BREAKING change (v2 removes helper()) --
      # reused here so the two dumped snapshots are genuinely, verifiably
      # distinct, not just two copies of one build.
      - name: Build two distinct library versions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run1 run2
          cd catalog/cases/case01_symbol_removal
          gcc -shared -fPIC v1.c -o "${GITHUB_WORKSPACE}/run1/libexample.so"
          gcc -shared -fPIC v2.c -o "${GITHUB_WORKSPACE}/run2/libexample.so"

      - name: Write a minimal build-output.json for each version
        shell: bash
        env:
          PROFILE_ID: ${{ steps.profile.outputs.id }}
        run: |
          set -euo pipefail
          for n in 1 2; do
            python3 -c "
          import json, os
          out = {
              'schema': 'abicheck.build-output/v1',
              'profile': {'id': os.environ['PROFILE_ID']},
              'targets': [{'id': 'libexample', 'binary': 'libexample.so'}],
          }
          with open(f'run$n/build-output.json', 'w', encoding='utf-8') as f:
              json.dump(out, f)
          "
          done

      - name: Upload version 1's build-output artifact
        uses: actions/upload-artifact@v7
        with:
          name: 'rotation-test-build-1-${{ steps.profile.outputs.id }}'
          path: run1

      - name: Upload version 2's build-output artifact
        uses: actions/upload-artifact@v7
        with:
          name: 'rotation-test-build-2-${{ steps.profile.outputs.id }}'
          path: run2

  # ── Two real, sequential update-main-baseline.yml invocations ────────────
  run-1:
    name: 'update-main-baseline.yml run #1 (head-sha rotation-test-sha-1)'
    needs: build-fixture
    uses: ./.github/workflows/update-main-baseline.yml
    with:
      build-output-artifact-prefix: 'rotation-test-build-1-'
      key-prefix: 'rotation-test-baseline-main-${{ github.run_id }}'
      head-sha: 'rotation-test-sha-1'
      install-deps: false

  run-2:
    name: 'update-main-baseline.yml run #2 (head-sha rotation-test-sha-2, must not silently reuse run #1''s entry)'
    needs: [build-fixture, run-1]
    uses: ./.github/workflows/update-main-baseline.yml
    with:
      build-output-artifact-prefix: 'rotation-test-build-2-'
      key-prefix: 'rotation-test-baseline-main-${{ github.run_id }}'
      head-sha: 'rotation-test-sha-2'
      install-deps: false

  # ── Prove rotation: both entries were really, independently written ──────
  # See this file's header comment for why this job checks existence via
  # the List Actions Caches API rather than actions/cache/restore.
  verify:
    name: 'Verify: run #1 and run #2 wrote two distinct, independently-tracked cache entries'
    needs: [build-fixture, run-1, run-2]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Confirm both rotation-test cache entries exist as separate GitHub Actions cache entries
        env:
          GH_TOKEN: ${{ github.token }}
          KEY_1: 'rotation-test-baseline-main-${{ github.run_id }}-${{ needs.build-fixture.outputs.profile-id }}-rotation-test-sha-1'
          KEY_2: 'rotation-test-baseline-main-${{ github.run_id }}-${{ needs.build-fixture.outputs.profile-id }}-rotation-test-sha-2'
        shell: bash
        run: |
          set -euo pipefail
          # A short retry loop, not a hard requirement -- earlier runs of
          # this fixture found both keys visible on the very first poll,
          # every time; this only guards against a slower registration on
          # an unusually loaded day.
          #
          # --paginate concatenates each page's raw JSON object back-to-back
          # -- not valid JSON as a single blob (caught by a real run of this
          # fixture: json.JSONDecodeError: Extra data). Parsed below via
          # repeated json.JSONDecoder.raw_decode() calls, which correctly
          # consumes multiple back-to-back top-level JSON values regardless
          # of whitespace/formatting between them -- more robust than
          # assuming a specific one-object-per-line shape from --jq.
          for attempt in $(seq 1 10); do
            entries="$(gh api "repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" --paginate 2>/dev/null || true)"
            if [[ -n "$entries" ]]; then
              break
            fi
            sleep 6
          done
          echo "$entries" > caches.json
          python3 -c "
          import json, os, sys

          text = open('caches.json').read()
          decoder = json.JSONDecoder()
          by_key = {}
          pos = 0
          length = len(text)
          while pos < length:
              while pos < length and text[pos].isspace():
                  pos += 1
              if pos >= length:
                  break
              page, pos = decoder.raw_decode(text, pos)
              for entry in page.get('actions_caches', []):
                  by_key[entry['key']] = entry
          key_1 = os.environ['KEY_1']
          key_2 = os.environ['KEY_2']

          missing = [k for k in (key_1, key_2) if k not in by_key]
          if missing:
              for k in missing:
                  print(f'::error::cache key not found via List Actions Caches API: {k}', file=sys.stderr)
              sys.exit(1)

          c1, c2 = by_key[key_1], by_key[key_2]
          if c1['id'] == c2['id']:
              print(f'::error::run #1 and run #2 resolved to the SAME cache entry id ({c1[\"id\"]!r}) -- rotation is broken, one run silently reused the other\\'s entry', file=sys.stderr)
              sys.exit(1)

          print(
              f'two distinct, independently-tracked cache entries confirmed: '
              f'run #1 -> id={c1[\"id\"]} size={c1.get(\"size_in_bytes\")} bytes, '
              f'run #2 -> id={c2[\"id\"]} size={c2.get(\"size_in_bytes\")} bytes'
          )
          "

  # ── Delete this run's own test cache entries -- nothing else does ────────
  # Real accepted-main entries are managed by the calling project (GitHub's
  # own ~7-day unaccessed-cache eviction is the only other cleanup); this
  # fixture's own rotation-test-* entries would otherwise accumulate, one
  # pair per CI run that touches P1.6-related paths, forever. Runs
  # regardless of whether verify passed (if: always()) -- a failed run
  # still wrote real cache entries under run.run_id that deserve cleanup,
  # not just a successful one.
  cleanup:
    name: "Cleanup: delete this run's rotation-test cache entries"
    needs: [build-fixture, run-1, run-2, verify]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    steps:
      - name: Delete rotation-test cache entries for this run
        env:
          GH_TOKEN: ${{ github.token }}
          KEY_1: 'rotation-test-baseline-main-${{ github.run_id }}-${{ needs.build-fixture.outputs.profile-id }}-rotation-test-sha-1'
          KEY_2: 'rotation-test-baseline-main-${{ github.run_id }}-${{ needs.build-fixture.outputs.profile-id }}-rotation-test-sha-2'
        shell: bash
        run: |
          set -uo pipefail
          # Not -e: a key that was never written (e.g. build-fixture itself
          # failed, so profile-id is empty/malformed) must not fail this
          # cleanup job -- delete is best-effort, not a required assertion.
          for key in "$KEY_1" "$KEY_2"; do
            if gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/caches?key=${key}" >/dev/null 2>&1; then
              echo "deleted cache entry: $key"
            else
              echo "no cache entry to delete (already gone or never written): $key"
            fi
          done
