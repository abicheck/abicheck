name: Module Architecture

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  module-architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # pull_request normally checks out GitHub's synthetic merge commit.
          # The architecture delta belongs to the PR branch only; otherwise
          # base-side changes included in that merge are misreported as PR
          # growth against the event's base SHA.
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Enforce bounded-module architecture
        env:
          MODULE_ARCHITECTURE_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: >-
          python scripts/verify.py --profile pr
          --only module-architecture-tests,module-architecture
