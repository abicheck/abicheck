name: Ops ICX plugin vendor-safe probe 2026-08-14

on:
  push:
    branches: [ops/icx-plugin-vendor-safe-probe-2026-08-14]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install ICX and matching-major plugin build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ca-certificates wget gpg-agent cmake ninja-build build-essential \
            file binutils jq

          wget -qO- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg >/dev/null
          echo 'deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main' \
            | sudo tee /etc/apt/sources.list.d/oneAPI.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends intel-oneapi-compiler-dpcpp-cpp

          key=/tmp/llvm-snapshot.gpg.key
          wget -q -O "$key" https://apt.llvm.org/llvm-snapshot.gpg.key
          got=$(gpg --show-keys --with-colons --with-fingerprint "$key" \
                | awk -F: '/^fpr:/ {print $10; exit}')
          test "$got" = "6084F3CF814B57C1CF12EFD515CF4D18AF4F7421"
          sudo install -m 0644 "$key" /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
          echo "deb http://apt.llvm.org/${codename}/ llvm-toolchain-${codename}-22 main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang-22 llvm-22-dev libclang-22-dev libc++-22-dev libc++abi-22-dev

          python -m pip install -e .

      - name: Build progressively safer variants and attempt scan
        shell: bash
        run: |
          set +e
          set -o pipefail
          ROOT=$(pwd)
          OUT="$ROOT/icx-plugin-vendor-safe-results"
          mkdir -p "$OUT"
          exec > >(tee "$OUT/probe.log") 2>&1

          source /opt/intel/oneapi/setvars.sh --force >/dev/null 2>&1
          ICPX=$(command -v icpx)
          ICX=$(command -v icx)
          LLVM_PREFIX=/usr/lib/llvm-22
          BASE_SRC="$ROOT/contrib/abicheck-clang-plugin"

          "$ICPX" --version | tee "$OUT/icpx-version.txt"
          echo | "$ICPX" -dM -E -x c++ - \
            | grep -E '__clang_(major|minor|patchlevel|version)__|__INTEL_(LLVM|CLANG)_COMPILER' \
            | sort | tee "$OUT/icpx-version-macros.txt"

          patch_variant() {
            local mode="$1" src="$2"
            MODE="$mode" SRC_FILE="$src/AbicheckFactsPlugin.cpp" python - <<'PY'
          import os
          import re
          from pathlib import Path

          mode = os.environ["MODE"]
          path = Path(os.environ["SRC_FILE"])
          text = path.read_text()

          context_old = '''                                           Version, computeContextHash(ci),
                                           macros, inferredRootCount);'''
          context_new = '''                                           Version, std::string("icx-experimental-context"),
                                           macros, inferredRootCount);'''
          if text.count(context_old) != 1:
              raise SystemExit(f"expected one context call, found {text.count(context_old)}")
          text = text.replace(context_old, context_new)

          text = text.replace(
              '    auto macros = std::make_shared<std::map<std::string, MacroRecord>>();',
              '    llvm::errs() << "ABICHECK_ICX_STEP: macros\\n";\n'
              '    auto macros = std::make_shared<std::map<std::string, MacroRecord>>();',
              1,
          )
          text = text.replace(
              '    Preprocessor &pp = ci.getPreprocessor();',
              '    llvm::errs() << "ABICHECK_ICX_STEP: preprocessor\\n";\n'
              '    Preprocessor &pp = ci.getPreprocessor();',
              1,
          )
          text = text.replace(
              '    std::vector<std::string> roots = Roots;',
              '    llvm::errs() << "ABICHECK_ICX_STEP: roots\\n";\n'
              '    std::vector<std::string> roots = Roots;',
              1,
          )
          text = text.replace(
              '    return std::make_unique<FactsConsumer>(OutDir, std::move(roots), Library,',
              '    llvm::errs() << "ABICHECK_ICX_STEP: create-consumer\\n";\n'
              '    return std::make_unique<FactsConsumer>(OutDir, std::move(roots), Library,',
              1,
          )

          if mode in {"nocontext-nopp", "noop"}:
              pp_old = '''    llvm::errs() << "ABICHECK_ICX_STEP: preprocessor\\n";
    Preprocessor &pp = ci.getPreprocessor();
    pp.addPPCallbacks(std::make_unique<MacroCollector>(pp, macros));'''
              pp_new = '''    llvm::errs() << "ABICHECK_ICX_STEP: preprocessor-skipped\\n";
    (void)ci;'''
              if text.count(pp_old) != 1:
                  raise SystemExit(f"expected one PP block, found {text.count(pp_old)}")
              text = text.replace(pp_old, pp_new)

              roots_old = '''    if (roots.empty()) {
      roots = deriveRootsFromIncludes(ci.getHeaderSearchOpts());
      inferredRootCount = roots.size();
    }'''
              roots_new = '''    if (roots.empty())
      llvm::errs() << "ABICHECK_ICX_STEP: roots-empty-no-derivation\\n";'''
              if text.count(roots_old) != 1:
                  raise SystemExit(f"expected one roots fallback, found {text.count(roots_old)}")
              text = text.replace(roots_old, roots_new)

          if mode == "noop":
              pattern = re.compile(
                  r'''    llvm::errs\(\) << "ABICHECK_ICX_STEP: create-consumer\\n";\n'''
                  r'''    return std::make_unique<FactsConsumer>\(OutDir, std::move\(roots\), Library,\n'''
                  r'''\s+Version, std::string\("icx-experimental-context"\),\n'''
                  r'''\s+macros, inferredRootCount\);'''
              )
              replacement = (
                  '    llvm::errs() << "ABICHECK_ICX_STEP: noop-consumer\\n";\n'
                  '    return std::make_unique<ASTConsumer>();'
              )
              text, count = pattern.subn(replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f"expected one FactsConsumer return, replaced {count}")

          path.write_text(text)
          PY
          }

          build_variant() {
            local mode="$1"
            local dir="$OUT/$mode"
            local src="$dir/src"
            local build="$dir/build"
            mkdir -p "$dir"
            cp -a "$BASE_SRC" "$src"
            patch_variant "$mode" "$src"

            cmake -S "$src" -B "$build" -G Ninja \
              -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_C_COMPILER="$ICX" \
              -DCMAKE_CXX_COMPILER="$ICPX" \
              -DCMAKE_PREFIX_PATH="$LLVM_PREFIX" \
              -DCMAKE_CXX_FLAGS="-fno-rtti -stdlib=libc++ -O0 -g" \
              -DCMAKE_MODULE_LINKER_FLAGS="-stdlib=libc++" \
              >"$dir/cmake.stdout" 2>"$dir/cmake.stderr"
            echo $? > "$dir/cmake.rc"
            cmake --build "$build" -v >"$dir/build.stdout" 2>"$dir/build.stderr"
            echo $? > "$dir/build.rc"

            local plugin="$build/libabicheck-facts.so"
            if [[ ! -f "$plugin" ]]; then
              echo 127 > "$dir/smoke.rc"
              echo 127 > "$dir/dump.rc"
              echo 127 > "$dir/scan.rc"
              return
            fi
            sha256sum "$plugin" > "$dir/plugin-sha256.txt"
            ldd "$plugin" > "$dir/plugin-ldd.txt" 2>&1

            mkdir -p "$dir/fixture/include" "$dir/fixture/facts"
            cat > "$dir/fixture/include/widget.hpp" <<'CPP'
          #pragma once
          namespace demo {
          struct widget { int value; };
          int answer(widget);
          }
          CPP
            cat > "$dir/fixture/widget.cpp" <<'CPP'
          #include "widget.hpp"
          int demo::answer(widget w) { return w.value + 42; }
          CPP

            "$ICPX" -std=c++17 -fPIC -shared -I"$dir/fixture/include" \
              -fplugin="$plugin" \
              -Xclang -plugin-arg-abicheck-facts -Xclang "out=$dir/fixture/facts" \
              -Xclang -plugin-arg-abicheck-facts -Xclang "public-roots=$dir/fixture/include" \
              -Xclang -plugin-arg-abicheck-facts -Xclang "library=icx_widget" \
              "$dir/fixture/widget.cpp" -o "$dir/fixture/libwidget.so" \
              >"$dir/smoke.stdout" 2>"$dir/smoke.stderr"
            local smoke_rc=$?
            echo "$smoke_rc" > "$dir/smoke.rc"
            find "$dir/fixture/facts" -type f -print -exec wc -c {} \; \
              > "$dir/facts-files.txt" 2>&1

            if [[ "$smoke_rc" -eq 0 && "$mode" != "noop" ]]; then
              abicheck dump "$dir/fixture/libwidget.so" \
                --build-info "$dir/fixture/facts" \
                -o "$dir/fixture/baseline.json" \
                >"$dir/dump.stdout" 2>"$dir/dump.stderr"
              local dump_rc=$?
              echo "$dump_rc" > "$dir/dump.rc"

              if [[ "$dump_rc" -eq 0 ]]; then
                abicheck scan "$dir/fixture/libwidget.so" \
                  --against "$dir/fixture/baseline.json" \
                  --build-info "$dir/fixture/facts" \
                  --depth source --format json \
                  >"$dir/scan.stdout" 2>"$dir/scan.stderr"
                echo $? > "$dir/scan.rc"
              else
                echo 127 > "$dir/scan.rc"
              fi
            else
              echo 127 > "$dir/dump.rc"
              echo 127 > "$dir/scan.rc"
            fi
          }

          build_variant nocontext
          build_variant nocontext-nopp
          build_variant noop

          {
            printf 'variant\tcmake\tbuild\tsmoke\tdump\tscan\n'
            for mode in nocontext nocontext-nopp noop; do
              printf '%s\t%s\t%s\t%s\t%s\t%s\n' \
                "$mode" \
                "$(cat "$OUT/$mode/cmake.rc")" \
                "$(cat "$OUT/$mode/build.rc")" \
                "$(cat "$OUT/$mode/smoke.rc")" \
                "$(cat "$OUT/$mode/dump.rc")" \
                "$(cat "$OUT/$mode/scan.rc")"
            done
          } | tee "$OUT/result-matrix.tsv"

          for mode in nocontext nocontext-nopp noop; do
            echo "===== $mode smoke stderr ====="
            tail -160 "$OUT/$mode/smoke.stderr" 2>/dev/null
            echo "===== $mode facts ====="
            cat "$OUT/$mode/facts-files.txt" 2>/dev/null
          done

          exit 0

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: icx-plugin-vendor-safe-${{ github.sha }}
          path: icx-plugin-vendor-safe-results/
          if-no-files-found: error
          retention-days: 30
