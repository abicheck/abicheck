name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install MkDocs + Material theme
        run: pip install mkdocs mkdocs-material mkdocs-redirects

      - name: Regenerate published documentation assets (idempotent)
        run: |
          python scripts/gen_examples_docs.py
          python scripts/publish_schemas.py

      - name: Build site
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5
        id: deployment

  verify-schema-ids:
    name: Verify published schema IDs
    needs: deploy
    runs-on: ubuntu-latest
    # actions/deploy-pages reporting success only means the artifact was handed
    # to the Pages backend, not that it's live on the CDN yet — propagation is
    # eventually consistent and has been observed to take over a minute after
    # deploy returns. The wait-for-live step below absorbs that lag with a
    # generous, backed-off poll budget; 15 minutes leaves comfortable headroom
    # on top of that poll budget plus the per-file byte comparison below.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
      - name: Wait for Pages deployment to become live
        shell: bash
        run: |
          set -euo pipefail
          # Poll one canonical, always-published URL until the CDN actually
          # serves it, rather than immediately racing the byte-comparison loop
          # below against propagation. Bounded, exponential-ish backoff over a
          # ~5 minute budget — comfortably above the propagation lag we've
          # observed in practice, without risking a hung job on a real outage.
          probe_url="$(python -c 'import json; print(json.load(open("abicheck/schemas/aggregate_report.schema.json", encoding="utf-8"))["$id"])')"
          echo "Polling $probe_url until live"
          deadline=$((SECONDS + 300))
          delay=5
          while true; do
            remaining=$((deadline - SECONDS))
            if [ "$remaining" -le 0 ]; then
              echo "::error::Pages deployment did not become live within the poll budget"
              exit 1
            fi
            # Bound this attempt to whatever's left of the poll budget, so a
            # stalled connection can't sit past the deadline check below —
            # curl's own timeout is what actually returns control here.
            if curl --fail --silent --show-error --location --output /dev/null \
              --connect-timeout "$remaining" --max-time "$remaining" "$probe_url"; then
              break
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::Pages deployment did not become live within the poll budget"
              exit 1
            fi
            echo "Not live yet, retrying in ${delay}s..."
            sleep "$delay"
            delay=$((delay * 2 > 30 ? 30 : delay * 2))
          done
          echo "Pages deployment is live"
      - name: Retrieve and compare every canonical schema URL
        shell: bash
        run: |
          set -euo pipefail
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          for schema in abicheck/schemas/*.schema.json; do
            url="$(python -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["$id"])' "$schema")"
            downloaded="$temp_dir/$(basename "$schema")"
            echo "Checking $url"
            # The probe step above already confirmed the deployment is live, so
            # this retry budget is just a safety net for transient network
            # blips, not a substitute for the propagation wait.
            curl --fail --location --retry 5 --retry-all-errors --retry-delay 5 \
              --connect-timeout 15 --max-time 60 "$url" --output "$downloaded"
            cmp -- "$schema" "$downloaded"
          done
