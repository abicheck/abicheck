name: Native GCC
on:
  pull_request:
    paths:
      - 'abicheck/**'
      - 'tests/test_native_gcc*'
      - 'pyproject.toml'
      - '.github/workflows/native-gcc.yml'
      - '.github/actions/install-system-deps/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-gcc-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        gcc: [13, 14]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install matching native compiler SDK
        uses: ./.github/actions/install-system-deps
        with:
          packages: g++-${{ matrix.gcc }} gcc-${{ matrix.gcc }}-plugin-dev
      - name: Install abicheck
        run: python -m pip install -e '.[dev]'
      - name: Run real GCC workflow tests without a CastXML dependency
        env:
          ABICHECK_NATIVE_GCC: g++-${{ matrix.gcc }}
          ABICHECK_MIN_EXECUTED: '8'
        run: python -m pytest tests/test_native_gcc_workflow.py tests/test_native_gcc_fact_integration.py tests/test_native_gcc_parity_regressions.py -q --no-cov
