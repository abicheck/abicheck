name: Real-world ABI validation

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"
  pull_request:
    paths:
      - "abicheck/package.py"
      - "abicheck/cli_compare_release.py"
      - "abicheck/bundle.py"
      - "tests/test_package.py"
      - "tests/test_compare_release.py"
      - "tests/test_bundle.py"
      - ".github/workflows/realworld-validation.yml"
      # CLI-audit P1 (CI hardening): this job is the one lane that runs
      # `abicheck compare` against a real package binary rather than a
      # synthetic snapshot, so it must not be skipped for a change to the
      # subsystems it actually exercises -- an earlier gap the review
      # flagged by name (contract pipeline, comparability, compiler
      # profile, report schemas), which a paths filter scoped only to
      # package/bundle plumbing silently missed.
      - "abicheck/contract_*.py"
      - "abicheck/compatibility_evaluation_*.py"
      - "abicheck/comparability*.py"
      - "abicheck/pack_application.py"
      - "abicheck/impact/**"
      - "abicheck/buildsource/project_targets.py"
      - "abicheck/buildsource/run_plan.py"
      - "abicheck/buildsource/toolchain_probe.py"
      - "abicheck/buildsource/toolchain_bindings.py"
      - "abicheck/schemas/*.schema.json"
      - "abicheck/checker.py"
      - "abicheck/checker_policy.py"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ubuntu-package-smoke:
    name: Ubuntu package and bundle smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install system dependencies
        uses: ./.github/actions/install-system-deps
        with:
          packages: gcc g++ binutils zstd abigail-tools zlib1g-dev curl ca-certificates

      - uses: ./.github/actions/setup-castxml

      - name: Install abicheck
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Focused regression tests
        run: |
          pytest -q \
            tests/test_package.py::TestDebExtractorExtended \
            tests/test_package.py::TestDebExtractorNoDataTar \
            tests/test_compare_release.py::TestCompareReleaseIncludes \
            tests/test_bundle.py::TestCompareReleaseBundleE2E

      - name: Download Ubuntu package inputs
        run: |
          mkdir -p reports/realworld inputs/debs
          cd inputs/debs
          apt-get download zlib1g zlib1g-dev

      - name: Compare a real Debian package against itself
        run: |
          set -euo pipefail
          cd inputs/debs
          runtime_deb="$(ls zlib1g_*.deb | head -1)"
          devel_deb="$(ls zlib1g-dev_*.deb | head -1)"
          cd ../..
          abicheck compare \
            "inputs/debs/${runtime_deb}" \
            "inputs/debs/${runtime_deb}" \
            --devel-pkg "old=inputs/debs/${devel_deb}" \
            --devel-pkg "new=inputs/debs/${devel_deb}" \
            --format json \
            -o reports/realworld/zlib-deb-self.json
          python - <<'PY'
          import json
          data = json.load(open("reports/realworld/zlib-deb-self.json"))
          # ADR-068 D3/D4/D5: compare() now runs the unversioned_exported_symbol
          # cross-source check automatically. zlib's own base-API symbols are
          # legitimately bound to the anonymous/base GNU symbol-version node
          # (real, correct, permanent upstream convention -- see readelf -V),
          # so a self-compare now reports COMPATIBLE_WITH_RISK with advisory
          # RISK findings alongside NO_CHANGE/COMPATIBLE -- never BREAKING, and
          # never a real ABI change (ADR-035 D4: these findings are advisory/
          # suppressible by design, not part of the compatibility verdict).
          assert data["verdict"] in {"NO_CHANGE", "COMPATIBLE", "COMPATIBLE_WITH_RISK"}
          # Phase 7d (one-comparison-product.md §4.1): --no-bundle-analysis
          # is gone -- bundle-level analysis always runs now, so these keys
          # are always present (a clean self-compare, so an empty list).
          assert data["bundle_findings"] == []
          PY

      - name: Compare a real Debian package against itself, with --contract
        # CLI-audit P1: this is the one lane exercising the release/package
        # contract-evaluation parity fix against a real package binary
        # (rather than a synthetic snapshot) -- contract evaluation used
        # to be a hard UsageError on a directory/package compare at all.
        # Real package export-table/header evidence, not a hand-built
        # fixture, is what actually catches a regression here.
        run: |
          set -euo pipefail
          cd inputs/debs
          runtime_deb="$(ls zlib1g_*.deb | head -1)"
          devel_deb="$(ls zlib1g-dev_*.deb | head -1)"
          cd ../..
          abicheck compare \
            "inputs/debs/${runtime_deb}" \
            "inputs/debs/${runtime_deb}" \
            --devel-pkg "old=inputs/debs/${devel_deb}" \
            --devel-pkg "new=inputs/debs/${devel_deb}" \
            --contract public \
            --format json \
            -o reports/realworld/zlib-deb-self-contract.json
          python - <<'PY'
          import json
          data = json.load(open("reports/realworld/zlib-deb-self-contract.json"))
          # See the same note on the plain self-compare step above:
          # compare()'s automatic unversioned_exported_symbol check now
          # reports advisory RISK findings for zlib's own (correct, upstream)
          # base-version-bound API symbols.
          assert data["verdict"] in {"NO_CHANGE", "COMPATIBLE", "COMPATIBLE_WITH_RISK"}, data["verdict"]
          # ADR-049 Phase 7's orthogonal coverage axis must resolve cleanly
          # against a real package's real export table/headers -- 0, not
          # merely "present", since this is a self-compare with complete
          # evidence on both sides.
          assert data["contract_coverage_exit_contribution"] == 0, data
          for lib in data["libraries"]:
              assert lib["contract_coverage_exit_contribution"] == 0, lib
          PY

      - name: Cross-check package self-compare with abidiff
        run: |
          set -euo pipefail
          mkdir -p /tmp/abicheck-realworld-old /tmp/abicheck-realworld-new
          runtime_deb="$(ls inputs/debs/zlib1g_*.deb | head -1)"
          dpkg-deb -x "${runtime_deb}" /tmp/abicheck-realworld-old
          dpkg-deb -x "${runtime_deb}" /tmp/abicheck-realworld-new
          abidiff \
            /tmp/abicheck-realworld-old/usr/lib/x86_64-linux-gnu/libz.so.1.3 \
            /tmp/abicheck-realworld-new/usr/lib/x86_64-linux-gnu/libz.so.1.3 \
            > reports/realworld/zlib-abidiff.txt

      - name: Upload real-world validation artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: realworld-validation
          path: reports/realworld
