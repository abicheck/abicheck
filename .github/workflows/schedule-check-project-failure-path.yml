name: 'Schedule: check-project.yml failure-path fixture'

# The automated trigger half of test-check-project-failure-path.yml -- see
# that file's header comment for why it can no longer declare its own
# `schedule:`/`push:main` trigger. That workflow's own run is EXPECTED to
# conclude "failure" on every successful test run (it deliberately drives
# check-project.yml into an operational error to prove the aggregate job's
# failure-survival contract); running it directly against any commit SHA
# that is part of `main`'s own history would permanently attach a red
# check-run to that commit.
#
# This workflow breaks that link. It runs on its own schedule against
# `main`, but its own job does no assertions -- it only:
#   1. creates/updates a dedicated, disposable fixture branch
#      (`ci-fixture/check-project-failure-path`) at the current `main` tip
#      plus one fresh empty commit, so the fixture branch's HEAD SHA is
#      never a commit reachable from `main`'s own branch ref (an empty
#      commit on top always mints a new SHA distinct from anything in
#      `main`'s history -- a fast-forward with no new commit would keep the
#      identical SHA, and GitHub's checks UI aggregates check-runs by exact
#      commit SHA regardless of which ref points at it);
#   2. dispatches test-check-project-failure-path.yml with
#      `ref: ci-fixture/check-project-failure-path`, so GitHub loads and
#      runs that workflow (and its `uses: ./.github/workflows/
#      check-project.yml` reusable-workflow call) exactly as they exist on
#      the fixture branch -- a byte-for-byte copy of `main` at dispatch
#      time, since the fixture branch is always rebuilt from the current
#      `main` tip first.
# Both steps are ordinary git/API operations that either succeed or fail
# operationally (e.g. a transient API error) -- neither can fail because of
# the *expected* downstream test failure, since dispatching a workflow run
# is fire-and-forget and does not block on that run's outcome. This job's
# own conclusion therefore reports this scheduler's own health, not the
# fixture's -- exactly the split "main is green" needs.
permissions:
  contents: read

on:
  schedule:
    # Weekly -- enough to catch a regression in the failure-survival
    # contract without needing a run on every push.
    - cron: '17 6 * * 1'
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  dispatch:
    name: 'Stage fixture ref and dispatch the failure-path fixture'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Create fixture ref with a fresh commit (never part of main's own history)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -B ci-fixture/check-project-failure-path
          git commit --allow-empty -m "ci fixture trigger for test-check-project-failure-path.yml (run ${GITHUB_RUN_ID})"
          git push --force origin ci-fixture/check-project-failure-path

      - name: Dispatch test-check-project-failure-path.yml against the fixture ref
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run test-check-project-failure-path.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref ci-fixture/check-project-failure-path
