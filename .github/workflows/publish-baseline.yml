name: 'abicheck publish-baseline'

# G30 P1.6 (ADR-047 section 6/section 10): publishes a `release-contract`
# baseline-set as one atomic GitHub Release asset per contract profile.
# Reusable workflow (workflow_call) -- the calling repository's own release
# workflow decides WHEN this runs (a `release: types: [published]` trigger
# is the intended one; ADR-047 section 12 requires baseline-publishing
# workflows to be push/workflow_dispatch/release-triggered only, never
# `pull_request`/`pull_request_target`, so a fork PR can never mint a
# release-contract baseline). This workflow never builds anything itself
# ("build once, scan many", the same boundary check-project.yml draws): it
# expects the caller's own build job(s) to have already uploaded one
# `<build-output-artifact-prefix><profile-id>` artifact per contract profile
# -- build-output.json plus the binaries/headers it references (G30 P1.1) --
# earlier in the same workflow run.
#
# Every third-party Action reference below is pinned to a full commit SHA,
# not a floating tag -- this workflow writes a GitHub Release asset, which
# needs the same SHA-pinning bar AGENTS.md already applies to security.yml/
# publish.yml (a re-pointed tag here is a real supply-chain risk), unlike
# check-target/resolve-baseline's tag-pinning (those carry no elevated
# permissions). Pins are the SAME commits already used elsewhere in this
# repository for the same major version (publish.yml/security.yml), not
# independently re-resolved from each tag's current HEAD -- a floating major
# tag (e.g. actions/checkout@v6) can move to a newer commit over time, so
# reusing this repository's own existing pin keeps every elevated-permission
# workflow pointed at the identical, already-reviewed commit.

on:
  workflow_call:
    inputs:
      build-output-artifact-prefix:
        description: 'Each contract profile''s build-output.json is downloaded from an artifact named <this><profile-id>.'
        type: string
        default: 'abicheck-build-'
      release-tag:
        description: 'Release tag this run publishes assets to, and records as each baseline-set''s project-ref. Defaults to github.ref_name (the tag that triggered the calling release workflow).'
        type: string
        default: ''
      asset-name-template:
        description: 'GitHub Release asset filename template; "{profile}" is replaced with each contract profile''s id.'
        type: string
        default: 'abicheck-baseline-{profile}.tar.zst'
      build-info:
        description: >-
          Path to a shared build/source facts pack, relative to each
          profile's downloaded build-output artifact directory -- passed as
          --build-info to every library's dump call. Omit for a
          binary/header-only (L0-L2) baseline-set.
        type: string
        default: ''
      depth:
        description: 'Evidence depth passed to every dump call (binary, headers, build, or source). Omit for the CLI default.'
        type: string
        default: ''
      validation:
        description: 'Forwarded to actions/baseline''s validation input (strict or none).'
        type: string
        default: 'strict'
      snapshot-compression:
        description: >-
          Forwarded to actions/baseline's snapshot-compression input
          (none/gzip/zstd, ADR-059). Independent of this workflow's own
          outer `tar --zstd` packaging step below: that step archives the
          whole baseline-set directory into one release asset regardless
          of this setting, so 'none' (default) is normally sufficient --
          set this only when a consumer of the *extracted* baseline-set
          (not the published archive) benefits from each snapshot already
          being individually compressed.
        type: string
        default: 'none'
      python-version:
        description: 'Python version for setup-python, every job.'
        type: string
        default: '3.13'
      install-deps:
        description: 'Install system dependencies (castxml, gcc) before dumping. Set to false if pre-installed.'
        type: boolean
        default: true

    secrets:
      github-token:
        description: 'Token with permission to upload assets to release-tag''s release. Defaults to this job''s own GITHUB_TOKEN (requires contents: write) when omitted.'
        required: false

jobs:
  # ── Job 1: discover which contract profiles have a build-output artifact ──
  discover:
    name: 'Discover contract profiles'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      has-profiles: ${{ steps.discover.outputs.has-profiles }}
    steps:
      - name: Download build-output artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          path: build-outputs
          pattern: '${{ inputs.build-output-artifact-prefix }}*'
          merge-multiple: false

      # Reads each build-output.json's OWN profile.id field (ADR-047 section
      # 2: "one build-output.json = one build profile, always") rather than
      # reconstructing it from the download directory name -- download-
      # artifact only nests a downloaded artifact under path/<artifact-name>/
      # when its pattern matches TWO OR MORE artifacts; matching exactly one
      # (a single-contract-profile project) extracts flat into path instead,
      # making a name-derived profile id ambiguous by construction (the same
      # gap check-project.yml's own plan job already works around).
      - name: Discover profile ids
        id: discover
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "
          import glob, json, sys

          profiles = []
          for bo_file in sorted(glob.glob('build-outputs/**/build-output.json', recursive=True)):
              profile_id = json.load(open(bo_file)).get('profile', {}).get('id', '')
              if not profile_id:
                  print(f'::error::{bo_file} has no profile.id set -- cannot determine which contract profile it belongs to', file=sys.stderr)
                  sys.exit(1)
              profiles.append(profile_id)
          print('matrix=' + json.dumps({'include': [{'profile_id': p} for p in profiles]}))
          print('has-profiles=' + ('true' if profiles else 'false'))
          " >> "$GITHUB_OUTPUT"

  no-profiles:
    name: 'Fail: no contract-profile build-output artifacts found'
    needs: discover
    if: needs.discover.outputs.has-profiles != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fail
        env:
          BUILD_OUTPUT_ARTIFACT_PREFIX: ${{ inputs.build-output-artifact-prefix }}
        run: |
          echo "::error::no '${BUILD_OUTPUT_ARTIFACT_PREFIX}*' build-output artifacts were found -- this run would otherwise report success having published nothing. Make sure the calling workflow's build job(s) upload one such artifact per contract profile before calling this reusable workflow." >&2
          exit 1

  # ── Job 2: dump + stage + publish one baseline-set per contract profile ──
  publish:
    name: 'Publish ${{ matrix.profile_id }}'
    needs: discover
    if: needs.discover.outputs.has-profiles == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          persist-credentials: false

      # This job needs the real abicheck CLI + actions/baseline's own files,
      # not whatever happens to be at the calling repository's root -- the
      # same self-checkout technique check-project.yml/check-target already
      # establish (see check-project.yml's "plan" job for the fuller
      # writeup of why github.workflow_ref/github.workflow_sha, not
      # job.workflow_ref/job.workflow_sha, would be wrong for a reusable
      # workflow's own self-identification).
      - name: Capture this reusable workflow's identity
        id: identity
        shell: bash
        env:
          WORKFLOW_REF: ${{ job.workflow_ref }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          FALLBACK_REPOSITORY: ${{ github.repository }}
          FALLBACK_REF: ${{ github.sha }}
        run: |
          repository="${WORKFLOW_REF%%/.github/workflows/*}"
          echo "repository=${repository:-$FALLBACK_REPOSITORY}" >> "$GITHUB_OUTPUT"
          echo "ref=${WORKFLOW_SHA:-$FALLBACK_REF}" >> "$GITHUB_OUTPUT"

      - name: Checkout abicheck (for installing the CLI and nested Action composition)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          repository: ${{ steps.identity.outputs.repository }}
          ref: ${{ steps.identity.outputs.ref }}
          path: .publish-baseline-src
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install abicheck
        shell: bash
        run: pip install ./.publish-baseline-src

      - name: Download build-output artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: '${{ inputs.build-output-artifact-prefix }}${{ matrix.profile_id }}'
          path: 'build-output/${{ matrix.profile_id }}'

      # Derives actions/baseline's `libraries` JSON input straight from this
      # profile's build-output.json (abicheck/buildsource/baseline_publish.py)
      # -- no separate .abicheck.yml read here: every target this build
      # produced, and whether it's a release-bundle member (which needs its
      # real ELF binary staged, not just a snapshot -- ADR-047 section 8 S14
      # correction), is already recorded in build-output.json itself.
      - name: Derive baseline libraries from build-output.json
        id: libraries
        shell: bash
        env:
          PROFILE_ID: ${{ matrix.profile_id }}
        run: |
          set -euo pipefail
          # Not a CLI command (ADR-054: `build-output baseline-libraries` was
          # a wire-format adapter for exactly this one call site, not general
          # project-integration CLI surface) -- call the library function
          # directly. Deliberately tolerant of a missing/malformed
          # build-output.json (writes nothing, same as the former CLI call's
          # `|| true`): a report with per-target errors still writes
          # baseline-libraries.json (report['ok'] is False), and the Python
          # block below reads report['errors'] to print each one as its own
          # ::error:: annotation either way. The trailing `|| true` matches
          # the former CLI call's own blanket tolerance -- any other
          # unexpected failure here (not just a missing/malformed
          # build-output.json) still falls through to that block's "was not
          # produced" branch instead of aborting this step with a bare
          # traceback.
          python3 -I -c "
          import json
          import os
          from pathlib import Path

          from abicheck.buildsource.baseline_publish import derive_baseline_libraries
          from abicheck.buildsource.build_output import load_build_output

          directory = Path('build-output') / os.environ['PROFILE_ID']
          try:
              build_output = load_build_output(directory)
          except (FileNotFoundError, ValueError):
              raise SystemExit(0)
          report = derive_baseline_libraries(build_output, directory)
          Path('baseline-libraries.json').write_text(json.dumps(report.to_dict()))
          " || true
          python3 -I -c "
          import json, sys

          try:
              report = json.load(open('baseline-libraries.json'))
          except OSError as exc:
              print(f'::error::baseline-libraries.json was not produced: {exc}', file=sys.stderr)
              sys.exit(1)
          if not report['ok']:
              for e in report['errors']:
                  print(f'::error::{e}', file=sys.stderr)
              sys.exit(1)
          with open('libraries.json', 'w', encoding='utf-8') as fh:
              json.dump(report['entries'], fh)
          "
          {
            echo "libraries<<ABICHECK_LIBRARIES_EOF"
            cat libraries.json
            echo
            echo "ABICHECK_LIBRARIES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Dump baseline-set
        id: baseline
        uses: ./.publish-baseline-src/actions/baseline
        with:
          libraries: ${{ steps.libraries.outputs.libraries }}
          output-dir: '.abicheck-baseline'
          project-ref: ${{ inputs.release-tag != '' && inputs.release-tag || github.ref_name }}
          profile: ${{ matrix.profile_id }}
          build-info: ${{ inputs.build-info != '' && format('build-output/{0}/{1}', matrix.profile_id, inputs.build-info) || '' }}
          depth: ${{ inputs.depth }}
          validation: ${{ inputs.validation }}
          snapshot-compression: ${{ inputs.snapshot-compression }}
          python-version: ${{ inputs.python-version }}
          install-deps: ${{ inputs.install-deps }}

      # Packages according to $asset_name's OWN extension, not unconditional
      # zstd -- a caller customizing asset-name-template away from the
      # default (e.g. to ".tar.gz") must get an archive whose bytes actually
      # match that extension. Root action.yml's own baseline-set fallback
      # (action/run.sh's _try_baseline_set_fallback) picks its extractor by
      # this same asset name's suffix, so an unconditional zstd here would
      # silently produce a ".tar.gz"-named file containing zstd bytes,
      # which that consumer would then fail to gunzip (Codex review).
      - name: Package baseline-set
        id: package
        shell: bash
        env:
          ASSET_NAME_TEMPLATE: ${{ inputs.asset-name-template }}
          PROFILE_ID: ${{ matrix.profile_id }}
          BASELINE_PATH: ${{ steps.baseline.outputs.baseline-path }}
        run: |
          set -euo pipefail
          asset_name="${ASSET_NAME_TEMPLATE//\{profile\}/$PROFILE_ID}"
          case "$asset_name" in
            *.tar.zst)
              tar --zstd -cf "$asset_name" -C "$BASELINE_PATH" .
              ;;
            *.tar.gz | *.tgz)
              tar -czf "$asset_name" -C "$BASELINE_PATH" .
              ;;
            *.tar)
              tar -cf "$asset_name" -C "$BASELINE_PATH" .
              ;;
            *)
              echo "::error::asset-name-template resolved to '$asset_name', which has no recognized archive extension (.tar.zst/.tar.gz/.tgz/.tar) -- resolve-baseline/root-action.yml's baseline-set consumers pick their extractor from this exact suffix, so an unrecognized one would silently produce an asset nothing downstream can extract." >&2
              exit 1
              ;;
          esac
          echo "asset-name=$asset_name" >> "$GITHUB_OUTPUT"

      # `release-contract` is documented (ADR-047 §10, publish-baseline.md)
      # as an IMMUTABLE channel -- "compatible with what we actually shipped
      # as v1.0.0" only holds if that asset can never quietly change out
      # from under a consumer. A bare `--clobber` contradicts that: any
      # re-run of this workflow against an already-published release (a
      # manual workflow_dispatch retry, a re-tagged/re-triggered release
      # event) would silently replace the asset with whatever this run just
      # built, with no record that a "same-tag" baseline-set is no longer
      # the one earlier consumers resolved against.
      #
      # This step therefore uploads plainly (no --clobber) when no asset of
      # this name exists yet -- the ordinary first-publish and same-content-
      # retry-after-a-transient-failure cases. When an asset of this name
      # DOES already exist, it is fetched and compared against what this run
      # just built by NORMALIZED content digest (library + snapshot sha256
      # pairs), not raw archive bytes -- every dump stamps a fresh
      # created_at and the tar archive itself carries filesystem metadata,
      # so a byte-for-byte comparison would almost always report "different
      # content" even for a logically-identical retry. Identical normalized
      # content is a safe no-op (the exact "retry after infra flakiness"
      # case --clobber existed for, without ever actually replacing a
      # differing artifact), and differing content is a hard failure --
      # overwriting a published release-contract asset with a different
      # baseline needs a human decision (a new release tag, or explicit
      # `gh release delete-asset` + re-run), not a silent workflow-level
      # clobber.
      - name: Upload release asset (fails closed on an immutability violation)
        env:
          GH_TOKEN: ${{ secrets.github-token != '' && secrets.github-token || secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release-tag != '' && inputs.release-tag || github.ref_name }}
          ASSET_NAME: ${{ steps.package.outputs.asset-name }}
          REPO: ${{ github.repository }}
          NEW_CONTENT_DIGEST: ${{ steps.baseline.outputs.content-digest }}
          NEW_PROFILE: ${{ matrix.profile_id }}
        run: |
          set -euo pipefail

          # NOTE: `gh`'s own `--jq` flag takes exactly one expression argument
          # -- it is not `jq` itself, so `--jq --arg name ... 'EXPR'` fails
          # with "accepts at most 1 arg(s)" (Codex review, verified against
          # gh 2.96.0). Piping the raw --json output into a real `jq`
          # invocation (which does support --arg) avoids that entirely.
          assets_json=$(gh release view "$RELEASE_TAG" --repo "$REPO" --json assets 2>/dev/null) || assets_json=""
          existing_url=""
          if [[ -n "$assets_json" ]]; then
            # .apiUrl (the authenticated REST API asset endpoint,
            # api.github.com/repos/.../releases/assets/<id>), not .url (the
            # unauthenticated browser-download URL) -- the download below
            # goes through `gh api ... -H 'Accept: application/octet-stream'`,
            # which needs the API endpoint to authenticate; the browser URL
            # doesn't reliably work there, especially for a private caller
            # repository (Codex review, verified against gh 2.96.0's `gh api`
            # contract).
            existing_url=$(printf '%s' "$assets_json" \
              | jq -r --arg name "$ASSET_NAME" '.assets[] | select(.name == $name) | .apiUrl')
          fi

          if [[ -z "$existing_url" ]]; then
            gh release upload "$RELEASE_TAG" "$ASSET_NAME" --repo "$REPO"
            echo "::notice::published new release-contract asset $ASSET_NAME on $RELEASE_TAG."
            exit 0
          fi

          echo "::group::Asset $ASSET_NAME already exists on $RELEASE_TAG -- verifying content before deciding whether this is a safe retry"
          # Compare NORMALIZED content digests (library name + snapshot
          # sha256 pairs -- actions/baseline/build_manifest.py's own
          # compute_content_digest(), the same formula behind this job's
          # `steps.baseline.outputs.content-digest`), not raw archive bytes:
          # dumper.py stamps a fresh created_at into every manifest/snapshot
          # on every run, and the tar archive itself carries filesystem
          # metadata, so a byte-for-byte comparison would almost always
          # report "different content" even for a genuine, logically-
          # identical retry -- permanently defeating the safe-retry path and
          # directing every rerun at the destructive delete-asset recovery
          # instead (Codex review).
          mkdir -p .existing-asset/extracted
          # Download to a file named exactly like the real asset (same
          # suffix) and let TarExtractor.extract() dispatch on that name --
          # hardcoding a `.tar.zst` download name here, independent of
          # $ASSET_NAME's actual extension, made a `.tar.gz`/`.tgz`/`.tar`
          # asset-name-template fail this comparison outright (it would
          # always be re-extracted as zstd), so a legitimate identical retry
          # under a non-default template could never reach the safe no-op
          # path and always hit the immutability error instead (Codex
          # review).
          existing_download=".existing-asset/$ASSET_NAME"
          gh api "$existing_url" -H 'Accept: application/octet-stream' > "$existing_download"
          python3 -c '
          import sys
          from pathlib import Path
          from abicheck.package import TarExtractor

          TarExtractor().extract(Path(sys.argv[1]), Path(sys.argv[2]))
          ' "$existing_download" .existing-asset/extracted

          existing_content_digest=$(python3 -c '
          import importlib.util
          import json
          import sys
          from pathlib import Path

          spec = importlib.util.spec_from_file_location(
              "baseline_build_manifest",
              Path(".publish-baseline-src/actions/baseline/build_manifest.py"),
          )
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          manifest_path = Path(sys.argv[1]) / "manifest.json"
          if not manifest_path.is_file():
              print(
                  "::error::existing release asset has no manifest.json at "
                  "its root after extraction -- cannot verify its content, "
                  "refusing to treat this as a safe retry.",
                  file=sys.stderr,
              )
              sys.exit(1)
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          print(module.compute_content_digest(manifest))
          ' .existing-asset/extracted)

          # compute_content_digest() deliberately excludes `profile` (it
          # hashes library/snapshot/binary content, not build-profile
          # identity -- see its own docstring), so it alone cannot tell two
          # DIFFERENT profiles' baseline-sets apart when they happen to
          # produce identical library/snapshot/binary digests. That
          # collision is reachable in practice: a caller whose
          # asset-name-template omits `{profile}` for a multi-profile
          # matrix has every profile's job target the SAME asset name, and
          # this step would then treat a later profile's upload as a "safe
          # retry" of an earlier, DIFFERENT profile's already-published
          # asset purely because their content happened to match --
          # silently discarding that profile's own baseline forever (Codex
          # review). Checked as an independent, profile-identity gate
          # BEFORE the content-digest comparison: a profile mismatch is
          # never a safe retry regardless of what the content digests say.
          existing_profile=$(python3 -c '
          import json
          import sys
          from pathlib import Path

          manifest = json.loads(
              (Path(sys.argv[1]) / "manifest.json").read_text(encoding="utf-8")
          )
          print(manifest.get("profile") or "")
          ' .existing-asset/extracted)

          echo "new profile:      $NEW_PROFILE"
          echo "existing profile: $existing_profile"

          if [[ -n "$existing_profile" && "$existing_profile" != "$NEW_PROFILE" ]]; then
            echo "::error::$ASSET_NAME already exists on release $RELEASE_TAG but was published for a DIFFERENT profile ('$existing_profile', this run is '$NEW_PROFILE') -- asset-name-template resolved to the same name for two distinct profiles, so this is never a safe retry regardless of content. Include '{profile}' in asset-name-template so each profile in a multi-profile matrix gets its own asset name." >&2
            exit 1
          fi

          echo "new:      $NEW_CONTENT_DIGEST"
          echo "existing: $existing_content_digest"
          echo "::endgroup::"

          if [[ "$NEW_CONTENT_DIGEST" == "$existing_content_digest" ]]; then
            echo "::notice::$ASSET_NAME already published on $RELEASE_TAG with identical (normalized) content -- treating this as a safe re-run, not re-uploading."
            exit 0
          fi

          echo "::error::$ASSET_NAME already exists on release $RELEASE_TAG with DIFFERENT content (normalized content-digest $existing_content_digest, this run built $NEW_CONTENT_DIGEST). release-contract assets are documented as immutable once published -- refusing to silently overwrite it. If this release-contract baseline-set genuinely needs to change, delete the existing asset explicitly first ('gh release delete-asset $RELEASE_TAG $ASSET_NAME --repo $REPO --yes') and re-run, or publish under a new release tag." >&2
          exit 1
