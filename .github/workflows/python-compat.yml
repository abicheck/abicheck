name: Python compatibility

# Tiered Python testing. `ci.yml`'s `unit-tests` job runs the full suite
# with coverage (80% floor) on canonical 3.13. This workflow adds, on every
# PR and blocking:
#   * full-suite: the same full fast suite on the oldest supported Python
#     (3.11, the `requires-python` floor) and on 3.15;
#   * free-threading: the full fast suite on 3.15t with the GIL disabled;
#   * smoke: sdist+wheel build, *wheel* install into a clean venv, import of
#     every module, CLI and a smoke subset on 3.11/3.12/3.14/3.15.
# A smoke-only, non-blocking 3.15 lane is how a str-Enum serialization
# break (~1,265 failing tests on 3.15) went unnoticed; don't regress to it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly, so a new CPython prerelease is picked up even on a quiet week.
    - cron: '17 5 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: smoke (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 3.15 (and 3.15t below) block merges: a non-blocking leg went red
        # on a str-mixin Enum serialization break and nobody noticed.
        python-version: ['3.11', '3.12', '3.14', '3.15']
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: 'pip'
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - name: Install the built wheel into a clean venv
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --upgrade pip
          wheel="$(ls dist/*.whl)"
          "$RUNNER_TEMP/venv/bin/python" -m pip install "${wheel}[dev]"
      - name: Import every abicheck module from the installed wheel
        # Run outside the checkout so the source tree cannot shadow the wheel.
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/venv/bin/python" - <<'EOF'
          import importlib, pkgutil, sys
          import abicheck
          assert "site-packages" in abicheck.__file__, abicheck.__file__
          failed = []
          for mod in pkgutil.walk_packages(abicheck.__path__, "abicheck."):
              try:
                  importlib.import_module(mod.name)
              except Exception as exc:  # noqa: BLE001 - report every failure
                  failed.append(f"{mod.name}: {exc!r}")
          print(f"Python {sys.version.split()[0]}: imported abicheck from {abicheck.__file__}")
          if failed:
              print("\n".join(failed))
              sys.exit(1)
          EOF
      - name: CLI smoke
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/venv/bin/abicheck" --version
          "$RUNNER_TEMP/venv/bin/abicheck" compare --help > /dev/null
          "$RUNNER_TEMP/venv/bin/abicheck" dump --help > /dev/null
          "$RUNNER_TEMP/venv/bin/python" -m abicheck --version
      - name: Unit-test smoke subset
        # A small, broad slice: root CLI surface, the core checker, snapshot
        # serialization, packaged policies, and real compiled example pairs
        # (gcc only, no castxml). The full suite is ci.yml's `unit-tests`.
        #
        # The tests must exercise the installed wheel, not the checkout:
        # `-P` keeps the cwd off sys.path, `-o pythonpath=` drops the
        # repo-root entry pyproject's pytest config adds, and importlib mode
        # stops rootdir insertion. The origin test asserts that from inside
        # the pytest process itself.
        run: |
          cat > "$RUNNER_TEMP/test_wheel_origin.py" <<'EOF'
          import abicheck

          def test_abicheck_is_imported_from_the_installed_wheel():
              assert "site-packages" in abicheck.__file__, abicheck.__file__
          EOF
          "$RUNNER_TEMP/venv/bin/python" -P -m pytest -q --tb=short -r fE -n auto \
            --import-mode=importlib -o pythonpath= \
            -m "not integration and not libabigail and not abicc and not slow" \
            "$RUNNER_TEMP/test_wheel_origin.py" \
            tests/test_cli_root_surface.py \
            tests/test_checker.py \
            tests/test_serialization.py \
            tests/test_str_enum_serialized_token.py \
            tests/test_packaged_policy_examples.py \
            tests/test_castxml_free_examples.py

  free-threading:
    # The free-threaded (PEP 703, no-GIL) interpreter. abicheck's release
    # fan-out, include-probe pool and AST acquisition table are shared-memory
    # thread code whose level-1 concurrency is sized by
    # `process_resources.python_parallelism` -- 2 members under the GIL, the
    # CPU count here -- so this is the lane where a real data race, or a
    # dependency that silently re-enables the GIL, would show up.
    #
    # 3.15t is the base free-threaded interpreter this project tests; 3.14t is
    # deliberately not covered. Taken from conda-forge (its `python_rc` label
    # while 3.15 is a release candidate) via the same pinned, sha256-verified
    # micromamba `scripts/setup_dev_env.sh` uses. Blocking, like the 3.15
    # smoke leg above.
    name: free-threading (py3.15t, shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      MICROMAMBA_VERSION: '2.9.0-0'
      MICROMAMBA_SHA256: '366cd9cd8be14df1ab8ed50352a82111082a36686b2d389fdb79a92c3fafb3e3'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
      - name: Install free-threaded CPython 3.15 from conda-forge
        run: |
          curl -Ls -o "$RUNNER_TEMP/micromamba" \
            "https://github.com/mamba-org/micromamba-releases/releases/download/${MICROMAMBA_VERSION}/micromamba-linux-64"
          echo "${MICROMAMBA_SHA256}  $RUNNER_TEMP/micromamba" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/micromamba"
          export MAMBA_ROOT_PREFIX="$RUNNER_TEMP/mamba"
          "$RUNNER_TEMP/micromamba" create -y -q -p "$RUNNER_TEMP/py315t" \
            -c conda-forge/label/python_rc -c conda-forge \
            "python=3.15=*_cp315t" pip
          "$RUNNER_TEMP/py315t/bin/python" -VV
          echo "PY=$RUNNER_TEMP/py315t/bin/python" >> "$GITHUB_ENV"
          # Action-lane tests shell out to `python3` on PATH; it must be the
          # interpreter abicheck is installed into, not the runner's system one.
          echo "$RUNNER_TEMP/py315t/bin" >> "$GITHUB_PATH"
      - name: Install abicheck
        run: |
          "$PY" -m pip install -e ".[dev]"
      - name: Every module imports with the GIL still disabled
        # No PYTHON_GIL here on purpose: an extension module that does not
        # declare free-threading support re-enables the GIL on import, and
        # that is exactly what this step exists to notice.
        working-directory: ${{ runner.temp }}
        run: |
          "$PY" - <<'EOF'
          import importlib, pkgutil, sys
          import abicheck
          assert not sys._is_gil_enabled(), "interpreter is not free-threaded"
          failed = []
          for mod in pkgutil.walk_packages(abicheck.__path__, "abicheck."):
              try:
                  importlib.import_module(mod.name)
              except Exception as exc:  # noqa: BLE001 - report every failure
                  failed.append(f"{mod.name}: {exc!r}")
          if failed:
              print("\n".join(failed))
              sys.exit(1)
          if sys._is_gil_enabled():
              sys.exit("an imported extension module re-enabled the GIL")
          print("all abicheck modules imported; GIL still disabled")
          EOF
      - name: Keep this job's temporary files off the shared /tmp
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Full fast suite without the GIL (one shard)
        env:
          PYTHON_GIL: '0'
        run: |
          "$PY" -m pytest tests/ -q --tb=short -r fE -n auto --dist worksteal \
            -m "not integration and not libabigail and not abicc and not slow and not repo_scan" \
            --shard=${{ matrix.shard }}/3

  full-suite:
    # The full fast suite (same selection as ci.yml's canonical 3.13
    # `unit-tests`, minus coverage) on the oldest supported Python and on
    # 3.15, on every PR. A smoke subset on these interpreters let a 3.15
    # json/str-Enum serialization break (~1,265 failing tests) go unnoticed.
    name: full-suite (py${{ matrix.python-version }}, shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.15']
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: 'pip'
      - name: Keep this job's temporary files off the shared /tmp
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Full fast suite (one shard)
        run: |
          pytest tests/ -q --tb=short -r fE -n auto --dist worksteal \
            -m "not integration and not libabigail and not abicc and not slow and not repo_scan" \
            --shard=${{ matrix.shard }}/3
