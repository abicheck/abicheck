name: Integration

# Real-toolchain lanes: header/DWARF/PE/Mach-O integration on three OSes, the
# native PE/Mach-O compare workflows, MSVC+PDB, and libabigail/ABICC parity.
#
# One runner per OS, every lane a scripts/verify.py step (AGENTS.md "M0-3"),
# each with --require-complete: this job installs every step's tools itself, so
# a precondition skip means an install broke -- without the flag verify.py's
# `full` profile reports that skip as exit 0, a green step that ran nothing.
# These used to be nine runners in ci.yml -- a `heavy-parity-gate` job, three
# `integration-tests` legs, `cross-platform-e2e` x2, `windows-msvc`,
# `libabigail-parity`, `abicc-parity` -- each paying its own checkout, Python,
# pip install and toolchain setup for one to three minutes of tests, and all
# but the gate waiting on the gate's own runner first (12-30 minutes of queue
# measured on 2026-10-02, before any of them could even be queued). The legs
# now share their OS's setup, and the path filter the gate implemented with a
# runner is a trigger-level `paths:` filter, which costs none. The gate
# existed so a skipped job still reported a stable required check; no check
# has been merge-blocking since 2026-09, so that reason is gone.
#
# `push` to main deliberately carries no `paths:` filter: the gate ran every
# heavy job on every non-PR event, and a runner-image or toolchain update can
# change these lanes' outcome on a commit that touched none of their inputs.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Exactly the gate's former filter set. The last four are the lanes' own
    # *infrastructure*, not just their inputs: every leg pip-installs the
    # package, sets CastXML up through the composite action, and runs
    # scripts/verify.py steps, so a PR touching only those (e.g. re-pinning
    # CastXML in action/install-castxml.sh) must still run them.
    # tests/test_workflow_path_filter_closure.py enforces that closure.
    paths:
      - 'abicheck/**'
      - 'tests/**'
      # abiforge, the edit-corpus generator the PR tier runs.
      - 'abiforge/**'
      - 'examples/**'
      - 'catalog/**'
      - '.github/workflows/**'
      - 'pyproject.toml'
      - 'action/**'
      - '.github/actions/**'
      - 'scripts/verify.py'
      # The Linux leg's demo-libz step (formerly ci.yml's `e2e` job).
      - 'scripts/demo_libz.py'
  workflow_dispatch:

concurrency:
  # Same grouping as ci.yml (see its comment): PRs by number, main pushes by
  # ref, manual runs isolated by run_id.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration:
    name: integration (${{ matrix.os }}${{ matrix.shard && format(', shard {0}/2', matrix.shard) || '' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write  # Codecov OIDC upload (Linux)
    strategy:
      fail-fast: false
      # The Linux leg runs as two shards. Its integration step alone measured
      # 35-38 min of this 40-min budget on main (the job ran 39:29 at #1918,
      # 38:40 at #1920) before the catalog backend-parity harness added ~95 s
      # and the leg started being cancelled mid-tail (42012488845, at #1925).
      # `--shard=K/2` splits the integration tests by whole file, balanced on
      # their own measured seconds (tests/shard_weights_integration.json; the
      # unit lane's weights know nothing of integration cost), so each shard
      # takes about half and the budget has room again. The shards partition
      # the selection: nothing is dropped and nothing runs twice
      # (tests/test_pytest_shards.py). The tool-lane tail (libabigail, ABICC,
      # libz demo) runs on shard 2 only, and both shards upload coverage under
      # the one Codecov `integration` flag, which merges them.
      matrix:
        include:
          - os: ubuntu-24.04
            shard: 1
          - os: ubuntu-24.04
            shard: 2
          - os: macos-latest
          - os: windows-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          persist-credentials: false
      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        # Compilers for the integration lane plus abi-compliance-checker for
        # the ABICC parity step. lld/llvm (lld-link, ld64.lld, llvm-nm) let
        # test_pe_macho_header_binding_integration.py cross-build PE (MSVC ABI)
        # and Mach-O from the same sources as its ELF oracle. Routed through the shared action, which owns
        # the "tolerate a flaky pre-baked third-party apt repo" rule.
        uses: ./.github/actions/install-system-deps
        with:
          packages: gcc g++ cmake clang lld llvm abi-compliance-checker zlib1g-dev curl ca-certificates
      - name: Install abidiff (Linux)
        if: runner.os == 'Linux'
        # Spelled `abigail-tools` on some releases, `libabigail-tools` on
        # others -- its own either/or step because the package list above
        # cannot express an alternative. If neither lands, the
        # libabigail-parity step's ABICHECK_MIN_EXECUTED floor fails loudly.
        run: sudo apt-get install -y abigail-tools || sudo apt-get install -y libabigail-tools
      - name: Set up pinned CastXML (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-castxml
      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake
      - name: Set up pinned CastXML (macOS)
        # Homebrew's castxml is unpinnable here: its stable formula moved to
        # 0.8.0, which castxml/policy.py rejects (MAX_CASTXML is an exclusive
        # 0.8.0 bound), and Homebrew keeps no versioned castxml formula. Install
        # the exact conda-forge osx-arm64 build that pixi.lock already commits
        # to (castxml 0.7.0, build hfc9ce51_0) instead, via a micromamba
        # bootstrap whose sha256 is verified (same pin as the osx-arm64 asset
        # of the micromamba release used elsewhere in this repo).
        if: runner.os == 'macOS'
        shell: bash
        env:
          MICROMAMBA_VERSION: '2.9.0-0'
          MICROMAMBA_OSX_ARM64_SHA256: 'ec2a072f028e1a7cf20f3e2e74d5a8127cf5a5f27636375b5359811565f4e5be'
        run: |
          set -euo pipefail
          [ "$(uname -m)" = "arm64" ] || { echo "::error::expected an arm64 macOS runner"; exit 1; }
          work="$(mktemp -d)"
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
            --output "$work/micromamba" \
            "https://github.com/mamba-org/micromamba-releases/releases/download/${MICROMAMBA_VERSION}/micromamba-osx-arm64"
          echo "${MICROMAMBA_OSX_ARM64_SHA256}  $work/micromamba" | shasum -a 256 -c -
          chmod +x "$work/micromamba"
          env_prefix="$RUNNER_TEMP/castxml-env"
          MAMBA_ROOT_PREFIX="$RUNNER_TEMP/mamba-root" "$work/micromamba" create -y \
            -p "$env_prefix" -c conda-forge "castxml=0.7.0=hfc9ce51_0"
          echo "$env_prefix/bin" >> "$GITHUB_PATH"
          export PATH="$env_prefix/bin:$PATH"
          # castxml prints its version banner on stderr, so capture both streams
          # (a stdout-only pipe into grep sees nothing and fails).
          version_output="$(castxml --version 2>&1)"
          case "$version_output" in
            "castxml version 0.7.0"*) ;;
            *) echo "::error::unexpected castxml version"; echo "$version_output"; exit 1 ;;
          esac
      - name: Install system deps (Windows)
        if: runner.os == 'Windows'
        # The PyPI `castxml` wheel is a stale 0.4.5 legacy build that the
        # castxml_policy version gate correctly rejects (see
        # action/install-castxml.sh: "Use Homebrew/conda-forge on this
        # platform"). The runner's preinstalled Miniconda pulls the maintained
        # conda-forge build instead, and conda verifies its own packages.
        #
        # No `choco install mingw`: the dedicated native-compare job used to
        # run one (~45 s) but it only edits the *machine* PATH, which later
        # steps never see -- the gcc those tests used was the runner image's
        # own MinGW all along. The native-compare step's floor of 5 fails the
        # leg if that ever stops being true.
        #
        # No `choco install cmake` either: the image ships CMake
        # (C:\Program Files\CMake\bin is on PATH), so it only re-installed it.
        #
        # Pinned below 0.8: conda-forge's castxml moved to 0.8.0, which the
        # castxml_policy gate rejects (supported >=0.6.11,<0.8.0), so an
        # unpinned install fails every castxml test on this leg. The spec is
        # `=0.7` (any 0.7.x), not `>=0.7,<0.8`: conda.bat runs through cmd,
        # which reads `<`/`>` as redirections even inside the quotes.
        run: |
          & "$env:CONDA\condabin\conda.bat" install --yes -c conda-forge "castxml=0.7"
          Add-Content -Path $env:GITHUB_PATH -Value "$env:CONDA\Library\bin"
          Add-Content -Path $env:GITHUB_PATH -Value "$env:CONDA\Scripts"
      - name: Set up MSVC developer environment (cl.exe on PATH)
        # Example cases that build through CMake run CMake's compiler sanity
        # check against cl.exe, which needs vcvarsall's environment; the msvc
        # step below needs the same.
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.14'
          cache: 'pip'
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Build the native GCC header plugin (Linux)
        if: runner.os == 'Linux'
        # The edit corpus dumps its headers lane with castxml, clang and the
        # native gcc plugin (ADR-092; Config.header_backend). The plugin must
        # match the system gcc that `cc`/`c++` run; without it the gcc-backend
        # cells read unavailable and cover nothing.
        run: |
          set -euo pipefail
          major=$(gcc -dumpversion | cut -d. -f1)
          sudo apt-get install -y --no-install-recommends "gcc-${major}-plugin-dev"
          python -m abicheck.extract.headers.gcc.build --compiler g++

      # Every step below runs whatever an earlier *test* step concluded
      # (`success() || failure()` is "not cancelled"): they are independent
      # lanes that used to be independent jobs, and one red lane must not hide
      # the next one's result.
      #
      # xdist on every OS. Windows already ran this suite under `-n auto`;
      # Linux ran it serially *with coverage* (12.7-15.3 min, the longest
      # step in this area). pytest-cov combines worker data itself, and the
      # Codecov `integration` flag (codecov.yml's own status) is the report's
      # consumer, so coverage stays -- only its serial cost goes.
      - name: Integration tests (Linux, with coverage)
        if: (success() || failure()) && runner.os == 'Linux'
        env:
          # Linux's ELF integration count is known (~900), so it gets a real
          # floor; the step's own default is the host-agnostic '1'. Each shard
          # runs about half, still far above it.
          ABICHECK_MIN_EXECUTED: '20'
          # Recorded per test so the shard weights can be refreshed from the
          # artifact below (tests/pytest_shards.py's docstring).
          ABICHECK_DURATIONS_JSON: integration-durations-shard${{ matrix.shard }}.json
          # The edit corpus's PR tier writes one coverage record per cell
          # (abiforge/coverage.py); the next step reports them.
          ABICHECK_EDIT_CORPUS_COVERAGE_DIR: edit-corpus-coverage
          PYTEST_ADDOPTS: -n auto --dist worksteal --shard=${{ matrix.shard }}/2 --shard-weights=tests/shard_weights_integration.json --cov=abicheck --cov-report=xml:coverage-integration.xml
        run: python scripts/verify.py --profile full --only integration --require-complete
      - name: Edit corpus coverage (Linux)
        # ChangeKinds this shard's corpus cells verified and the language space
        # they ran, in the step summary. Reported only: the `pr` verified floor
        # is checked on both shards merged (the edit-corpus-coverage job), since
        # a kind one shard's cells expect may be verified only in the other.
        if: (success() || failure()) && runner.os == 'Linux'
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          # This shard's integration step finished (passed or failed): the
          # floor job judges a run only when both shards left this marker, so a
          # cancelled shard is never read as missing records. Written first, so
          # a failing report below fails this step without hiding the shard.
          had_records=0
          [ -d edit-corpus-coverage ] && had_records=1
          mkdir -p edit-corpus-coverage
          : > "edit-corpus-coverage/shard-${SHARD}.done"
          if [ "$had_records" = 1 ]; then
            python -m abiforge.coverage report edit-corpus-coverage \
              --title "Edit corpus PR-tier coverage (shard ${SHARD}/2)" \
              --summary "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload edit corpus coverage records
        if: (success() || failure()) && runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: edit-corpus-coverage-shard${{ matrix.shard }}
          path: edit-corpus-coverage
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload integration-durations artifact
        if: ${{ always() && runner.os == 'Linux' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: integration-durations-shard${{ matrix.shard }}
          path: integration-durations-shard${{ matrix.shard }}.json
          if-no-files-found: ignore
      - name: Integration tests (macOS/Windows)
        if: (success() || failure()) && runner.os != 'Linux'
        env:
          # The Mach-O/PE subset counts are not pinned, so the step default
          # "> 0" floor catches a missing toolchain without platform guesswork.
          # `-v` names each test as it finishes: verify.py streams it, so a
          # stalled or cancelled leg still shows which tests were running.
          #
          # Windows: 8 workers on the 4-vCPU runner. Its tests mostly wait on
          # castxml/compiler subprocesses (Windows process start is the cost),
          # not on the CPU.
          PYTEST_ADDOPTS: -n ${{ runner.os == 'Windows' && '8' || 'auto' }} --dist worksteal -v
        run: python scripts/verify.py --profile full --only integration --require-complete
      - name: Native PE/Mach-O compare workflows
        # Formerly the `cross-platform-e2e` job. Apple clang -> .dylib,
        # MinGW gcc -> .dll, then `abicheck compare` on them.
        if: (success() || failure()) && runner.os != 'Linux'
        run: python scripts/verify.py --profile full --only native-compare --require-complete
      - name: MSVC + PDB end-to-end
        # Formerly the `windows-msvc` job, and still informational: the
        # pure-Python PDB parser is maturing on real MSVC output, so a failure
        # here is reported without failing the leg.
        if: (success() || failure()) && runner.os == 'Windows'
        continue-on-error: true
        run: python scripts/verify.py --profile full --only msvc --require-complete
      - name: libabigail parity
        # Marker-scoped, and the step sets its own ABICHECK_MIN_EXECUTED.
        # This tail (libabigail, ABICC, libz demo) runs on one Linux shard.
        if: (success() || failure()) && runner.os == 'Linux' && matrix.shard == 2
        run: python scripts/verify.py --profile full --only libabigail-parity --require-complete
      - name: ABICC parity
        # Native `compare` verdicts against the real abi-compliance-checker;
        # the step sets its own ABICHECK_MIN_EXECUTED.
        if: (success() || failure()) && runner.os == 'Linux' && matrix.shard == 2
        run: python scripts/verify.py --profile full --only abicc-parity --require-complete
      - name: End-to-end demo (libz)
        # Formerly ci.yml's `e2e` job: the distro libz dumped with its real
        # zlib.h through CastXML, then mutated and classified. The demo takes
        # ~3 s; as its own job it paid a full runner's setup on every PR.
        if: (success() || failure()) && runner.os == 'Linux' && matrix.shard == 2
        run: python scripts/verify.py --profile full --only demo-libz --require-complete
      - name: Upload integration coverage to Codecov
        if: ${{ always() && runner.os == 'Linux' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7
        with:
          use_oidc: true
          files: coverage-integration.xml
          flags: integration
          fail_ci_if_error: false

  edit-corpus-coverage:
    # The PR tier's verified ChangeKind floor (abiforge/coverage_ledger.json),
    # held over both Linux shards' corpus records merged. Judged only when both
    # shards left their `shard-N.done` marker (their integration step finished),
    # so a cancelled run is never judged; no records at all fail the job.
    name: edit corpus coverage floor
    needs: integration
    if: always() && (needs.integration.result == 'success' || needs.integration.result == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.14'
          cache: 'pip'
      - name: Install package
        run: pip install -e .
      - name: Download both shards' records
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: edit-corpus-coverage-shard*
          path: edit-corpus-coverage
          merge-multiple: false
      - name: Check the PR-tier floor
        run: |
          set -euo pipefail
          # needs.integration.result reads `failure` when one matrix leg failed
          # and another was cancelled; judge only a run whose two Linux shards
          # both finished their integration step.
          # (No artifact at all leaves no directory: find fails, count is 0.)
          # $(( )) strips the leading blanks BSD `wc -l` pads its count with.
          done_shards=$(( $({ find edit-corpus-coverage -name 'shard-*.done' 2>/dev/null || true; } | wc -l) ))
          if [ "$done_shards" -lt 2 ]; then
            echo "::notice::only ${done_shards} of 2 Linux shards finished (cancelled run); the PR-tier floor is not judged"
            exit 0
          fi
          # A shard whose test files hold no corpus cells uploads no records; the
          # pair of shards must still have recorded the PR tier somewhere.
          if [ -z "$(find edit-corpus-coverage -name '*.json' -print -quit 2>/dev/null)" ]; then
            echo "::error::neither Linux shard uploaded edit corpus coverage records"
            exit 1
          fi
          python -m abiforge.coverage report edit-corpus-coverage \
            --title "Edit corpus PR-tier coverage (both shards)" \
            --summary "$GITHUB_STEP_SUMMARY" --json edit-corpus-coverage-report.json \
            --check-floor pr
      - name: Upload the PR-tier coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: edit-corpus-coverage-report
          path: edit-corpus-coverage-report.json
          if-no-files-found: ignore
          retention-days: 30
