name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A PR groups by PR number, so a new push supersedes the stale run for
  # the same PR. A `push` to `main` must group by *ref*, not `run_id`:
  # every push run has a distinct `run_id`, so the previous spelling gave
  # each one its own group and `cancel-in-progress` never cancelled a
  # superseded main run at all — the newer commit's run simply queued
  # behind the obsolete one. `schedule`/`workflow_dispatch` deliberately
  # keep keying off `run_id` (unique per run) so two manual or scheduled
  # runs stay isolated from each other and from PR runs, matching
  # `mutation.yml`'s own grouping. This workflow is read-only validation;
  # do not copy this to a workflow with persistent side effects (release
  # publication, baseline rotation), where cancelling a superseded run can
  # leave partial state.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ai-readiness:
    # Also runs the `repo_scan` test lane (formerly its own `repo-scan-tests`
    # job). Both need the identical setup -- Python 3.13, `pip install -e
    # ".[dev]"`, a checkout -- and neither is near the critical path (the
    # unit-test shards and integration-tests run 10-16 min; this job ~7), so
    # a second runner bought no feedback time and cost one more slot in a
    # queue that measured 12-77 min per job (2026-10-02).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          # Full history, unlike every other job here. `adr-status-sync`'s
          # freshness tripwire answers "have commits touched this module
          # since the ADR's `**Verified:**` sha", which a depth-1 checkout
          # cannot resolve at all — the sha isn't present, so the check
          # would stand down on every CI run and be live only locally,
          # i.e. disabled in exactly the environment it exists to protect
          # (Codex review on PR #667).
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          # Pinned to the canonical Python (repo_facts.json's
          # `canonical_python`, matching the coverage-floor lane in
          # unit-tests below) — NOT '3.14' like the other jobs. This job's
          # repo-facts step recomputes `fast_test_cases_collected` via
          # `pytest --collect-only`, which has been observed to drift by a
          # small, unexplained amount even between environments that match on
          # Python version and every dependency version — this pin removes
          # one plausible variable. `gen_repo_facts.py --check` treats that
          # one field's drift as non-fatal (WARN, not ERROR) precisely
          # because it isn't reliably reproducible; see that script's
          # docstring for what was actually tried.
          python-version: '3.13'
          cache: 'pip'
      # One install, not two. This job used to `pip install "mypy==1.19.1"`
      # standalone before the ai-readiness step and only then install `[dev]`
      # for the later gates — two full pip resolutions of an overlapping
      # dependency set. `[dev]` already pins the *same* exact mypy
      # (pyproject.toml's "mypy==1.19.1", for the same reproducible-drift-gate
      # reason the standalone pin cited), so installing it up front satisfies
      # both steps. `[dev]` (not the bare package) is also what repo-facts'
      # fast_test_cases_collected needs, since it runs pytest --collect-only
      # (see scripts/gen_repo_facts.py).
      - name: Keep this job's temporary files off the shared /tmp
        # Needed by the repo-scan tests below (same reason as `unit-tests`'
        # identical step: something prunes `/tmp` on these runners mid-job).
        shell: bash
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install package (mypy drift gate + FP-rate / tier-accuracy / doc-sync / repo-facts gates + repo-scan tests)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # ADR-058's three publication trees (.agents/skills/, .claude/skills/,
      # .gemini/skills/) are no longer committed (2026-08-21 amendment) --
      # they're gitignored build output. `agent-skills-generated` below
      # validates skills-src/'s own consistency without needing them on
      # disk, but the skill-eval-pack/skill-eval-freshness/harbor-tasks
      # steps further down still hash the *generated* tree's real content
      # (deliberately, not skills-src/ -- see gen_skill_eval_pack.py's
      # `_skill_tree_digest` docstring), so it must actually exist here.
      - name: Materialize generated agent-skill trees (ADR-058, not committed)
        run: python scripts/gen_agent_skills.py
      # A `pull_request` run scopes the debt-no-growth check to the PR's own
      # base sha. A `push`-to-`main`/`workflow_dispatch` run has no PR base
      # at all -- `github.event.pull_request.base.sha` is simply empty there
      # -- so `push` instead uses its own `before` sha (the tip of `main`
      # immediately prior) and `workflow_dispatch` uses the checked-out
      # revision's own parent commit, scoping the check to growth *this run*
      # introduced rather than every file's original ADR-061 adoption
      # baseline. Falling through to that unscoped baseline on every
      # post-merge `main` run would make it permanently red on any
      # pre-existing drift already on `main` (individually-compliant PRs
      # each growing a debt-tracked file a little further past its original
      # baseline), even when the merged/dispatched change itself introduced
      # none (Codex review, fresh evidence, both for `push` and, in a
      # follow-up finding, for `workflow_dispatch`: reproduced directly
      # against this tree both times). `push`'s `before` is skipped when
      # it's the all-zero sentinel git uses for a branch's first push (no
      # prior commit to compare against); `workflow_dispatch`'s `HEAD^` is
      # skipped when it doesn't resolve (the repository's very first commit)
      # -- `check_repository()` would otherwise report a hard
      # `base-revision` error for an unresolvable sha rather than silently
      # falling back, for either case.
      - name: Resolve architecture check base revision
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ] \
            && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            base="${{ github.event.before }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            base="$(git rev-parse --verify -q HEAD^ || true)"
          else
            base=""
          fi
          echo "ARCHITECTURE_BASE=${base}" >> "$GITHUB_ENV"
      # Every structural gate in one verify.py invocation. They used to be
      # six separate workflow steps, and since a workflow step stops the job
      # on failure, a red `ai-readiness` hid whether the five gates after it
      # passed. verify.py runs every selected step even when one fails and
      # prints a `=== <step>: passed|failed (Ns) ===` line per gate, so the log
      # still attributes time and failure per gate. The one gate that needs
      # the base revision resolved above (`architecture`) reads it from the
      # environment, so ordering is unaffected. Routed through
      # scripts/verify.py, the same implementation `pixi run check` and
      # `python scripts/verify.py --profile pr` run locally (CLAUDE.md
      # "M0-3"), so this job can't silently diverge from the local PR-profile
      # definition of done. Skill-eval pack/freshness are G37 Phase 0
      # (deterministic re-derivations, no model -- G37 D2); harbor-tasks is
      # the ADR-058 Harbor battery's freshness half.
      - name: Structural gates (ai-readiness, architecture, usage ratchet, FP-rate, tier-accuracy, docs contract, agent skills, repo facts, skill-eval, harbor tasks)
        run: python scripts/verify.py --profile pr --only ai-readiness,architecture,usage-ratchet,fp-rate,tier-accuracy,usecase-docs-sync,docs-contract,learning-ladder,agent-skills-generated,repo-facts,action-cli-surface,skill-eval-pack,skill-eval-freshness,harbor-tasks
      # Tests marked `repo_scan`: structural gates that read or parse the
      # whole repository tree. Their result depends on the committed tree
      # only -- not on the OS and not on coverage -- so they run exactly
      # once, here, uninstrumented, instead of once per unit-test leg under
      # coverage tracing. Run even when a structural gate above failed: they
      # are independent, and a hidden second failure costs a CI round trip.
      - name: Run repository-scan tests
        if: success() || failure()
        run: python scripts/verify.py --profile pr --only repo-scan-tests
      # The freshness check above only re-derives the tree structurally
      # (gen_harbor_tasks.py --check) -- it never asks whether a generated
      # task.toml/environment/tests/solution layout is actually valid per
      # Harbor's own schema. `harbor` needs Python >=3.12 (this job's own
      # pin) and is not a repository dependency (it exists to validate
      # output *for* Harbor, not to be one), so it's installed here as its
      # own dedicated step rather than folded into `[dev]` -- the check
      # itself (`harbor-schema`) is still routed through verify.py's step
      # catalog like every other gate here (CLAUDE.md "M0-3"), just run
      # under `--profile full` since it's FULL-only there.
      - name: Harbor schema validation (real harbor package, skills-src/evaluation/agents/skills/harbor/CLAUDE.md)
        if: success() || failure()
        run: |
          pip install harbor
          python scripts/verify.py --profile full --only harbor-schema
      - name: Per-tier accuracy matrix (step-summary artifact)
        if: always()
        run: python scripts/check_tier_accuracy.py --markdown >> "$GITHUB_STEP_SUMMARY"

  fair-metadata:
    name: FAIR metadata and packaging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.14'
          cache: 'pip'
      - name: Install validation and build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" build twine
      - name: Verify FAIR metadata and published schema copies
        run: python scripts/verify.py --profile pr --only schema-sync,fair-metadata
      - name: Build, twine check, and validate distribution metadata
        run: python scripts/verify.py --profile pr --only distribution-build

  lint-and-types:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.14'
          cache: 'pip'
      # One resolution of `[dev,docs]` -- the docs extra is pyproject.toml's
      # single list of mkdocs requirements (it was hand-copied here, and the
      # copies in docs-pr.yml/pages.yml had already drifted: they lacked
      # pymdown-extensions). mypy is pinned in [dev]; no separate install.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,docs]"
      # lint / typecheck / docs-build routed through scripts/verify.py — see
      # the ai-readiness job's comment above (CLAUDE.md "M0-3"). This job is
      # the one PR-time owner of the docs build: docs-pr.yml, which ran the
      # same `mkdocs build --strict` again on docs PRs, was folded in here
      # (`examples-docs` carries its generated-pages check; its
      # `publish_schemas.py --check` already runs as `fair-metadata`'s
      # `schema-sync`).
      - name: Lint, format check, type check, docs build (strict), generated example docs
        run: python scripts/verify.py --profile pr --only lint,fmt-check,typecheck,docs-build,examples-docs

  unit-tests:
    # The canonical Linux/3.13 coverage lane, split into three concurrent
    # shards (`pytest --shard=K/3`, tests/pytest_shards.py: whole test files,
    # balanced by test count). As one job it ran ~34 minutes on a 4-core
    # runner and was the critical path of every CI run; the selection and
    # the 95% floor are unchanged -- each shard only *collects* coverage
    # data, and `unit-tests-coverage` below combines the three and enforces
    # the floor once, over the whole.
    #
    # `not repo_scan`: tests that statically scan the whole repository tree
    # (import/AST/text lint-style gates) run in the `repo-scan-tests` job
    # instead -- once, uninstrumented. Their result depends only on the
    # committed tree, not on the OS or on coverage, and they were the top of
    # the slowest-tests list on every leg (120s+ each).
    name: unit-tests (ubuntu-latest, ${{ matrix.python-version }}, shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Requests the sys.monitoring coverage backend (far lower
      # instrumentation overhead than the default C-trace core).
      #
      # It is INERT today, and the comment here used to claim otherwise
      # ("the same line+branch data"): `[tool.coverage.run] branch = true`
      # in pyproject.toml applies to every lane, and sys.monitoring cannot
      # measure branches before Python 3.14, so coverage.py warns
      # ("Can't use core=sysmon: sys.monitoring can't measure branches in
      # this version, using default core") and falls back to CTracer --
      # measured on the canonical 3.13 lane's own interpreter, and already
      # observed by this file's own slow-test carve-out comment below. The
      # request is left in place rather than deleted because it becomes
      # live, unchanged, the moment the coverage-collecting lane moves to
      # 3.14; what was wrong was the claim, not the setting.
      #
      # tests/test_coverage_core_effectiveness.py asserts the two stay in
      # agreement: it probes what coverage.py actually selects and fails if
      # this is requested under a configuration where it silently falls
      # back without the repo saying so.
      #
      # That move was measured and is BLOCKED -- do not re-attempt it as a
      # speedup without re-measuring the floor first. On 3.14.0rc2 with
      # coverage 7.16.0, `COVERAGE_CORE=sysmon` does engage under
      # `branch = true` (`tracer_name()` reports `SysMonitor`, no fallback
      # warning) and removes essentially all instrumentation overhead: on a
      # 2,173-test subset, uninstrumented 21.9s / sysmon 19.9s / CTracer
      # 35.1s, and on the full canonical selection at `-n 4`, 12m15s against
      # 17m30s on 3.13 -- a ~30% reduction. But the same two full runs, same
      # selection, same machine, near-identical test counts (48,708 vs
      # 48,710 passed, with `repo_facts.json`'s `canonical_python` flipped so
      # the canonical-only cases actually ran), report 93.73% on 3.14 against
      # 96.30% on 3.13: 1,339 fewer branches covered, below this lane's 95%
      # floor. The gap is interpreter-specific, not a backend artifact -- on
      # one interpreter the two cores agree to four decimal places on the
      # total and differ by a single branch arc in each direction. Lowering
      # the floor to buy the speedup is not an option, so the lane stays on
      # 3.13 until that 2.57 points is understood and closed, which is its
      # own investigation.
      COVERAGE_CORE: sysmon
    strategy:
      fail-fast: false
      matrix:
        # Full suite on the canonical interpreter only. Every other supported
        # Python (3.11, 3.12, 3.14, and the in-development 3.15) is covered by
        # python-compat.yml's wheel-install + import + smoke-subset lane.
        python-version: ['3.13']
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Keep this job's temporary files off the shared /tmp
        # Evidence, from one run (34778392930, `unit-tests (ubuntu-latest,
        # 3.14)`): three unrelated consumers each lost a file under `/tmp`
        # while still using it.
        #   * an xdist worker's whole basetemp -- `.../popen-gw0: MISSING`,
        #     reported by the harness guard added for exactly this;
        #   * `action/run.sh`'s own `mktemp -d` scratch directory --
        #     `cd: /tmp/tmp.r4jnmBWtyh: No such file or directory`;
        #   * gcc's own intermediate object, mid-link --
        #     `ld: cannot find /tmp/ccQIceDH.o: No such file or directory`.
        # No test touches the second or third, so this is not test-owned
        # state being mishandled: something prunes `/tmp` on these runners
        # while the job is running. That had been surfacing as a handful of
        # unattributable `FileNotFoundError`s per lane, a different set each
        # time, none reproducible locally.
        #
        # Found 2026-09-30: a unit test handed `scripts/check_l2_cli_perf.py`'s
        # cache reset the path `/tmp`, which it `rmtree`d (fixed, see
        # docs/contribute/known-gaps.md). This step stays as containment for
        # the next such helper.
        #
        # `$RUNNER_TEMP` is job-private and not under `/tmp`, so pointing
        # `TMPDIR` at it moves all three at once: `tempfile.gettempdir()`
        # (hence pytest's own basetemp), `mktemp`, and the compilers. One
        # variable rather than a per-consumer fix, because the consumers
        # have nothing in common except the directory they were using.
        #
        # Written to `$GITHUB_ENV` from a step rather than set in this job's
        # own `env:` block: the `runner` context is NOT available at
        # `jobs.<id>.env`, so `${{ runner.temp }}` there is a workflow
        # *validation* error -- GitHub rejects the whole file before any
        # matrix cell starts, taking every job in it offline. Observed, not
        # theorised: run 34779552374 completed "failure" with zero jobs one
        # second after creation, and the run is titled by path rather than
        # by the workflow's `name:`, because the file never parsed. Inside a
        # step `$RUNNER_TEMP` is an ordinary environment variable and needs
        # no context at all. Found in review by Codex on PR #1294.
        #
        # `shell: bash` so the one spelling works on the Windows lane too;
        # `TMPDIR` is what Python's `tempfile` and bash's `mktemp` both
        # read, on all three platforms.
        shell: bash
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests with coverage (Linux 3.13 — canonical lane, one shard)
        # Collects coverage data only (`--cov-report=`, no floor): a single
        # shard's percentage means nothing. The data file is renamed per
        # shard so `coverage combine` can merge them in the fan-in job.
        # --durations=25 surfaces the slowest tests in the CI log every run so
        # timing regressions stay visible (test-time hygiene).
        env:
          ABICHECK_DURATIONS_JSON: test-durations-shard${{ matrix.shard }}.json
        run: |
          pytest tests/ -q --tb=short -r fE -m "not integration and not libabigail and not abicc and not slow and not repo_scan" --shard=${{ matrix.shard }}/3 -n auto --dist worksteal --durations=25 --durations-min=1 --junitxml=test-results-${{ runner.os }}-py${{ matrix.python-version }}-shard${{ matrix.shard }}.xml --cov=abicheck --cov-report=
      - name: Keep this shard's coverage data for the fan-in job
        if: always()
        run: |
          if [ -f .coverage ]; then mv .coverage ".coverage.shard${{ matrix.shard }}"; fi
      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: coverage-data-shard${{ matrix.shard }}
          path: .coverage.shard${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
      - name: Test-time report (slowest tests → run summary)
        # Reporting only — a hard per-test wall-time gate would be flaky given
        # CI-runner variance; the uploaded artifact is the durable record.
        if: always()
        continue-on-error: true
        run: python scripts/summarize_test_durations.py test-durations-shard${{ matrix.shard }}.json --top 25
      - name: Upload test-durations artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: test-durations-shard${{ matrix.shard }}
          path: test-durations-shard${{ matrix.shard }}.json
          if-no-files-found: ignore
      - name: Upload JUnit test results
        # `if: always()` on purpose: the failing run is the one whose result
        # file is worth reading. One artifact name per shard, since a shared
        # name would have the legs overwrite each other.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: test-results-${{ runner.os }}-py${{ matrix.python-version }}-shard${{ matrix.shard }}
          path: test-results-*.xml
          if-no-files-found: ignore

  unit-tests-coverage:
    # Fan-in for the sharded canonical lane: combines the shards' coverage
    # data, enforces the 95% floor over the whole selection (the same floor
    # verify.py's `unit-pr` step enforces in one process), and uploads the
    # combined report to Codecov. Runs even when a shard failed, so a test
    # failure and a coverage shortfall are both reported; a missing shard
    # fails the explicit count check rather than passing on partial data.
    name: unit-tests coverage floor (combined shards)
    needs: [unit-tests]
    if: ${{ !cancelled() && needs.unit-tests.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.13'
      - name: Install coverage
        run: python -m pip install coverage
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          pattern: coverage-data-shard*
          merge-multiple: true
      - name: Combine shard data and enforce the 95% floor
        run: |
          test "$(ls .coverage.shard* | wc -l)" -eq 3
          coverage combine .coverage.shard*
          coverage report --skip-covered --fail-under=95
          coverage xml
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7
        with:
          use_oidc: true
          files: coverage.xml
          flags: unit
          fail_ci_if_error: false

  unit-tests-other-os:
    # The full unit suite on macOS and Windows, no coverage (they
    # skip the Linux-only ELF/DWARF tests, so their figure is structurally
    # below the floor and has no consumer). `repo_scan` tests are excluded
    # here too: they are OS-independent and `repo-scan-tests` owns them.
    name: unit-tests (${{ matrix.os }}, 3.13)
    # Not on every PR push. These legs cost ~27 minutes each on the scarcest
    # runner pools (macOS concurrency is a fraction of Linux's), and every PR
    # push competing for them is where most of the 24-54 minutes of per-job
    # queueing measured on 2026-09-29 came from. They run on every push to
    # `main` (a platform regression surfaces on the first `main` run after
    # merge), on `workflow_dispatch`, and on PRs labelled `ci:full` -- add it
    # to a PR touching paths, encodings, subprocesses, temp files or anything
    # else platform-sensitive. integration.yml's macOS/Windows legs (integration,
    # native PE/Mach-O compare, MSVC) still run on every engine PR. A moved
    # detection point, stated: docs/contribute/plans/ci-cost-and-assurance.md,
    # Phase 7.
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'ci:full')
    runs-on: ${{ matrix.os }}
    # 15 was too tight for the canonical (ubuntu, 3.13) leg: its own
    # coverage-collecting main-suite step alone measured 803s (13m23s) on
    # 2026-08-29, leaving under two minutes of job budget for the
    # subsequent "Run slow tests" step, the durations/coverage uploads, and
    # normal runner variance — which twice cancelled that step mid-run at
    # the identical ~73% completion point (PR #940) despite every test up
    # to that point passing. 20 was raised to match the headroom other
    # multi-step jobs in this file already carry, but PR #1002 (which added
    # tests/test_selectors.py, tests/test_selectors_namespace_glob.py, and
    # tests/test_reclassify_leaf_import_contract.py) pushed the canonical
    # leg's total wall time right back up against that same 20-minute wall
    # twice in a row on 2026-09-02 — once cancelled mid "Run slow tests"
    # (14m42s into the coverage step alone), once cancelled at exactly
    # 20m01s with every single step, coverage floor included, already
    # reporting success (a job-level timeout racing its own last step, not
    # a real failure). The lesson generalizes: the canonical leg's total
    # cost (coverage-collecting suite + slow/hypothesis tests + uploads)
    # grows with the whole test suite, so a fixed budget with days-old
    # headroom keeps re-drifting to zero as tests are added anywhere in the
    # fast lane. 30 restored real headroom over the ~20m1s observed there --
    # and the same drift then reached the *Windows* leg: on 2026-09-05 its
    # main-suite step measured 27m12s on main (stored ProjectSnapshot
    # package compares cost 30-225s each on that runner, under a second on
    # Linux -- the slowest-25 report is dominated by them), and PR #1079,
    # which adds end-to-end coverage of exactly that path, was cancelled at
    # 29m19s with 99% of the suite passed. 45 restores headroom over that
    # 27-29m; the per-platform cost of the stored-package path is a
    # separate, unowned investigation, not something a test budget fixes.
    #
    # The drift repeated on the *Windows* leg again: on 2026-09-10, run
    # 11381's windows-latest/3.13 job (github.com/abicheck/abicheck/actions/
    # runs/34435814307/job/102752838266) was killed by the job-level
    # timeout at 49m21s -- past the 45m budget above -- with every test
    # that had run so far passing and the suite at 99% completion (mid
    # tests/test_cli_compare_release_project_snapshot_package.py, the same
    # stored-package test module PR #1079's own overrun was in). Same
    # class of failure as 2026-09-05's: a job-level timeout racing an
    # otherwise-green run, not a real test failure. 65 restores headroom
    # over the ~49m21s observed here, matching the ~1.5x-of-observed
    # pattern each prior bump in this comment already followed.
    #
    # Scoped to the windows-latest leg only (Codex review, PR #1197):
    # `timeout-minutes` is a job-level setting, so a flat 65 would also
    # hand every ubuntu/macos matrix cell 20 extra minutes of runaway-hang
    # budget on a required check, for a cost this comment's own evidence
    # only ever measured on Windows. The other legs keep the 45m this
    # comment's prior bumps established.
    #
    # 65 turned out to be too tight on its own first re-run: PR #1197's
    # own windows-latest/3.13 job (run 34458364910, job 102810016338)
    # was killed at exactly 65m14s -- 14 seconds past the just-raised
    # budget, with every test up to that point (99% of the suite) still
    # passing. A ~1.5x multiplier that worked for three prior bumps
    # (20->30, 45->65 from ~29m/~49m observed) left essentially zero
    # headroom this time, since normal runner-to-runner variance on
    # Windows is itself worth several minutes. 90 restores real margin
    # (not just matching-the-multiplier margin) over the ~65m14s+
    # observed here -- the run was still executing when killed, so the
    # true completion time is unknown and at least this high.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 90 || 45 }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ['3.13']
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Keep this job's temporary files off the shared /tmp
        # Evidence, from one run (34778392930, `unit-tests (ubuntu-latest,
        # 3.14)`): three unrelated consumers each lost a file under `/tmp`
        # while still using it.
        #   * an xdist worker's whole basetemp -- `.../popen-gw0: MISSING`,
        #     reported by the harness guard added for exactly this;
        #   * `action/run.sh`'s own `mktemp -d` scratch directory --
        #     `cd: /tmp/tmp.r4jnmBWtyh: No such file or directory`;
        #   * gcc's own intermediate object, mid-link --
        #     `ld: cannot find /tmp/ccQIceDH.o: No such file or directory`.
        # No test touches the second or third, so this is not test-owned
        # state being mishandled: something prunes `/tmp` on these runners
        # while the job is running. That had been surfacing as a handful of
        # unattributable `FileNotFoundError`s per lane, a different set each
        # time, none reproducible locally.
        #
        # Found 2026-09-30: a unit test handed `scripts/check_l2_cli_perf.py`'s
        # cache reset the path `/tmp`, which it `rmtree`d (fixed, see
        # docs/contribute/known-gaps.md). This step stays as containment for
        # the next such helper.
        #
        # `$RUNNER_TEMP` is job-private and not under `/tmp`, so pointing
        # `TMPDIR` at it moves all three at once: `tempfile.gettempdir()`
        # (hence pytest's own basetemp), `mktemp`, and the compilers. One
        # variable rather than a per-consumer fix, because the consumers
        # have nothing in common except the directory they were using.
        #
        # Written to `$GITHUB_ENV` from a step rather than set in this job's
        # own `env:` block: the `runner` context is NOT available at
        # `jobs.<id>.env`, so `${{ runner.temp }}` there is a workflow
        # *validation* error -- GitHub rejects the whole file before any
        # matrix cell starts, taking every job in it offline. Observed, not
        # theorised: run 34779552374 completed "failure" with zero jobs one
        # second after creation, and the run is titled by path rather than
        # by the workflow's `name:`, because the file never parsed. Inside a
        # step `$RUNNER_TEMP` is an ordinary environment variable and needs
        # no context at all. Found in review by Codex on PR #1294.
        #
        # `shell: bash` so the one spelling works on the Windows lane too;
        # `TMPDIR` is what Python's `tempfile` and bash's `mktemp` both
        # read, on all three platforms.
        shell: bash
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests (no coverage, platform tests skip)
        run: |
          pytest tests/ -q --tb=short -r fE -m "not integration and not libabigail and not abicc and not slow and not repo_scan" -n auto --dist worksteal --durations=25 --durations-min=1 --junitxml=test-results-${{ runner.os }}-py${{ matrix.python-version }}.xml
      - name: Upload JUnit test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: test-results-${{ runner.os }}-py${{ matrix.python-version }}
          path: test-results-*.xml
          if-no-files-found: ignore

  slow-tests:
    # Split out of `unit-tests`' canonical (ubuntu, 3.13) leg, where it ran as
    # a step *after* the coverage-collecting main suite and so sat on that
    # job's critical path: on run 34787831201 the main test step took 22m58s
    # and this step a further 3m38s, serialized behind it for no reason —
    # nothing it runs depends on the main suite's result, and it collects no
    # coverage (the canonical lane's 95% floor is measured by `unit-tests`
    # alone and is unaffected by this move). As its own job it runs
    # concurrently instead, taking its wall time off the longest job in the
    # workflow rather than adding to it. Total compute is unchanged; what
    # changes is PR feedback time.
    #
    # Still a required check, and still every `slow`-marked test: this is a
    # relocation, not an opt-out, and it deliberately is NOT moved to a
    # nightly or manual trigger.
    #
    # One configuration on purpose, matching the `if:` guard it carried as a
    # step (`matrix.python-version == '3.13' && matrix.os == 'ubuntu-latest'`)
    # — these tests were never run on any other matrix leg, so no executed
    # case set changes.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Keep this job's temporary files off the shared /tmp
        # Same reason as `unit-tests`' identical step: something prunes `/tmp`
        # on these runners mid-job, and `$RUNNER_TEMP` is job-private. Set from
        # a step rather than `jobs.<id>.env` because the `runner` context is
        # not available there (a workflow *validation* error that takes the
        # whole file offline).
        shell: bash
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run slow tests (hypothesis / property-based)
        # Routed through scripts/verify.py (CLAUDE.md "M0-3"): its `slow`
        # step (xdist-parallel) and `slow-perf` step (serial -- every test in
        # it asserts on wall-clock time, so it must not share the CPU with
        # the parallel lane, Codex review PR #1036) are the one definition of
        # this lane; this job used to carry a hand-copied pair of pytest
        # lines that could drift from them. No coverage: it had no consumer,
        # and instrumentation distorts slow-perf's timing assertions.
        # --junit-dir writes test-results-slow.xml / test-results-slow-perf.xml
        # for the upload below.
        run: python scripts/verify.py --profile full --only slow,slow-perf --junit-dir .
      - name: Upload JUnit test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: test-results-slow-Linux-py3.13
          path: test-results-slow*.xml
          if-no-files-found: ignore

  packaging:
    # Windows only. The Linux leg ran `python -m build && twine check` --
    # exactly what `fair-metadata`'s `distribution-build` verify.py step
    # already does on ubuntu in the same run -- so it cost a runner slot
    # (and ~54 minutes of queueing on a congested day) for no new signal.
    # What this job adds is the Windows sdist/wheel build path.
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.14'
          cache: 'pip'
      - name: Build artifacts and validate metadata
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          python -m build
          twine check dist/*
