name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ai-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          # Full history, unlike every other job here. `adr-status-sync`'s
          # freshness tripwire answers "have commits touched this module
          # since the ADR's `**Verified:**` sha", which a depth-1 checkout
          # cannot resolve at all — the sha isn't present, so the check
          # would stand down on every CI run and be live only locally,
          # i.e. disabled in exactly the environment it exists to protect
          # (Codex review on PR #667).
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          # Pinned to the canonical Python (repo_facts.json's
          # `canonical_python`, matching the coverage-floor lane in
          # unit-tests below) — NOT '3.14' like the other jobs. This job's
          # repo-facts step recomputes `fast_test_cases_collected` via
          # `pytest --collect-only`, which has been observed to drift by a
          # small, unexplained amount even between environments that match on
          # Python version and every dependency version — this pin removes
          # one plausible variable. `gen_repo_facts.py --check` treats that
          # one field's drift as non-fatal (WARN, not ERROR) precisely
          # because it isn't reliably reproducible; see that script's
          # docstring for what was actually tried.
          python-version: '3.13'
          cache: 'pip'
      # One install, not two. This job used to `pip install "mypy==1.19.1"`
      # standalone before the ai-readiness step and only then install `[dev]`
      # for the later gates — two full pip resolutions of an overlapping
      # dependency set. `[dev]` already pins the *same* exact mypy
      # (pyproject.toml's "mypy==1.19.1", for the same reproducible-drift-gate
      # reason the standalone pin cited), so installing it up front satisfies
      # both steps. `[dev]` (not the bare package) is also what repo-facts'
      # fast_test_cases_collected needs, since it runs pytest --collect-only
      # (see scripts/gen_repo_facts.py).
      - name: Install package (mypy drift gate + FP-rate / tier-accuracy / doc-sync / repo-facts gates)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # ADR-058's three publication trees (.agents/skills/, .claude/skills/,
      # .gemini/skills/) are no longer committed (2026-08-21 amendment) --
      # they're gitignored build output. `agent-skills-generated` below
      # validates skills-src/'s own consistency without needing them on
      # disk, but the skill-eval-pack/skill-eval-freshness/harbor-tasks
      # steps further down still hash the *generated* tree's real content
      # (deliberately, not skills-src/ -- see gen_skill_eval_pack.py's
      # `_skill_tree_digest` docstring), so it must actually exist here.
      - name: Materialize generated agent-skill trees (ADR-058, not committed)
        run: python scripts/gen_agent_skills.py
      - name: AI-readiness checks (file size, CLAUDE.md coverage, ChangeKind invariants, mypy drift, import cycles)
        run: python scripts/verify.py --profile pr --only ai-readiness
      # A `pull_request` run scopes the debt-no-growth check to the PR's own
      # base sha. A `push`-to-`main`/`workflow_dispatch` run has no PR base
      # at all -- `github.event.pull_request.base.sha` is simply empty there
      # -- so `push` instead uses its own `before` sha (the tip of `main`
      # immediately prior) and `workflow_dispatch` uses the checked-out
      # revision's own parent commit, scoping the check to growth *this run*
      # introduced rather than every file's original ADR-061 adoption
      # baseline. Falling through to that unscoped baseline on every
      # post-merge `main` run would make it permanently red on any
      # pre-existing drift already on `main` (individually-compliant PRs
      # each growing a debt-tracked file a little further past its original
      # baseline), even when the merged/dispatched change itself introduced
      # none (Codex review, fresh evidence, both for `push` and, in a
      # follow-up finding, for `workflow_dispatch`: reproduced directly
      # against this tree both times). `push`'s `before` is skipped when
      # it's the all-zero sentinel git uses for a branch's first push (no
      # prior commit to compare against); `workflow_dispatch`'s `HEAD^` is
      # skipped when it doesn't resolve (the repository's very first commit)
      # -- `check_repository()` would otherwise report a hard
      # `base-revision` error for an unresolvable sha rather than silently
      # falling back, for either case.
      - name: Resolve architecture check base revision
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ] \
            && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            base="${{ github.event.before }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            base="$(git rev-parse --verify -q HEAD^ || true)"
          else
            base=""
          fi
          echo "ARCHITECTURE_BASE=${base}" >> "$GITHUB_ENV"
      - name: Architecture contract (ADR-061)
        run: python scripts/verify.py --profile pr --only architecture
      # Scoping FP-rate gate (ADR-024 §7), per-tier accuracy gate, the use-case
      # docs sync gate, the docs/AGENTS.md ownership contract gate, the
      # generated agent-skill trees' drift gate (ADR-058), and
      # repo_facts.json freshness — routed through scripts/verify.py, the
      # same implementation `pixi run check` and `python scripts/verify.py
      # --profile pr` run locally (CLAUDE.md "M0-3"), so this job can't
      # silently diverge from the local PR-profile definition of done.
      - name: Scoping / tier-accuracy / doc-sync / docs-contract / agent-skills / repo-facts gates
        run: python scripts/verify.py --profile pr --only fp-rate,tier-accuracy,usecase-docs-sync,docs-contract,learning-ladder,agent-skills-generated,repo-facts
      # G37 Phase 0. Deliberately in this job and not a new one: both steps are
      # deterministic re-derivations over content this job already has on
      # disk (committed repo content, plus the freshly-generated agent-skill
      # trees materialized above), no model is involved (G37 D2), so they
      # belong beside the other structural gates rather than in a lane of
      # their own.
      - name: Skill-eval pack + evidence freshness gates (G37 D6)
        run: python scripts/verify.py --profile pr --only skill-eval-pack,skill-eval-freshness
      - name: Harbor task battery freshness (ADR-058 Harbor migration)
        run: python scripts/verify.py --profile pr --only harbor-tasks
      # The freshness check above only re-derives the tree structurally
      # (gen_harbor_tasks.py --check) -- it never asks whether a generated
      # task.toml/environment/tests/solution layout is actually valid per
      # Harbor's own schema. `harbor` needs Python >=3.12 (this job's own
      # pin) and is not a repository dependency (it exists to validate
      # output *for* Harbor, not to be one), so it's installed here as its
      # own dedicated step rather than folded into `[dev]` -- the check
      # itself (`harbor-schema`) is still routed through verify.py's step
      # catalog like every other gate here (CLAUDE.md "M0-3"), just run
      # under `--profile full` since it's FULL-only there.
      - name: Harbor schema validation (real harbor package, agent-evals/skills/harbor/CLAUDE.md)
        run: |
          pip install harbor
          python scripts/verify.py --profile full --only harbor-schema
      - name: Per-tier accuracy matrix (step-summary artifact)
        if: always()
        run: python scripts/check_tier_accuracy.py --markdown >> "$GITHUB_STEP_SUMMARY"

  fair-metadata:
    name: FAIR metadata and packaging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.14'
          cache: 'pip'
      - name: Install validation and build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" build twine
      - name: Verify FAIR metadata and published schema copies
        run: python scripts/verify.py --profile pr --only schema-sync,fair-metadata
      - name: Build, twine check, and validate distribution metadata
        run: python scripts/verify.py --profile pr --only distribution-build

  lint-and-types:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.14'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"  # mypy is pinned in [dev]; no separate unpinned install
      - name: Install docs dependencies
        run: pip install mkdocs mkdocs-material pymdown-extensions mkdocs-redirects
      # lint / typecheck / docs-build routed through scripts/verify.py — see
      # the ai-readiness job's comment above (CLAUDE.md "M0-3").
      - name: Lint, type check, docs build (strict)
        run: python scripts/verify.py --profile pr --only lint,typecheck,docs-build

  unit-tests:
    runs-on: ${{ matrix.os }}
    # 15 was too tight for the canonical (ubuntu, 3.13) leg: its own
    # coverage-collecting main-suite step alone measured 803s (13m23s) on
    # 2026-08-29, leaving under two minutes of job budget for the
    # subsequent "Run slow tests" step, the durations/coverage uploads, and
    # normal runner variance — which twice cancelled that step mid-run at
    # the identical ~73% completion point (PR #940) despite every test up
    # to that point passing. 20 was raised to match the headroom other
    # multi-step jobs in this file already carry, but PR #1002 (which added
    # tests/test_selectors.py, tests/test_selectors_namespace_glob.py, and
    # tests/test_reclassify_leaf_import_contract.py) pushed the canonical
    # leg's total wall time right back up against that same 20-minute wall
    # twice in a row on 2026-09-02 — once cancelled mid "Run slow tests"
    # (14m42s into the coverage step alone), once cancelled at exactly
    # 20m01s with every single step, coverage floor included, already
    # reporting success (a job-level timeout racing its own last step, not
    # a real failure). The lesson generalizes: the canonical leg's total
    # cost (coverage-collecting suite + slow/hypothesis tests + uploads)
    # grows with the whole test suite, so a fixed budget with days-old
    # headroom keeps re-drifting to zero as tests are added anywhere in the
    # fast lane. 30 restores real headroom over the ~20m1s observed here.
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      # Use the sys.monitoring coverage backend (Python 3.12+): far lower
      # instrumentation overhead than the default C-trace core, with the same
      # line+branch data. Every matrix Python here is 3.12+, so it's always
      # available. Harmless on steps that don't collect coverage.
      COVERAGE_CORE: sysmon
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.12', '3.13', '3.14']
        allow-prereleases: [false]
        include:
          - os: windows-latest
            python-version: '3.13'
            allow-prereleases: false
          - os: macos-latest
            python-version: '3.13'
            allow-prereleases: false
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: ${{ matrix.allow-prereleases }}
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests with coverage (Linux 3.13 — canonical lane, enforces 95% floor)
        # Coverage + the 95% floor + the codecov upload run on ONE canonical
        # Linux/Python lane (3.13). The other Linux Pythons (3.12/3.14) run the
        # same suite *without* coverage instrumentation — they'd only re-check
        # the identical floor, and coverage adds ~60% wall time. macOS/Windows
        # skip the Linux-only ELF/DWARF tests, so they don't enforce the floor.
        # --durations=25 surfaces the slowest tests in the CI log every run so
        # timing regressions stay visible (test-time hygiene).
        if: runner.os == 'Linux' && matrix.python-version == '3.13'
        env:
          # Capture per-test durations (tests/conftest.py hook) for the
          # test-time report + artifact below.
          ABICHECK_DURATIONS_JSON: test-durations.json
        run: |
          pytest tests/ -v --tb=short -m "not integration and not libabigail and not abicc and not slow" -n auto --dist worksteal --durations=25 --cov=abicheck --cov-report=term-missing --cov-report=xml --cov-fail-under=95
      - name: Run tests (Linux non-canonical Python — no coverage)
        if: runner.os == 'Linux' && matrix.python-version != '3.13'
        run: |
          pytest tests/ -v --tb=short -m "not integration and not libabigail and not abicc and not slow" -n auto --dist worksteal --durations=25
      - name: Run tests with coverage (macOS — report only, platform tests skip)
        if: runner.os == 'macOS'
        run: |
          pytest tests/ -v --tb=short -m "not integration and not libabigail and not abicc and not slow" -n auto --dist worksteal --durations=25 --cov=abicheck --cov-report=term-missing --cov-report=xml
      - name: Run tests (Windows — parallel, no coverage)
        if: runner.os == 'Windows'
        run: |
          pytest tests/ -v --tb=short -m "not integration and not libabigail and not abicc and not slow" -n auto --dist worksteal --durations=25
      - name: Run slow tests (hypothesis / property-based)
        # -n auto --dist worksteal, matching every other step in this job:
        # this step ran fully serial (no `-n`) while its siblings didn't,
        # and the `slow`-marked tests it selects are independent
        # (Hypothesis/property-based suites plus the production-scale
        # snapshot-compression round trips in
        # tests/test_snapshot_compression_public_api_scale.py, individually
        # 90-195s), so running them one at a time was pure wasted wall time
        # on a multi-core runner and a real contributor to this leg
        # repeatedly running past its own timeout-minutes (see that
        # comment's own incident history above). pytest-cov's xdist
        # integration combines per-worker coverage automatically, so
        # --cov-append here still lands in one coverage-slow.xml.
        if: matrix.python-version == '3.13' && matrix.os == 'ubuntu-latest'
        run: |
          pytest tests/ -v --tb=short -m "slow" -n auto --dist worksteal --cov=abicheck --cov-report=xml:coverage-slow.xml --cov-append
      - name: Test-time report (slowest tests → run summary)
        # Renders the captured durations into the GitHub run summary. Reporting
        # only — a hard per-test wall-time gate would be flaky given CI-runner
        # variance; the uploaded artifact is the durable record for trends.
        # continue-on-error keeps it truly non-blocking: a hiccup rendering the
        # report must never fail an otherwise-green test job.
        if: always() && matrix.python-version == '3.13' && matrix.os == 'ubuntu-latest'
        continue-on-error: true
        run: python scripts/summarize_test_durations.py test-durations.json --top 25
      - name: Upload test-durations artifact
        if: always() && matrix.python-version == '3.13' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: test-durations
          path: test-durations.json
          if-no-files-found: ignore
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.13' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7
        with:
          use_oidc: true
          files: coverage.xml
          flags: unit
          fail_ci_if_error: false

  integration-tests:
    # Path-gated through the existing heavy-parity-gate rather than a
    # trigger-level `paths:` filter, for the same reason libabigail-parity and
    # abicc-parity already are: the gate job itself always runs and reports, so
    # branch protection keeps a stable check to require. This is the most
    # expensive always-on job in the repo — three OS legs, each doing
    # apt/brew/choco + castxml + a full editable install, with macOS billed at
    # 10x and Windows at 2x runner minutes — and it was running in full on
    # documentation-only PRs. The gate's filter set (abicheck/**, tests/**,
    # examples/**, .github/workflows/**) is exactly the input set that can
    # change what these tests observe. Note this is deliberately NOT the same
    # call as cross-platform-e2e below, which stays always-on: that one is ~1
    # minute, so its runner cost never justified the skipped-check friction.
    needs: [heavy-parity-gate]
    if: needs.heavy-parity-gate.outputs.run-heavy == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          # Don't let a flaky pre-baked third-party apt repo (e.g. the runner's
          # packages.microsoft.com returning 403/"no longer signed") fail the lane:
          # tolerate `update` errors — the `install` below still fails loudly if any
          # of the packages it needs are genuinely unavailable.
          sudo apt-get update -qq || sudo apt-get update -qq || true
          sudo apt-get install -y gcc g++ cmake clang curl ca-certificates
      - name: Set up pinned CastXML (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-castxml
      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: brew install castxml cmake
      - name: Install system deps (Windows)
        if: runner.os == 'Windows'
        # The PyPI `castxml` wheel is a stale 0.4.5 legacy build that the
        # castxml_policy version gate correctly rejects (see
        # action/install-castxml.sh's docstring: "Use Homebrew/conda-forge on
        # this platform" for non-Linux). Use the GitHub-hosted Windows
        # runner's preinstalled Miniconda (`$env:CONDA`) to pull the
        # actively-maintained conda-forge build instead — no new third-party
        # Action needed, and conda verifies its own package integrity.
        run: |
          choco install cmake --no-progress --yes
          & "$env:CONDA\condabin\conda.bat" install --yes -c conda-forge castxml
          Add-Content -Path $env:GITHUB_PATH -Value "$env:CONDA\Library\bin"
          Add-Content -Path $env:GITHUB_PATH -Value "$env:CONDA\Scripts"
      - name: Set up MSVC developer environment (cl.exe on PATH)
        # Some example cases build via CMake (CMakeLists.txt special flags),
        # which invokes CMake's own compiler sanity check
        # (CMakeTestCCompiler.cmake) against cl.exe. Without vcvarsall having
        # run, cl.exe can't find the MSVC/Windows SDK headers even for a
        # trivial program ("is not able to compile a simple test program").
        # windows-msvc job below hits the same class of issue and fixes it
        # the same way.
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.14'
          cache: 'pip'
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Run integration tests (Linux/macOS — with coverage)
        if: runner.os != 'Windows'
        # ABICHECK_MIN_EXECUTED guards against a silent toolchain-install failure
        # turning the whole lane into 0-ran-but-green (see tests/conftest.py).
        # Linux's ELF integration count is known (~195) so it gets a real floor;
        # the macOS Mach-O subset count isn't verified here, so it uses a minimal
        # "> 0" floor — enough to catch a missing toolchain without risking a
        # false failure from platform subsetting.
        env:
          ABICHECK_MIN_EXECUTED: ${{ runner.os == 'macOS' && '1' || '20' }}
        run: |
          pytest tests/ -v -m integration --tb=short --cov=abicheck --cov-report=xml:coverage-integration.xml --ignore=tests/test_abi_examples.py
      - name: Run integration tests (Windows — parallel, no coverage)
        if: runner.os == 'Windows'
        # Same silent-skip guard: the xdist controller aggregates every worker's
        # reports, so the session-finish check in conftest.py works under -n auto
        # (verified). The Windows PE integration count isn't measured here, so a
        # minimal "> 0" floor catches a missing MinGW without false failures.
        env:
          ABICHECK_MIN_EXECUTED: '1'
        run: |
          pytest tests/ -v -m integration --tb=short -n auto --dist worksteal --ignore=tests/test_abi_examples.py
      - name: Upload integration coverage to Codecov
        if: always() && matrix.os == 'ubuntu-24.04'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7
        with:
          use_oidc: true
          files: coverage-integration.xml
          flags: integration
          fail_ci_if_error: false

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y zlib1g-dev curl ca-certificates
      - uses: ./.github/actions/setup-castxml
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.14'
          cache: 'pip'
      - name: Install package
        run: pip install -e ".[dev]"
      - name: End-to-end demo (libz)
        run: python scripts/demo_libz.py

  windows-msvc:
    name: MSVC + PDB end-to-end
    runs-on: windows-latest
    timeout-minutes: 20
    # Experimental lane: abicheck's pure-Python PDB parser is still maturing on
    # real MSVC output, so a failure here is informational (does not block the
    # PR). Tests self-skip when layout cannot be extracted; this flag covers
    # genuine parser/toolchain breakage until the lane is proven stable.
    continue-on-error: true
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
      - name: Set up MSVC developer environment (cl.exe on PATH)
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.14'
          cache: 'pip'
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Run MSVC + PDB end-to-end tests
        run: pytest tests/test_msvc_pdb_e2e.py -v -m msvc --tb=short

  cross-platform-e2e:
    # G1: native PE/Mach-O `compare` workflows + AArch64 AAPCS modeling.
    # Drives `abicheck compare` over binaries built by the *platform's own*
    # toolchain (Apple clang → .dylib, MinGW gcc → .dll) and asserts verdicts,
    # so the core workflow is validated end-to-end off the Linux baseline.
    #
    # Kept always-on (not path-gated): the jobs are short (~1 min) and a
    # path-filtered "skipped" status complicates branch-protection required
    # checks; the modest runner cost buys a reliable platform signal on every PR.
    name: Native PE/Mach-O compare workflows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
      - name: Install MinGW gcc (Windows — PE/DWARF)
        if: runner.os == 'Windows'
        run: choco install mingw --no-progress --yes
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.14'
          cache: 'pip'
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Native PE/Mach-O compare workflow tests
        # Run ONLY the native, compiler-gated integration tests here. Every test
        # in this file is @pytest.mark.integration and needs clang/MinGW, so if
        # the native compiler is missing they all skip and the
        # ABICHECK_MIN_EXECUTED floor fails the lane — closing the silent-skip
        # hole where always-run unit tests could keep it green. (The AArch64
        # AAPCS64 unit tests run in the regular unit-tests lane on all OSes.)
        # Floor 5: each platform contributes ~7-8 native tests when the compiler
        # is present, so 5 is comfortably reachable yet 0 (all-skipped) fails.
        env:
          ABICHECK_MIN_EXECUTED: '5'
        run: pytest tests/test_cross_platform_integration.py -v -m integration --tb=short

  heavy-parity-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Same dorny/paths-filter requirement as mutation.yml's resolve job —
      # fixed in both places rather than only where it was reported, since
      # one job silently losing its filter would skip the parity lanes it
      # gates.
      pull-requests: read
    outputs:
      run-heavy: ${{ steps.resolve.outputs.run-heavy }}
      reason: ${{ steps.resolve.outputs.reason }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - name: Detect changed files for parity jobs (PR only)
        id: changed
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706  # v4
        with:
          filters: |
            heavy:
              - 'abicheck/**'
              - 'tests/**'
              - 'examples/**'
              - '.github/workflows/**'
              # The gated jobs' *infrastructure*, not just their inputs. Every
              # one of them does `pip install -e ".[dev]"` and sets up CastXML
              # through the composite action, and the two parity lanes are
              # driven by scripts/verify.py's step catalog — so a PR touching
              # only those would skip the very jobs that validate them. The
              # sharpest case: re-pinning CastXML in action/install-castxml.sh
              # (asset names, SHA256s, expected versions) would otherwise land
              # without a single job that uses CastXML having run.
              # (Codex review on PR #685; the gap predates this PR for the two
              # parity lanes, and integration-tests inherited it when it moved
              # behind this gate.)
              - 'pyproject.toml'
              - 'action/**'
              - '.github/actions/**'
              - 'scripts/verify.py'

      - name: Resolve parity gate output
        id: resolve
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run-heavy=true" >> "$GITHUB_OUTPUT"
            echo "reason=full-run-non-pr-event" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.changed.outputs.heavy }}" = "true" ]; then
            echo "run-heavy=true" >> "$GITHUB_OUTPUT"
            echo "reason=relevant-files-changed" >> "$GITHUB_OUTPUT"
          else
            echo "run-heavy=false" >> "$GITHUB_OUTPUT"
            echo "reason=no-relevant-changes" >> "$GITHUB_OUTPUT"
          fi

  libabigail-parity:
    needs: [heavy-parity-gate]
    if: needs.heavy-parity-gate.outputs.run-heavy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc g++ curl ca-certificates
          sudo apt-get install -y abigail-tools || sudo apt-get install -y libabigail-tools
      - uses: ./.github/actions/setup-castxml
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.14'
          cache: 'pip'
      - name: Install package
        run: pip install -e ".[dev]"
      # Routed through scripts/verify.py (CLAUDE.md "M0-3") — its
      # "libabigail-parity" Step is marker-scoped (not a hardcoded file
      # list; tests/test_abidiff_parity_extended.py and
      # tests/test_surface_scope_parity.py also carry @pytest.mark.libabigail
      # and would silently never run under the old hardcoded 3-file list)
      # and sets ABICHECK_MIN_EXECUTED itself — fails loudly if abigail-tools
      # didn't install (lane would otherwise skip every test and pass), see
      # tests/conftest.py's silent-skip guard.
      - name: Run libabigail parity tests
        run: python scripts/verify.py --profile full --only libabigail-parity

  abicc-parity:
    needs: [heavy-parity-gate]
    if: needs.heavy-parity-gate.outputs.run-heavy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc g++ abi-compliance-checker curl ca-certificates
      - uses: ./.github/actions/setup-castxml
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.14'
          cache: 'pip'
      - name: Install package
        run: pip install -e ".[dev]"
      # Routed through scripts/verify.py (CLAUDE.md "M0-3") — its
      # "abicc-parity" Step is marker-scoped (not a hardcoded file list;
      # tests/test_abicc_parity_extended.py also carries @pytest.mark.abicc
      # and would silently never run under the old hardcoded 2-file list)
      # and sets ABICHECK_MIN_EXECUTED itself — fails loudly if
      # abi-compliance-checker didn't install (lane would otherwise skip
      # every test and pass), see tests/conftest.py's silent-skip guard.
      - name: Run ABICC parity tests
        run: python scripts/verify.py --profile full --only abicc-parity
      - name: Run XML schema validation tests (no ABICC required)
        run: pytest tests/test_xml_parity.py::TestXmlSchemaValidation tests/test_xml_report.py -v --tb=short

  packaging:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.14'
          cache: 'pip'
      - name: Build artifacts and validate metadata
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          python -m build
          twine check dist/*

  # ── PR A / PR 0B (CLI cleanup phase two): neutral-aggregate required
  # checks for path-filtered workflows ────────────────────────────────────
  #
  # docs-pr.yml and test-action.yml are both `paths:`-filtered at the
  # workflow level -- they simply don't run on a PR that doesn't touch their
  # paths, and GitHub's branch-protection/Ruleset required-status-checks
  # mechanism has no native way to say "required only when these paths
  # changed" (checked directly against the GitHub REST/GraphQL API surface;
  # confirmed absent). Requiring `build-docs`/`test-action-summary` directly
  # would therefore strand every PR that never touches `docs/**`/
  # `action/**`, since GitHub blocks merge on a required check that never
  # reports at all, the same as on a failing one.
  #
  # These two jobs are the fix: `ci.yml` itself carries no `paths:` filter
  # (it always runs), so each job independently re-evaluates the SAME path
  # filter the target workflow's own trigger uses. When the paths don't
  # match, there is nothing to gate and the job succeeds immediately. When
  # they do match, the target workflow is guaranteed to have been triggered
  # by the same `pull_request` event (running in parallel with this one), so
  # this job polls that workflow's own aggregate check for the same head SHA
  # and mirrors its conclusion -- succeeding, failing, or timing out loudly
  # if the target check never completes. Only meaningful for `pull_request`
  # events: neither `docs-pr.yml` nor `test-action.yml`'s `build-docs`/
  # `test-action-summary` check re-runs on a `push`-triggered merge commit
  # (a different, untested SHA), so waiting on `push` would only time out.
  docs-pr-required:
    name: docs-pr (required)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: read
      pull-requests: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
      - name: Detect whether docs-pr.yml's own paths changed
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706  # v4
        with:
          filters: |
            docs:
              - 'docs/**'
              - 'abicheck/schemas/**'
              - 'examples/**'
              - 'mkdocs.yml'
              - 'scripts/gen_examples_docs.py'
              - 'scripts/publish_schemas.py'
              - '.github/workflows/pages.yml'
              - '.github/workflows/docs-pr.yml'
      - name: Wait for docs-pr.yml's build-docs check and mirror its outcome
        if: steps.filter.outputs.docs == 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd  # v8
        with:
          script: |
            const sha = context.payload.pull_request.head.sha;
            const checkName = 'build-docs';
            const timeoutMs = 25 * 60 * 1000;
            const pollMs = 15 * 1000;
            const start = Date.now();
            while (Date.now() - start < timeoutMs) {
              const { data } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: sha,
                check_name: checkName,
                per_page: 100,
              });
              const run = data.check_runs.find(r => r.name === checkName);
              if (run && run.status === 'completed') {
                core.info(`${checkName} completed with conclusion: ${run.conclusion}`);
                if (!['success', 'neutral'].includes(run.conclusion)) {
                  core.setFailed(`${checkName} did not succeed (conclusion: ${run.conclusion})`);
                }
                return;
              }
              core.info(run
                ? `${checkName} status: ${run.status} -- waiting`
                : `${checkName} not reported yet -- waiting`);
              await new Promise(r => setTimeout(r, pollMs));
            }
            core.setFailed(`Timed out waiting for ${checkName} to complete`);
      - name: Nothing to gate
        if: steps.filter.outputs.docs != 'true'
        run: echo "docs-pr.yml's own paths didn't change -- nothing to gate."

  test-action-required:
    name: test-action (required)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      checks: read
      pull-requests: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
      - name: Detect whether test-action.yml's own paths changed
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706  # v4
        with:
          filters: |
            action:
              - 'action.yml'
              - 'action/**'
              - 'actions/check-target/**'
              - 'actions/resolve-baseline/**'
              - 'abicheck/**'
              - 'pyproject.toml'
              - 'pixi.lock'
              - '.github/workflows/test-action.yml'
              - '.github/workflows/check-single.yml'
              - 'tests/fixtures/action/**'
      - name: Wait for test-action.yml's summary check and mirror its outcome
        if: steps.filter.outputs.action == 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd  # v8
        with:
          script: |
            const sha = context.payload.pull_request.head.sha;
            const checkName = 'test-action summary';
            const timeoutMs = 35 * 60 * 1000;
            const pollMs = 15 * 1000;
            const start = Date.now();
            while (Date.now() - start < timeoutMs) {
              const { data } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: sha,
                check_name: checkName,
                per_page: 100,
              });
              const run = data.check_runs.find(r => r.name === checkName);
              if (run && run.status === 'completed') {
                core.info(`${checkName} completed with conclusion: ${run.conclusion}`);
                if (!['success', 'neutral'].includes(run.conclusion)) {
                  core.setFailed(`${checkName} did not succeed (conclusion: ${run.conclusion})`);
                }
                return;
              }
              core.info(run
                ? `${checkName} status: ${run.status} -- waiting`
                : `${checkName} not reported yet -- waiting`);
              await new Promise(r => setTimeout(r, pollMs));
            }
            core.setFailed(`Timed out waiting for ${checkName} to complete`);
      - name: Nothing to gate
        if: steps.filter.outputs.action != 'true'
        run: echo "test-action.yml's own paths didn't change -- nothing to gate."
