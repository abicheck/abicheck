name: 'abicheck — ABI Compatibility Checker'
description: 'ABI/API compatibility of C/C++ binaries, packages, and releases in CI: what changed, what breaks, what was not checked.'

branding:
  icon: 'shield'
  color: 'blue'

inputs:
  # ── Operation mode ──────────────────────────────────────────────────────────
  mode:
    description: >
      Operation mode. The Action exposes four analysis modes, mirroring
      abicheck's core per-library CLI commands (compare/dump/deps tree/deps
      compare — ADR-043; the CLI additionally has project-orchestration
      commands like `aggregate` and `project plan` (ADR-054) that this
      Action does not expose as separate modes): "compare" (default)
      compares two ABI surfaces — old-library/new-library may be single
      binaries/snapshots OR directories/packages, in which case abicheck
      fans out to a per-library comparison automatically (no separate
      mode); omitting old-library (and abi-baseline) runs an audit-only
      `compare --no-baseline` against new-library alone, reporting no
      old/new compatibility verdict — see the migration section of
      docs/use/github-action.md for converting a `mode: scan` job (retired,
      ADR-068) to this shape, including the severity-preset requirement to
      keep it gating a CI job the way `mode: scan`'s own audit mode did;
      "dump" generates a JSON baseline snapshot from a single library (now
      also embeds optional L3/L4/L5 build-source evidence via source/build
      inputs); "deps-tree" resolves transitive dependencies and symbol
      bindings for one binary (Linux ELF); "deps-compare" compares a
      binary's full dependency stack across two sysroots (Linux ELF).
      `mode: scan` itself is retired outright (ADR-068 D8, hard removal,
      no deprecation window) — setting it fails the step with an error
      naming the replacement for your shape.
    required: false
    default: 'compare'

  # ── Library inputs ──────────────────────────────────────────────────────────
  old-library:
    description: >
      Path to the old library, JSON snapshot, or ABICC Perl dump. Required
      for a two-sided compare; omit it (and abi-baseline) to run an
      audit-only `compare --no-baseline` against new-library alone instead
      (the replacement for a baseline-less `mode: scan`/`audit: true`
      request — see the mode input's own description). May also be a
      directory or package (RPM, Deb, tar, conda, wheel) — abicheck then
      fans out to a per-library comparison automatically.
    required: false
  new-library:
    description: >
      Path to the new (current) library, binary, or JSON snapshot. Required
      for compare (both the two-sided and audit-only shapes), dump (unless
      a source-only sources/build-info/compile-db input is given), and
      deps-tree/deps-compare modes. May be a directory or package (RPM,
      Deb, tar, conda, wheel) ONLY in a two-sided compare, matching
      old-library — compare then fans out to a per-library
      comparison automatically. dump, and compare's own audit-only shape,
      each analyse exactly one artifact and reject a directory/package with
      an error (neither has a per-library fan-out); for a multi-library
      release, dump each library individually or use a two-sided compare
      instead.
    required: false
  new-library-set:
    description: >
      RETIRED (ADR-068 D8, hard removal, no deprecation window). It mapped
      to the now fully-removed `scan --artifact-set`/`mode: scan`:
      preserving its per-member manifest/coverage accounting needs ADR-065
      S3's package component inventories, and routing it onto `compare
      --no-baseline DIR` before those land would silently narrow those
      guarantees. Still declared so a
      workflow that sets it gets an explicit `::error::` naming that
      prerequisite instead of a silently-ignored input; run one audit-only
      compare per library until ADR-065 S3 lands.
      For a multi-library release comparison against an old side, use
      mode: compare with a directory/package operand instead.
    required: false

  # ── Package inputs (compare mode, directory/package operands only) ──────────
  debug-info1:
    description: 'Debug info package for old side (RPM/Deb/tar). compare mode, directory/package operands only.'
    required: false
  debug-info2:
    description: 'Debug info package for new side (RPM/Deb/tar). compare mode, directory/package operands only.'
    required: false
  devel-pkg1:
    description: 'Development package with headers for old side. compare mode, directory/package operands only.'
    required: false
  devel-pkg2:
    description: 'Development package with headers for new side. compare mode, directory/package operands only.'
    required: false
  dso-only:
    description: 'Only compare shared objects, skip executables. compare mode, directory/package operands only. Deliberately no declared default (Codex review, fresh evidence): the synthesized release:/gate: config overlay needs to tell "omitted" apart from an explicit "false" (which must override a discovered/explicit .abicheck.yml''s own release.dso_only: true) -- a declared default would make every omitted invocation indistinguishable from an explicit false, silently losing that override.'
    required: false
  include-private-dso:
    description: 'Include private (non-public) shared objects from non-standard paths. compare mode, directory/package operands only. Deliberately no declared default -- see dso-only''s own description for why.'
    required: false
  fail-on-removed-library:
    description: 'Exit 8 when a library present in old is proven removed in new -- NEW must have a proven-complete declared inventory: either a stored ProjectSnapshot package whose capture asserted inventory_complete, or a package archive (e.g. .rpm/.deb) whose own readable member table this run extracted and could enumerate in full (ADR-065 D2/S3); a live directory, or an archive whose member table could not be read in full, is an unproven inventory and an unmatched library there is an incomplete scope instead, governed by the scope.on_incomplete key in .abicheck.yml. compare mode, directory/package operands only. Deliberately no declared default -- see dso-only''s own description for why.'
    required: false

  # ── Header inputs ───────────────────────────────────────────────────────────
  header:
    description: >
      Public header file(s) applied to both sides (space-separated).
      Required when input is an ELF binary; ignored for JSON snapshots.
      If old and new actually declare different header sets (e.g. a new
      release added a header), set `old-header`/`new-header` instead --
      a bare `header` parses BOTH snapshots against the same files, which
      silently hides the removed/added declarations you're trying to check.
    required: false
  old-header:
    description: 'Public header(s) for the old side only (overrides header for old). Space-separated.'
    required: false
  new-header:
    description: 'Public header(s) for the new side only (overrides header for new). Space-separated.'
    required: false
  public-header-dir:
    description: >
      Directory whose headers are treated as public for provenance
      classification (repeatable, space-separated) — establishes the
      public/internal boundary so leakage/RTTI/exported-vs-public
      cross-checks run instead of skipping. dump mode forwards it as one
      more `-H/--header` root, which is where `dump` reads declaration
      provenance from AND extracts headers from (a directory entry tags
      everything under it public and expands to every header inside).
      compare's audit-only shape (old-library/abi-baseline both omitted)
      forwards it the same way, as a bare `-H` root applying to the one
      audited artifact — a two-sided compare has no equivalent flag.
    required: false
  build-target:
    description: >
      Explicit build-system root target(s) to scope L3 evidence collection
      to, instead of a workspace-wide query (P0.2; Bazel only so far, e.g.
      `//:math`). Space-separated, repeatable — each root's transitive
      dependency closure is unioned. **dump mode only.** `compare` has no
      equivalent.
    required: false

  # ── Include directories ─────────────────────────────────────────────────────
  include:
    description: >
      Extra include directories for header AST parsing (castxml or clang).
      Space-separated. Set this (or `old-include`/`new-include` for a
      side-specific root) whenever a header passed via `header` itself
      `#include`s a *dependency's* header from a separate include root
      (e.g. PVXS's own `version.h` pulling in EPICS Base's
      `epicsVersion.h`, found in a real PVXS Action acceptance run) --
      `header`/`public-header-dir` alone never cover a dependency's own
      headers. On ELF the parse then aborts on the first such include with
      a "file not found" error; on Mach-O/PE it can instead warn and fall
      back to export-table scoping (`--header`/`--include` are silently
      ignored for that dump), which is quieter but leaves header-based
      coverage incomplete rather than failing loud. In a two-sided
      `compare`, `old-include`/`new-include` *replace* this list for
      their side rather than adding to it (repeat any shared directory
      there too); in `dump` and compare's audit-only shape, a side-specific
      include is added alongside this list instead. (`sources`/`build-info`
      can sometimes auto-derive a build's own include dirs for this instead
      of a manual `-I`, when neither side has any explicit include input of
      its own.)
    required: false
  old-include:
    description: >
      Include directories for old side only. Space-separated. Used by a
      two-sided `compare`; not applicable to compare's audit-only shape,
      which has no old side. Replaces `include` for this side rather than
      adding to it (repeat any directory `include` also lists that's still
      needed).
    required: false
  new-include:
    description: >
      Include directories for new side only. Space-separated. In a
      two-sided `compare`, replaces `include` for this side rather than
      adding to it (repeat any directory `include` also lists that the new
      side still needs); in `dump` and compare's audit-only shape, it is
      added alongside `include` instead.
    required: false

  # ── Version labels ──────────────────────────────────────────────────────────
  old-version:
    description: 'Version label for the old library (embedded in reports).'
    required: false
    default: 'old'
  new-version:
    description: 'Version label for the new library (embedded in reports).'
    required: false
    default: 'new'

  # ── Language & compiler ─────────────────────────────────────────────────────
  lang:
    description: 'Language mode for header AST parsing: "c++" or "c".'
    required: false
    default: 'c++'
  ast-frontend:
    description: >
      L2 header-AST frontend for native-binary inputs: "auto" (resolves to
      castxml and never changes producer unless the CLI's
      --allow-ast-frontend-fallback flag is also passed via extra-args (or
      ABICHECK_ALLOW_AST_FALLBACK=1 is set) — with that opt-in, a recognized
      castxml toolchain-version mismatch, an unsupported castxml release, or
      a direct-include-guard failure falls back to clang, G16; without it,
      and on any host with no castxml at all, auto does not silently switch
      to clang — the command fails asking you to install castxml or pass
      ast-frontend: clang explicitly. One exception: a non-host
      --frontend-context (SYCL/DPC++, passed via extra-args) routes an auto
      that resolves to plain castxml (no pin) straight to clang with no
      opt-in needed, since castxml can't satisfy it at all — but any way of
      pinning the resolved backend away from plain castxml-or-clang still
      rejects it: an explicit ast-frontend: castxml, auto pinned to castxml
      via ABICHECK_AST_FRONTEND=castxml, and hybrid (explicit or auto
      pinned via ABICHECK_AST_FRONTEND=hybrid — hybrid has no device
      concept either) all reject a non-host context. Explicit
      ast-frontend: clang satisfies it directly, and so does auto pinned to
      clang via ABICHECK_AST_FRONTEND=clang),
      "castxml" (default), "clang" (clang -ast-dump=json; explicit opt-in
      for clang-only hosts), or "hybrid" (runs both and merges them; needs
      both tools installed on the runner, never auto-selected). Applies to
      dump, and compare mode with a single-pair (non-directory, non-package)
      operand — the per-library fan-out a directory/package compare uses
      never threads this L2 context to each pair's header dump, so a value
      other than "auto" (the no-op default) is a hard error there (shared
      `compile_context_options`, ADR-037 D3). Same as the
      ABICHECK_AST_FRONTEND env var.
    required: false
  gcc-path:
    description: >
      Path to GCC/G++ (or clang) cross-compiler binary. Like dump and
      single-pair compare (including the audit-only shape), it folds into
      a synthesized .abicheck.yml compile: block forwarded via --config
      (together with gcc-prefix, gcc-options, sysroot, and nostdinc, when
      any of those are also set). Applies to dump, and compare mode with a
      single-pair (non-directory, non-package) operand — a directory/
      package compare rejects it with an error (same restriction as
      ast-frontend above). Combining any of this group with build-config
      is supported: the synthesized compile: block is merged into a copy
      of the named build-config, and this Action's input wins on a key
      conflict.
    required: false
  gcc-prefix:
    description: >
      Cross-toolchain prefix, e.g. aarch64-linux-gnu-. Folds into the same
      synthesized compile: block gcc-path describes above, on every mode
      that accepts it (a full gcc-path wins if both are set, since the
      merged compile.compiler config key can only hold one). Applies to
      dump, and compare mode with a single-pair (non-directory,
      non-package) operand — a directory/package compare rejects it with
      an error (same restriction as ast-frontend above).
    required: false
  gcc-options:
    description: >
      Extra compiler flags passed through to the header frontend. Folds
      into a synthesized compile.options list in the same synthesized
      compile: block gcc-path describes above, on every mode that accepts
      it. A single-line
      value is shell-quoting-aware split on whitespace into separate flags
      (a quoted segment such as -DMSG="hello world" stays one flag, but
      that one flag still contains a space internally); a multi-line
      (YAML block scalar) value treats each line as one already-complete
      flag, not split further. Either way, each resulting compile.options
      entry must be a single whitespace-free flag -- a flag containing a
      space (whether from a quoted single-line segment or a spaced
      multi-line entry) is rejected with a clear error rather than
      silently accepted or silently split further; put each word needing
      its own flag on its own line instead. This is a real, accepted
      narrowing from an earlier Action version, where the CLI's own
      now-removed --compiler-option flag once forwarded such a flag
      verbatim (a raw CLI arg is not subject to compile.options' own
      whitespace-free-atom contract). Applies to dump, and compare mode
      with a single-pair (non-directory, non-package) operand — a
      directory/package compare rejects it with an error (same
      restriction as ast-frontend above).
    required: false
  sysroot:
    description: 'Alternative system root directory for cross-compilation. On dump and single-pair compare (including the audit-only shape) this folds into the same synthesized compile: block gcc-path describes above (deps-tree keeps its own direct --sysroot CLI forwarding, unaffected -- it is not part of this compile-context group at all). Applies to dump, deps-tree, and compare mode with a single-pair (non-directory, non-package) operand — a directory/package compare rejects it with an error (same restriction as ast-frontend above).'
    required: false
  nostdinc:
    description: >
      Do not search standard system include paths. On dump and single-pair
      compare this folds into the same synthesized compile: block gcc-path
      describes above. Applies to dump, and compare mode with a
      single-pair (non-directory, non-package) operand — a directory/package
      compare rejects it with an error (same restriction as ast-frontend above).
    required: false
    default: 'false'

  # ── Full-stack dependency validation (Linux ELF) ─────────────────────────────
  follow-deps:
    description: >
      Include transitive dependency graph and symbol binding info in dump or
      compare output. ELF only. Applies to dump and compare modes. For
      compare, requires a baseline (old-library or abi-baseline) -- rejected
      outright for the audit-only shape (compare --no-baseline's own
      DT_NEEDED dependency walk is not wired to that path yet).
    required: false
    default: 'false'
  old-root:
    description: >
      Sysroot for the old (baseline) environment. Required for
      mode=deps-compare.
    required: false
  new-root:
    description: >
      Sysroot for the new (candidate) environment. Required for
      mode=deps-compare.
    required: false
  search-path:
    description: >
      Additional directories to search for shared libraries (space-separated).
      Used by deps-tree, deps-compare, and follow-deps.
    required: false
  ld-library-path:
    description: >
      Simulated LD_LIBRARY_PATH (colon-separated). Used by deps-tree,
      deps-compare, and follow-deps.
    required: false

  # ── Scoped comparison: app-usage / required-symbol contracts (compare mode) ──
  used-by:
    description: >
      Application binary/binaries whose actual imports/required symbol
      versions scope the comparison (space-separated; maps to repeated
      compare --used-by). The full library comparison always determines
      this run's own verdict/exit code; the supplied application's own
      confirmed/potential/unresolved impact is reported alongside it
      (informational), never in place of it. Mutually exclusive with
      required-symbol/required-symbols (the CLI rejects both being set).
      Requires a baseline (old-library or abi-baseline) -- rejected
      outright for the audit-only shape (consumer scoping needs two
      versions to compare, and an audit has none).
      compare mode only.
    required: false
  used-by-manifest:
    description: >
      Path(s) to a JSON document naming one or more consumer binaries
      (space-separated; maps to repeated compare --used-by-manifest), each
      with optional digest/platform/profile/provider_baseline provenance and
      a requirement ("required", the default -- an unreadable consumer
      aborts the run, same as used-by -- or "advisory" -- an unreadable
      consumer is skipped and reported instead). Merged into the same
      scoping pipeline as used-by; every listed consumer counts toward the
      reported "N of M consumers affected" summary
      (consumer_impact_summary in --format json). Mutually exclusive with
      required-symbol/required-symbols. compare mode only. Requires a
      baseline (old-library or abi-baseline) -- rejected outright for the
      audit-only shape, same reason as used-by above.
    required: false
  required-symbol:
    description: >
      An exported linker symbol a plugin host resolves via dlopen/dlsym
      and requires (space-separated; maps to repeated compare
      --required-symbol). The full library comparison always determines
      this run's own verdict/exit code; this contract's own confirmed/
      potential/unresolved impact is reported alongside it (informational),
      never in place of it. Mutually exclusive with used-by. compare mode
      only. Requires a baseline (old-library or abi-baseline) -- rejected
      outright for the audit-only shape, same reason as used-by above.
    required: false
  required-symbols:
    description: >
      Path to a file of required symbols, one per line (blank lines and
      '#' comments ignored) -- combined with any required-symbol values.
      compare mode only. Requires a baseline (old-library or abi-baseline)
      -- rejected outright for the audit-only shape, same reason as
      used-by above.
    required: false

  # ── Source-scan & build-source evidence (dump / compare modes) ────────────────────────
  against:
    description: >
      RETIRED (ADR-068's Action-input-lifecycle amendment, D8 hard
      removal). This applied only to the now-removed mode: scan, as the
      baseline artifact to compare the scanned new-library against. Set
      old-library (or abi-baseline) to the same value under mode: compare
      instead. Still declared so a workflow that sets it gets an explicit
      `::error::` naming that replacement instead of a silently-ignored
      input.
    required: false
  sources:
    description: >
      Source checkout / tree for source-intelligence analysis. The compile
      database is auto-discovered within it. Drives L4 source-ABI replay and
      L5 source-graph collection. Used by dump mode, and by compare mode
      for the new (candidate) side only — mapped to compare's
      --sources new=... (the old side's evidence, if any, is expected to
      already be embedded in whatever old-library snapshot was resolved;
      not applicable to compare's audit-only shape, which has no old side).
    required: false
  build-info:
    description: >
      Out-of-tree L3 build context: a build directory, a compile_commands.json,
      or a previously-collected evidence pack. Use when the build tree lives
      outside --sources. Used by dump mode, and by compare mode for
      the new (candidate) side only — mapped to compare's
      --build-info new=... (same old-side caveat as sources above).
    required: false
  compile-db:
    description: >
      Explicit path to a compile_commands.json, when it is not under
      `sources`. Folded into `--build-info` for every mode that accepts it
      (dump, and compare mode's new side) — `--build-info` already accepts
      a build dir, a compile_commands.json, or a pre-captured pack, so it
      is the one flag that takes this operand.
    required: false
  build-config:
    description: >
      Path to a trusted .abicheck.yml. For dump mode, supplying this
      alone is enough — an explicit --config is itself the operator's
      consent to run its build.query. Used by dump mode, and by compare
      mode (--config). Also the only way to configure the cross-library
      bundle-analysis layer's system-provider allow-list extension and
      co-versioned cohort declarations: .abicheck.yml's `bundle:` block
      (`system_providers:`/`cohorts:`, CLI cleanup phase two, PR J — there
      is no longer a per-invocation Action input for either, matching the
      native CLI's own removal of --bundle-system-providers/
      --bundle-cohort). `system_providers:` applies to compare mode
      (directory/package operands); `cohorts:` (the SONAME-skew check)
      applies to compare only.
    required: false
  jobs:
    description: >
      Removed and ignored (ADR-068 D5). This input used to forward
      `-j/--jobs` to `compare`, capping the directory/package release
      fan-out's worker count. Both the flag and the input are gone: the
      release engine auto-detects the CPU count and clamps it to available
      memory, and there is no manual override any more. Kept registered as
      a tombstone — deleting the input outright made GitHub drop it before
      the Action ever ran, so a pinned workflow that still sets it got no
      error and no annotation, and its worker cap silently stopped
      applying. Setting it now emits an explicit warning telling you it has
      no effect. Remove it from your workflow.
    required: false
  bundle-system-providers:
    description: >
      Removed (CLI cleanup phase two, PR J). The cross-library
      bundle-analysis layer's system-provider allow-list extension moved to
      `.abicheck.yml`'s `bundle.system_providers:` block, reachable through
      the `build-config` input. Kept registered as a tombstone for the same
      reason as `jobs` above — an undeclared input is dropped silently,
      which here would drop a real analysis setting. Setting it is a hard
      error: move the list into `.abicheck.yml` and point `build-config` at
      it.
    required: false
  allow-build-query:
    description: >
      Deprecated and ignored. The `--allow-build-query` dump flag it used to
      forward was already a no-op and has since been removed outright (CLI
      cleanup H1); this input is kept registered only so an existing
      workflow that still sets it doesn't get an unknown-input warning.
      abicheck always runs its own inferred, abicheck-authored
      cmake/bazel/make compile-DB query whenever a sources input needs build
      context: pointing abicheck at a source tree is itself the request to
      analyse it. A trusted, operator-supplied build.query (`build-config`)
      needs no opt-in either — see `build-config` above.
    required: false
    default: 'false'
  depth:
    description: >
      Evidence-depth selector: binary, headers, build, or source. Used by
      dump mode, and by compare mode (--depth) -- both the two-sided and
      audit-only shapes. Omitting it means 'headers' -- set it to build or
      source explicitly to collect those (there is no risk-driven auto
      escalation). --depth source analyses the whole current library
      target unless since/changed-path seeds a narrower changed scope. Maps
      to --depth.
    required: false
  since:
    description: >
      compare mode (single-pair operands, two-sided only). Focus the run's
      source-evidence scope on files changed vs a ref (e.g.
      origin/main). Maps to compare --since. Not forwarded
      for a compare directory/package operand (the per-library release
      fan-out collects no build/source evidence for either side to scope).
      Rejected outright (step fails before any dependency install) for
      compare's audit-only shape (old-library and abi-baseline both
      omitted): compare --no-baseline does not implement revision-range
      evidence scoping (ADR-068 D2) -- set old-library (or abi-baseline)
      to use since.
    required: false
  changed-path:
    description: >
      compare mode (single-pair operands, two-sided only). Changed path(s) to
      focus the run's source-evidence scope on (space-separated; alternative
      to since). Maps to repeated compare --changed-path. Not forwarded for
      a compare directory/package operand, same as since above. Rejected
      outright for compare's audit-only shape, same as since above and for
      the same reason.
    required: false
  budget:
    description: >
      compare mode, two-sided shape only. Time guard (e.g. 15m, 900s, 1h).
      The step FAILS on overflow (exit 5) — a budget never silently shrinks
      scope. Maps to compare --budget. Rejected outright (step fails before
      any dependency install) for compare's audit-only shape (old-library
      and abi-baseline both omitted): compare --no-baseline does not wire
      the wall-clock guard to that path yet (ADR-068 D2) -- set old-library
      (or abi-baseline) to use budget.
    required: false
  dry-run:
    description: >
      Resolve inputs/config and print what the run would do, without
      performing any analysis or writing output. Exits 0 for a resolvable
      preview; an invocation the real run would itself reject (an invalid
      flag combination) still exits with that same usage error, and a
      requested-but-unsatisfiable depth/evidence contract still exits
      nonzero — a dry run validates what it can see, it does not turn every
      outcome into success. The one deliberate exception is this
      composite Action's own baseline resolution: an unresolved
      abi-baseline is tolerated under dry-run rather than hard-failing,
      since the point of a preview is to report what *would* be compared,
      not to require the comparison already be resolvable. Maps to
      --dry-run; supported by every mode (compare -- both the two-sided and
      audit-only shapes -- dump, deps-tree, deps-compare). To preview an
      audit-only single-build hygiene lint instead of a two-sided compare,
      simply omit old-library and abi-baseline for that step.
    required: false
    default: 'false'
  estimate:
    description: >
      RETIRED (ADR-068). This applied only to the now-removed mode: scan,
      as a dry-run alias. Use dry-run: 'true' instead, which applies to
      every mode. Still declared so a workflow that sets it gets an
      explicit `::error::` naming that replacement instead of a
      silently-ignored input.
    required: false
    default: 'false'
  audit:
    description: >
      RETIRED (ADR-068). This applied only to the now-removed mode: scan,
      forcing a one-build audit-only run. Under mode: compare, simply omit
      old-library and abi-baseline to run an audit-only compare
      --no-baseline instead; set severity-preset (e.g. 'default') if this
      job should still gate on a BREAKING/API_BREAK-classified finding the
      way mode: scan's own audit mode always did. Still declared so a
      workflow that sets it gets an explicit `::error::` naming that
      replacement instead of a silently-ignored input.
    required: false
    default: 'false'
  crosscheck:
    description: >
      RETIRED (ADR-068 D8, hard removal -- dropped, superseded, not a hard
      removal with nothing to replace it). `scan --crosscheck`'s KEY=LEVEL
      promotion syntax, which this input mapped to, no longer exists (along
      with mode: scan itself): every cross-source check it used to gate
      already reaches `compare` as an ordinary `ChangeKind`, so `policy` /
      `.abicheck.yml`'s `policy.overrides.<CHANGE_KIND>: error` already lets
      you control any one check's severity — only the KEY=LEVEL syntax
      itself doesn't survive. Still declared so a workflow that sets it gets
      an explicit `::error::` naming that replacement instead of a
      silently-ignored input.
    required: false
  risk-rules:
    description: >
      RETIRED (ADR-068 D8, hard removal). `scan --risk-rules` is gone,
      together with mode: scan itself and the risk-driven `auto` depth
      escalation it fed: an omitted `depth` now resolves to the fixed
      `headers` rung — the same default `compare` has always used — instead
      of being scored from the changed paths. Set `depth: source` (or
      `build`) explicitly to pin the level a risk profile used to escalate
      to. Still declared so a workflow that sets it gets an explicit
      `::error::` saying so.
    required: false
  # ── Baseline auto-fetch (compare mode) ──────────────────────────────────────
  abi-baseline:
    description: >
      Automatically fetch an ABI baseline snapshot for compare mode, used
      as old-library.
      Values: "latest-release" fetches *.abicheck.json from the latest GitHub Release;
      a tag name (e.g. "v2.0.0") fetches from that release; a file path uses the
      file directly. Requires GITHUB_TOKEN with contents:read permission.
      Overrides old-library when set. When the
      resolved release has no single `*.abicheck.json[.gz|.zst]` asset, set
      baseline-profile and baseline-target to instead fetch a
      release-contract baseline-set archive
      (`abicheck-baseline-<profile>.tar.zst`, published by
      publish-baseline.yml -- see docs/reference/publish-baseline.md); the
      single-snapshot search always takes priority when both exist.
    required: false
  baseline-profile:
    description: >
      Selects which contract profile's baseline-set to fetch when
      abi-baseline resolves to a release-contract baseline-set archive
      (docs/reference/publish-baseline.md) rather than a single
      *.abicheck.json asset. Requires baseline-target to also be set. Omit
      when the release publishes a single-snapshot asset (abi-baseline's
      original, unchanged contract) -- this input is only consulted as a
      fallback when that search finds nothing.
    required: false
  baseline-target:
    description: >
      The target/library id (the baseline-set manifest.json's "library"
      field, matching the name passed to actions/baseline's `libraries`
      input when the baseline-set was published) to resolve from the
      baseline-set archive selected by baseline-profile. Required when
      baseline-profile is set.
    required: false
  baseline-asset-name-template:
    description: >
      Release asset filename template for the baseline-set archive
      fetched via baseline-profile; "{profile}" is replaced with
      baseline-profile's value, and "{generation}" (optional) with
      baseline-generation's value. Must match the asset-name-template the
      publishing workflow (publish-baseline.yml, or a custom equivalent)
      used.
    required: false
    default: 'abicheck-baseline-{profile}.tar.zst'
  baseline-generation:
    description: >
      Substituted for "{generation}" in baseline-asset-name-template --
      set this when the publishing workflow's asset-name-template
      includes "{generation}" (e.g. it published a baseline scoped to a
      scanner-compatibility generation -- see baseline-management.md's
      "Scanner upgrades and baseline generations" section). Omit when
      baseline-asset-name-template doesn't reference "{generation}" at
      all -- the default template never does, so this input is a no-op
      unless you opt in by including the placeholder.
    required: false

  # ── Output & policy ─────────────────────────────────────────────────────────
  format:
    description: >
      Output format: json, markdown, sarif, html, junit, review, or oneline
      (each mode's default when this input is left unset). compare, two-sided
      shape, single-pair (non-directory, non-package) operand: all seven.
      compare, two-sided shape, directory/package operand: json, markdown, or
      junit only — sarif/html/review/oneline are rejected with an error (the
      per-library release fan-out has no single report those formats
      describe). compare, audit-only shape (old-library/abi-baseline both
      omitted): json, markdown, sarif, junit, or oneline — html and review
      are two-sided-report renderers with no audit-only equivalent and are
      rejected with an error. html is also supported by deps-tree/deps-compare
      (a dependency-stack report); sarif/junit/review/oneline are not. dump
      ignores this input; it always writes a JSON snapshot. Requesting an
      unsupported format for the mode/shape is a hard error raised before any
      dependency install (it used to silently fall back to a supported
      format with only a warning, which is unsafe for CI — see
      upload-sarif). Deliberately has no Action-level default (unlike most
      inputs): GitHub Actions has no way to tell "left unset" from
      "explicitly set to the default" apart once a default is declared —
      each mode branch in action/run.sh supplies its own correct default
      instead.
    required: false
  output-file:
    description: 'Path to write the report file. If not set, output goes to stdout and job summary.'
    required: false
  snapshot-compression:
    description: >
      dump mode only (ADR-059). Storage envelope for the written snapshot:
      'auto' (default) infers gzip/zstd/plain from output-file's canonical
      suffix (.abicheck.json.gz/.abicheck.json.zst/plain .abicheck.json);
      an explicit 'none', 'gzip', or 'zstd' is used as-is and is a hard
      error if it contradicts output-file's suffix, mirroring the CLI's
      own --compression flag it maps to directly. Ignored by every other
      mode -- compare/deps-tree/deps-compare produce a report, not a
      stored snapshot, and transparently read a compressed snapshot
      operand either way via magic-byte detection regardless of this
      input.
    required: false
  policy:
    description: 'Built-in policy profile: strict_abi (default), sdk_vendor, plugin_abi.'
    required: false
    default: 'strict_abi'
  policy-file:
    description: >
      Path to a YAML policy document with per-kind (overrides:) or
      selector-scoped (reclassify:) verdict re-classification, or the name of
      a packaged built-in one (e.g. `security`). Forwarded as `--policy`,
      which takes a profile name or a document; setting this outranks
      `policy` for the run, exactly as the removed `--policy-file` flag did.
    required: false
  suppress:
    description: 'Path to a YAML suppression file to filter known/intentional changes.'
    required: false
  verbose:
    description: 'Enable verbose/debug output from abicheck.'
    required: false
    default: 'false'

  # ── Action-specific behaviour ───────────────────────────────────────────────
  python-version:
    description: 'Python version for setup-python.'
    required: false
    default: '3.13'
  install-deps:
    description: >
      Deprecated — use `dependency-source` instead (kept for one release
      cycle). Ignored if `dependency-source` is set. true (the default) maps
      to dependency-source=conda-forge; false maps to dependency-source=none.
    required: false
    default: 'true'
  dependency-source:
    description: >
      How to install system dependencies (castxml, gcc/g++, clang, bear):
      'conda-forge' (default — this repo's pixi-managed `scanner` conda-forge
      environment, castxml 0.7.x + whichever gcc/g++ conda-forge currently
      resolves as default; Linux/macOS only, no clang, no bear),
      'conda-forge-gcc14' (same, but pinned to gcc/g++ 14.x instead of
      whatever's currently default; Linux-only, no clang, no bear),
      'conda-forge-clang20' (castxml + clang/clang++ 20.x instead of gcc —
      the one conda-forge source that provides clang, needed for L4 source-ABI
      replay and the clang-backed call/type/include-graph edges of L5 (the
      structural L5 source graph itself still builds from L3 build evidence
      alone, without clang); Linux/macOS, no bear), 'system' (apt/Homebrew
      + the pinned CastXML Superbuild — the previous default, still available;
      installs bear on Linux only — the macOS path installs only castxml via
      Homebrew and relies on Xcode's preinstalled clang, no bear), or 'none'
      (skip; dependencies must already be on PATH). Leave unset to fall back
      to `install-deps` for backward compatibility. **On a Windows runner the
      unset default is 'system', not 'conda-forge'** — every conda-forge
      source is unsupported there, so the usual default would hard-fail
      before analysis; an explicitly requested conda-forge* still errors
      rather than being silently rewritten.
    required: false
    default: ''
  upload-sarif:
    description: >
      Upload SARIF results to GitHub Code Scanning (requires security-events: write permission).
      Requires format=sarif and mode=compare — setting this with any other
      mode or format is a hard error raised before any dependency install
      (mode=dump/deps-tree/deps-compare never produce a SARIF report).
    required: false
    default: 'false'
  fail-on-breaking:
    description: 'Fail the step when a binary ABI break is detected (exit code 4).'
    required: false
    default: 'true'
  fail-on-api-break:
    description: 'Fail the step when a source-level API break is detected (exit code 2).'
    required: false
    default: 'false'
  severity-preset:
    description: >
      Severity preset: 'default', 'strict', or 'info-only'.
      Controls exit codes and report labels. Applies to compare mode --
      both the two-sided shape and the audit-only shape, where it is also
      the required opt-in for the AUDIT_GATE audit-gate axis: that axis is
      inactive by default (see the AUDIT_GATE verdict entry below), so set
      this to a value other than 'info-only' to gate an audit-only run on a
      BREAKING/API_BREAK-classified finding. Does not apply to dump,
      deps-tree, or deps-compare.
    required: false
  require-complete-analysis:
    description: >
      Fail the step (P0.4's orthogonal ANALYSIS_INCOMPLETE axis) when
      analysis_assurance.status is not 'complete', independent of the
      compatibility verdict. Mirrors `compare`'s own
      --require-complete-analysis flag. Applies to single-pair compare
      (old-library/new-library are individual files, not a directory or
      package) -- both the two-sided and audit-only (`--no-baseline`)
      shapes, which the CLI accepts identically -- rejected outright
      (step fails) for a directory/package compare's per-library release
      fan-out, which has no single analysis_assurance result to gate on.
      A dedicated
      input rather than routing through extra-args, so this Action's own
      detection of whether the flag was requested is never ambiguous
      with a value some other option in extra-args happens to spell the
      same way.
    required: false
    default: 'false'
  annotate:
    description: >
      Emit GitHub Actions workflow command annotations (inline PR-diff
      comments) for ABI/API findings, in compare mode's two-sided shape
      (single-pair and directory/package release operands alike). Not
      supported for compare's audit-only shape (old-library/abi-baseline
      both omitted) -- its report has no additions/removals to annotate,
      only candidate-side findings; requesting it there emits a
      ::notice:: explaining why and renders nothing, rather than silently
      producing zero annotations. Rendered by this Action
      itself from the run's own persisted JSON report (schema 2.43+), not
      by passing --annotate to the abicheck CLI -- no second comparison is
      ever run to collect them, for either operand shape. Has no effect on
      dump/deps-tree/deps-compare. A dedicated input rather than
      routing through extra-args, for the same reason
      require-complete-analysis is: this Action's own detection of whether
      annotations were requested is never ambiguous with some other
      extra-args value.
    required: false
    default: 'false'
  annotate-additions:
    description: >
      Include additions and other compatible-but-notable changes as
      ::notice annotations. Off by default (only errors/warnings, plus the
      one notice kind that is always shown regardless of this input -- a
      --contract finding compatibility policy did not evaluate). Has no
      effect unless annotate is also true.
    required: false
    default: 'false'
  extra-args:
    description: 'Additional CLI arguments passed directly to the abicheck command.'
    required: false
    default: ''
  add-job-summary:
    description: 'Write a markdown summary to the GitHub Actions Job Summary. Ignored for dump mode.'
    required: false
    default: 'true'
  pr-comment:
    description: >
      Post a sticky ABI report comment on the pull request. Supports compare
      mode (both the two-sided shape, including directory/package operands,
      and the single-artifact audit-only shape), rendering the same
      verdict/breaking/needs-review sections plus a green "Public API
      additions" table, and (audit-only) a risk/coverage summary line. The
      comment is a content channel and never changes the check's red/green
      state — breaks still
      gate via fail-on-breaking / fail-on-api-break. Defaults to 'true', but
      is a no-op unless the workflow is triggered by a pull_request event
      and a token with 'pull-requests: write' is available.
    required: false
    default: 'true'
  pr-comment-mode:
    description: >
      'update' (default) keeps a single sticky comment and edits it in place on
      every run; 'new' posts a fresh comment each run. Either way the scanned
      head SHA is shown in the comment.
    required: false
    default: 'update'
  pr-comment-on:
    description: >
      When to comment: 'changes' (default) only comments when there is at least
      one ABI/API change, 'always' comments every run (including a clean
      "no changes" result), 'never' disables the comment.
    required: false
    default: 'changes'
  pr-comment-detail:
    description: >
      Detail level of the comment body: 'summary' (verdict + counts only),
      'standard' (default; per-symbol tables for breaking/review, grouped safe
      list) or 'full' (every change with locations, all sections expanded).
    required: false
    default: 'standard'
  github-token:
    description: >
      Token used to post the PR comment and to auto-fetch release baselines.
      Defaults to the workflow token; requires 'pull-requests: write' for the
      comment.
    required: false
    default: ${{ github.token }}

outputs:
  verdict:
    description: >
      ABI verdict. For compare (single-pair or directory/package operands,
      two-sided shape):
      COMPATIBLE, COMPATIBLE_WITH_RISK (a real, exit-0 tier -- the report
      found a compatible-but-risky change, e.g. a toolchain-floor raise; R1,
      CLI-audit: this was previously laundered into plain COMPATIBLE at exit
      0, silently dropping every risk finding from this Action's own output),
      SEVERITY_ERROR (with the severity-preset input, or when a
      `severity.addition: error` key in the repository's .abicheck.yml
      detects new public API additions),
      COVERAGE_INCOMPLETE (with --contract via extra-args, when
      the selected contract domain cannot be closed on the available
      evidence -- ADR-049's orthogonal coverage axis, which leaves the
      compatibility verdict unchanged), SCOPE_INCOMPLETE (directory/package
      operands only, ADR-065: a selected member went unchecked under
      `.abicheck.yml`'s `scope.on_incomplete: block` key, or the run
      completed no comparison at all -- the completeness axis, orthogonal
      to the compatibility verdict, which then covers the compared members
      only; fails the step unconditionally, since no fail-on-* input governs
      it), ANALYSIS_INCOMPLETE (single-pair
      operands only, with the require-complete-analysis input, when
      analysis_assurance.status is not "complete" -- P0.4's orthogonal
      assurance axis, which likewise leaves the compatibility verdict
      unchanged; rejected outright for a directory/package operand, so
      this verdict never applies there), API_BREAK,
      BREAKING, REMOVED_LIBRARY (directory/package
      operands with fail-on-removed-library set), or ERROR.
      For compare's audit-only shape (old-library and abi-baseline both
      omitted -- the replacement for a baseline-less mode: scan/audit: true
      request, ADR-068): COVERAGE_INCOMPLETE (with --contract via
      extra-args, when the selected contract domain cannot be closed on the
      available evidence -- the same orthogonal coverage axis as the
      two-sided shape above; on this shape it is exit 1's only source, since
      there is no bare severity-gate exit 1 here), AUDIT_GATE (a real,
      BREAKING/API_BREAK-classified
      finding was detected against the candidate's own public surface while
      a severity preset other than `info-only` was in effect. Gating is
      opt-in: this Action never injects a preset on your behalf, so you
      must set the severity-preset input yourself (e.g. `default`) to get
      this axis at all -- unlike legacy `mode: scan`'s own audit mode,
      which gated by default with no flag needed; see the migration notes
      in this file's `mode` input and in docs/use/github-action.md. This is
      NOT a two-sided compatibility
      verdict -- an audit reports no additions, removals, or compatibility
      verdict at all; only the candidate-side findings themselves. Exit
      code 3, fails the step unconditionally, since no fail-on-* input
      governs an axis with no compatibility verdict to follow),
      AUDIT_CLEAN (exit 0: the same shape as AUDIT_GATE, but no
      candidate-side finding at all was detected against the candidate's
      own public surface -- not a two-sided compatibility verdict either,
      since no baseline was compared),
      AUDIT_RISK (exit 0: a real candidate-side finding WAS detected, but
      this run did not gate on it -- no severity-preset opt-in reached a
      BREAKING/API_BREAK-classified finding, or the only finding present is
      RISK-classified, which policy/audit_gate_exit.py never gates
      regardless of preset. Distinct from AUDIT_CLEAN so a reviewer can
      tell "nothing found" apart from "something found, not gating" --
      both exit 0, neither fails the step, but only one has something
      worth reading in the JSON report's findings[]),
      ANALYSIS_INCOMPLETE (with the require-complete-analysis input, when
      analysis_assurance.status is not "complete" -- the same P0.4
      orthogonal assurance axis as the two-sided shape above, reachable
      here since require-complete-analysis applies to both compare shapes;
      not a two-sided compatibility verdict either, since no baseline was
      compared -- fails the step unconditionally),
      NOT_COMPARABLE (two-sided shape only, with the old-library or
      abi-baseline input: when the candidate and baseline were not
      extracted under a comparable profile/scope contract -- ADR-050 D2 --
      so no comparison could run at all; this verdict fails the step
      unconditionally, since no fail-on-* input governs a run in which no
      comparison happened. Never reachable on the audit-only shape, which
      has no baseline to mismatch against), BUDGET_OVERFLOW (two-sided
      shape only, with the budget input), EVIDENCE_CONTRACT_ERROR
      (this run's evidence contract could not be satisfied -- ADR-037 D5
      -- so no comparison could run at all; two independent causes share
      this one verdict: a pinned --depth/--source-method whose required
      source evidence was never collected, or --abi3 targeting a binary
      that isn't a recognisable CPython extension module -- see the
      command's own error message for which one applied. Like
      NOT_COMPARABLE, this fails the step unconditionally and is
      distinct from ERROR, which covers a genuine CLI/config error.
      Reachable on the audit-only shape too, since the underlying
      precondition checks run regardless of whether a baseline comparison
      follows -- this axis is unambiguous to `action/run.sh`'s exit-code
      dispatch regardless of format, pr-comment setting, or extra-args,
      closing a gap four successive review rounds found in three earlier
      signaling designs (a stderr marker line, then a marker-file path,
      each shown forgeable by a PR-controlled build script the run's own
      evidence collection spawns -- see ADR-064 for the full account).
      Whether a JSON report also exists for this Action to read
      (auto-injected `--write json=...` sidecar, extra-args naming one,
      `format: json`, or extra-args overriding `--format` in either
      direction, detected via `_effective_format`) still decides only
      whether the sticky PR comment and JSON-consuming outputs have
      structured detail to show, not whether this verdict/exit-code
      publish at all), or ERROR.
      For dump: COMPATIBLE or ERROR.
      For deps-compare: PASS, WARN, FAIL, or ERROR.
      For deps-tree: PASS, FAIL, or ERROR.
      For a two-sided compare, verdict and exit-code are different axes and
      may disagree: BREAKING/API_BREAK follows the report's compatibility
      verdict (what was *detected*) while the exit code follows what the
      severity policy chose to *gate* on. So a demoting policy (e.g.
      --severity-preset info-only) can publish BREAKING with exit code 0
      (nothing gated), and a policy that demotes abi_breaking while some
      other gate still fires -- potential_breaking: error, say -- can
      publish BREAKING with exit code 2.
      The same holds at exit code 1: a demoted abi_breaking alongside an
      error-level addition/quality finding publishes BREAKING or API_BREAK
      while the exit code names the severity tier that gated, so exit 1 is
      not always SEVERITY_ERROR or COVERAGE_INCOMPLETE.
      In both cases the verdict stays truthful and the step still gates at
      the tier the exit code names, so fail-on-breaking does not re-gate a
      break the policy demoted. Branch on verdict for what was found, and on
      exit-code for the tier abicheck itself gated at. Note that neither is
      the same as whether this step failed: the fail-on-* inputs decide that,
      so an ordinary API break with the default fail-on-api-break: false
      publishes exit-code 2 from a step that succeeded. Use the step's own
      outcome/conclusion for that.
    value: ${{ steps.run-abicheck.outputs.verdict }}
  exit-code:
    description: >
      abicheck exit code. compare, two-sided shape: 0 (compatible), 1
      (severity error, incomplete contract coverage, incomplete analysis
      assurance with
      the require-complete-analysis input, or -- directory/package
      operands, ADR-065 -- an incompletely checked comparison scope under
      `.abicheck.yml`'s scope.on_incomplete: block key, or no comparison completed at all under
      either setting; the four share the code and are told apart by the
      report's pre-fold severity.exit_code /
      contract_coverage_exit_contribution / analysis_assurance.status /
      the exit block's incomplete_scope_contribution and
      no_comparison_completed_contribution),
      2 (API break),
      4 (ABI break), 8 (library proven removed; directory/package operands
      with fail-on-removed-library set and a proven-complete NEW
      inventory).
      compare, audit-only shape (old-library/abi-baseline both omitted):
      0 (compatible/advisory), 1 (incomplete contract coverage, or
      incomplete analysis assurance with
      the require-complete-analysis input -- unlike the two-sided shape,
      there is no bare severity-gate exit-1 source here (severity-based
      audit gating uses the dedicated exit 3 below instead). A third
      cause, dry-run only: with dry-run true, a live-candidate (not a
      stored snapshot) request pinning depth: build/source via extra-args
      with no sources/build-info given previews a blocker the real run
      would hit at exit 7 -- the dry-run preview itself reports VERDICT
      ERROR at exit 1 rather than 7, since no analysis actually ran to
      collect that evidence contract in the first place. These three are
      exit 1's only causes on this shape; the first two are told apart the
      same way, one level down under diff),
      3 (AUDIT_GATE -- the audit-gate axis;
      see the verdict output's own description above),
      7 (evidence-contract error, ADR-037 D5, VERDICT=EVIDENCE_CONTRACT_ERROR
      -- either a pinned --depth/--source-method whose required source
      evidence was never collected, or --abi3 targeting a binary that
      isn't a recognisable CPython extension module; reachable on the
      audit-only shape too, since the underlying precondition checks run
      regardless of whether a baseline comparison follows -- see the
      verdict output's own description above). budget/exit-5 does not
      apply to the audit-only shape (rejected outright upstream, per the
      budget input's own description).
      deps-compare: 0 (pass), 1 (warn),
      4 (fail). deps-tree: 0 (ok), 1 (missing). Click CLI errors are mapped to
      VERDICT=ERROR.
    value: ${{ steps.run-abicheck.outputs.exit-code }}
  report-path:
    description: >
      Path to the generated report file. Set when output-file is provided,
      or auto-populated for SARIF format (defaults to abicheck-results.sarif).
      Withheld (empty) when format: sarif and upload-sarif: true were both
      requested but extra-args overrode --format away from sarif -- the
      real file exists but its content isn't SARIF, and this is the exact
      value the upload-sarif step below gates on, so withholding it skips
      that upload rather than feeding mismatched content to CodeQL.
    value: ${{ steps.run-abicheck.outputs.report-path }}

runs:
  using: 'composite'
  steps:
    # ── 0. Validate mode/input combinations ──────────────────────────────────
    # Fails fast on an unsupported mode/input combination (e.g. a directory
    # passed to dump, or format: sarif on a non-compare mode) before
    # Python setup, system-dependency installation, or any build/analysis
    # work runs — see action/validate-inputs.sh for the rationale. It also
    # warns (not fails) when a mode-scoped input is set on a mode it has no
    # effect on — a legal-but-inert combination, not an error.
    - name: Validate mode/input combination
      shell: bash
      env:
        INPUT_MODE: ${{ inputs.mode }}
        # Removed inputs, kept declared as tombstones so a pinned
        # workflow that still sets one is told rather than silently
        # ignored (see their own descriptions above). Consumed *only*
        # here -- validate-inputs.sh rejects them and run.sh never
        # forwards either, which is why both are in
        # tests/test_action_run_contract.py's _NON_RUN_SH_INPUTS.
        INPUT_JOBS: ${{ inputs.jobs }}
        INPUT_BUNDLE_SYSTEM_PROVIDERS: ${{ inputs.bundle-system-providers }}
        INPUT_NEW_LIBRARY: ${{ inputs.new-library }}
        INPUT_NEW_LIBRARY_SET: ${{ inputs.new-library-set }}
        # Retired inputs (they applied only to the now-removed mode: scan),
        # rejected in preflight so a workflow that still sets one fails
        # before Python setup and the toolchain install.
        INPUT_RISK_RULES: ${{ inputs.risk-rules }}
        INPUT_CROSSCHECK: ${{ inputs.crosscheck }}
        INPUT_AGAINST: ${{ inputs.against }}
        INPUT_DRY_RUN: ${{ inputs.dry-run }}
        INPUT_OLD_HEADER: ${{ inputs.old-header }}
        INPUT_OLD_INCLUDE: ${{ inputs.old-include }}
        INPUT_OLD_VERSION: ${{ inputs.old-version }}
        INPUT_OLD_LIBRARY: ${{ inputs.old-library }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_UPLOAD_SARIF: ${{ inputs.upload-sarif }}
        INPUT_DEBUG_INFO1: ${{ inputs.debug-info1 }}
        INPUT_DEBUG_INFO2: ${{ inputs.debug-info2 }}
        INPUT_DEVEL_PKG1: ${{ inputs.devel-pkg1 }}
        INPUT_DEVEL_PKG2: ${{ inputs.devel-pkg2 }}
        INPUT_DSO_ONLY: ${{ inputs.dso-only }}
        INPUT_INCLUDE_PRIVATE_DSO: ${{ inputs.include-private-dso }}
        INPUT_FAIL_ON_REMOVED_LIBRARY: ${{ inputs.fail-on-removed-library }}
        INPUT_ABI_BASELINE: ${{ inputs.abi-baseline }}
        INPUT_BASELINE_PROFILE: ${{ inputs.baseline-profile }}
        INPUT_BASELINE_TARGET: ${{ inputs.baseline-target }}
        INPUT_BASELINE_ASSET_NAME_TEMPLATE: ${{ inputs.baseline-asset-name-template }}
        INPUT_BASELINE_GENERATION: ${{ inputs.baseline-generation }}
        INPUT_ESTIMATE: ${{ inputs.estimate }}
        INPUT_AUDIT: ${{ inputs.audit }}
        # No-baseline capability-gap guard: compare's audit-only shape
        # (old-library/abi-baseline both omitted) setting since/
        # changed-path/budget fails here, before Python setup and the
        # toolchain install -- run.sh keeps its own copy for anyone
        # invoking it directly.
        INPUT_SINCE: ${{ inputs.since }}
        INPUT_CHANGED_PATH: ${{ inputs.changed-path }}
        INPUT_BUDGET: ${{ inputs.budget }}
        INPUT_FOLLOW_DEPS: ${{ inputs.follow-deps }}
        INPUT_USED_BY: ${{ inputs.used-by }}
        INPUT_USED_BY_MANIFEST: ${{ inputs.used-by-manifest }}
        INPUT_REQUIRED_SYMBOL: ${{ inputs.required-symbol }}
        INPUT_REQUIRED_SYMBOLS: ${{ inputs.required-symbols }}
        INPUT_SNAPSHOT_COMPRESSION: ${{ inputs.snapshot-compression }}
        INPUT_PUBLIC_HEADER_DIR: ${{ inputs.public-header-dir }}
        INPUT_BUILD_TARGET: ${{ inputs.build-target }}
        # validate-inputs.sh's own compile-context guard (ast-frontend/
        # gcc-*/sysroot/nostdinc for a directory/package compare operand)
        # and its new require-complete-analysis release-operand guard both
        # read these -- previously missing from this step's env block
        # entirely, so both checks always read their inputs as unset/false
        # here regardless of what the workflow set, and only the identical
        # check re-run inside run.sh (which *is* wired) ever actually fired
        # (Codex review; found while wiring require-complete-analysis
        # through this same step).
        INPUT_AST_FRONTEND: ${{ inputs.ast-frontend }}
        INPUT_LANG: ${{ inputs.lang }}
        INPUT_GCC_PATH: ${{ inputs.gcc-path }}
        INPUT_GCC_PREFIX: ${{ inputs.gcc-prefix }}
        INPUT_GCC_OPTIONS: ${{ inputs.gcc-options }}
        INPUT_SYSROOT: ${{ inputs.sysroot }}
        INPUT_NOSTDINC: ${{ inputs.nostdinc }}
        INPUT_REQUIRE_COMPLETE_ANALYSIS: ${{ inputs.require-complete-analysis }}
        # A previously-missing-from-this-step-entirely gap, caught by the
        # generalized contract test
        # (test_every_validate_inputs_var_is_set_by_its_own_step) once it
        # existed, rather than found by review a second time.
        INPUT_BUILD_INFO: ${{ inputs.build-info }}
        INPUT_COMPILE_DB: ${{ inputs.compile-db }}
      run: bash "${{ github.action_path }}/action/validate-inputs.sh"

    # ── 1. Python ─────────────────────────────────────────────────────────────
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
      with:
        python-version: ${{ inputs.python-version }}

    # ── 2. System dependencies ────────────────────────────────────────────────
    # `dependency-source` (new) takes priority; an unset `dependency-source`
    # falls back to the legacy `install-deps` boolean for one release cycle —
    # true (its own default too, so "never touched either input" lands here)
    # now maps to conda-forge, the new default; false maps to none, preserving
    # an explicit opt-out. A caller who explicitly wants the old apt/Homebrew
    # path can still set dependency-source: system directly.
    - name: Resolve dependency-source
      id: resolve-deps
      shell: bash
      env:
        INPUT_DEPENDENCY_SOURCE: ${{ inputs.dependency-source }}
        INPUT_INSTALL_DEPS: ${{ inputs.install-deps }}
        RUNNER_OS: ${{ runner.os }}
      run: |
        if [ -n "$INPUT_DEPENDENCY_SOURCE" ]; then
          resolved="$INPUT_DEPENDENCY_SOURCE"
        elif [ "$INPUT_INSTALL_DEPS" = "false" ]; then
          resolved="none"
        elif [ "$RUNNER_OS" = "Windows" ]; then
          # The default below is a Linux/macOS default: every conda-forge*
          # source is explicitly unsupported on Windows (the step further
          # down that hard-fails it), because pyproject.toml's
          # native-toolchain* pixi features don't cover win-64. Defaulting a
          # Windows runner to conda-forge therefore resolves straight into
          # that `exit 1` -- which nobody could have been relying on, so
          # falling back to `system` here can only unblock. `system` is
          # exactly what that error message already tells Windows users to
          # pick, and install-deps.sh's own Windows branch warns and
          # continues rather than failing, matching the "toolchain is
          # pre-installed on the image" story an MSVC lane has anyway.
          # An *explicit* conda-forge* still fails: asking for something
          # unsupported should say so, not be silently rewritten.
          #
          # Reached for real since G34 Phase C, which lets an `os: windows`
          # profile schedule a native `windows-latest` check cell (Codex
          # review) -- before that, no Windows runner got this far through
          # check-project.yml at all.
          resolved="system"
        else
          resolved="conda-forge"
        fi
        case "$resolved" in
          system|conda-forge|conda-forge-gcc14|conda-forge-clang20|none) ;;
          *)
            echo "::error::dependency-source must be one of 'system', 'conda-forge'," \
              "'conda-forge-gcc14', 'conda-forge-clang20', or 'none' (got '${resolved}')"
            exit 1
            ;;
        esac
        echo "value=${resolved}" >> "$GITHUB_OUTPUT"
        # Maps a resolved dependency-source onto the pyproject.toml pixi
        # environment name that provisions it (only meaningful for the three
        # conda-forge-* values; unused otherwise).
        case "$resolved" in
          conda-forge) echo "pixi-env=scanner" >> "$GITHUB_OUTPUT" ;;
          conda-forge-gcc14) echo "pixi-env=gcc14" >> "$GITHUB_OUTPUT" ;;
          conda-forge-clang20) echo "pixi-env=clang20" >> "$GITHUB_OUTPUT" ;;
        esac

    - name: Install system dependencies (system)
      if: steps.resolve-deps.outputs.value == 'system'
      shell: bash
      run: bash "${{ github.action_path }}/action/install-deps.sh"

    - name: dependency-source=conda-forge* is not yet supported on Windows
      if: startsWith(steps.resolve-deps.outputs.value, 'conda-forge') && runner.os == 'Windows'
      shell: bash
      run: |
        echo "::error::dependency-source=${{ steps.resolve-deps.outputs.value }} is not yet" \
          "supported on Windows (pyproject.toml's native-toolchain* pixi features don't cover" \
          "win-64). Use dependency-source=system or install castxml/a compiler manually."
        exit 1

    # conda-forge* paths: pixi resolves one of this repo's own pyproject.toml
    # environments (scanner/gcc14/clang20 — the mapped `pixi-env` output above,
    # `pixi.lock`-frozen) instead of the checksum-pinned Superbuild installer.
    # Linux/macOS only (gcc14 is linux-only — conda-forge's gcc doesn't build
    # for macOS). Only clang20 provides clang; none of the three provide bear
    # yet (L3/L4/L5 source scanning degrades gracefully when clang/bear are
    # absent, same as on the system path without them).
    - name: Set up pixi (conda-forge)
      if: startsWith(steps.resolve-deps.outputs.value, 'conda-forge') && runner.os != 'Windows'
      uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11  # v0.9.6
      with:
        manifest-path: ${{ github.action_path }}/pyproject.toml
        environments: ${{ steps.resolve-deps.outputs.pixi-env }}
        frozen: true

    - name: Install system dependencies (conda-forge)
      if: startsWith(steps.resolve-deps.outputs.value, 'conda-forge') && runner.os != 'Windows'
      shell: bash
      env:
        ABICHECK_PIXI_ENV: ${{ steps.resolve-deps.outputs.pixi-env }}
      run: bash "${{ github.action_path }}/action/install-deps-conda-forge.sh"

    # ── 3. Install abicheck ──────────────────────────────────────────────────
    - name: Install abicheck
      shell: bash
      run: pip install "${{ github.action_path }}"

    # ── 4. Run abicheck ──────────────────────────────────────────────────────
    - name: Run abicheck
      id: run-abicheck
      shell: bash
      env:
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_OLD_LIBRARY: ${{ inputs.old-library }}
        INPUT_NEW_LIBRARY: ${{ inputs.new-library }}
        INPUT_NEW_LIBRARY_SET: ${{ inputs.new-library-set }}
        INPUT_HEADER: ${{ inputs.header }}
        INPUT_OLD_HEADER: ${{ inputs.old-header }}
        INPUT_NEW_HEADER: ${{ inputs.new-header }}
        INPUT_PUBLIC_HEADER_DIR: ${{ inputs.public-header-dir }}
        INPUT_BUILD_TARGET: ${{ inputs.build-target }}
        INPUT_INCLUDE: ${{ inputs.include }}
        INPUT_OLD_INCLUDE: ${{ inputs.old-include }}
        INPUT_NEW_INCLUDE: ${{ inputs.new-include }}
        INPUT_OLD_VERSION: ${{ inputs.old-version }}
        INPUT_NEW_VERSION: ${{ inputs.new-version }}
        INPUT_LANG: ${{ inputs.lang }}
        INPUT_AST_FRONTEND: ${{ inputs.ast-frontend }}
        INPUT_GCC_PATH: ${{ inputs.gcc-path }}
        INPUT_GCC_PREFIX: ${{ inputs.gcc-prefix }}
        INPUT_GCC_OPTIONS: ${{ inputs.gcc-options }}
        INPUT_SYSROOT: ${{ inputs.sysroot }}
        INPUT_NOSTDINC: ${{ inputs.nostdinc }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_OUTPUT_FILE: ${{ inputs.output-file }}
        INPUT_SNAPSHOT_COMPRESSION: ${{ inputs.snapshot-compression }}
        INPUT_POLICY: ${{ inputs.policy }}
        INPUT_POLICY_FILE: ${{ inputs.policy-file }}
        INPUT_SUPPRESS: ${{ inputs.suppress }}
        INPUT_VERBOSE: ${{ inputs.verbose }}
        INPUT_FOLLOW_DEPS: ${{ inputs.follow-deps }}
        INPUT_OLD_ROOT: ${{ inputs.old-root }}
        INPUT_NEW_ROOT: ${{ inputs.new-root }}
        INPUT_USED_BY: ${{ inputs.used-by }}
        INPUT_USED_BY_MANIFEST: ${{ inputs.used-by-manifest }}
        INPUT_REQUIRED_SYMBOL: ${{ inputs.required-symbol }}
        INPUT_REQUIRED_SYMBOLS: ${{ inputs.required-symbols }}
        INPUT_AGAINST: ${{ inputs.against }}
        INPUT_SEARCH_PATH: ${{ inputs.search-path }}
        INPUT_LD_LIBRARY_PATH: ${{ inputs.ld-library-path }}
        INPUT_FAIL_ON_BREAKING: ${{ inputs.fail-on-breaking }}
        INPUT_FAIL_ON_API_BREAK: ${{ inputs.fail-on-api-break }}
        INPUT_SEVERITY_PRESET: ${{ inputs.severity-preset }}
        INPUT_REQUIRE_COMPLETE_ANALYSIS: ${{ inputs.require-complete-analysis }}
        INPUT_ANNOTATE: ${{ inputs.annotate }}
        INPUT_ANNOTATE_ADDITIONS: ${{ inputs.annotate-additions }}
        INPUT_EXTRA_ARGS: ${{ inputs.extra-args }}
        INPUT_ABI_BASELINE: ${{ inputs.abi-baseline }}
        INPUT_BASELINE_PROFILE: ${{ inputs.baseline-profile }}
        INPUT_BASELINE_TARGET: ${{ inputs.baseline-target }}
        INPUT_BASELINE_ASSET_NAME_TEMPLATE: ${{ inputs.baseline-asset-name-template }}
        INPUT_BASELINE_GENERATION: ${{ inputs.baseline-generation }}
        INPUT_ADD_JOB_SUMMARY: ${{ inputs.add-job-summary }}
        INPUT_DEBUG_INFO1: ${{ inputs.debug-info1 }}
        INPUT_DEBUG_INFO2: ${{ inputs.debug-info2 }}
        INPUT_DEVEL_PKG1: ${{ inputs.devel-pkg1 }}
        INPUT_DEVEL_PKG2: ${{ inputs.devel-pkg2 }}
        INPUT_DSO_ONLY: ${{ inputs.dso-only }}
        INPUT_INCLUDE_PRIVATE_DSO: ${{ inputs.include-private-dso }}
        INPUT_FAIL_ON_REMOVED_LIBRARY: ${{ inputs.fail-on-removed-library }}
        INPUT_PR_COMMENT: ${{ inputs.pr-comment }}
        INPUT_PR_COMMENT_MODE: ${{ inputs.pr-comment-mode }}
        INPUT_PR_COMMENT_ON: ${{ inputs.pr-comment-on }}
        INPUT_PR_COMMENT_DETAIL: ${{ inputs.pr-comment-detail }}
        INPUT_SOURCES: ${{ inputs.sources }}
        INPUT_BUILD_INFO: ${{ inputs.build-info }}
        INPUT_COMPILE_DB: ${{ inputs.compile-db }}
        INPUT_BUILD_CONFIG: ${{ inputs.build-config }}
        INPUT_ALLOW_BUILD_QUERY: ${{ inputs.allow-build-query }}
        INPUT_DEPTH: ${{ inputs.depth }}
        INPUT_SINCE: ${{ inputs.since }}
        INPUT_CHANGED_PATH: ${{ inputs.changed-path }}
        INPUT_BUDGET: ${{ inputs.budget }}
        INPUT_DRY_RUN: ${{ inputs.dry-run }}
        INPUT_ESTIMATE: ${{ inputs.estimate }}
        INPUT_AUDIT: ${{ inputs.audit }}
        INPUT_CROSSCHECK: ${{ inputs.crosscheck }}
        INPUT_RISK_RULES: ${{ inputs.risk-rules }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: bash "${{ github.action_path }}/action/run.sh"

    # ── 5. Upload SARIF ──────────────────────────────────────────────────────
    - name: Upload SARIF to Code Scanning
      if: inputs.upload-sarif == 'true' && inputs.format == 'sarif' && steps.run-abicheck.outputs.report-path != ''
      uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a  # v4
      with:
        sarif_file: ${{ steps.run-abicheck.outputs.report-path }}
        category: abicheck
      continue-on-error: true
