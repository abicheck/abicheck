name: 'abicheck — ABI Compatibility Checker'
description: 'Detect ABI/API and dependency breakages across C/C++ binaries, packages, and releases in CI.'

branding:
  icon: 'shield'
  color: 'blue'

inputs:
  # ── Operation mode ──────────────────────────────────────────────────────────
  mode:
    description: >
      Operation mode. The Action exposes five analysis modes, mirroring
      abicheck's five core per-library CLI commands (compare/dump/scan/
      deps tree/deps compare — ADR-043; the CLI additionally has
      project-orchestration commands like `aggregate` and `project plan`
      (ADR-054) that this Action does not expose as separate modes):
      "compare" (default) compares two ABI surfaces — old-library/new-library
      may be single binaries/snapshots OR directories/packages, in which case
      abicheck fans out to a per-library comparison automatically (no separate
      mode); "dump" generates a JSON baseline snapshot from a single library
      (now also embeds optional L3/L4/L5 build-source evidence via
      source/build inputs); "scan" runs the deterministic source-intelligence
      orchestrator (classify → always-on pattern/cross-source tier → pinned
      evidence level, optionally compared against a baseline) — the entry
      point for source scans; "deps-tree" resolves transitive dependencies
      and symbol bindings for one binary (Linux ELF); "deps-compare" compares
      a binary's full dependency stack across two sysroots (Linux ELF).
    required: false
    default: 'compare'

  # ── Library inputs ──────────────────────────────────────────────────────────
  old-library:
    description: >
      Path to the old library, JSON snapshot, or ABICC Perl dump. Required
      when mode=compare. May also be a directory or package (RPM, Deb, tar,
      conda, wheel) — abicheck then fans out to a per-library comparison
      automatically.
    required: false
  new-library:
    description: >
      Path to the new (current) library, binary, or JSON snapshot. Required
      for compare, dump (unless a source-only sources/build-info/compile-db
      input is given), scan, and deps-tree/deps-compare modes. May be a
      directory or package (RPM, Deb, tar, conda, wheel) ONLY in compare
      mode, matching old-library — compare then fans out to a per-library
      comparison automatically. dump and scan each analyse exactly one
      artifact and reject a directory/package with an error (they have no
      per-library fan-out); for a multi-library release, dump/scan each
      library individually or use compare instead.
    required: false
  new-library-set:
    description: >
      scan mode only (ADR-056). Audit a *set* of libraries with no old side,
      as one operation: a directory (every discoverable shared library in
      it) or an explicit comma-separated path list. Maps to scan
      --artifact-set. Mutually exclusive with new-library and with
      against/abi-baseline (audit-only — no old-side comparison for a set).
      For a multi-library release comparison against an old side, use
      mode: compare with a directory/package operand instead.
    required: false

  # ── Package inputs (compare mode, directory/package operands only) ──────────
  debug-info1:
    description: 'Debug info package for old side (RPM/Deb/tar). compare mode, directory/package operands only.'
    required: false
  debug-info2:
    description: 'Debug info package for new side (RPM/Deb/tar). compare mode, directory/package operands only.'
    required: false
  devel-pkg1:
    description: 'Development package with headers for old side. compare mode, directory/package operands only.'
    required: false
  devel-pkg2:
    description: 'Development package with headers for new side. compare mode, directory/package operands only.'
    required: false
  dso-only:
    description: 'Only compare shared objects, skip executables. compare mode, directory/package operands only.'
    required: false
    default: 'false'
  include-private-dso:
    description: 'Include private (non-public) shared objects from non-standard paths. compare mode, directory/package operands only.'
    required: false
    default: 'false'
  keep-extracted:
    description: 'Keep extracted temporary files for debugging. compare mode, directory/package operands only.'
    required: false
    default: 'false'
  fail-on-removed-library:
    description: 'Exit 8 when a library present in old is absent in new. compare mode, directory/package operands only.'
    required: false
    default: 'false'

  # ── Header inputs ───────────────────────────────────────────────────────────
  header:
    description: >
      Public header file(s) applied to both sides (space-separated).
      Required when input is an ELF binary; ignored for JSON snapshots.
      If old and new actually declare different header sets (e.g. a new
      release added a header), set `old-header`/`new-header` instead --
      a bare `header` parses BOTH snapshots against the same files, which
      silently hides the removed/added declarations you're trying to check.
    required: false
  old-header:
    description: 'Public header(s) for the old side only (overrides header for old). Space-separated.'
    required: false
  new-header:
    description: 'Public header(s) for the new side only (overrides header for new). Space-separated.'
    required: false
  public-header-dir:
    description: >
      Directory whose headers are treated as public for provenance
      classification (repeatable, space-separated) — establishes the
      public/internal boundary so leakage/RTTI/exported-vs-public
      cross-checks run instead of skipping. dump mode forwards it as one
      more `-H/--header` root, which is where `dump` reads declaration
      provenance from AND extracts headers from (a directory entry tags
      everything under it public and expands to every header inside). scan
      mode forwards it both as `--public-header-dir` (scope only) and as an
      `-H` root, so its own header extraction expands the same directory
      `dump` does — keeping a `scan --against` a fresh `dump` baseline of
      the same inputs comparable instead of drifting apart on
      `include_sequence` for no real recipe difference (lab report). The
      `-H` root is candidate-sided (`new=...`) for a scalar scan with a
      resolved baseline — so it never leaks into the baseline/old side's
      own header parse even when `old-header` is also given — and bare
      (both-sided) for an audit-only or `--artifact-set` scan, which has no
      old side to protect. compare has no equivalent flag.
    required: false
  build-target:
    description: >
      Explicit build-system root target(s) to scope L3 evidence collection
      to, instead of a workspace-wide query (P0.2; Bazel only so far, e.g.
      `//:math`). Space-separated, repeatable — each root's transitive
      dependency closure is unioned. Forwarded identically to both dump and
      scan mode (`--build-target`, same flag and semantics on both); CLI
      equivalent of `.abicheck.yml`'s `build.targets`, overrides it when
      both are given. Without this, a multi-package workspace with
      fixture/test targets alongside the real library is collected in
      full, which can pollute L3 evidence with unrelated compile units and
      diverge a `scan --against` a target-scoped `dump` baseline's own
      evidence (lab report). compare has no equivalent flag.
    required: false

  # ── Include directories ─────────────────────────────────────────────────────
  include:
    description: >
      Extra include directories for header AST parsing (castxml or clang).
      Space-separated. Set this (or `old-include`/`new-include` for a
      side-specific root) whenever a header passed via `header` itself
      `#include`s a *dependency's* header from a separate include root
      (e.g. PVXS's own `version.h` pulling in EPICS Base's
      `epicsVersion.h`, found in a real PVXS Action acceptance run) --
      `header`/`public-header-dir` alone never cover a dependency's own
      headers. On ELF the parse then aborts on the first such include with
      a "file not found" error; on Mach-O/PE it can instead warn and fall
      back to export-table scoping (`--header`/`--include` are silently
      ignored for that dump), which is quieter but leaves header-based
      coverage incomplete rather than failing loud. In
      `compare` mode, `old-include`/`new-include` *replace* this list for
      their side rather than adding to it (repeat any shared directory
      there too); in `dump`/`scan`, a side-specific include is added
      alongside this list instead. (`sources`/`build-info` can sometimes
      auto-derive a build's own include dirs for this instead of a manual
      `-I`, when neither side has any explicit include input of its own.)
    required: false
  old-include:
    description: >
      Include directories for old side only. Space-separated. Used by
      `compare` and by `scan --against` (the baseline side); `dump` and
      scan's audit-only `new-library-set` mode have no old side. In
      `compare`, replaces `include` for this side rather than adding to
      it (repeat any directory `include` also lists that's still
      needed); in `scan --against`, it is added alongside `include`
      instead.
    required: false
  new-include:
    description: >
      Include directories for new side only. Space-separated. In
      `compare` mode, replaces `include` for this side rather than adding
      to it (repeat any directory `include` also lists that the new side
      still needs); in `dump`/`scan`, it is added alongside `include`
      instead.
    required: false

  # ── Version labels ──────────────────────────────────────────────────────────
  old-version:
    description: 'Version label for the old library (embedded in reports).'
    required: false
    default: 'old'
  new-version:
    description: 'Version label for the new library (embedded in reports).'
    required: false
    default: 'new'

  # ── Language & compiler ─────────────────────────────────────────────────────
  lang:
    description: 'Language mode for header AST parsing: "c++" or "c".'
    required: false
    default: 'c++'
  ast-frontend:
    description: >
      L2 header-AST frontend for native-binary inputs: "auto" (resolves to
      castxml and never changes producer unless the CLI's
      --allow-ast-frontend-fallback flag is also passed via extra-args (or
      ABICHECK_ALLOW_AST_FALLBACK=1 is set) — with that opt-in, a recognized
      castxml toolchain-version mismatch, an unsupported castxml release, or
      a direct-include-guard failure falls back to clang, G16; without it,
      and on any host with no castxml at all, auto does not silently switch
      to clang — the command fails asking you to install castxml or pass
      ast-frontend: clang explicitly. One exception: a non-host
      --frontend-context (SYCL/DPC++, passed via extra-args) routes an auto
      that resolves to plain castxml (no pin) straight to clang with no
      opt-in needed, since castxml can't satisfy it at all — but any way of
      pinning the resolved backend away from plain castxml-or-clang still
      rejects it: an explicit ast-frontend: castxml, auto pinned to castxml
      via ABICHECK_AST_FRONTEND=castxml, and hybrid (explicit or auto
      pinned via ABICHECK_AST_FRONTEND=hybrid — hybrid has no device
      concept either) all reject a non-host context. Explicit
      ast-frontend: clang satisfies it directly, and so does auto pinned to
      clang via ABICHECK_AST_FRONTEND=clang),
      "castxml" (default), "clang" (clang -ast-dump=json; explicit opt-in
      for clang-only hosts), or "hybrid" (runs both and merges them; needs
      both tools installed on the runner, never auto-selected). Applies to
      dump, scan, and compare mode with a single-pair (non-directory, non-package)
      operand — the per-library fan-out a directory/package compare uses
      never threads this L2 context to each pair's header dump, so a value
      other than "auto" (the no-op default) is a hard error there (shared
      `compile_context_options`, ADR-037 D3). Same as the
      ABICHECK_AST_FRONTEND env var.
    required: false
  gcc-path:
    description: >
      Path to GCC/G++ (or clang) cross-compiler binary (maps to the CLI's
      --compiler). Applies to dump,
      scan, and compare mode with a single-pair (non-directory, non-package)
      operand — a directory/package compare rejects it with an error (same
      restriction as ast-frontend above).
    required: false
  gcc-prefix:
    description: >
      Cross-toolchain prefix, e.g. aarch64-linux-gnu- (maps to the CLI's
      --compiler-prefix). Applies to dump,
      scan, and compare mode with a single-pair (non-directory, non-package)
      operand — a directory/package compare rejects it with an error (same
      restriction as ast-frontend above).
    required: false
  gcc-options:
    description: >
      Extra compiler flags passed through to the header frontend (maps to
      the CLI's --compiler-option). A single-line value is
      split on whitespace into separate flags, same as before; a multi-line
      (YAML block scalar) value keeps each line as one flag verbatim,
      spaces included — use that form for a flag whose value contains a
      space. Applies to dump, scan, and compare mode with a single-pair
      (non-directory, non-package) operand — a directory/package compare
      rejects it with an error (same restriction as ast-frontend above).
    required: false
  sysroot:
    description: 'Alternative system root directory for cross-compilation. Applies to dump, scan, deps-tree, and compare mode with a single-pair (non-directory, non-package) operand — a directory/package compare rejects it with an error (same restriction as ast-frontend above).'
    required: false
  nostdinc:
    description: >
      Do not search standard system include paths. Applies to dump, scan,
      and compare mode with a single-pair (non-directory, non-package)
      operand — a directory/package compare rejects it with an error (same
      restriction as ast-frontend above).
    required: false
    default: 'false'

  # ── Full-stack dependency validation (Linux ELF) ─────────────────────────────
  follow-deps:
    description: >
      Include transitive dependency graph and symbol binding info in dump or
      compare output. ELF only. Applies to dump and compare modes.
    required: false
    default: 'false'
  old-root:
    description: >
      Sysroot for the old (baseline) environment. Required for
      mode=deps-compare.
    required: false
  new-root:
    description: >
      Sysroot for the new (candidate) environment. Required for
      mode=deps-compare.
    required: false
  search-path:
    description: >
      Additional directories to search for shared libraries (space-separated).
      Used by deps-tree, deps-compare, and follow-deps.
    required: false
  ld-library-path:
    description: >
      Simulated LD_LIBRARY_PATH (colon-separated). Used by deps-tree,
      deps-compare, and follow-deps.
    required: false

  # ── Scoped comparison: app-usage / required-symbol contracts (compare mode) ──
  used-by:
    description: >
      Application binary/binaries whose actual imports/required symbol
      versions scope the comparison (space-separated; maps to repeated
      compare --used-by). The full library comparison still runs; the
      worst app-scoped result becomes the primary verdict/exit code, with
      the full verdict kept as informational context. Mutually exclusive
      with required-symbol/required-symbols (the CLI rejects both being
      set). compare mode only.
    required: false
  required-symbol:
    description: >
      An exported linker symbol a plugin host resolves via dlopen/dlsym
      and requires (space-separated; maps to repeated compare
      --required-symbol). Scopes the comparison to this explicit
      entrypoint contract instead of the full diff. Mutually exclusive
      with used-by. compare mode only.
    required: false
  required-symbols:
    description: >
      Path to a file of required symbols, one per line (blank lines and
      '#' comments ignored) -- combined with any required-symbol values.
      compare mode only.
    required: false

  # ── Source-scan & build-source evidence (scan / dump modes) ──────────────────
  against:
    description: >
      scan mode only. Baseline artifact (a library binary or JSON snapshot) to
      compare the scanned new-library against. Maps to scan --against; omit
      for a one-build audit (see the audit input below). Overridden by
      abi-baseline when set.
    required: false
  sources:
    description: >
      Source checkout / tree for source-intelligence analysis. The compile
      database is auto-discovered within it. Drives L4 source-ABI replay and
      L5 source-graph collection. Used by scan and dump modes, and by compare
      mode for the new (candidate) side only — mapped to compare's
      --sources new=... (the old side's evidence, if any, is expected to
      already be embedded in whatever old-library snapshot was resolved).
    required: false
  build-info:
    description: >
      Out-of-tree L3 build context: a build directory, a compile_commands.json,
      or a previously-collected evidence pack. Use when the build tree lives
      outside --sources. Used by scan and dump modes, and by compare mode for
      the new (candidate) side only — mapped to compare's
      --build-info new=... (same old-side caveat as sources above).
    required: false
  compile-db:
    description: >
      Explicit path to a compile_commands.json, when it is not under
      `sources`. Folded into `--build-info` for every mode (scan, dump, and
      compare mode's new side) — `--build-info` already accepts a build dir,
      a compile_commands.json, or a pre-captured pack, so it is the one flag
      that takes this operand.
    required: false
  build-config:
    description: >
      Path to a trusted .abicheck.yml. For scan mode, supplying this
      together with an explicitly pinned depth (not allow-build-query) is
      what permits its build.query (compile-DB generation) command to
      run — see allow-build-query below; a plain scan with no depth pinned
      does not auto-run it. Used by scan and dump modes, and by compare
      mode (--config).
    required: false
  allow-build-query:
    description: >
      Dump-mode-only opt-in for the external extractor manifest
      (--dump-manifest)'s own build-system query action; a real gate there,
      not a no-op. For scan mode this input is ignored (CLI audit PR 5/5) —
      scan's own build.query auto-runs whenever build-config is given
      together with an explicitly pinned --depth, with no separate opt-in
      needed. abicheck also always runs its own inferred,
      abicheck-authored cmake/bazel/make compile-DB query whenever a sources
      input needs build context, independent of this input: pointing
      abicheck at a source tree is itself the request to analyse it. Used by
      dump mode only.
    required: false
    default: 'false'
  depth:
    description: >
      Evidence-depth selector: binary, headers, build, or source. Used by
      scan and dump modes, and by compare mode (--depth). In scan mode, omit
      it for 'auto' (risk-driven); --depth source analyses the whole current
      library target unless since/changed-path seeds a narrower changed
      scope. Maps to --depth. (The deprecated scan-mode/source-method inputs
      have been removed; use depth.)
    required: false
  since:
    description: >
      scan mode only. Focus the scan on files changed vs a git ref
      (e.g. origin/main). Maps to scan --since.
    required: false
  changed-path:
    description: >
      scan mode only. Changed path(s) to focus the scan on (space-separated;
      alternative to since). Maps to repeated scan --changed-path.
    required: false
  budget:
    description: >
      scan mode only. Time guard (e.g. 15m, 900s, 1h). The step FAILS on
      overflow (exit 5) — a budget never silently shrinks scope.
      Maps to scan --budget.
    required: false
  dry-run:
    description: >
      Resolve inputs/config and print what the run would do, without
      performing any analysis or writing output. Exits 0 for a resolvable
      preview; an invocation the real run would itself reject (an invalid
      flag combination) still exits with that same usage error, and a
      requested-but-unsatisfiable depth/evidence contract still exits
      nonzero — a dry run validates what it can see, it does not turn every
      outcome into success. The one deliberate exception is this
      composite Action's own baseline resolution: an unresolved
      abi-baseline is tolerated under dry-run rather than hard-failing,
      since the point of a preview is to report what *would* be compared,
      not to require the comparison already be resolvable. Maps to
      --dry-run; supported by every mode (compare, dump, scan, deps-tree,
      deps-compare). For scan, this also reports the projected per-layer
      cost (the same preview the deprecated estimate input below used to
      provide). To force a scan-mode single-build hygiene lint instead of a
      baseline compare, simply omit against/abi-baseline for that step —
      scan already runs audit-only whenever no against is given (the
      deprecated audit input below is a functional alias for this).
    required: false
    default: 'false'
  estimate:
    description: >
      Deprecated alias for dry-run (scan mode only, historical name).
      Setting this to true is equivalent to dry-run: 'true'. Prefer dry-run
      directly, which now applies to every mode, not just scan. Kept as a
      functional (not just accepted-and-ignored) alias for backward
      compatibility with existing workflows.
    required: false
    default: 'false'
  audit:
    description: >
      Deprecated. scan mode only. Forces a one-build audit-only run (omits
      --against) even when against/abi-baseline is configured elsewhere in
      the workflow. Prefer simply omitting against/abi-baseline for the
      step instead — scan already runs audit-only whenever no against is
      given. Kept as a functional (not just accepted-and-ignored) alias for
      backward compatibility with existing workflows.
    required: false
    default: 'false'
  crosscheck:
    description: >
      scan mode only. Per-check severity overrides KEY=LEVEL
      (off|info|warning|error), space-separated. Maps to repeated
      scan --crosscheck. Promote a check to =error to gate CI on it.
    required: false
  risk-rules:
    description: >
      scan mode only. Path to a YAML file overriding the risk_rules profile.
      Maps to scan --risk-rules.
    required: false
  bundle-system-providers:
    description: >
      Comma-separated extra sonames to treat as system-provided (extends
      the built-in libc/libstdc++/libgcc/libtbb allow-list) for the
      cross-library bundle-analysis layer. Maps to --bundle-system-providers
      on mode: compare (directory/package operands, the release/bundle
      comparison) and mode: scan (only meaningful with new-library-set).
    required: false

  # ── Baseline auto-fetch (compare / scan modes) ───────────────────────────────
  abi-baseline:
    description: >
      Automatically fetch an ABI baseline snapshot for compare mode (used as
      old-library) or scan mode (used as the scan baseline).
      Values: "latest-release" fetches *.abicheck.json from the latest GitHub Release;
      a tag name (e.g. "v2.0.0") fetches from that release; a file path uses the
      file directly. Requires GITHUB_TOKEN with contents:read permission.
      Overrides old-library (compare) / against (scan) when set. When the
      resolved release has no single `*.abicheck.json[.gz|.zst]` asset, set
      baseline-profile and baseline-target to instead fetch a
      release-contract baseline-set archive
      (`abicheck-baseline-<profile>.tar.zst`, published by
      publish-baseline.yml -- see docs/reference/publish-baseline.md); the
      single-snapshot search always takes priority when both exist.
    required: false
  baseline-profile:
    description: >
      Selects which contract profile's baseline-set to fetch when
      abi-baseline resolves to a release-contract baseline-set archive
      (docs/reference/publish-baseline.md) rather than a single
      *.abicheck.json asset. Requires baseline-target to also be set. Omit
      when the release publishes a single-snapshot asset (abi-baseline's
      original, unchanged contract) -- this input is only consulted as a
      fallback when that search finds nothing.
    required: false
  baseline-target:
    description: >
      The target/library id (the baseline-set manifest.json's "library"
      field, matching the name passed to actions/baseline's `libraries`
      input when the baseline-set was published) to resolve from the
      baseline-set archive selected by baseline-profile. Required when
      baseline-profile is set.
    required: false
  baseline-asset-name-template:
    description: >
      Release asset filename template for the baseline-set archive
      fetched via baseline-profile; "{profile}" is replaced with
      baseline-profile's value, and "{generation}" (optional) with
      baseline-generation's value. Must match the asset-name-template the
      publishing workflow (publish-baseline.yml, or a custom equivalent)
      used.
    required: false
    default: 'abicheck-baseline-{profile}.tar.zst'
  baseline-generation:
    description: >
      Substituted for "{generation}" in baseline-asset-name-template --
      set this when the publishing workflow's asset-name-template
      includes "{generation}" (e.g. it published a baseline scoped to a
      scanner-compatibility generation -- see baseline-management.md's
      "Scanner upgrades and baseline generations" section). Omit when
      baseline-asset-name-template doesn't reference "{generation}" at
      all -- the default template never does, so this input is a no-op
      unless you opt in by including the placeholder.
    required: false

  # ── Output & policy ─────────────────────────────────────────────────────────
  format:
    description: >
      Output format: json, sarif, html, or markdown/text (each mode's
      default when this input is left unset — markdown for compare/
      deps-tree/deps-compare, text for scan). sarif is only supported in
      compare mode with a single-pair (non-directory, non-package) operand
      — a directory/package compare rejects it with an error. html is
      supported by compare (same single-pair restriction as sarif) and by
      deps-tree/deps-compare (a dependency-stack report). scan supports
      text (its default) and json only. dump ignores this input; it always
      writes a JSON snapshot. Requesting an
      unsupported format for the mode is a hard error raised before any
      dependency install (it used to silently fall back to a supported
      format with only a warning, which is unsafe for CI — see
      upload-sarif). Deliberately has no Action-level default (unlike most
      inputs): a single default here would resolve to the wrong value for
      scan regardless of mode, since GitHub Actions has no way to tell
      "left unset" from "explicitly set to the default" apart once a
      default is declared — each mode branch in action/run.sh supplies its
      own correct default instead.
    required: false
  output-file:
    description: 'Path to write the report file. If not set, output goes to stdout and job summary.'
    required: false
  snapshot-compression:
    description: >
      dump mode only (ADR-059). Storage envelope for the written snapshot:
      'auto' (default) infers gzip/zstd/plain from output-file's canonical
      suffix (.abicheck.json.gz/.abicheck.json.zst/plain .abicheck.json);
      an explicit 'none', 'gzip', or 'zstd' is used as-is and is a hard
      error if it contradicts output-file's suffix, mirroring the CLI's
      own --compression flag it maps to directly. Ignored by every other
      mode -- compare/scan/deps-tree/deps-compare produce a report, not a
      stored snapshot, and transparently read a compressed snapshot
      operand either way via magic-byte detection regardless of this
      input.
    required: false
  policy:
    description: 'Built-in policy profile: strict_abi (default), sdk_vendor, plugin_abi.'
    required: false
    default: 'strict_abi'
  policy-file:
    description: >
      Path to a YAML policy document with per-kind (overrides:) or
      selector-scoped (reclassify:) verdict re-classification, or the name of
      a packaged built-in one (e.g. `security`). Forwarded as `--policy`,
      which takes a profile name or a document; setting this outranks
      `policy` for the run, exactly as the removed `--policy-file` flag did.
    required: false
  suppress:
    description: 'Path to a YAML suppression file to filter known/intentional changes.'
    required: false
  verbose:
    description: 'Enable verbose/debug output from abicheck.'
    required: false
    default: 'false'

  # ── Action-specific behaviour ───────────────────────────────────────────────
  python-version:
    description: 'Python version for setup-python.'
    required: false
    default: '3.13'
  install-deps:
    description: >
      Deprecated — use `dependency-source` instead (kept for one release
      cycle). Ignored if `dependency-source` is set. true (the default) maps
      to dependency-source=conda-forge; false maps to dependency-source=none.
    required: false
    default: 'true'
  dependency-source:
    description: >
      How to install system dependencies (castxml, gcc/g++, clang, bear):
      'conda-forge' (default — this repo's pixi-managed `scanner` conda-forge
      environment, castxml 0.7.x + whichever gcc/g++ conda-forge currently
      resolves as default; Linux/macOS only, no clang, no bear),
      'conda-forge-gcc14' (same, but pinned to gcc/g++ 14.x instead of
      whatever's currently default; Linux-only, no clang, no bear),
      'conda-forge-clang20' (castxml + clang/clang++ 20.x instead of gcc —
      the one conda-forge source that provides clang, needed for L4 source-ABI
      replay and the clang-backed call/type/include-graph edges of L5 (the
      structural L5 source graph itself still builds from L3 build evidence
      alone, without clang); Linux/macOS, no bear), 'system' (apt/Homebrew
      + the pinned CastXML Superbuild — the previous default, still available;
      installs bear on Linux only — the macOS path installs only castxml via
      Homebrew and relies on Xcode's preinstalled clang, no bear), or 'none'
      (skip; dependencies must already be on PATH). Leave unset to fall back
      to `install-deps` for backward compatibility. **On a Windows runner the
      unset default is 'system', not 'conda-forge'** — every conda-forge
      source is unsupported there, so the usual default would hard-fail
      before analysis; an explicitly requested conda-forge* still errors
      rather than being silently rewritten.
    required: false
    default: ''
  upload-sarif:
    description: >
      Upload SARIF results to GitHub Code Scanning (requires security-events: write permission).
      Requires format=sarif and mode=compare — setting this with any other
      mode or format is a hard error raised before any dependency install
      (mode=scan/dump/deps-tree/deps-compare never produce a SARIF report).
    required: false
    default: 'false'
  fail-on-breaking:
    description: 'Fail the step when a binary ABI break is detected (exit code 4).'
    required: false
    default: 'true'
  fail-on-api-break:
    description: 'Fail the step when a source-level API break is detected (exit code 2).'
    required: false
    default: 'false'
  severity-preset:
    description: >
      Severity preset: 'default', 'strict', or 'info-only'.
      Controls exit codes and report labels. Only applies to compare mode.
    required: false
  require-complete-analysis:
    description: >
      Fail the step (P0.4's orthogonal ANALYSIS_INCOMPLETE axis) when
      analysis_assurance.status is not 'complete', independent of the
      compatibility verdict. Mirrors `compare`/`scan --against`'s own
      --require-complete-analysis flag. Applies to single-pair compare
      (old-library/new-library are individual files, not a directory or
      package) and scan (--against) modes only -- rejected outright
      (step fails) for a directory/package compare's per-library release
      fan-out, which has no single analysis_assurance result to gate on.
      Has no effect for an audit-only scan (new-library with no
      against/abi-baseline): the CLI itself rejects this flag without a
      baseline, so run.sh never forwards it in that shape. A dedicated
      input rather than routing through extra-args, so this Action's own
      detection of whether the flag was requested is never ambiguous
      with a value some other option in extra-args happens to spell the
      same way.
    required: false
    default: 'false'
  jobs:
    description: >
      Number of parallel library comparisons for compare mode when
      old-library/new-library are directories or packages. 0 = auto-detect
      (CPU count). Default: 0.
    required: false
    default: '0'
  annotate:
    description: >
      Emit GitHub Actions workflow command annotations (inline PR-diff
      comments) for ABI/API findings, in compare mode (single-pair and
      directory/package release operands alike). Rendered by this Action
      itself from the run's own persisted JSON report (schema 2.43+), not
      by passing --annotate to the abicheck CLI -- no second comparison is
      ever run to collect them, for either operand shape. Has no effect on
      scan mode as of this Action version. A dedicated input rather than
      routing through extra-args, for the same reason
      require-complete-analysis is: this Action's own detection of whether
      annotations were requested is never ambiguous with some other
      extra-args value.
    required: false
    default: 'false'
  annotate-additions:
    description: >
      Include additions and other compatible-but-notable changes as
      ::notice annotations. Off by default (only errors/warnings, plus the
      one notice kind that is always shown regardless of this input -- a
      --contract finding compatibility policy did not evaluate). Has no
      effect unless annotate is also true.
    required: false
    default: 'false'
  extra-args:
    description: 'Additional CLI arguments passed directly to the abicheck command.'
    required: false
    default: ''
  add-job-summary:
    description: 'Write a markdown summary to the GitHub Actions Job Summary. Ignored for dump mode.'
    required: false
    default: 'true'
  pr-comment:
    description: >
      Post a sticky ABI report comment on the pull request. Supports compare
      mode (including directory/package operands) and scan mode (a single
      artifact, not scan --artifact-set — that JSON has no single-artifact
      shape to render), rendering the same verdict/breaking/needs-review
      sections plus a green "Public API additions" table for either mode,
      and a scan-only risk/coverage summary line. The comment is a content
      channel and never changes the check's red/green state — breaks still
      gate via fail-on-breaking / fail-on-api-break. Defaults to 'true', but
      is a no-op unless the workflow is triggered by a pull_request event
      and a token with 'pull-requests: write' is available.
    required: false
    default: 'true'
  pr-comment-mode:
    description: >
      'update' (default) keeps a single sticky comment and edits it in place on
      every run; 'new' posts a fresh comment each run. Either way the scanned
      head SHA is shown in the comment.
    required: false
    default: 'update'
  pr-comment-on:
    description: >
      When to comment: 'changes' (default) only comments when there is at least
      one ABI/API change, 'always' comments every run (including a clean
      "no changes" result), 'never' disables the comment.
    required: false
    default: 'changes'
  pr-comment-detail:
    description: >
      Detail level of the comment body: 'summary' (verdict + counts only),
      'standard' (default; per-symbol tables for breaking/review, grouped safe
      list) or 'full' (every change with locations, all sections expanded).
    required: false
    default: 'standard'
  github-token:
    description: >
      Token used to post the PR comment and to auto-fetch release baselines.
      Defaults to the workflow token; requires 'pull-requests: write' for the
      comment.
    required: false
    default: ${{ github.token }}

outputs:
  verdict:
    description: >
      ABI verdict. For compare (single-pair or directory/package operands):
      COMPATIBLE, SEVERITY_ERROR (with the severity-preset input, or when a
      `severity.addition: error` key in the repository's .abicheck.yml
      detects new public API additions),
      COVERAGE_INCOMPLETE (with --contract via extra-args, when
      the selected contract domain cannot be closed on the available
      evidence -- ADR-049's orthogonal coverage axis, which leaves the
      compatibility verdict unchanged), ANALYSIS_INCOMPLETE (single-pair
      operands only, with the require-complete-analysis input, when
      analysis_assurance.status is not "complete" -- P0.4's orthogonal
      assurance axis, which likewise leaves the compatibility verdict
      unchanged; rejected outright for a directory/package operand, so
      this verdict never applies there), API_BREAK,
      BREAKING, REMOVED_LIBRARY (directory/package operands with
      fail-on-removed-library set), or ERROR.
      For dump: COMPATIBLE or ERROR.
      For scan: COMPATIBLE, SEVERITY_ERROR (with --against and a
      severity or `--exit-code-scheme` setting, when an error-level
      category has findings), COVERAGE_INCOMPLETE, ANALYSIS_INCOMPLETE
      (with --against and the require-complete-analysis input, same
      axis as compare's), API_BREAK, BREAKING,
      NOT_COMPARABLE (with --against, when the candidate and baseline were
      not extracted under a comparable profile/scope contract -- ADR-050
      D2 -- so no comparison could run at all; this verdict fails the step
      unconditionally, since no fail-on-* input governs a run in which no
      comparison happened), BUDGET_OVERFLOW, EVIDENCE_CONTRACT_ERROR
      (this scan's evidence contract could not be satisfied -- ADR-037 D5
      -- so no comparison could run at all; two independent causes share
      this one verdict: a pinned --depth/--source-method whose required
      source evidence was never collected, or --abi3 targeting a binary
      that isn't a recognisable CPython extension module -- see the
      command's own error message for which one applied. Like
      NOT_COMPARABLE, this fails the step unconditionally and is
      distinct from ERROR, which covers a genuine CLI/config error --
      only published as this distinct verdict when a JSON report exists
      for this Action to read it from -- whether one was produced this
      run depends on the *effective* invocation, not any one input
      considered alone: an auto-injected `--write json=...` sidecar, the
      run's own extra-args already naming one via `--write`, this
      Action's own `format: json` input, or extra-args overriding
      `--format` in either direction (`--format json` under `format:
      text`, or `--format text` under `format: json` -- neither override
      is detected specially, so `format: json` alone is not a reliable
      guarantee any more than `format: text` alone is a reliable
      disqualifier). This description does not attempt to enumerate
      every format/pr-comment/extra-args combination that does or
      doesn't produce one, since five successive review rounds each
      found the previous claim incomplete (pr-comment: false; an
      --artifact-set scan; extra-args already owning --write for a
      non-JSON format; extra-args overriding a text primary format to
      JSON; extra-args overriding a JSON primary format back to text --
      the last two are mirror images of the same "the effective
      invocation, not the configured input, decides" root cause);
      action/run.sh's own JSON-detection logic (`_json_report_src` and
      the `_STDOUT_JSON_FILE` capture immediately above it -- search that
      file for either name) is the one authoritative source, with no
      shortcut claim in this description standing in for it. Whenever no
      JSON report exists, this still reads as the generic ERROR, a
      documented, unclosed gap.
      new-library-set (--artifact-set) scans are a stricter case of the
      same gap: the JSON sidecar is never auto-requested for that mode
      regardless of pr-comment, so a JSON report requires either
      format: json or the run's own extra-args to have written one --
      AND, even when a JSON report does exist, ScanSetResult's own aggregation
      (service_scan._aggregate_scan_set_verdict) reports this verdict at
      the set's top level only when it is the *worst* outcome across the
      set; a sibling library with a real API_BREAK/BREAKING keeps that
      verdict at the top level instead (still floors the overall exit code
      at 1, per that function's own docstring), leaving the aborted
      member's status visible only in the JSON report's own per_artifact
      list, not in the verdict/exit-code outputs this Action publishes.
      So "unconditionally fails the step" holds for a new-library-set scan
      only when the evidence-contract abort is the set's own worst
      outcome; when a sibling member's real break outranks it, this
      Action's fail-on-api-break/fail-on-breaking inputs alone decide the
      step's outcome, exactly as for an ordinary API_BREAK/BREAKING
      verdict, with the sibling abort unreported by this Action), or
      ERROR.
      For deps-compare: PASS, WARN, FAIL, or ERROR.
      For deps-tree: PASS, FAIL, or ERROR.
      On compare and scan alike, verdict and exit-code are different axes and
      may disagree: BREAKING/API_BREAK follows the report's compatibility
      verdict (what was *detected*) while the exit code follows what the
      severity policy chose to *gate* on. So a demoting policy (e.g.
      --severity-preset info-only) can publish BREAKING with exit code 0
      (nothing gated), and a policy that demotes abi_breaking while some
      other gate still fires -- an error-level --crosscheck, or
      potential_breaking: error -- can publish BREAKING with exit code 2.
      The same holds at exit code 1: a demoted abi_breaking alongside an
      error-level addition/quality finding publishes BREAKING or API_BREAK
      while the exit code names the severity tier that gated, so exit 1 is
      not always SEVERITY_ERROR or COVERAGE_INCOMPLETE.
      In both cases the verdict stays truthful and the step still gates at
      the tier the exit code names, so fail-on-breaking does not re-gate a
      break the policy demoted. Branch on verdict for what was found, and on
      exit-code for the tier abicheck itself gated at. Note that neither is
      the same as whether this step failed: the fail-on-* inputs decide that,
      so an ordinary API break with the default fail-on-api-break: false
      publishes exit-code 2 from a step that succeeded. Use the step's own
      outcome/conclusion for that.
    value: ${{ steps.run-abicheck.outputs.verdict }}
  exit-code:
    description: >
      abicheck exit code. compare: 0 (compatible), 1 (severity error,
      incomplete contract coverage, or incomplete analysis assurance with
      the require-complete-analysis input -- the three share the code and
      are told apart by the report's pre-fold severity.exit_code /
      contract_coverage_exit_contribution / analysis_assurance.status),
      2 (API break),
      4 (ABI break), 8 (library removed; directory/package operands with
      fail-on-removed-library set).
      scan: 0 (compatible/advisory), 1 (with --against: severity error,
      incomplete contract coverage, or incomplete analysis assurance with
      the require-complete-analysis input -- as on compare, the three
      share the code and are told apart the same way, one level down
      under diff; independently of --against, also an unsatisfied
      evidence contract (ADR-037 D5, VERDICT=EVIDENCE_CONTRACT_ERROR --
      either a pinned --depth/--source-method whose required source
      evidence was never collected, or --abi3 targeting a binary that
      isn't a recognisable CPython extension module) -- reachable on an
      audit-only scan too, since the underlying precondition checks run
      regardless of whether a baseline comparison follows, but only
      published as that distinct verdict when a JSON report exists to
      carry it -- see the verdict output's own description above for
      exactly which format/pr-comment/extra-args combinations produce
      one; otherwise this still exits 1 as the generic ERROR),
      2 (API break), 4 (ABI break), 5 (budget overflow), 6 (not comparable --
      candidate/baseline scope or profile mismatch, VERDICT=NOT_COMPARABLE).
      deps-compare: 0 (pass), 1 (warn),
      4 (fail). deps-tree: 0 (ok), 1 (missing). Click CLI errors are mapped to
      VERDICT=ERROR.
    value: ${{ steps.run-abicheck.outputs.exit-code }}
  report-path:
    description: >
      Path to the generated report file. Set when output-file is provided,
      or auto-populated for SARIF format (defaults to abicheck-results.sarif).
    value: ${{ steps.run-abicheck.outputs.report-path }}

runs:
  using: 'composite'
  steps:
    # ── 0. Validate mode/input combinations ──────────────────────────────────
    # Fails fast on an unsupported mode/input combination (e.g. a directory
    # passed to dump/scan, or format: sarif on a non-compare mode) before
    # Python setup, system-dependency installation, or any build/analysis
    # work runs — see action/validate-inputs.sh for the rationale. It also
    # warns (not fails) when a mode-scoped input is set on a mode it has no
    # effect on — a legal-but-inert combination, not an error.
    - name: Validate mode/input combination
      shell: bash
      env:
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_NEW_LIBRARY: ${{ inputs.new-library }}
        INPUT_NEW_LIBRARY_SET: ${{ inputs.new-library-set }}
        INPUT_BUNDLE_SYSTEM_PROVIDERS: ${{ inputs.bundle-system-providers }}
        INPUT_AGAINST: ${{ inputs.against }}
        INPUT_DRY_RUN: ${{ inputs.dry-run }}
        INPUT_OLD_HEADER: ${{ inputs.old-header }}
        INPUT_OLD_INCLUDE: ${{ inputs.old-include }}
        INPUT_OLD_LIBRARY: ${{ inputs.old-library }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_UPLOAD_SARIF: ${{ inputs.upload-sarif }}
        INPUT_DEBUG_INFO1: ${{ inputs.debug-info1 }}
        INPUT_DEBUG_INFO2: ${{ inputs.debug-info2 }}
        INPUT_DEVEL_PKG1: ${{ inputs.devel-pkg1 }}
        INPUT_DEVEL_PKG2: ${{ inputs.devel-pkg2 }}
        INPUT_DSO_ONLY: ${{ inputs.dso-only }}
        INPUT_INCLUDE_PRIVATE_DSO: ${{ inputs.include-private-dso }}
        INPUT_KEEP_EXTRACTED: ${{ inputs.keep-extracted }}
        INPUT_FAIL_ON_REMOVED_LIBRARY: ${{ inputs.fail-on-removed-library }}
        INPUT_JOBS: ${{ inputs.jobs }}
        INPUT_ABI_BASELINE: ${{ inputs.abi-baseline }}
        INPUT_BASELINE_PROFILE: ${{ inputs.baseline-profile }}
        INPUT_BASELINE_TARGET: ${{ inputs.baseline-target }}
        INPUT_BASELINE_ASSET_NAME_TEMPLATE: ${{ inputs.baseline-asset-name-template }}
        INPUT_BASELINE_GENERATION: ${{ inputs.baseline-generation }}
        INPUT_ESTIMATE: ${{ inputs.estimate }}
        INPUT_AUDIT: ${{ inputs.audit }}
        INPUT_USED_BY: ${{ inputs.used-by }}
        INPUT_REQUIRED_SYMBOL: ${{ inputs.required-symbol }}
        INPUT_REQUIRED_SYMBOLS: ${{ inputs.required-symbols }}
        INPUT_SNAPSHOT_COMPRESSION: ${{ inputs.snapshot-compression }}
        INPUT_PUBLIC_HEADER_DIR: ${{ inputs.public-header-dir }}
        INPUT_BUILD_TARGET: ${{ inputs.build-target }}
        # validate-inputs.sh's own compile-context guard (ast-frontend/
        # gcc-*/sysroot/nostdinc for a directory/package compare operand)
        # and its new require-complete-analysis release-operand guard both
        # read these -- previously missing from this step's env block
        # entirely, so both checks always read their inputs as unset/false
        # here regardless of what the workflow set, and only the identical
        # check re-run inside run.sh (which *is* wired) ever actually fired
        # (Codex review; found while wiring require-complete-analysis
        # through this same step).
        INPUT_AST_FRONTEND: ${{ inputs.ast-frontend }}
        INPUT_GCC_PATH: ${{ inputs.gcc-path }}
        INPUT_GCC_PREFIX: ${{ inputs.gcc-prefix }}
        INPUT_GCC_OPTIONS: ${{ inputs.gcc-options }}
        INPUT_SYSROOT: ${{ inputs.sysroot }}
        INPUT_NOSTDINC: ${{ inputs.nostdinc }}
        INPUT_REQUIRE_COMPLETE_ANALYSIS: ${{ inputs.require-complete-analysis }}
        # The scan build-info/compile-db conflict guard below also reads
        # these -- same previously-missing-from-this-step-entirely gap,
        # caught by the same generalized contract test
        # (test_every_validate_inputs_var_is_set_by_its_own_step) once it
        # existed, rather than found by review a second time.
        INPUT_BUILD_INFO: ${{ inputs.build-info }}
        INPUT_COMPILE_DB: ${{ inputs.compile-db }}
      run: bash "${{ github.action_path }}/action/validate-inputs.sh"

    # ── 1. Python ─────────────────────────────────────────────────────────────
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
      with:
        python-version: ${{ inputs.python-version }}

    # ── 2. System dependencies ────────────────────────────────────────────────
    # `dependency-source` (new) takes priority; an unset `dependency-source`
    # falls back to the legacy `install-deps` boolean for one release cycle —
    # true (its own default too, so "never touched either input" lands here)
    # now maps to conda-forge, the new default; false maps to none, preserving
    # an explicit opt-out. A caller who explicitly wants the old apt/Homebrew
    # path can still set dependency-source: system directly.
    - name: Resolve dependency-source
      id: resolve-deps
      shell: bash
      env:
        INPUT_DEPENDENCY_SOURCE: ${{ inputs.dependency-source }}
        INPUT_INSTALL_DEPS: ${{ inputs.install-deps }}
        RUNNER_OS: ${{ runner.os }}
      run: |
        if [ -n "$INPUT_DEPENDENCY_SOURCE" ]; then
          resolved="$INPUT_DEPENDENCY_SOURCE"
        elif [ "$INPUT_INSTALL_DEPS" = "false" ]; then
          resolved="none"
        elif [ "$RUNNER_OS" = "Windows" ]; then
          # The default below is a Linux/macOS default: every conda-forge*
          # source is explicitly unsupported on Windows (the step further
          # down that hard-fails it), because pyproject.toml's
          # native-toolchain* pixi features don't cover win-64. Defaulting a
          # Windows runner to conda-forge therefore resolves straight into
          # that `exit 1` -- which nobody could have been relying on, so
          # falling back to `system` here can only unblock. `system` is
          # exactly what that error message already tells Windows users to
          # pick, and install-deps.sh's own Windows branch warns and
          # continues rather than failing, matching the "toolchain is
          # pre-installed on the image" story an MSVC lane has anyway.
          # An *explicit* conda-forge* still fails: asking for something
          # unsupported should say so, not be silently rewritten.
          #
          # Reached for real since G34 Phase C, which lets an `os: windows`
          # profile schedule a native `windows-latest` check cell (Codex
          # review) -- before that, no Windows runner got this far through
          # check-project.yml at all.
          resolved="system"
        else
          resolved="conda-forge"
        fi
        case "$resolved" in
          system|conda-forge|conda-forge-gcc14|conda-forge-clang20|none) ;;
          *)
            echo "::error::dependency-source must be one of 'system', 'conda-forge'," \
              "'conda-forge-gcc14', 'conda-forge-clang20', or 'none' (got '${resolved}')"
            exit 1
            ;;
        esac
        echo "value=${resolved}" >> "$GITHUB_OUTPUT"
        # Maps a resolved dependency-source onto the pyproject.toml pixi
        # environment name that provisions it (only meaningful for the three
        # conda-forge-* values; unused otherwise).
        case "$resolved" in
          conda-forge) echo "pixi-env=scanner" >> "$GITHUB_OUTPUT" ;;
          conda-forge-gcc14) echo "pixi-env=gcc14" >> "$GITHUB_OUTPUT" ;;
          conda-forge-clang20) echo "pixi-env=clang20" >> "$GITHUB_OUTPUT" ;;
        esac

    - name: Install system dependencies (system)
      if: steps.resolve-deps.outputs.value == 'system'
      shell: bash
      run: bash "${{ github.action_path }}/action/install-deps.sh"

    - name: dependency-source=conda-forge* is not yet supported on Windows
      if: startsWith(steps.resolve-deps.outputs.value, 'conda-forge') && runner.os == 'Windows'
      shell: bash
      run: |
        echo "::error::dependency-source=${{ steps.resolve-deps.outputs.value }} is not yet" \
          "supported on Windows (pyproject.toml's native-toolchain* pixi features don't cover" \
          "win-64). Use dependency-source=system or install castxml/a compiler manually."
        exit 1

    # conda-forge* paths: pixi resolves one of this repo's own pyproject.toml
    # environments (scanner/gcc14/clang20 — the mapped `pixi-env` output above,
    # `pixi.lock`-frozen) instead of the checksum-pinned Superbuild installer.
    # Linux/macOS only (gcc14 is linux-only — conda-forge's gcc doesn't build
    # for macOS). Only clang20 provides clang; none of the three provide bear
    # yet (L3/L4/L5 source scanning degrades gracefully when clang/bear are
    # absent, same as on the system path without them).
    - name: Set up pixi (conda-forge)
      if: startsWith(steps.resolve-deps.outputs.value, 'conda-forge') && runner.os != 'Windows'
      uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11  # v0.9.6
      with:
        manifest-path: ${{ github.action_path }}/pyproject.toml
        environments: ${{ steps.resolve-deps.outputs.pixi-env }}
        frozen: true

    - name: Install system dependencies (conda-forge)
      if: startsWith(steps.resolve-deps.outputs.value, 'conda-forge') && runner.os != 'Windows'
      shell: bash
      env:
        ABICHECK_PIXI_ENV: ${{ steps.resolve-deps.outputs.pixi-env }}
      run: bash "${{ github.action_path }}/action/install-deps-conda-forge.sh"

    # ── 3. Install abicheck ──────────────────────────────────────────────────
    - name: Install abicheck
      shell: bash
      run: pip install "${{ github.action_path }}"

    # ── 4. Run abicheck ──────────────────────────────────────────────────────
    - name: Run abicheck
      id: run-abicheck
      shell: bash
      env:
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_OLD_LIBRARY: ${{ inputs.old-library }}
        INPUT_NEW_LIBRARY: ${{ inputs.new-library }}
        INPUT_NEW_LIBRARY_SET: ${{ inputs.new-library-set }}
        INPUT_BUNDLE_SYSTEM_PROVIDERS: ${{ inputs.bundle-system-providers }}
        INPUT_HEADER: ${{ inputs.header }}
        INPUT_OLD_HEADER: ${{ inputs.old-header }}
        INPUT_NEW_HEADER: ${{ inputs.new-header }}
        INPUT_PUBLIC_HEADER_DIR: ${{ inputs.public-header-dir }}
        INPUT_BUILD_TARGET: ${{ inputs.build-target }}
        INPUT_INCLUDE: ${{ inputs.include }}
        INPUT_OLD_INCLUDE: ${{ inputs.old-include }}
        INPUT_NEW_INCLUDE: ${{ inputs.new-include }}
        INPUT_OLD_VERSION: ${{ inputs.old-version }}
        INPUT_NEW_VERSION: ${{ inputs.new-version }}
        INPUT_LANG: ${{ inputs.lang }}
        INPUT_AST_FRONTEND: ${{ inputs.ast-frontend }}
        INPUT_GCC_PATH: ${{ inputs.gcc-path }}
        INPUT_GCC_PREFIX: ${{ inputs.gcc-prefix }}
        INPUT_GCC_OPTIONS: ${{ inputs.gcc-options }}
        INPUT_SYSROOT: ${{ inputs.sysroot }}
        INPUT_NOSTDINC: ${{ inputs.nostdinc }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_OUTPUT_FILE: ${{ inputs.output-file }}
        INPUT_SNAPSHOT_COMPRESSION: ${{ inputs.snapshot-compression }}
        INPUT_POLICY: ${{ inputs.policy }}
        INPUT_POLICY_FILE: ${{ inputs.policy-file }}
        INPUT_SUPPRESS: ${{ inputs.suppress }}
        INPUT_VERBOSE: ${{ inputs.verbose }}
        INPUT_FOLLOW_DEPS: ${{ inputs.follow-deps }}
        INPUT_OLD_ROOT: ${{ inputs.old-root }}
        INPUT_NEW_ROOT: ${{ inputs.new-root }}
        INPUT_USED_BY: ${{ inputs.used-by }}
        INPUT_REQUIRED_SYMBOL: ${{ inputs.required-symbol }}
        INPUT_REQUIRED_SYMBOLS: ${{ inputs.required-symbols }}
        INPUT_AGAINST: ${{ inputs.against }}
        INPUT_SEARCH_PATH: ${{ inputs.search-path }}
        INPUT_LD_LIBRARY_PATH: ${{ inputs.ld-library-path }}
        INPUT_FAIL_ON_BREAKING: ${{ inputs.fail-on-breaking }}
        INPUT_FAIL_ON_API_BREAK: ${{ inputs.fail-on-api-break }}
        INPUT_SEVERITY_PRESET: ${{ inputs.severity-preset }}
        INPUT_REQUIRE_COMPLETE_ANALYSIS: ${{ inputs.require-complete-analysis }}
        INPUT_ANNOTATE: ${{ inputs.annotate }}
        INPUT_ANNOTATE_ADDITIONS: ${{ inputs.annotate-additions }}
        INPUT_EXTRA_ARGS: ${{ inputs.extra-args }}
        INPUT_ABI_BASELINE: ${{ inputs.abi-baseline }}
        INPUT_BASELINE_PROFILE: ${{ inputs.baseline-profile }}
        INPUT_BASELINE_TARGET: ${{ inputs.baseline-target }}
        INPUT_BASELINE_ASSET_NAME_TEMPLATE: ${{ inputs.baseline-asset-name-template }}
        INPUT_BASELINE_GENERATION: ${{ inputs.baseline-generation }}
        INPUT_JOBS: ${{ inputs.jobs }}
        INPUT_ADD_JOB_SUMMARY: ${{ inputs.add-job-summary }}
        INPUT_DEBUG_INFO1: ${{ inputs.debug-info1 }}
        INPUT_DEBUG_INFO2: ${{ inputs.debug-info2 }}
        INPUT_DEVEL_PKG1: ${{ inputs.devel-pkg1 }}
        INPUT_DEVEL_PKG2: ${{ inputs.devel-pkg2 }}
        INPUT_DSO_ONLY: ${{ inputs.dso-only }}
        INPUT_INCLUDE_PRIVATE_DSO: ${{ inputs.include-private-dso }}
        INPUT_KEEP_EXTRACTED: ${{ inputs.keep-extracted }}
        INPUT_FAIL_ON_REMOVED_LIBRARY: ${{ inputs.fail-on-removed-library }}
        INPUT_PR_COMMENT: ${{ inputs.pr-comment }}
        INPUT_PR_COMMENT_MODE: ${{ inputs.pr-comment-mode }}
        INPUT_PR_COMMENT_ON: ${{ inputs.pr-comment-on }}
        INPUT_PR_COMMENT_DETAIL: ${{ inputs.pr-comment-detail }}
        INPUT_SOURCES: ${{ inputs.sources }}
        INPUT_BUILD_INFO: ${{ inputs.build-info }}
        INPUT_COMPILE_DB: ${{ inputs.compile-db }}
        INPUT_BUILD_CONFIG: ${{ inputs.build-config }}
        INPUT_ALLOW_BUILD_QUERY: ${{ inputs.allow-build-query }}
        INPUT_DEPTH: ${{ inputs.depth }}
        INPUT_SINCE: ${{ inputs.since }}
        INPUT_CHANGED_PATH: ${{ inputs.changed-path }}
        INPUT_BUDGET: ${{ inputs.budget }}
        INPUT_DRY_RUN: ${{ inputs.dry-run }}
        INPUT_ESTIMATE: ${{ inputs.estimate }}
        INPUT_AUDIT: ${{ inputs.audit }}
        INPUT_CROSSCHECK: ${{ inputs.crosscheck }}
        INPUT_RISK_RULES: ${{ inputs.risk-rules }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: bash "${{ github.action_path }}/action/run.sh"

    # ── 5. Upload SARIF ──────────────────────────────────────────────────────
    - name: Upload SARIF to Code Scanning
      if: inputs.upload-sarif == 'true' && inputs.format == 'sarif' && steps.run-abicheck.outputs.report-path != ''
      uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a  # v4
      with:
        sarif_file: ${{ steps.run-abicheck.outputs.report-path }}
        category: abicheck
      continue-on-error: true
