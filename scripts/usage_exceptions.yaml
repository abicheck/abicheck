# Declared exceptions for scripts/check_usage_ratchet.py.
#
# A key listed here is a finding that is legitimately test-only or
# duplicated -- public Python API kept for library users, a plugin entry
# point loaded by name from outside this repository -- and is never
# reported. It is NOT a second baseline: debt that should eventually go
# belongs in scripts/usage_ratchet_baseline.json, which only shrinks.
#
# Each entry needs a `key` (exactly as the gate prints it) and a non-empty
# `reason`. An entry whose key no longer matches a finding fails the gate
# as stale, so this list cannot rot.
#
# Shape:
#   test_only_functions:
#     - key: abicheck.module#Class.method
#       reason: documented extension hook, called by third-party plugins
test_only_functions: []
test_only_modules:
  - key: abicheck.workflows.consumer_scope_standalone
    reason: "public Python API: check_appcompat/check_plugin_host_contract (docs/use/appcompat.md, docs/use/plugin-systems.md) for library users; the CLI uses the pre-computed-diff path instead"
  - key: abicheck.workflows.package_gc
    reason: "public Python API: collect_package_garbage, ADR-062 D17's package garbage collection (docs/reference/project-snapshot-format.md); no CLI subcommand maintains packages yet (known-gaps D17 residual)"
  - key: abicheck.compare.auto_derived_standard
    reason: "production code reached only through abicheck.comparability_profile, which comparability.py loads with importlib.import_module to break the comparability <-> comparability_profile cycle; the static scan cannot see that import (comparability_profile is in the ratchet baseline for the same reason)"
  - key: abicheck.storage.extension_facts
    reason: "ADR-062 D19's write/read API for declared extension facts; the catalog (storage/extension_fact_catalog.py) is empty by design until its first fact, ADR-079's export_read (D19 'Applied to ADR-079'), whose writer and reader will be its production callers -- this entry then goes stale and the gate fails until it is removed"
cross_module_exact_clones: []
