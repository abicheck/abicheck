# Declared exceptions for scripts/check_usage_ratchet.py.
#
# A key listed here is a finding that is legitimately test-only or
# duplicated -- public Python API kept for library users, a plugin entry
# point loaded by name from outside this repository -- and is never
# reported. It is NOT a second baseline: debt that should eventually go
# belongs in scripts/usage_ratchet_baseline.json, which only shrinks.
#
# Each entry needs a `key` (exactly as the gate prints it) and a non-empty
# `reason`. An entry whose key no longer matches a finding fails the gate
# as stale, so this list cannot rot.
#
# Shape:
#   test_only_functions:
#     - key: abicheck.module#Class.method
#       reason: documented extension hook, called by third-party plugins
test_only_functions: []
test_only_modules:
  - key: abicheck.workflows.consumer_scope_standalone
    reason: "public Python API: check_appcompat/check_plugin_host_contract (docs/use/appcompat.md, docs/use/plugin-systems.md) for library users; the CLI uses the pre-computed-diff path instead"
cross_module_exact_clones: []
