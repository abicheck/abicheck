# Scenario group: CI ABI gating (persona: CI engineer)
#
# See tests/scenarios/README.md for the catalog format and how it is validated.
schema_version: 1

scenarios:
  - id: SC-CI-GATE-BREAKING
    title: CI ABI gate fails the build on a removed public symbol
    persona: CI engineer
    narrative: >
      A pull request drops a public function from a shared library. The ABI gate
      in CI must fail (non-zero exit) so the breaking change cannot merge
      silently.
    flow:
      - abicheck compare old.json new.json
    expected:
      exit_code: 4
      verdict: BREAKING
    validates: UC-WF-compare
    automated: true
    test: test_sc_ci_gate_breaking

  - id: SC-CI-GATE-ADDITIVE
    title: CI ABI gate passes a backward-compatible addition
    persona: CI engineer
    narrative: >
      A release adds a new exported function and changes nothing else. The gate
      must pass (exit 0) so additive work is not blocked.
    flow:
      - abicheck compare old.json new.json
    expected:
      exit_code: 0
      verdict: COMPATIBLE
    validates: UC-WF-compare
    automated: true
    test: test_sc_ci_gate_additive

  - id: SC-EXIT-CONTRACT
    title: Exit-code contract (0 / 2 / 4) is stable for tooling
    persona: CI engineer
    narrative: >
      Build scripts gate on exit codes: 0 = compatible, 2 = source-level
      (API) break, 4 = binary (ABI) break. This contract must hold so a
      Makefile/pipeline can branch on it.
    flow:
      - abicheck compare old.json new.json   # exit code is the gate
    expected:
      exit_codes: {NO_CHANGE: 0, API_BREAK: 2, BREAKING: 4}
    surfaces:
      - cli: compare
    validates: UC-WF-compare
    automated: true
    test: test_sc_exit_contract

  - id: SC-CI-SEVERITY-GATE
    title: Severity policy turns an ABI break into a warning (custom gate)
    persona: CI engineer
    narrative: >
      A team is mid-migration and wants ABI breaks reported but NOT
      build-failing for one release. Any severity setting switches to the
      severity-aware exit scheme; downgrading abi_breaking to "warning" in
      .abicheck.yml yields exit 0 while the default gate still fails with
      exit 4.
    flow:
      - abicheck compare old.json new.json --config warn.abicheck.yml
    expected:
      exit_code: 0
      default_exit_code: 4
    surfaces:
      - cli: compare --config
    validates: UC-WF-compare
    automated: true
    test: test_sc_ci_severity_gate

  - id: SC-CI-STRICT-INFORMATIONAL
    title: A strict gate never fails on an informational, no-material-change finding
    persona: CI engineer
    narrative: >
      A team runs with severity.preset: strict but keeps additions informational.
      Adding a function also emits public_surface_grew, an aggregate
      roll-up of the additions already reported. That roll-up is an
      informational outcome (ADR-078): it stays in the report under
      summary.informational, but it is never scored as a quality issue,
      so the run exits 0 instead of failing on a restatement of an
      info-level addition.
    flow:
      - abicheck compare old.json new.json --set severity.preset=strict --config additions-info.abicheck.yml
    expected:
      exit_code: 0
    surfaces:
      - cli: compare --config
    validates: UC-WF-compare
    automated: true
    test: test_sc_ci_strict_informational

  - id: SC-CI-SEVERITY-CONFIG
    title: A .abicheck.yml severity override decides the CI exit code
    persona: CI engineer
    narrative: >
      A project accepts a removed function for one release by setting
      `severity.abi_breaking: info` in .abicheck.yml. The documented config rule
      (exit-codes.md) makes the CI gate exit 0 where the verdict alone exits 4.
      The typed API takes the same value through CompareRequest (ADR-088).
    flow:
      - abicheck compare old.json new.json --config abi-info.abicheck.yml
    expected:
      exit_code: 0
    surfaces:
      - cli: compare --config
      - api: abicheck.workflows.service_requests.CompareRequest
    validates: UC-WF-compare
    automated: true
    test: test_sc_ci_severity_block_demotes_removal

  - id: SC-CI-STAT
    title: One-line summary for CI logs (-o oneline=...)
    persona: CI engineer
    narrative: >
      A pipeline wants a compact, greppable one-line result in the job log
      instead of a full report. CLI cleanup phase two, PR 1 removed the
      boolean --stat flag; -o oneline=... is its sole surviving one-line
      output (originally reached only via the built-in `quick` --profile,
      removed outright by plan Phase 7e).
    flow:
      - abicheck compare old.json new.json -o oneline=-
    expected:
      exit_code: 4
      output_contains: total
    validates: UC-WF-compare
    automated: true
    test: test_sc_ci_oneline_format

  - id: SC-MALFORMED-INPUT
    title: Corrupt snapshot fails the run cleanly (degraded-mode contract)
    persona: CI engineer
    narrative: >
      A gate is only trustworthy if its failure modes are predictable. When a
      snapshot is corrupt or unreadable (truncated artifact, bad upload), the
      scanner must not crash with a traceback or — worse — exit 0 and look clean.
      It exits non-zero (1) with a clear "failed to load" diagnostic so the
      pipeline distinguishes a tooling error from a compatibility verdict.
    flow:
      - abicheck compare good.json corrupt.json
    expected:
      exit_code: 1
      output_contains: "Failed to load"
    validates: UC-WF-compare
    automated: true
    test: test_sc_malformed_input

  - id: SC-SCAN-BINARY-DEPTH-MATRIX-ARGS
    title: Binary-depth scan ignores matrix-wide source/build inputs
    persona: CI maintainer running a depth matrix
    narrative: >
      A CI matrix often builds one command template and varies only --depth,
      leaving --headers, --sources, and --build-info on every rung. The binary
      rung must remain an L0/L1 artifact scan: it should ignore those deeper
      inputs, skip the source pattern scan and L3 collection, and return the same
      binary verdict quickly.
    flow:
      # ADR-068 Phase 6 retired `scan` outright; this scenario now runs the
      # identical check through `compare`, which pins the requested
      # `--depth binary` the same way `scan` used to.
      - abicheck compare old.json new.json -H include/ --sources src/ --build-info compile_commands.json --depth binary -o json=-
    expected:
      exit_code: 4
      verdict: BREAKING
      old_evidence_depth: binary
      new_evidence_depth: binary
      evidence_tiers: [elf]
    validates: UC-WORKFLOW-pr-source-tier
    automated: true
    test: test_sc_scan_binary_depth_matrix_args

  # G2: fold build-config (probe-matrix) findings into the mainline gate.
  - id: SC-PROBE-MATRIX-GATE
    title: Build-config findings (C++ floor) gate via probe matrices in compare
    persona: CI engineer
    narrative: >
      A library's binary surface is unchanged, but a build raises the minimum
      C++ standard floor (17 → 20) — a source-level break that a per-binary diff
      cannot see. By passing the probe build-config matrices to compare
      (--build-info old=/new=, routed on the matrix document), the CXX_STANDARD_FLOOR_RAISED
      finding is folded into the same verdict and report, turning a NO_CHANGE
      binary diff into an API_BREAK gate (exit 2).
    flow:
      - abicheck compare old.json new.json --build-info old=old.matrix.json --build-info new=new.matrix.json
    expected:
      exit_code: 2
      verdict: API_BREAK
      contains_kind: cxx_standard_floor_raised
    validates: UC-WF-probe-matrix
    automated: true
    test: test_sc_probe_matrix_into_compare

  # Multi-library bundle PR gate: block confirmed public breaks, warn (don't
  # block) when analysis could not confidently confirm the public surface.
  - id: SC-BUNDLE-PR-GATE-STRICT
    title: Block multi-library bundle PRs on public ABI/API break, warn on unconfirmed analysis
    persona: numerical-library maintainer (e.g. oneDAL)
    narrative: >
      A pull request changes a co-versioned bundle's shared libraries or public
      headers. CI must
      stop merges for confirmed public BREAKING or API_BREAK findings, but must
      only warn (not block) when compatibility cannot be confidently confirmed —
      the public-surface scope fell back, or the verdict is COMPATIBLE_WITH_RISK.
      Because exit 0 covers NO_CHANGE / COMPATIBLE / COMPATIBLE_WITH_RISK, the
      gate inspects the JSON `verdict` field rather than relying on exit codes
      alone, and uses compare-release so sibling-library relationships in the
      bundle are analysed.
    flow:
      - abicheck compare-release baseline/ pr-build/ -H include/ -o json=abi.json
      - abicheck compare-release baseline/ pr-build/ -H include/ -o junit=abi.xml
    expected:
      # Block only on CONFIRMED public breaks; when scoping fell back the result
      # is unconfirmed and must be manual-review-only, never an auto-fail.
      fail_when:
        - verdict in [BREAKING, API_BREAK] and scope.manual_review_required == false
      manual_review_when:
        - scope.manual_review_required == true   # public surface could not be confirmed
        - verdict == COMPATIBLE_WITH_RISK
      require_public_surface_scope: true   # scope block present in JSON
      require_bundle_analysis: true        # bundle_verdict/bundle_findings present
    validates: UC-WF-bundle
    automated: false
    status: planned
    note: >
      G2 is Done (build matrix folds into compare/compare-release; bundle soname-skew is wired) — the plan record was
      retired after completion (see docs/contribute/plans/index.md).
      This specific scenario just has no automated end-to-end CLI test yet.
      The scoping rollup (scope.manual_review_required / public_additions /
      filtered_internal_changes) and changed_libraries that this gate keys off
      are unit-tested in tests/test_compare_release.py
      (TestCompareReleaseScopeAndChangedLibraries). Full automation needs a real
      multi-library bundle (multiple .so + public headers) so -H scoping is exercised
      end-to-end rather than via JSON snapshots.

  # Multi-library additive surface tracking: report growth, never gate on it.
  - id: SC-BUNDLE-PR-ADDITION-TRACKING
    title: Report bundle API/ABI additions without gating the PR
    persona: numerical-library maintainer (e.g. oneDAL)
    narrative: >
      A pull request legitimately expands the bundle's surface. CI must not block the
      merge on additions alone, but it must clearly separate public additions
      from internal-only growth (using public-header scoping, whose exclusion
      ledger every run discloses) and communicate the release impact to reviewers via
      a job summary / PR comment rather than raw JSON.
    flow:
      - abicheck compare-release baseline/ pr-build/ -H include/ -o json=abi.json
      - abicheck compare-release baseline/ pr-build/ -H include/ -o json=reports/ -o markdown=-
    expected:
      fail_when:
        - verdict in [BREAKING, API_BREAK]
      do_not_fail_on: [COMPATIBLE]
      # Real compare-release JSON keys (see render_release_summary): the scope
      # rollup separates public growth from internal-only growth.
      require_summary_fields:
        - changed_libraries
        - scope.public_additions
        - scope.filtered_internal_changes
      github_presentation: [job_summary, pr_comment]
    validates: UC-WF-bundle
    automated: false
    status: planned
    note: >
      G3 is Done (workflow scenarios and Markdown/HTML coverage) — the plan record was
      retired after completion (see docs/contribute/plans/index.md).
      This specific scenario just has no automated end-to-end CLI test yet.
      changed_libraries and the scope.public_additions / filtered_internal_changes
      rollup are emitted today and unit-tested in tests/test_compare_release.py.
      Per-library release_recommendation is available in the -o json=reports/
      (single-library JSON). The job_summary / pr_comment digest is the G3
      review-UX deliverable; full automation needs a real multi-library bundle.

  - id: SC-ZERO-COMPARISON-NOT-CLEAN
    title: A release compare that pairs nothing must not read as a clean pass
    persona: Release engineer gating a directory of libraries in CI
    narrative: >
      The baseline and the new release directories share no library name, so
      no member pairs and zero comparisons complete. The run must not exit 0
      or report a compatibility verdict. It records no_comparison_completed
      and an incomplete scope, and exits 1 under both the warn and block
      scope policies.
    flow:
      - abicheck compare baseline/ candidate/ --config abicheck.yml -o json=report.json
    expected:
      exit_code: 1
      run_outcome:
        operational: no_comparison_completed
        compatibility: null
        scope: incomplete
      exit_reasons_include: [no_comparison_completed]
    surfaces:
      - report: compare_report.run_outcome
      - report: compare_report.comparison_scope
    validates: UC-WF-scope-completeness
    automated: true
    test: test_sc_zero_comparison_not_clean

  - id: SC-ANALYSIS-ASSURANCE-GATE
    title: Missing evidence is reported, and assurance.require_complete turns it into a gate
    persona: Library maintainer whose CI only has the exported symbol table
    narrative: >
      The snapshots carry only the ELF export table, with no headers and no
      DWARF. Without a completeness requirement the run exits 0, but the JSON
      report says the analysis is partial and lists the unverified layout
      detectors. With assurance.require_complete: true the same clean run exits
      1. A real ABI break in the same configuration still exits 4, because the
      assurance axis only raises a clean exit and never lowers a break.
    flow:
      - abicheck compare old.json new.json -o json=report.json
      - abicheck compare old.json new.json --config abicheck.yml -o json=report.json
    expected:
      exit_code_default: 0
      exit_code_required: 1
      analysis_assurance:
        status: partial
        contribution_required: 1
        unverified_includes: [dwarf]
      breaking_pair_exit_required: 4
    surfaces:
      - cli: compare
    validates: UC-WF-analysis-assurance
    automated: true
    test: test_sc_analysis_assurance_gate
