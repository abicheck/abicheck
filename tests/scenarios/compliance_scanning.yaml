# Scenario group: compliance scanning (persona: library maintainer / AppSec)
#
# See tests/scenarios/README.md for the catalog format and how it is validated.
schema_version: 1

scenarios:
  # The missed scenario from issue #235.
  - id: SC-PUBLIC-SURFACE-SCOPE
    title: Public-header scoping suppresses private/internal ABI breaks
    persona: Library maintainer
    issue: 235
    narrative: >
      A maintainer ships a stable public API and changes only a private/internal
      type that is not reachable from any public declaration. Run as a
      compliance scanner with public headers and public-header scoping (the default), abicheck
      must NOT raise compliance errors for the private break (matching the
      default behaviour of libabigail and abicc). The private change is recorded
      as filtered -- disclosed on every run since plan slice 7o, with no token
      to type -- never as a verdict-affecting finding.
    flow:
      - abicheck compare old.json new.json
    expected:
      exit_code: 0
      verdict: NO_CHANGE   # the only change was to a private type → filtered
      without_scope_exit_code: 4
    validates: UC-WF-compare
    automated: true
    test: test_sc_public_surface_scope

  # The other half of issue #235: scoping is best-effort and can fall back.
  - id: SC-PUBLIC-SURFACE-SCOPE-FALLBACK
    title: Public-header scoping falls back and requires manual review
    persona: Library maintainer
    issue: 235
    narrative: >
      The maintainer asks for public-surface scoping, but the scope cannot be
      resolved — castxml is unavailable, the public headers do not parse, or
      PE/MSVC name matching fails. abicheck must NOT silently claim a clean
      public surface. It warns, falls back to the full export table, and flags
      that the result needs manual review (so an unconfirmed scope never reads
      as confident compatibility). This is the "don't overclaim" companion to
      SC-PUBLIC-SURFACE-SCOPE.
    flow:
      - abicheck compare old.json new.json -o json=-
    expected:
      exit_code: 4   # fallback keeps the break, so the gate still fires
      scope_resolved: false
      manual_review_required: true
      warning_on_stderr: true
    validates: UC-WF-compare
    automated: true
    test: test_sc_public_surface_scope_fallback

  - id: SC-ACCEPT-KNOWN-BREAK
    title: Accept a known, intentional break via a suppression file
    persona: Library maintainer
    narrative: >
      A maintainer intentionally removed a deprecated symbol and recorded a
      justified, time-boxed suppression. The gate must pass (exit 0) while the
      suppression is live, and the change is tracked as suppressed (audit trail).
    flow:
      - abicheck compare old.json new.json --suppress suppressions.yaml
    expected:
      exit_code: 0
    surfaces:
      - cli: compare --suppress
    validates: UC-WF-suppression
    automated: true
    test: test_sc_accept_known_break

  - id: SC-ACCEPT-KNOWN-BREAK-ACK
    title: Accept a reviewed break with an acknowledgment record, without weakening the verdict
    persona: Library maintainer
    narrative: >
      A maintainer reviewed one removed symbol and recorded it as an
      acknowledgment with its change kind. With `acknowledgment.breaks: accept`
      in the explicit config, the gate passes (exit 0) for that break. The
      verdict and the report still show it as a break, and an unreviewed sibling
      break on the same run would still gate.
    flow:
      - abicheck compare old.json new.json --config breaks.abicheck.yml --acknowledgments acks.yml
    expected:
      exit_code: 0
    surfaces:
      - cli: compare --acknowledgments
      - action: acknowledgments
    validates: UC-WF-acknowledgment
    automated: true
    test: test_sc_accept_known_break_via_acknowledgments

  - id: SC-SUPPRESSION-EXPIRY
    title: Strict suppressions fail when a waiver has expired
    persona: Library maintainer
    narrative: >
      Suppressions are time-boxed waivers. With `suppression.strict: true` in
      `.abicheck.yml`, a rule past its `expires` date fails the run (exit 1) so
      stale waivers can't hide breaks indefinitely. (Note: an expired rule no
      longer suppresses, so the underlying break also resurfaces.)
    flow:
      - abicheck compare old.json new.json --suppress expired.yaml --config strict.abicheck.yml
    expected:
      exit_code: 1
    validates: UC-WF-suppression
    automated: true
    test: test_sc_suppression_expiry

  - id: SC-POLICY-PROFILE
    title: A policy profile reclassifies a source-only break
    persona: SDK vendor
    narrative: >
      An SDK vendor ships source alongside binaries, so source-only API breaks
      (e.g. an enum-member rename) are acceptable. The sdk_vendor policy
      downgrades them to COMPATIBLE (exit 0) where strict_abi reports an API
      break (exit 2).
    flow:
      - abicheck compare old.json new.json --policy sdk_vendor
    expected:
      exit_code: 0
      strict_exit_code: 2
    surfaces:
      - cli: compare --policy
    validates: UC-WF-policy-profile
    automated: true
    test: test_sc_policy_profile

  - id: SC-CONTRACT-DOMAIN-COVERAGE
    title: Stating a contract domain makes missing evidence for it visible
    persona: Library maintainer
    narrative: >
      A maintainer declares that the public contract is what the gate judges.
      A removed public function still breaks (exit 4), and because the
      snapshots carry no export table, the run also records that coverage of
      the stated domain is incomplete (contract-coverage exit contribution 1).
      Without --contract there is no stated domain, so nothing is recorded as
      missing for it.
    flow:
      - abicheck compare old.json new.json --contract public -o json=report.json
    expected:
      exit_code: 4
    surfaces:
      - cli: compare --contract
    validates: UC-WF-contract-config
    automated: true
    test: test_sc_contract_domain_coverage
